 phases. The first exposure sensitized the child, and re-exposure triggered elicitation, a type IV delayed hypersensitivity response, with a delayed, sharply bordered, pruritic, vesicular eruption at the application site. Neomycin is a classic topical allergen. Irritant reactions are immediate and do not depend on earlier exposure. Type I reactions are not the mechanism. An id reaction appears away from the exposure site, not confined to it."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 14-month-old had 4 days of fever to 39.8\u00b0C (103.6\u00b0F). During that time the parents say he was \"playing like normal.\" This morning he is afebrile, and his mother noticed a new rash. The FNP suspects roseola infantum. Which rash characteristics fit this diagnosis? Select all that apply.","o":["Discrete rose-colored macules and papules 2 to 3 mm in diameter that fade on pressure","An eruption that begins on the trunk and then spreads centrifugally","An eruption that begins on the face and then spreads downward to the trunk","Lesions that coalesce into confluent plaques within the first 24 hours","An eruption that is nonpruritic, so the child is not scratching","An eruption of intensely pruritic vesicles in crops on the trunk"],"a":[0,1,4],"r":"The roseola exanthem is a diffuse, nonpruritic, discrete, rose-colored maculopapular rash with 2 to 3 mm lesions that blanch. It begins on the trunk and spreads centrifugally. A rash that starts on the face and moves downward describes measles (and rubella). Roseola lesions rarely coalesce, so early confluence points toward measles. Pruritic vesicles in crops describe varicella."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"An 11-month-old was seen at urgent care on day 2 of a high fever. Red tympanic membranes were noted, and amoxicillin was started. On day 4 the fever broke, and a blanching pink maculopapular rash appeared on the trunk. The child is now playful and well hydrated. Which response by the FNP is most appropriate?","o":["Order a CBC, because a rising WBC count on day 4 confirms roseola rather than a drug eruption.","Explain that a rash appearing as the fever breaks is typical of roseola and does not by itself establish a drug allergy.","Explain that a rash appearing as the fever breaks is typical of measles and must be reported within 24 hours.","Document a penicillin allergy, because the rash began while the child was taking amoxicillin."],"a":[1],"r":"This is a classic roseola course: 3 to 7 days of high fever in a child who does not look ill, then a rash as the fever breaks. Reddened TMs are a recognized associated finding, which often leads to antibiotics and a mistaken \"amoxicillin allergy\" label. Measles rash appears as the fever rises, often to 40.5\u00b0C (105\u00b0F), not as it breaks. In roseola the WBC count falls rather than rises, and a CBC is not needed in a classic case."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A parent of a 9-month-old with suspected roseola asks about the virus and who gets it. Which statements by the FNP are accurate? Select all that apply.","o":["HHV-6 causes the majority of roseola cases.","HHV-7 causes the majority of roseola cases.","Roseola is most common between 7 and 24 months of age, after maternal antibodies wane.","Roseola is rare in infants younger than 3 months.","Most children are HHV-6 seropositive by 4 years of age.","Roseola is rare in infants younger than 12 months."],"a":[0,2,3,4],"r":"HHV-6 causes most cases of roseola. Only a small percentage come from primary HHV-7 infection, so B is wrong. Peak incidence is 7 to 24 months, after protective maternal antibodies wane. The disease is rare in infants younger than 3 months and in children older than 4 years, and most children are HHV-6 seropositive by age 4. Option F puts the cutoff at 12 months, which wrongly excludes much of the peak age range."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"An 18-month-old is on day 4 of high fever with a rash that appeared as the fever broke. Because the course was atypical, a series of CBCs was obtained. Which WBC pattern best supports roseola?","o":["Low WBC count for age initially, falling further by the third or fourth day, then returning to normal","Normal WBC count initially, falling only on the sixth or seventh day after the rash appears","Low WBC count for age initially, rising to leukocytosis by the third or fourth day as the rash appears","Leukocytosis for age initially, falling to normal by the third or fourth day"],"a":[0],"r":"In roseola the WBC count is low for age at first, drops further by day 3 or 4, and then returns to normal, following the fever pattern. Leukocytosis (D, C) is not expected and should raise concern for a bacterial process. A drop that starts only after the rash (B) does not match the fever-linked pattern."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 10-month-old on day 3 of fever to 40.1\u00b0C (104.2\u00b0F) had a brief generalized seizure at home. In the office he is alert and interactive, and his anterior fontanelle is flat. The FNP suspects roseola. Which statements are accurate? Select all that apply.","o":["Febrile seizures occur in about 10% to 15% of children with roseola.","A bulging anterior fontanelle may signal rare CNS involvement.","HHV-6 is associated with encephalitis, especially in immunocompromised hosts.","A seizure means routine HHV-6 serology is indicated in every case.","HHV-6 reactivation occurs mainly in immunocompetent toddlers.","Contagiousness is probably greatest during the febrile phase, before the rash."],"a":[0,1,2,5],"r":"Febrile seizures complicate about 10% to 15% of roseola cases. A bulging fontanelle can occur in the rare case with CNS involvement. HHV-6 is associated with encephalitis, particularly in immunocompromised hosts, and that is also the group in which reactivation occurs, not immunocompetent toddlers. Roseola is a clinical diagnosis; testing is reserved for unclear, severe, or unusual cases, so serology is not routine after an uncomplicated febrile seizure. Communicability is probably greatest during the fever, before the rash."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A childcare director calls about a 13-month-old who was just diagnosed with roseola after her fever broke and a truncal rash appeared. The director asks when the child was most likely contagious to other children. What is the best answer?","o":["During the rash phase, after the fever broke","During the 4 days after the rash appeared","During the febrile phase, before the rash erupted","During the desquamation phase, after the rash faded"],"a":[2],"r":"Roseola is probably most contagious during the fever, before the rash erupts. By the time the rash appears, the period of greatest communicability has usually passed. \"Four days after the rash appears\" is the end of the contagious period for measles, not roseola. Roseola does not have a desquamation phase like the one that follows measles."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An unvaccinated 3-year-old came back from the Philippines 10 days ago. She now has 3 days of fever, harsh cough, runny nose, and red, watery eyes, and no rash yet. Which findings are consistent with the measles prodrome? Select all that apply.","o":["Small, irregular bluish-white granules on an erythematous base on the buccal mucosa opposite the lower molars","Small, irregular bluish-white granules on an erythematous base on the soft palate and uvula","Cough, coryza, and conjunctivitis before the rash appears","Fever above 38.3\u00b0C (101\u00b0F) during the prodrome","A rash that begins on the trunk and spreads centrifugally","Koplik spots that appear only after the rash has fully generalized"],"a":[0,2,3],"r":"Koplik spots are small, irregular bluish-white granules on an erythematous base, found on the oral mucosa opposite the lower molars. They are pathognomonic and appear during the prodrome, before the rash generalizes, so F is wrong. Placing the spots on the soft palate (B) is a distractor; palatal lesions suggest rubella (Forchheimer spots) or roseola (Nagayama spots). The prodrome includes the \"three Cs\" (cough, coryza, conjunctivitis) with fever above 38.3\u00b0C. A rash that starts on the trunk and spreads centrifugally describes roseola."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 4-year-old with confirmed measles developed a rash yesterday. The parents ask how the rash will progress. Which description is accurate?","o":["It starts behind the ears and on the forehead, covers the back, abdomen, and thighs within the first 24 hours, and the face stays involved until the legs have cleared.","It starts behind the ears and on the forehead, covers the face, trunk, and legs within the first 24 hours, and has completely faded by the end of the second 24 hours.","It starts on the trunk, covers the face, neck, and arms over the first 24 hours, and reaches the thighs by the end of the second 24 hours; the trunk clears as the face becomes involved.","It starts behind the ears and on the forehead, covers the face, neck, and arms over the first 24 hours, and reaches the back, abdomen, and thighs by the end of the second 24 hours; the face clears as the legs become involved."],"a":[3],"r":"The measles rash first appears behind the ears and on the forehead, then covers the face, neck, and arms over the next 24 hours, and reaches the back, abdomen, and thighs by the end of the second 24 hours. As the legs become involved, the face begins to clear, and the whole spread takes about 3 days. Option A moves the spread too fast and reverses the clearing pattern. Option C starts on the trunk. Option B describes a faster course that has faded within 48 hours, more like rubella."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An unvaccinated 5-year-old has measles. The rash began this morning. The FNP is counseling the family and the health department about transmission. Which statements are accurate? Select all that apply.","o":["The child was contagious starting 1 to 2 days before symptoms began.","The child became contagious only once Koplik spots appeared.","The child remains contagious through 4 days after the rash appeared.","The child remains contagious through 14 days after the rash appeared.","About 9 of every 10 susceptible exposed contacts will develop measles.","A carrier state may persist for months after the child recovers."],"a":[0,2,4],"r":"A person with measles is contagious from 1 to 2 days before symptoms begin (several days before the rash) through 4 days after the rash appears. Contagiousness starts before the Koplik spots, which is why transmission happens before anyone suspects the diagnosis. The total contagious period is roughly 14 days counted from before symptom onset, not 14 days after the rash. About 9 of 10 susceptible exposed people develop disease. There is no carrier state."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"An unvaccinated 2-year-old was in a clinic waiting room with a child who was later confirmed to have measles. The child received no postexposure prophylaxis. The parent asks when symptoms would most likely start if the child was infected. What is the best response?","o":["1 to 3 days after exposure","22 to 28 days after exposure","8 to 12 days after exposure","4 to 6 days after exposure"],"a":[2],"r":"The incubation period for measles is 8 to 12 days. For modified measles (for example, after immune globulin) it can be as long as 21 days. One to 6 days is too short for typical measles. An onset 22 to 28 days after exposure falls outside the typical incubation period for an untreated child."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 9-month-old received IGIM 4 days after a household measles exposure. On day 18 after exposure she develops a mild illness. Which features are consistent with modified measles? Select all that apply.","o":["A prodrome lasting 1 to 2 days","A prodrome lasting 4 to 5 days","Normal to low-grade fever","Prominent Koplik spots opposite the lower molars","A rash so mild that it is often missed","Minimal or absent upper respiratory symptoms"],"a":[0,2,4,5],"r":"Modified measles can occur after immune globulin given post-exposure, with residual maternal antibodies, or after an improperly administered vaccine. It is an abbreviated version of the disease. The prodrome lasts 1 to 2 days with normal to low-grade fever, URI symptoms are minimal or absent, and the rash is often missed. A 4- to 5-day prodrome describes typical (unmodified) measles. Koplik spots usually do not appear in modified measles."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 6-year-old who recently traveled internationally has fever, cough, conjunctivitis, and a morbilliform rash that began at the hairline yesterday. Which diagnostic approach is most appropriate to confirm measles?","o":["A serum measles IgM level plus viral testing of a throat or nasopharyngeal swab (or urine) at the first visit","A single serum measles IgM level, deferred until 6 weeks after rash onset","A throat culture for group A streptococcus plus an antistreptolysin O titer at the first visit","A single serum measles IgG level at the first visit"],"a":[0],"r":"Measles is confirmed by measles IgM in serum, by detecting virus in throat or nasopharyngeal secretions, urine, or blood, or by comparing acute and convalescent IgG titers. Specimens should be collected at presentation. A single IgG level cannot tell acute infection from prior immunity. Deferring IgM until 6 weeks is wrong, because IgM reactivity is low more than 30 days after onset. Streptococcal testing does not confirm measles."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An unvaccinated 7-year-old arrives in a busy pediatric clinic with fever, the \"three Cs,\" and a rash that started behind the ears. The FNP suspects measles. Which actions are appropriate? Select all that apply.","o":["Notify the health department as soon as measles is suspected.","Wait to notify the health department until the IgM result confirms the diagnosis.","Move the child to a closed exam room, ideally an airborne-infection isolation room, and mask the child.","Use droplet precautions only, because measles is not spread by the airborne route.","Start identifying exposed patients and staff for possible postexposure prophylaxis.","Allow only staff with documented evidence of measles immunity to enter the room."],"a":[0,2,4,5],"r":"Measles is a reportable disease (within 24 hours of diagnosis per the source). Public health guidance is to report on clinical suspicion, without waiting for lab confirmation, so contact tracing and the 72-hour vaccine window are not lost. Measles is highly transmissible by the airborne route and lingers in room air, so airborne isolation is the standard. \"Droplet precautions only\" is unsafe. Exposed people should be identified quickly, and only staff with presumptive evidence of immunity should provide care."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"An 8-month-old is diagnosed with measles. According to the WHO recommendation, which vitamin A regimen is correct?","o":["50,000 international units orally once daily for 2 days","100,000 international units orally once daily for 2 days","200,000 international units orally once daily for 2 days","100,000 international units orally as a single one-time dose"],"a":[1],"r":"Vitamin A is given once daily for 2 days. The dose is 50,000 IU under 6 months, 100,000 IU for 6 through 11 months, and 200,000 IU at 12 months or older. An 8-month-old therefore receives 100,000 IU daily for 2 days. Option D has the right dose but the wrong duration. Options A and C use the doses for other age groups."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"The FNP is reviewing vitamin A orders for several children with measles. Which age and regimen pairings are correct? Select all that apply.","o":["4-month-old: 50,000 international units once daily for 2 days","6-month-old: 50,000 international units once daily for 2 days","11-month-old: 100,000 international units once daily for 2 days","12-month-old: 100,000 international units once daily for 2 days","3-year-old: 200,000 international units once daily for 2 days","5-year-old: 200,000 international units as a single one-time dose"],"a":[0,2,4],"r":"The age bands are under 6 months (50,000 IU), 6 through 11 months (100,000 IU), and 12 months or older (200,000 IU), each once daily for 2 days. A 6-month-old has already entered the 100,000 IU band, so B is wrong. A 12-month-old has entered the 200,000 IU band, so D is wrong. Option F has the right dose for a 5-year-old but gives only 1 day instead of 2."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A well-nourished 3-year-old living in the United States has uncomplicated measles and is managed at home. Which statement about vitamin A best reflects the WHO recommendation?","o":["Give vitamin A to every child with measles, regardless of country of residence.","Give vitamin A only after a low serum retinol level is confirmed.","Give vitamin A only if the child has signs of malnutrition.","Give vitamin A only if the child needs hospitalization for measles."],"a":[0],"r":"The WHO recommends vitamin A for all children with measles, regardless of country of residence. Children with severe measles have low vitamin A levels, and U.S. children are also at risk for measles morbidity. Limiting treatment to malnourished or hospitalized children, or waiting for a serum level, would delay a therapy that reduces morbidity and mortality."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A child with measles attended a community event. Which exposed people should receive measles-containing vaccine as the preferred postexposure measure? Select all that apply.","o":["A healthy, unvaccinated 13-month-old exposed 48 hours ago","A healthy 4-year-old who received one MMR dose at 12 months, exposed 60 hours ago","A pregnant woman at 30 weeks without evidence of immunity, exposed 48 hours ago","A 6-year-old receiving induction chemotherapy for leukemia, exposed 24 hours ago","A healthy, unvaccinated 14-month-old exposed 5 days ago","A healthy, unvaccinated 2-year-old exposed 70 hours ago"],"a":[0,1,5],"r":"Measles vaccine within 72 hours of exposure is the first choice for vaccine-eligible people. That includes the unvaccinated toddlers exposed at 48 and 70 hours and the child due for a second dose (more than 28 days after the first). MMR is a live vaccine and is contraindicated in pregnancy and severe immunocompromise; those people should receive immune globulin within 6 days. The child exposed 5 days ago is past the 72-hour vaccine window and is a candidate for immune globulin instead."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy, unvaccinated 10-month-old was exposed to measles at a pediatric urgent care 30 hours ago. Which plan is most appropriate?","o":["Give IGIM now, because infants younger than 12 months cannot receive MMR vaccine.","Give no prophylaxis now, and give the routine MMR dose at 12 months.","Give MMR now, because vaccine within 72 hours is the first choice and may be given at 6 to 11 months.","Give MMR and IGIM together now, to provide both active and passive protection."],"a":[2],"r":"Measles vaccine within 72 hours of exposure is the first choice to prevent or modify infection, and it may be given to infants 6 to 11 months old. Option C is wrong because MMR can be given from 6 months for postexposure prophylaxis or outbreaks; immune globulin within 6 days is the alternative for infants under 6 months or when the 72-hour window has passed. MMR and immune globulin are not given together, because the antibody interferes with the vaccine response. Withholding prophylaxis leaves a high-risk infant unprotected."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A child who attended a daycare center was diagnosed with measles. The exposures occurred 4 days ago unless otherwise noted. Which exposed people are appropriate candidates for immune globulin? Select all that apply.","o":["An unvaccinated 10-month-old exposed 4 days ago","A pregnant staff member without evidence of measles immunity, exposed 4 days ago","A 5-year-old with leukemia receiving chemotherapy, exposed 4 days ago","A healthy 6-year-old with no prior measles vaccine, exposed 4 days ago","A pregnant staff member without evidence of measles immunity, exposed 9 days ago","An unvaccinated 10-month-old exposed 8 days ago"],"a":[0,1,2,3],"r":"Immune globulin (IGIM or IGIV) given within 6 days of exposure can prevent or modify measles in susceptible people. That includes those with no prior measles vaccine, infants under 12 months, pregnant women, and immunocompromised people. At 4 days the 72-hour vaccine window has closed, but the 6-day immune globulin window is still open. The exposures at 8 and 9 days are past the 6-day window, so immune globulin is no longer indicated; those contacts need monitoring."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 7-month-old received MMR vaccine 36 hours after a measles exposure and did not develop measles. How should her future MMR doses be handled?","o":["The dose does not count; give a single additional dose at 4 to 6 years of age.","The dose does not count; give two more doses, the first at 12 to 15 months and the second at least 28 days later or at 4 to 6 years.","The dose counts as dose 1; give dose 2 at 4 to 6 years of age.","The dose counts as dose 1; give dose 2 at least 28 days after the postexposure dose."],"a":[1],"r":"MMR given before the first birthday, including as postexposure prophylaxis at 6 to 11 months, does not count toward the routine series. Residual maternal antibody and an immature immune response lower its effectiveness. The infant still needs two valid doses: the first at 12 to 15 months, and the second at least 28 days later (usually at 4 to 6 years). Counting the infant dose (C, D) or giving only one more dose (A) would leave her incompletely protected."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A family whose unvaccinated child recently had measles asks about the risk of complications. Which statements are accurate? Select all that apply.","o":["Pneumonia is the largest cause of measles deaths in infants.","Otitis media is a recognized complication of measles.","Measles infection can make underlying tuberculosis worse.","Subacute sclerosing panencephalitis (SSPE) is a fatal complication of wild-type measles.","SSPE is a recognized complication of the measles vaccine virus.","Complications are common after modified measles."],"a":[0,1,2,3],"r":"Pneumonia, from measles virus itself or a bacterial superinfection, is the largest cause of measles deaths in infants. Otitis media is a common superinfection. Measles can exacerbate underlying TB. SSPE is a fatal complication of wild-type measles; it is not caused by vaccine virus, so vaccination protects against it. Modified measles usually causes no complications."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"An 11-year-old has a 4-month decline in school performance, personality changes, and new myoclonic jerks. He had measles at 10 months of age before emigrating and never received MMR. Which is the most likely diagnosis and typical latency?","o":["Acute measles encephalitis, which typically appears 7 to 10 years after wild-type measles","Subacute sclerosing panencephalitis, which typically appears 7 to 10 weeks after wild-type measles","Postinfectious encephalomyelitis, which typically appears 7 to 10 years after measles vaccination","Subacute sclerosing panencephalitis, which typically appears 7 to 10 years after wild-type measles"],"a":[3],"r":"SSPE is a progressive, fatal degenerative CNS disease caused by persistent wild-type measles virus. It typically presents 7 to 10 years after infection with behavioral and cognitive decline followed by myoclonus. Infection before age 2, as in this child, increases the risk. A latency of weeks is wrong. Acute measles encephalitis occurs during or shortly after the acute illness, not years later. SSPE is linked to wild-type virus, not vaccine."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 2-year-old is on day 5 of the measles rash. After initially improving, he has a new fever spike, purulent sputum, and focal crackles. The FNP suspects a bacterial superinfection. Which organisms are recognized causes of bacterial complications of measles? Select all that apply.","o":["Group A \u03b2-hemolytic streptococci","Streptococcus pneumoniae","Haemophilus influenzae","Staphylococcus aureus","Listeria monocytogenes","Pseudomonas aeruginosa in an otherwise healthy child"],"a":[0,1,2,3],"r":"Measles complications can be caused by the measles virus itself or by bacterial superinfection with GABHS, pneumococci, H. influenzae, or S. aureus. These should be treated with appropriate antibiotics. Listeria is a neonatal and foodborne pathogen and not a typical measles superinfection. Pseudomonas is not an expected pathogen in a previously healthy child."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 6-year-old receiving chemotherapy develops severe measles with hypoxemia. Which statement about antiviral therapy is accurate?","o":["Ribavirin has been used off label for severe measles and in immunocompromised children, with infectious disease consultation.","Oral acyclovir is the standard antiviral therapy for all children with measles.","Ribavirin is standard first-line therapy for all children with uncomplicated measles.","Oseltamivir started within 48 hours of rash onset shortens the course of measles."],"a":[0],"r":"No antiviral therapy is approved for measles. Ribavirin has been used off label for severe infection and in immunocompromised children, and these cases (along with encephalitis and severe pneumonia) should be managed with an infectious disease expert. Acyclovir targets herpesviruses, and oseltamivir targets influenza; neither treats measles. Routine ribavirin for uncomplicated measles is not recommended, because care is supportive."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 3-year-old with uncomplicated measles will be cared for at home. The child has photophobia. Which elements belong in the home care plan? Select all that apply.","o":["Antipyretics such as acetaminophen for fever and discomfort","Adequate fluids and humidified air","A darkened room because of the photophobia","Prophylactic oral antibiotics to prevent bacterial pneumonia","Aspirin as the preferred antipyretic for the high fever","Oral vitamin A dosed for age, once daily for 2 days"],"a":[0,1,2,5],"r":"Treatment is supportive: antipyretics, bed rest, adequate fluids, air humidification, a warm room, and a darkened room if photophobia is present. Vitamin A is recommended for all children with measles. Antibiotics are for documented bacterial superinfections such as otitis or bronchopneumonia, not for prevention. Aspirin is avoided in children with viral illness because of the risk of Reye syndrome."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 5-year-old with measles had rash onset 2 days ago. The parent asks when the cough and other respiratory symptoms are likely to be at their worst. What is the best answer?","o":["On day 1 of the prodrome","On day 3 of the rash","On day 1 of the rash","On day 3 after the rash has faded"],"a":[1],"r":"In unmodified measles, respiratory symptoms are most severe on day 3 of the rash. The rash begins to fade after the fourth day, and the fever then breaks. Early prodrome and rash day 1 are too early. By the time the rash has faded, the illness should be resolving unless a complication such as pneumonia has developed."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"The FNP is examining a febrile child with a rash and is trying to tell roseola from measles. Which findings favor roseola over measles? Select all that apply.","o":["The child looks relatively well despite a high fever.","Erythematous papules on the soft palate and uvula (Nagayama spots).","The child is between 7 and 24 months of age.","A prodrome of cough, coryza, and conjunctivitis.","A rash that first appears behind the ears and on the forehead.","Desquamating discoloration that persists for about 1 week after the rash."],"a":[0,1,2],"r":"Children with roseola typically do not look ill despite fevers to 39.5\u00b0C or higher, and the illness peaks between 7 and 24 months. Nagayama spots on the soft palate and uvula are a recognized roseola enanthem. They are different from Koplik spots, which are opposite the lower molars. The \"three Cs\" prodrome, a rash starting behind the ears and on the forehead, and desquamating discoloration lasting about a week are all features of measles."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A parent asks what fever course to expect in a 12-month-old suspected of having early roseola. Which description is most accurate?","o":["Low-grade fever below 38\u00b0C (100.4\u00b0F) for 1 to 2 days, followed by a rash as the temperature rises","Sudden fever from 38.3\u00b0C to more than 39.5\u00b0C (101\u00b0F to more than 103\u00b0F) for 3 to 7 days, with the child appearing toxic and lethargic throughout","Sudden fever from 38.3\u00b0C to more than 39.5\u00b0C (101\u00b0F to more than 103\u00b0F) for 10 to 14 days, often with the child not appearing ill","Sudden fever from 38.3\u00b0C to more than 39.5\u00b0C (101\u00b0F to more than 103\u00b0F) for 3 to 7 days, often with the child not appearing ill"],"a":[3],"r":"Roseola begins with a sudden fever from 38.3\u00b0C to more than 39.5\u00b0C that lasts 3 to 7 days, and the child usually does not seem ill, although irritability may occur at the peaks. Persistent toxicity should prompt a search for another cause. Fever lasting 10 to 14 days is outside the roseola pattern. A low-grade fever followed by a rash as the temperature rises does not fit roseola, where the rash appears as a high fever breaks."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A nursing student asks the FNP about the virology and transmission of roseola. Which statements are accurate? Select all that apply.","o":["Humans are the only natural reservoir of HHV-6 and HHV-7.","The virus is probably spread through oral, nasal, and conjunctival routes from close contacts.","Transmission is suspected to occur prenatally or during or after birth.","Nonhuman primates are a recognized secondary reservoir for HHV-6.","HHV-6 and HHV-7 belong to the Roseolovirus genus in the Betaherpesvirinae subfamily.","Roseola shows a marked late-winter and spring seasonality."],"a":[0,1,2,4],"r":"HHV-6 and HHV-7 are roseoloviruses in the Betaherpesvirinae subfamily, and humans are their only natural reservoir. Transmission is not fully understood but probably occurs through oral, nasal, and conjunctival routes from close contacts, and prenatal or perinatal transmission is suspected. \"Humans and primates\" describes the reservoir for measles, not roseola. Roseola occurs year round with no seasonal peak; a late-winter and spring peak is characteristic of measles."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 12-month-old had 4 days of fever to 39.7\u00b0C. He became afebrile yesterday, and a blanching pink truncal rash then appeared. He is alert, eating well, and has a flat fontanelle and no other abnormal findings. Which diagnostic plan is most appropriate?","o":["Order a CBC with differential to document the leukocytosis that confirms roseola.","Perform a lumbar puncture, because HHV-6 commonly causes encephalitis in healthy toddlers.","Make a clinical diagnosis of roseola; no diagnostic studies are indicated.","Order HHV-6 IgM serology to confirm roseola before giving a diagnosis."],"a":[2],"r":"Roseola can usually be diagnosed clinically, and studies are not indicated in a classic, uncomplicated case. Testing is reserved for unclear, severe, or unusual presentations. If a CBC is done, it shows a low WBC count for age, not leukocytosis. HHV-6 encephalitis is associated mainly with immunocompromised hosts, so a lumbar puncture is not indicated in a well toddler with a flat fontanelle."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"The FNP is giving discharge teaching to the parents of a 15-month-old diagnosed with roseola during the febrile phase. Which statements are appropriate? Select all that apply.","o":["\"The rash that may appear as the fever breaks usually does not itch, so anti-itch medicine is usually not needed.\"","\"You may give acetaminophen or ibuprofen for comfort while the fever lasts.\"","\"Seek care right away if the soft spot on the head bulges or if a seizure lasts more than a few minutes.\"","\"Your child must stay out of childcare until the rash has completely faded, because the rash is the most contagious stage.\"","\"Apply a topical corticosteroid to the rash twice daily until it clears.\"","\"An antiviral such as acyclovir will shorten the fever if started today.\""],"a":[0,1,2],"r":"The roseola rash is nonpruritic and lasts hours to 2 to 3 days, so it needs no specific treatment. Antipyretics are reasonable for comfort. A bulging fontanelle can signal rare CNS involvement, and febrile seizures occur in 10% to 15% of cases, so parents need clear return precautions. Contagiousness is greatest during the fever before the rash, so excluding the child until the rash fades is not justified. Topical steroids and antivirals have no role in uncomplicated roseola."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"Which statement best describes the relationship between fever and rash that helps distinguish measles from roseola?","o":["In both measles and roseola, the temperature rises as the rash appears.","In both measles and roseola, the rash appears as the fever breaks.","In measles, the rash appears as the fever breaks; in roseola, the temperature rises as the rash appears.","In measles, the temperature rises as the rash appears; in roseola, the rash appears as the fever breaks."],"a":[3],"r":"In measles, the temperature rises as the rash appears, often to 40.5\u00b0C (105\u00b0F), and the fever breaks only after the illness peaks and the rash begins to fade. In roseola, the rash erupts as the 3- to 7-day fever breaks. The other options reverse or merge these patterns."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"For which children with measles does the source recommend management in consultation with an infectious disease expert? Select all that apply.","o":["A child with measles encephalitis","A child with severe measles pneumonia","A child with measles and a compromised immune system","A well-hydrated child with uncomplicated measles and conjunctivitis","A child with desquamation after the rash clears","An otherwise well child with measles and acute otitis media"],"a":[0,1,2],"r":"All children with encephalitis, severe pneumonia, or compromised immune systems should be managed with an infectious disease expert. Uncomplicated measles with conjunctivitis is managed supportively. Post-rash desquamating discoloration is an expected finding that lasts about a week. Acute otitis media in an otherwise well child is a bacterial superinfection that is treated with appropriate antibiotics and does not require ID consultation."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 4-year-old with measles is on day 2 of the rash. The rash has become dark and purpuric, and he has gum bleeding and hematuria. Which complication is most likely, and what is the main concern?","o":["Purpura fulminans (\"black measles\"), with multiorgan bleeding and risk of fatal DIC","Subacute sclerosing panencephalitis, with multiorgan bleeding and risk of fatal DIC","Residual desquamating pigmentation, with bleeding from skin fissures","Modified measles, with mild bleeding that resolves without intervention"],"a":[0],"r":"Measles rash can become hemorrhagic. Purpura fulminans, called \"black measles,\" involves multiorgan bleeding and can be fatal because of disseminated intravascular coagulation, and a more severe rash generally means a more severe illness. SSPE is a late neurodegenerative complication, not a bleeding disorder. Modified measles is mild and usually uncomplicated. Desquamating discoloration after the rash does not cause systemic bleeding."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 3-year-old has 5 days of fever, conjunctival injection, and a diffuse morbilliform rash. The differential includes measles and Kawasaki disease. Which findings favor measles? Select all that apply.","o":["Bluish-white granules on an erythematous base on the buccal mucosa opposite the lower molars","A prominent cough and coryza during the prodrome","A rash that began at the hairline and behind the ears and moved downward","Periungual desquamation of the fingers during convalescence","A strawberry tongue with red, cracked lips","A single, unilateral cervical lymph node larger than 1.5 cm"],"a":[0,1,2],"r":"Koplik spots are pathognomonic of measles. A prodrome with prominent cough and coryza and a rash that starts behind the ears and on the forehead and moves downward also point to measles. Periungual desquamation, strawberry tongue with cracked lips, and a single cervical node larger than 1.5 cm are classic Kawasaki criteria. Kawasaki syndrome is part of the measles differential, and missing it delays IVIG."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy, unvaccinated 2-year-old received IGIM (0.5 mL/kg) 5 days after a measles exposure and never developed measles. When should she receive MMR vaccine?","o":["11 months after the IGIM dose","4 weeks after the IGIM dose","6 months after the IGIM dose","3 months after the IGIM dose"],"a":[2],"r":"Passively acquired measles antibody interferes with the response to live MMR vaccine. After IGIM at the measles prophylaxis dose of 0.5 mL/kg, MMR should be deferred 6 months; after IGIV (400 mg/kg), the deferral is 8 months. Four weeks and 3 months are too short to ensure a reliable vaccine response. Eleven months is the interval for much larger IVIG doses, such as those used for Kawasaki disease."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A pregnant woman at 20 weeks' gestation has no evidence of measles immunity. She was exposed to a child with measles 2 days ago. Which actions are appropriate? Select all that apply.","o":["Give MMR vaccine now, because she is within 72 hours of exposure.","Give immune globulin now, because she is within 6 days of exposure.","Use the intravenous formulation (IGIV) rather than IGIM for her prophylaxis.","Wait for measles IgG results to return after day 6 before deciding on prophylaxis.","Plan MMR vaccination after the pregnancy rather than during it.","Give MMR vaccine and immune globulin at the same visit for combined protection."],"a":[1,2,4],"r":"MMR is a live vaccine and is contraindicated in pregnancy, so even though she is within 72 hours, she should not receive it. Pregnant women without immunity should receive immune globulin within 6 days of exposure. IGIV (400 mg/kg) is recommended in pregnancy because IGIM volume limits make it hard to reach protective antibody levels in adults. Waiting until after day 6 would close the prophylaxis window. MMR should be given postpartum and never together with immune globulin."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy, unvaccinated 3-year-old weighing 20 kg was exposed to measles 5 days ago. The FNP plans IGIM. Which dose is correct?","o":["IGIM 0.5 mL/kg, capped at a maximum dose of 5 mL","IGIM 0.5 mL/kg (10 mL), with a maximum dose of 15 mL","IGIM 0.25 mL/kg (5 mL), with a maximum dose of 15 mL","IGIV 400 mg/kg as the routine product for healthy children"],"a":[1],"r":"The current recommended IGIM dose for measles postexposure prophylaxis is 0.5 mL/kg, up to a maximum of 15 mL, which is 10 mL for a 20-kg child. The older 0.25 mL/kg dose was abandoned because it gave inadequate protection. A 5-mL cap would underdose this child. IGIV 400 mg/kg is reserved for pregnant women without immunity and severely immunocompromised people, not healthy children."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A measles case was confirmed in a kindergarten class. Which statements about school exclusion are consistent with standard public health guidance? Select all that apply.","o":["An unvaccinated exposed classmate who received no prophylaxis is excluded from day 5 through day 21 after exposure.","An unvaccinated exposed classmate who received no prophylaxis is excluded from day 1 through day 7 after exposure.","A classmate who received MMR within 72 hours of the initial exposure may generally return to school.","The child with measles stays home through 4 days after the rash appeared.","The child with measles may return to school as soon as the fever resolves.","The child with measles must stay home until all post-rash desquamation has resolved."],"a":[0,2,3],"r":"Susceptible contacts without prophylaxis are excluded from day 5 through day 21 after exposure, which covers the incubation period. Day 1 through 7 ends too early. Contacts who receive MMR within 72 hours of the initial exposure can generally return. The child with measles is contagious through 4 days after rash onset and is isolated for that period. Fever resolution does not mark the end of contagiousness, and desquamating discoloration is not infectious."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 4-year-old needs a tuberculin skin test (TST) for a TB contact investigation. He is also due for his second MMR dose. Which plan is most appropriate?","o":["Give the MMR first and place the TST 1 week later, while vaccine viremia is resolving.","Give the MMR first and place the TST 2 weeks later, after the vaccine response has peaked.","Place the TST at any time relative to the MMR, because measles virus does not affect TB testing.","Place the TST on the same day as the MMR, or delay the TST at least 4 weeks after the MMR."],"a":[3],"r":"Measles virus, wild-type or vaccine strain, temporarily suppresses delayed-type hypersensitivity and can cause a false-negative TST. Measles infection can also exacerbate underlying TB. The TST should be placed on the same day as MMR or delayed at least 4 weeks (commonly 4 to 6 weeks) afterward. Testing 1 or 2 weeks after vaccination falls within the suppression window, so C is wrong."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"Which statements about the measles virus and its epidemiology are accurate? Select all that apply.","o":["Measles virus has only one antigenic type.","Humans and primates are the only known reservoirs of infection.","Peak incidence in susceptible people occurs in late summer and fall.","Infectious virus is present in respiratory secretions, blood, and urine.","A chronic carrier state develops in a minority of recovered patients.","A single dose of measles vaccine reliably gives lifelong immunity."],"a":[0,1,3],"r":"Measles is a Morbillivirus in the Paramyxoviridae family with a single antigenic type. Humans and primates are its only reservoirs, and virus is present in respiratory secretions, blood, and urine. Peak incidence occurs in late winter and spring, not late summer and fall. There is no carrier state. Natural disease or two vaccine doses usually give lifelong immunity; a single dose is less reliable, which is why two are recommended."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 6-year-old with measles is on day 6 of the rash. The parents notice that the rash is fading and the skin looks discolored and is flaking. Which statement is accurate?","o":["This residual desquamating discoloration is expected and lasts approximately 1 month.","This residual desquamating discoloration is expected and lasts approximately 1 week.","Sheet-like peeling of the palms and soles is the expected measles pattern at this stage.","Measles rash does not desquamate, so this suggests a new drug eruption."],"a":[1],"r":"The measles rash begins to fade after the fourth day. Once it clears, a residual desquamating discoloration remains for about 1 week. A duration of a month overstates it. Desquamation is an expected part of measles, so it does not by itself suggest a drug reaction. Sheet-like peeling of the palms and soles suggests Kawasaki disease or scarlet fever rather than the fine desquamation of measles."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"Which statements about modified measles are accurate? Select all that apply.","o":["It can occur in a child who received immune globulin after exposure.","It can occur in a young infant who still has maternal antibodies.","It can occur in a child who received an improperly administered measles vaccine.","It is the expected presentation in severely immunocompromised children.","It is the expected presentation in children with vitamin A deficiency.","Its incubation period can be as long as 21 days."],"a":[0,1,2,5],"r":"Modified measles is an abbreviated illness in children with partial passive or active immunity: those who received immune globulin after exposure, those with residual maternal antibodies, and those who received an improperly administered vaccine. Its incubation period can be as long as 21 days, compared with 8 to 12 days for typical measles. Immunocompromised children and those with low vitamin A are at risk for severe measles, not modified measles."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"An 8-year-old is 3 weeks past an allogeneic hematopoietic stem cell transplant. He develops fever, confusion, and memory impairment, and HHV-6 DNA is detected in his CSF. He had roseola as a toddler. Which statement best explains this finding?","o":["It most likely reflects HHV-6 reactivation, which occurs in immunocompromised hosts and can cause encephalitis.","It most likely reflects primary HHV-7 infection, which causes most roseola cases.","It most likely reflects primary roseola, which typically first occurs at 8 years of age.","It cannot be HHV-6, because primary roseola permanently clears the virus from the body."],"a":[0],"r":"Like other herpesviruses, HHV-6 becomes latent after primary infection and can reactivate in immunocompromised people. HHV-6 is associated with encephalitis, especially in immunocompromised hosts. Primary roseola is rare after 4 years of age, and most children are seropositive by then. HHV-7 accounts for only a small share of roseola. Primary infection does not clear the virus."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 16-month-old is on day 3 of high fever and looks relatively well. The FNP suspects roseola in its febrile phase. Which associated findings are consistent with roseola? Select all that apply.","o":["Cervical and posterior occipital lymphadenopathy","Eyelid edema","Reddened tympanic membranes","Inflamed palpebral conjunctiva","Bluish-white granules on the buccal mucosa opposite the lower molars","A strawberry tongue with red, cracked lips"],"a":[0,1,2,3],"r":"During the febrile phase of roseola, children may have URI signs, cervical and posterior occipital lymphadenopathy, inflamed palpebral conjunctiva, eyelid edema, GI complaints, and reddened TMs. Bluish-white granules opposite the lower molars are Koplik spots, which are pathognomonic of measles. A strawberry tongue with cracked lips suggests Kawasaki disease (or, for strawberry tongue alone, scarlet fever)."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 9-year-old is evaluated 6 weeks after an untested febrile rash illness during a community measles outbreak. Her serum measles IgM is negative. How should the FNP interpret this result?","o":["A negative IgM confirms modified measles, because Koplik spots and IgM both appear only in unmodified measles.","A negative IgM means the illness should be reported only if a single IgG level is also negative.","A negative IgM does not exclude recent measles, because IgM reactivity is low more than 30 days after onset; paired IgG titers can help.","A negative IgM definitively excludes measles, because IgM stays detectable for at least 6 months after infection."],"a":[2],"r":"A single measles IgM is useful when drawn around the time of illness, but reactivity is low more than 30 days after onset. A negative result at 6 weeks therefore does not rule out measles. Comparing acute and convalescent IgG titers, or viral detection when specimens are available, can establish the diagnosis. IgM does not persist for 6 months. A negative IgM does not indicate modified measles. Reporting is based on clinical suspicion and diagnosis, not on a single IgG value."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"Which conditions are recognized complications of measles (rubeola)? Select all that apply.","o":["Obstructive laryngitis","Myocarditis","Transient hepatitis","Orchitis in a postpubertal male","Polyarthritis of the small joints of the hands in an adolescent female","Mastoiditis"],"a":[0,1,2,5],"r":"Viral and bacterial complications of measles include URI, obstructive laryngitis, otitis, mastoiditis, cervical adenitis, bronchitis, diarrhea, transient hepatitis, pneumonia, and myocarditis. Orchitis is a classic complication of mumps. Small-joint polyarthritis in adolescent and adult females is characteristic of rubella."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy 4-month-old was exposed to measles in a pediatric emergency department waiting room 36 hours ago. Which plan is most appropriate?","o":["Give MMR vaccine now, because postexposure MMR may be given from 3 months of age.","Give IGIM now, because infants younger than 6 months are not eligible for postexposure MMR.","Give no prophylaxis, because maternal antibodies reliably protect all infants younger than 6 months.","Give IGIM, but only if the infant reaches 72 hours after exposure without symptoms."],"a":[1],"r":"Postexposure MMR may be given starting at 6 months of age, so a 4-month-old is not vaccine eligible. Immune globulin within 6 days of exposure is the appropriate measure, and infants under 12 months are among the susceptible groups that qualify. There is no reason to wait 72 hours. Maternal antibody protection is variable and wanes, so infants can develop measles, sometimes as modified disease."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"Which statements about the timing and seroepidemiology of roseola infantum are accurate? Select all that apply.","o":["The mean incubation period is 9 to 10 days.","The mean incubation period is 2 to 3 days.","The rash lasts from hours to 2 to 3 days.","The rash lasts 7 to 10 days and then desquamates.","About 85% of people are HHV-7 seropositive by adulthood.","About 85% of children are HHV-7 seropositive by 12 months of age."],"a":[0,2,4],"r":"Roseola has a mean incubation period of 9 to 10 days. The rash is short-lived, lasting from hours to 2 to 3 days, and does not desquamate. A rash that lasts longer and leaves desquamating discoloration fits measles instead. About 85% of people are HHV-7 seropositive by adulthood, not by 12 months. HHV-6 seropositivity is nearly universal by age 4."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy 6-year-old has written documentation of two valid MMR doses, given at 12 months and 4 years. He sat next to a classmate with confirmed measles 1 day ago. Which plan is most appropriate?","o":["Give no postexposure prophylaxis, because two documented valid doses are presumptive evidence of immunity; monitor for symptoms.","Exclude him from school from day 5 through day 21 after exposure, because all exposed children must be excluded.","Give IGIM within 6 days of exposure, because vaccine protection is unreliable after household-level contact.","Give a third MMR dose within 72 hours of exposure, because any exposed child should be revaccinated."],"a":[0],"r":"Measles disease or two vaccine doses usually give lifelong immunity, so documentation of two valid MMR doses is presumptive evidence of immunity. No postexposure prophylaxis or exclusion is needed, although monitoring for symptoms is reasonable. A third dose and immune globulin are for people without evidence of immunity. Exclusion from day 5 through day 21 applies to susceptible contacts who did not receive timely prophylaxis."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 7-year-old unvaccinated boy has had malaise for one day. Today he has painful swelling of the right side of his face, and the left side started to swell this afternoon. His temperature is 38.3\u00b0C (101\u00b0F). Which findings fit acute mumps parotitis? Select all that apply.","o":["Swelling fills the space between the posterior mandible and the mastoid and hides the angle of the jaw","The opening of the Stensen duct, across from the upper second molar, is red and swollen","Massaging the gland pushes thick purulent material out of the opening of the Stensen duct","Pain on the swollen side gets worse when he is given a sour food such as a pickle","The swelling peaks and resolves completely within 24 hours of onset on each side","Swelling starts on the trunk, then the parotids enlarge on both sides at the same moment"],"a":[0,1,3],"r":"Mumps parotitis fills the space between the posterior border of the mandible and the mastoid, the Stensen duct is red and swollen, and sour foods bring out pain (the \"pickle sign\"). Pus expressed from the Stensen duct points to bacterial suppurative parotitis, not mumps. The glands usually take 3 to 7 days to return to normal size, not 24 hours. When both sides are involved, one gland generally swells before the other, so simultaneous bilateral onset is atypical."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 9-year-old's parotid swelling began this morning, and lab testing confirms mumps. The health department asks the NP which window to use when identifying exposed contacts. Which window is correct?","o":["From 5 days before parotid swelling began through 5 days after swelling began","From 7 days before parotid swelling began through 7 days after swelling began","From 1 to 2 days before parotid swelling began through 9 days after swelling began","From 1 to 2 days before parotid swelling began through 5 days after swelling began"],"a":[3],"r":"Mumps is communicable from about 1 to 2 days before glandular swelling until about 5 days after swelling begins. The 9-day endpoint in B comes from older school-exclusion guidance and does not describe the communicable period. The 5-day lead in A and the symmetric 7-day window in D look more like rubella's shedding pattern (several days before through several days after the rash) than mumps."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 17-year-old male has had mumps parotitis for 5 days. He now has a tender, swollen left testis with fever. He and his mother ask about the outlook and treatment. Which statements are accurate? Select all that apply.","o":["Mumps orchitis is usually one-sided, and permanent sterility is rare","Mumps oophoritis in postpubertal females usually impairs later fertility","Treatment includes bed rest, scrotal elevation, and analgesics as needed","Oral antiviral therapy started within 48 hours shortens orchitis","Mumps can cause hearing loss that is temporary in some cases and permanent in others","Testicular atrophy never follows mumps orchitis in adolescents"],"a":[0,2,4],"r":"Orchitis and epididymitis affect about 10% of postpubertal males and are usually unilateral. Sterility is rare. Management is supportive: bed rest and scrotal elevation. Deafness is a recognized complication and can be transient or permanent. Oophoritis does not affect fertility, there is no effective antiviral for mumps, and some testicular atrophy can follow orchitis, so \"never\" is wrong."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 12-year-old unvaccinated girl was exposed to a cousin with lab-confirmed mumps 10 days ago and has no symptoms. If she is infected, when is parotid swelling most likely to appear?","o":["Usually 14 to 21 days after exposure, with a range of 10 to 28 days","Usually 4 to 14 days after exposure, with a range of 4 to 21 days","Usually 16 to 18 days after exposure, with a range of 12 to 25 days","Usually 10 to 12 days after exposure, with a range of 7 to 21 days"],"a":[2],"r":"The mumps incubation period is 12 to 25 days, usually 16 to 18 days, so a child 10 days out can still become ill. Option C is the rubella incubation range (14 to 21 days). Option D is closer to parvovirus B19 (about 4 to 21 days). Option B is too short and would wrongly reassure the family too early."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 10-year-old has had swelling of both parotid glands for 2 days during a school mumps outbreak. Which diagnostic choices or interpretations are appropriate? Select all that apply.","o":["Massage the parotid, then swab the buccal mucosa near the Stensen duct opening and send the swab for RT-PCR","Collect specimens within 1 to 3 days of symptom onset, when results are most reliable","Expect a CBC showing leukocytosis with a predominance of neutrophils","Expect a possibly elevated serum amylase, from salivary gland inflammation","Treat a negative mumps IgM in a child with 2 MMR doses as excluding mumps","Treat a single positive mumps IgG in a child with 2 MMR doses as confirming acute mumps"],"a":[0,1,3],"r":"Mumps virus is detected by RT-PCR on buccal (Stensen duct) swabs, throat washings, saliva, or CSF, and results are most reliable when specimens are collected within 1 to 3 days of onset. Leukopenia with relative lymphocytosis and an elevated amylase are typical, so neutrophilic leukocytosis is wrong. Vaccinated children may never mount a detectable IgM, so a negative IgM does not exclude disease. A single positive IgG may only reflect vaccination; serologic diagnosis needs IgM or paired acute and convalescent IgG."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 6-year-old has firm swelling under the jaw on both sides that is only mildly tender. The redness over the area has been slow to fade. The parotids are normal, and two classmates have confirmed mumps. How should the NP interpret this?","o":["Mumps can involve only the submandibular glands, but that form is always very painful","Mumps always involves the parotids, so isolated submandibular swelling rules it out","Mumps can involve only the submandibular glands, with little pain and slow-fading redness","Mumps can involve only the sublingual glands, causing swelling in front of the ears on both sides"],"a":[2],"r":"About 10% to 15% of mumps cases involve only the submandibular glands, with little pain and redness that fades more slowly. Parotid involvement is not required (B), and submandibular disease is not marked by severe pain (A). Sublingual involvement causes swelling under the chin in the floor of the mouth, not in front of the ears (D)."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 4-year-old has unilateral facial swelling. The NP is weighing acute bacterial (suppurative) parotitis against mumps. Which findings favor bacterial parotitis? Select all that apply.","o":["Pus flows from the Stensen duct opening when the gland is massaged","One gland is warm, firm, very tender, and the overlying skin is red","A CBC shows leukocytosis with a predominance of neutrophils","A CBC shows leukopenia with a relative lymphocytosis","The opposite parotid starts to swell 1 to 2 days after the first","Serum amylase is elevated above the reference range"],"a":[0,1,2],"r":"Purulent drainage from the Stensen duct, a hot, red, indurated single gland, and neutrophilic leukocytosis point to bacterial parotitis (for example, S. aureus). Leukopenia with relative lymphocytosis is the typical mumps blood picture. Swelling of one side followed by the other is classic for mumps. Amylase can rise with inflammation of the salivary glands from any cause, so it does not separate the two."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 14-year-old on day 5 of mumps parotitis develops steady epigastric pain radiating to the back, plus vomiting. The NP suspects mumps pancreatitis. Which lab test best supports a pancreatic source?","o":["Serum amylase, because lipase stays normal in mumps pancreatitis","Serum lipase, because amylase does not rise in mumps without pancreatitis","Serum amylase, because it is specific for pancreatic tissue during mumps","Serum lipase, because amylase may already be high from the inflamed salivary glands"],"a":[3],"r":"Elevated amylase is typical of uncomplicated mumps because the salivary glands produce amylase, so amylase cannot separate parotitis from pancreatitis (C is wrong). Lipase is pancreas-specific. Option C is wrong because amylase does rise without pancreatitis. Option D is wrong because lipase rises in pancreatitis."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"During a campus mumps outbreak, a 19-year-old student with 2 documented MMR doses asks about her risk and how to protect herself. Which statements are accurate? Select all that apply.","o":["Two MMR doses lower but do not eliminate the risk of mumps, because effectiveness is incomplete","During an outbreak, public health may recommend a third MMR dose for people at increased risk","Immune globulin given within 6 days of exposure reliably prevents mumps","An MMR dose given after this exposure reliably prevents illness from this exposure","Natural mumps infection usually gives lifelong immunity, and second infections are rare","Mumps has several serotypes, which explains why vaccinated people still get infected"],"a":[0,1,4],"r":"Two-dose mumps vaccine effectiveness ranges from about 66% to 95%, so outbreaks happen in vaccinated groups, and public health may recommend a third MMR dose for those at increased risk. Natural infection usually gives lifelong immunity. Immune globulin is not effective as postexposure prophylaxis for mumps, and MMR given after exposure has not been shown to prevent illness from that exposure. Mumps has only one serotype."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 16-year-old unvaccinated exchange student has had fever, headache, poor appetite, neck pain, and malaise since yesterday. His roommate has mumps. If this is the mumps prodrome, when is parotid swelling most likely to start?","o":["About 3 to 5 days after the prodrome begins","About 24 hours after the prodrome begins","About 7 to 10 days after the prodrome begins","At the same time as the prodrome begins"],"a":[1],"r":"The swelling stage starts about 24 hours after the prodrome. The prodrome itself is uncommon in children but more typical in older patients. Seven to 10 days (C) is the gap between prodrome and rash in erythema infectiosum. Three to 5 days (A) loosely matches the rubella prodrome before the rash (1 to 5 days). Mumps parotitis follows the prodrome rather than starting with it (D)."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An NP is reviewing the complications of mumps with a group of students. Which are recognized complications of mumps? Select all that apply.","o":["Pancreatitis, with epigastric pain and vomiting","Thyroiditis, with a tender, enlarged thyroid gland","Thrombocytopenia, with petechiae and mucosal bleeding","Subacute sclerosing panencephalitis years after the illness","Fetal hydrops from fetal anemia after infection in pregnancy","Myocarditis, with arrhythmia or heart failure"],"a":[0,1,2,5],"r":"Mumps complications include meningoencephalitis, orchitis or epididymitis, oophoritis, pancreatitis (rare), thyroiditis (uncommon), myocarditis, deafness, arthritis, thrombocytopenia, self-limited hemolytic anemia, mastitis, and glomerulonephritis. Subacute sclerosing panencephalitis is a late complication of wild-type measles, not mumps. Fetal hydrops from fetal anemia is the classic risk of parvovirus B19 in pregnancy."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"During an outbreak, an 8-year-old has painful swelling of both parotids and a swollen, red Stensen duct opening, but her temperature is 37.0\u00b0C (98.6\u00b0F). The parent says it \"can't be mumps without a fever.\" Which response is most accurate?","o":["About 20% of children with mumps have no fever, so a normal temperature does not rule it out","Nearly all children with mumps run a high fever, so another diagnosis is more likely","Fever comes only with complications, so a normal temperature means uncomplicated mumps","About 50% of children with mumps have no fever, so fever has no diagnostic value at all"],"a":[0],"r":"Fever in mumps is usually moderate, and about 20% of patients have none, so a normal temperature does not exclude mumps. Option B overstates fever, which is usually moderate rather than high. Option D inflates the afebrile rate. Option C wrongly ties fever only to complications."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An 8-year-old has uncomplicated mumps parotitis. Which management choices are appropriate? Select all that apply.","o":["Acetaminophen for fever and gland pain, with bed rest as needed","A soft diet that needs little chewing, avoiding sour or acidic foods","Aspirin as the preferred antipyretic for gland pain and fever","Empiric oral anti-staphylococcal antibiotics to prevent suppuration","NSAIDs or corticosteroids if mumps-associated arthritis develops","Oral acyclovir to shorten how long the parotids stay swollen"],"a":[0,1,4],"r":"Mumps treatment is supportive: antipyretics, bed rest as needed, and a diet suited to chewing discomfort. Sour foods make the pain worse. NSAIDs or corticosteroids are used for arthritic complications. Aspirin is avoided in children with viral illness because of the risk of Reye syndrome. Antibiotics have no role in viral parotitis, and acyclovir has no activity against mumps."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 22-year-old man on day 4 of mumps parotitis develops headache, vomiting, and neck stiffness but remains alert. Which CSF result best fits mumps meningitis?","o":["Normal cell count and glucose, with a markedly elevated protein and no cells","Neutrophilic pleocytosis, markedly low glucose, and Gram-positive diplococci on stain","Normal cell count, glucose, and protein, with only a high opening pressure","Lymphocytic pleocytosis, normal or mildly low glucose, and mildly elevated protein"],"a":[3],"r":"Mumps meningoencephalitis, more common in males, is an aseptic (viral) meningitis with lymphocytic pleocytosis. Glucose is normal or sometimes mildly low, and protein is mildly elevated. Option B describes bacterial (pneumococcal) meningitis. Option D is albuminocytologic dissociation, which suggests Guillain-Barr\u00e9 syndrome. Option C suggests idiopathic intracranial hypertension."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An NP is investigating a mumps cluster and reviews the disease's epidemiology. Which statements are accurate? Select all that apply.","o":["Humans are the only natural reservoir of mumps virus","Several mumps serotypes circulate, which is why reinfection is common","Cases peak in late winter and spring but occur in every season","Males develop parotitis more often than females of the same age","About one-third of infected people have no symptoms or only URI symptoms","Infection spreads mainly through blood and blood products"],"a":[0,2,4],"r":"Mumps has a single serotype, and humans are the only natural reservoir. It occurs in all seasons but is most common in late winter and spring. About one-third of infections are asymptomatic or cause only URI symptoms, which helps explain unrecognized spread. Both sexes are affected equally, and reinfection is rare. Spread is through saliva and respiratory secretions, not blood."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 5-year-old has a tender swelling near the angle of the jaw. Which exam finding best shows that the parotid gland, not an anterior cervical lymph node, is enlarged?","o":["The angle of the mandible is easy to feel, with a fixed mass in front of the sternocleidomastoid","The angle of the mandible is easy to feel, with a discrete movable mass below it","The angle of the mandible is hidden, and the earlobe is pushed up and out","The angle of the mandible is hidden, with a discrete mass behind the sternocleidomastoid"],"a":[2],"r":"An enlarged parotid fills the space between the posterior mandible and the mastoid. It hides the angle of the jaw and pushes the ear out of position. A discrete, movable mass below a palpable mandibular angle (B) is typical of cervical lymphadenitis, which is part of the mumps differential. Options C and D describe nodal or other neck masses, not the parotid."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"Several families ask whether their children can receive MMR during a mumps outbreak. Which conditions are true contraindications to MMR? Select all that apply.","o":["A 17-year-old who is currently pregnant at 9 weeks","A 6-year-old receiving induction chemotherapy for leukemia","A 13-month-old who had hives after eating scrambled eggs","A 15-month-old whose mother is pregnant and breastfeeding a sibling","A 4-year-old with asymptomatic HIV and a CD4 percentage of 25%","A 12-month-old with documented anaphylaxis to neomycin"],"a":[0,1,5],"r":"MMR is a live vaccine and is contraindicated in pregnancy and in severe immunosuppression such as chemotherapy. It is also contraindicated after anaphylaxis to a vaccine component such as neomycin. Egg allergy, including anaphylaxis, is not a contraindication. A pregnant or breastfeeding household member is not a contraindication. Children with HIV whose CD4 percentage is 15% or higher should receive MMR."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 26-year-old at 10 weeks of gestation has a confirmed primary rubella infection. Which counseling statement about congenital risk is most accurate?","o":["Primary infection in the first 12 weeks carries the highest risk of congenital defects, and the risk falls in the second trimester","Primary infection carries the same risk of congenital defects in every trimester, so gestational age does not change counseling","Primary infection in the third trimester carries the highest risk of congenital defects, and the risk is lower in the first 12 weeks","Reinfection in a previously immune woman carries the same risk of congenital defects as primary infection in the first 12 weeks"],"a":[0],"r":"The risk of congenital defects (eye, heart, hearing, neurologic) is highest when primary maternal rubella occurs in the first 12 weeks and falls substantially in the second trimester, so C and B are wrong. In pregnant women, reinfection rarely results in congenital rubella syndrome, so D is wrong."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 15-year-old unvaccinated immigrant has had a pink maculopapular rash for 2 days, along with postauricular lymphadenopathy. Rubella IgM drawn today is negative. Which statements about lab confirmation are accurate? Select all that apply.","o":["IgM may not be detectable before day 5 after the rash, so repeat the test after day 5","Draw acute IgG as soon as possible and repeat it in 7 to 21 days to check for a rise","A single positive IgG drawn on day 2 of the rash confirms acute rubella","IgG levels define immune status, whether immunity came from infection or vaccination","A negative IgM on day 2 of the rash reliably rules out acute rubella","Nasal or, preferably, throat specimens can be sent for RT-PCR detection of rubella"],"a":[0,1,3,5],"r":"Timing is critical. Rubella IgM may not be detectable before the fifth day after the rash appears, so an early negative should be repeated after day 5, and E is wrong. Paired IgG (acute as soon as possible, repeated in 7 to 21 days) shows a rise. A single IgG only shows prior immunity from infection or vaccination, so it cannot confirm acute disease (C is wrong). RT-PCR on nasal or throat specimens (throat preferred) detects the virus."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 3-year-old with a 1-day history of a fine pink rash that started on the face is suspected of having postnatal rubella. Which pattern of lymph node enlargement best supports the diagnosis?","o":["Preauricular, anterior cervical, and submandibular nodes, sometimes with an enlarged liver","Postauricular, posterior cervical, and suboccipital nodes, sometimes with an enlarged spleen","Anterior cervical and epitrochlear nodes only, starting 7 days after the rash","Postauricular, supraclavicular, and axillary nodes, without generalized node enlargement"],"a":[1],"r":"Rubella lymphadenopathy mainly involves the postauricular, posterior cervical, and posterior occipital (suboccipital) nodes. It can be generalized and sometimes comes with splenomegaly. It usually starts within 24 hours of the rash, but can start up to 7 days before it, and lasts more than a week. Anterior cervical and submandibular nodes (A) suggest pharyngeal or dental sources. Supraclavicular nodes raise concern for malignancy. Node enlargement that starts after the rash (C) does not fit rubella."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 6-year-old has a low-grade fever and a pink maculopapular rash suspected to be rubella. Which features of the rash are consistent with rubella? Select all that apply.","o":["The rash starts on the face and spreads to the chest and downward over about 24 hours","The rash is usually gone by the third day after it appears","Blue-white spots on the buccal mucosa across from the molars appear before the rash","Marked photophobia accompanies the rash in most children","A fine, bran-like scaling of the skin may follow the rash","The rash starts on the trunk after the fever breaks and spreads toward the face"],"a":[0,1,4],"r":"The rubella rash starts on the face, spreads to the chest and downward over the next 24 hours, and is usually gone by the third day. A fine, bran-like desquamation may follow. Koplik spots (C) are measles, not rubella. Rubella causes no photophobia (D). A rash that starts on the trunk after the fever breaks (F) is roseola (erythema subitum)."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 16-year-old with a new pink facial rash has small rose-colored spots on the soft palate. Which statement about this finding is most accurate?","o":["These Forchheimer spots appear only after the rash fades and are pathognomonic for rubella","These Forchheimer spots can appear before the rash and are not pathognomonic for rubella","These Forchheimer spots are on the buccal mucosa and confirm rubella without further testing","These Koplik spots can appear before the rash and are pathognomonic for rubella"],"a":[1],"r":"Forchheimer spots are small rose-colored to reddish spots on the soft palate that may appear before the generalized rubella rash. They are not pathognomonic, because similar lesions occur in other illnesses such as scarlet fever and infectious mononucleosis. Koplik spots are measles and sit on the buccal mucosa, which rules out D and D. B wrongly places the spots after the rash and calls them pathognomonic."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An NP is advising a child care center after a 4-year-old was diagnosed with postnatal rubella. Separately, a newborn with confirmed congenital rubella syndrome (CRS) is about to enroll. Which recommendations are appropriate? Select all that apply.","o":["The 4-year-old should stay home for about 7 days after the rash first appears","The infant with CRS should be treated as contagious through the first year of life unless repeated cultures are negative","The 4-year-old may return 24 hours after the fever resolves, even if the rash is still present","Nonimmune pregnant staff should avoid contact with both children while they are contagious","The 4-year-old may return as soon as the rash fades, usually by the third day","The infant with CRS stops shedding virus by 4 weeks of age and needs no special precautions after that"],"a":[0,1,3],"r":"Children with rubella should stay home for about 1 week after the rash appears, because shedding continues after the rash; that is why C and E are wrong. Infants infected in utero can shed virus past their first birthday, so they are treated as contagious until age 1 unless repeated cultures are negative, and F is wrong. Susceptible pregnant women should avoid exposure because of the risk of congenital rubella syndrome."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"Which patient's joint symptoms best fit arthritis as a complication of postnatal rubella?","o":["A 9-year-old girl with migrating large-joint arthritis and carditis 3 weeks after a sore throat","A 30-year-old man with hip and low-back pain starting about 4 weeks after his rash resolved","A 24-year-old woman with pain in the finger joints, wrists, and knees starting about 1 week after her rash","A 5-year-old boy with a single swollen knee starting 3 days before his rash appeared"],"a":[2],"r":"Rubella arthralgia and arthritis affect postpubertal patients, more often females. It involves the fingers, wrists, and knees, starts about a week after the rash, and lasts 3 to 28 days. Prepubertal children rarely develop it, and it does not come before the rash (D). Hip and spine involvement weeks later does not fit (B). Migrating arthritis with carditis after pharyngitis suggests acute rheumatic fever (A)."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 2-week-old born to an unvaccinated mother who had a rash illness at 8 weeks of gestation is being evaluated for congenital rubella syndrome. Which findings fit this diagnosis? Select all that apply.","o":["Cataracts or other eye abnormalities noted on the red reflex exam","A failed hearing screen, consistent with sensorineural hearing loss","A patent ductus arteriosus or peripheral pulmonary artery stenosis","Fetal hydrops caused mainly by destruction of red cell precursors","Limb hypoplasia with zigzag scarring of the skin in a dermatomal pattern","Purple-blue skin papules (\"blueberry muffin\" lesions) from blood cell production in the skin"],"a":[0,1,2,5],"r":"Congenital rubella causes eye (cataracts), auditory (sensorineural deafness), cardiac (PDA, pulmonary artery stenosis), and neurologic defects. Blueberry muffin lesions reflect blood cell production in the skin. Hydrops from destruction of red cell precursors is the mechanism of fetal parvovirus B19 disease. Limb hypoplasia with dermatomal (cicatricial) scarring is congenital varicella syndrome."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 23-year-old received MMR at a college clinic and learns 2 weeks later that she was 3 weeks pregnant when vaccinated. She asks whether she should end the pregnancy. Which response is most accurate?","o":["Accidental rubella vaccination in pregnancy is not by itself a reason to end the pregnancy, and congenital rubella syndrome has not been documented","Accidental rubella vaccination in pregnancy is a reason to end the pregnancy, because the risk of congenital rubella syndrome is about 61%","Accidental rubella vaccination in pregnancy is not by itself a reason to end the pregnancy, but she needs immune globulin within 72 hours","Accidental rubella vaccination in pregnancy is a reason to end the pregnancy only if it happened in the first 12 weeks of gestation"],"a":[0],"r":"Accidental vaccination of a pregnant woman alone is not a reason to end the pregnancy. Surveillance has shown signs of infection in some infants but not congenital rubella syndrome. The roughly 61% figure applies to primary wild-type maternal infection in the first 12 weeks, not to vaccination (B, D). Immune globulin is not indicated after vaccination (C)."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 29-year-old at 8 weeks of gestation with unknown rubella immunity was exposed yesterday to a coworker with confirmed rubella. Which actions are appropriate? Select all that apply.","o":["Draw rubella IgG promptly to find out whether she was already immune","If she is IgG-negative, repeat serology about 2 to 3 weeks and about 6 weeks after the expo
