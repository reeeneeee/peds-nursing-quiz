tern on the trunk of a light-skinned adolescent are tinea versicolor, caused by Malassezia, and are treated with selenium sulfide. Griseofulvin (B) targets dermatophytes, not Malassezia. Tinea corporis (A) usually shows one or more annular plaques with a red, scaly advancing border rather than many small raindrop macules. Seborrheic dermatitis (D) involves hair-bearing intertriginous areas."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"Which conditions are caused by Malassezia yeast? Select all that apply.","o":["Tinea capitis caused by Microsporum canis","Tinea versicolor","Seborrheic dermatitis (dandruff) in a school-age child","Tinea corporis","Cradle cap in an infant","Onychomycosis"],"a":[1,2,4],"r":"Tinea versicolor is caused by Malassezia, and seborrheic dermatitis, including infant cradle cap and childhood dandruff, is caused by Malassezia ovalis. Microsporum (A) is a dermatophyte despite the similar-sounding name. Tinea corporis and onychomycosis (D, F) are dermatophyte infections."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 5-month-old has several hypopigmented, finely scaling macules on the upper chest and back. The infant is not itchy, the skin is otherwise not dry, and the scalp is clear. The mother is being treated for recurrent tinea versicolor. What is the most likely diagnosis?","o":["Tinea versicolor acquired from the mother","Seborrheic dermatitis, since it is also caused by Malassezia","Infantile atopic dermatitis, since onset is typically at 1\u20136 months","Tinea corporis caused by M. canis"],"a":[0],"r":"Tinea versicolor occurs mostly in adolescents, but the blueprint notes that infants can get it from their mothers. It shows scaling, discrete macules on the trunk that are hypopigmented in some skin types. Infantile seborrheic dermatitis (B) usually presents as cradle cap on the scalp. Atopic dermatitis (C) involves abnormally dry skin and severe itching, which this infant does not have. Nothing suggests annular plaques with a red scaly border or pet exposure (D)."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 7-year-old spent the afternoon squeezing limes for lemonade at an outdoor stand. Two days later she has streaky, red-to-brown patches on the backs of both hands and forearms, following the lines where the juice dripped. She has never had a reaction like this before. Which classification and mechanism best fit?","o":["Irritant contact dermatitis (phytophotodermatitis), which does not require prior sensitization","Allergic contact dermatitis, a type IV delayed hypersensitivity reaction after prior sensitization to citrus","Allergic contact dermatitis, an IgE-mediated immediate reaction to citrus","Tinea corporis, with the streaks reflecting peripheral spread and central clearing"],"a":[0],"r":"The blueprint lists phytophotodermatitis as an example of irritant contact dermatitis, which is not an allergy. The streaks follow where the plant juice touched sun-exposed skin. Option B uses the correct allergic mechanism, but allergic contact dermatitis needs prior sensitization, and this is her first reaction. The reaction is not IgE-mediated, and tinea corporis lesions are annular plaques with scaly borders, not drip-shaped streaks."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"A 12-year-old has worn new leather sandals for 2 weeks. He now has itchy, red, vesicular, weeping plaques on the tops of both feet that match the strap pattern. The toe webs are clear, and the rash covers about 4% of his body surface area. Which orders are appropriate? Select all that apply.","o":["Stop wearing the sandals.","An oral antihistamine to reduce itching and scratching","Clotrimazole cream twice daily until 7 days after clearing","A clotrimazole\u2013betamethasone combination cream twice daily","An oral corticosteroid tapered over 2\u20133 weeks, because weeping vesicles mean severe disease","Oatmeal soaks to soothe the skin"],"a":[0,1,5],"r":"A symmetric rash that matches the straps of a new shoe is allergic contact dermatitis. Shoes are one of the blueprint's allergen examples. Care includes avoiding the allergen, oral antihistamines for itching and scratching, and oatmeal baths. Clotrimazole until 7 days after clearing is the tinea pedis regimen, and antifungals should never be combined with steroids. A systemic taper is reserved for involvement over 10% of the skin. Vesicles and weeping simply mark the acute stage."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 10-year-old has allergic contact dermatitis on both forearms and a small patch on one cheek after clearing brush. It covers about 6% of his body surface area. Which plan matches the blueprint and the professor's recommendation?","o":["An oral corticosteroid tapered over 2\u20133 weeks, because two separate body regions are involved","Triamcinolone 0.1% cream once daily to the forearms and the cheek","Triamcinolone 0.1% cream once daily to the forearms only, with no systemic steroid because involvement is under 10%","An oral corticosteroid tapered over 5 days, because involvement is under 10%"],"a":[2],"r":"Systemic oral steroids, tapered over 2\u20133 weeks, are for allergic involvement that exceeds 10% of the skin and affects extensive parts of the body. At 6%, topical therapy is appropriate. The professor recommends triamcinolone 0.1% once daily and says not to use it on the face or groin, which rules out option B. Note: standard references say mid-potency steroids such as triamcinolone 0.1% are usually applied 2\u20133 times daily."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"A nurse practitioner student is reviewing contact dermatitis. Which statements are accurate? Select all that apply.","o":["Contact dermatitis can be acute or chronic and is more common in children.","Dry skin can itself be a cause of irritant contact dermatitis.","A rash that appears within hours of the first-ever use of a new perfume is the classic allergic contact dermatitis pattern.","Shoes and perfume are classic causes of irritant contact dermatitis.","Irritant contact dermatitis requires a type IV delayed hypersensitivity response that activates an immune cascade."],"a":[0,1],"r":"The blueprint defines contact dermatitis as acute or chronic inflammation from a hypersensitivity reaction to an irritant or allergen, more common in children. Dry skin is one of its irritant examples. Allergic contact dermatitis is delayed and appears only after sensitization, so an immediate rash on first exposure does not fit. Shoes and perfume are allergic examples, not irritant ones, and the type IV immune cascade describes allergic, not irritant, dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 2-month-old has thick, greasy, yellow scale on the scalp. There is also symmetric, red, scaling rash in the inguinal folds and the creases of the diaper area, and the infant does not seem bothered by it. The convex surfaces of the diaper area are clear. Following the professor's recommendation, what is the best treatment for the diaper-area lesions?","o":["Desitin plus hydrocortisone 0.5\u20131% three times daily for 5 days","Low-potency hydrocortisone 1% lotion once daily for no longer than 2 weeks","Triamcinolone 0.1% cream once daily for no longer than 2 weeks","Hydrocortisone 1% lotion three times daily for no longer than 2 weeks"],"a":[1],"r":"Greasy scalp scale with a symmetric, non-itchy rash in the intertriginous folds is seborrheic dermatitis, not irritant diaper dermatitis. For seborrheic dermatitis of the face or diaper area, the professor recommends hydrocortisone 1% lotion once daily for no longer than 2 weeks. Option A is the diaper dermatitis regimen, which tempts because the rash is in the diaper area. Option D has the right drug and duration but the wrong frequency, and triamcinolone should not be used on the groin."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"A 4-month-old is brought in for scaling on the scalp. Which findings point toward cradle cap (infantile seborrheic dermatitis) rather than tinea capitis? Select all that apply.","o":["Thick, greasy, yellow scale on the scalp, with similar scaling in the eyebrows and behind the ears","Patches of broken hair with black dots","No pustules anywhere on the scalp","Occipital and posterior cervical lymphadenopathy","An age under 1 year, the period in which this condition usually resolves","A boggy, inflamed, pustule-filled mass with fever and leukocytosis"],"a":[0,2,4],"r":"Seborrheic dermatitis is a symmetric scaling eruption of hair-bearing areas without pustules. In infants it is called cradle cap and usually resolves in the first year. Black dots of broken hair are the sign of T. tonsurans tinea capitis, and occipital or posterior cervical adenopathy also points to tinea capitis. A boggy, pustule-filled mass with fever and leukocytosis is a kerion."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"The parent of a 5-month-old with cradle cap asks for a medicated shampoo. The infant's face and diaper area are clear. Which response matches the blueprint?","o":["Use ketoconazole 2% shampoo 2\u20133 times per week for 4 weeks.","Use selenium sulfide 2.5% shampoo twice weekly for 4 weeks.","Use zinc pyrithione shampoo daily, left on for 5\u201310 minutes before scrubbing.","Loosen the scales with a soft brush and frequent shampooing. No medication is approved for children under 2 years."],"a":[3],"r":"For cradle cap, the blueprint says to remove scales with a soft brush and frequent shampooing, and it notes that no medication is approved for children under 2 years. Medicated shampoos left on for 5\u201310 minutes are the treatment for dandruff in older children. Ketoconazole 2% and selenium sulfide 2.5% on 4-week schedules are adjuncts to oral therapy for tinea capitis, not cradle cap treatments."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"Which pairings of a seborrheic dermatitis treatment with its drug class are correct? Select all that apply.","o":["Azoles: antifungal","Topical calcineurin inhibitors: anti-inflammatory","Urea: keratolytic","Selenium sulfide: keratolytic","Salicylic acid: antifungal","Topical steroids: anti-inflammatory"],"a":[0,1,2,5],"r":"The blueprint groups seborrheic dermatitis treatments into three classes. Antifungals are azoles and selenium sulfide. Anti-inflammatories are topical steroids and calcineurin inhibitors. Keratolytics, which remove excess scale, are salicylic acid and urea. Options D and E swap two of the classes: selenium sulfide is an antifungal, and salicylic acid is a keratolytic."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 16-year-old has many discrete, finely scaling, hypopigmented macules in a raindrop pattern over the upper back and upper arms. The scalp, eyebrows, and nasolabial folds are clear. He asks whether this is the same \"yeast\" problem as his brother's dandruff. Which diagnosis and treatment are correct?","o":["Tinea versicolor; selenium sulfide 2.5% shampoo twice weekly for 4 weeks","Tinea versicolor; selenium sulfide 2.5% lotion in a thin layer for 10 minutes daily for 1\u20132 weeks, then monthly for 3 months","Seborrheic dermatitis; ketoconazole shampoo left on for 5\u201310 minutes before scrubbing","Tinea versicolor; selenium sulfide 2.5% lotion for 10 minutes daily for 1\u20132 weeks, then stop"],"a":[1],"r":"Guttate, scaling macules on the trunk and upper arms of an adolescent are tinea versicolor. It is caused by Malassezia, the same genus as the yeast behind seborrheic dermatitis. Seborrheic dermatitis involves hair-bearing and intertriginous areas, which are clear here. Treatment is selenium sulfide applied for 10 minutes daily for 1\u20132 weeks, followed by monthly applications for 3 months. Option D leaves out the monthly maintenance, and option A is the tinea capitis adjunct schedule."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"An unvaccinated 5-year-old is in the prodrome and early rash stage of varicella. Which statements about the course are accurate? Select all that apply.","o":["The prodrome can include low-grade fever, headache, backache, anorexia, and mild abdominal pain.","The more severe the rash, the higher the fever tends to be.","Scabs can last 5\u201320 days, depending on how deep the lesion is.","Fever in varicella stays low-grade and does not exceed 101\u00b0F.","The average child has about 30 lesions."],"a":[0,1,2],"r":"The varicella prodrome includes low-grade fever, headache, backache, anorexia, mild abdominal pain, and occasional URI symptoms. Rash severity tracks with fever, and scabs last 5\u201320 days depending on lesion depth. Once the rash appears, fever can reach 105\u00b0F, so option D is wrong. The average number of lesions is about 300, not 30."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 3-year-old who has had one dose of varicella vaccine has a few atypical papulovesicular lesions. The nurse practitioner wants to confirm varicella before advising the child's daycare. Which test does the blueprint list for varicella?","o":["PCR of lesion material","ELISA","IgM and IgG serology to tell current infection from past infection","Gram stain and culture from beneath a crust"],"a":[0],"r":"The blueprint lists PCR as the diagnostic test for varicella. ELISA is listed for Lyme disease, and IgM/IgG testing is described for parvovirus B19 (fifth disease). Gram stain and culture from beneath the crust is how impetigo is worked up when it does not respond to treatment in 7 days."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"A nurse practitioner is counseling families about who faces the greatest risk from varicella. Which statements are accurate? Select all that apply.","o":["Mortality from primary varicella is highest among newborns.","Mortality from primary varicella is highest among immunocompromised children.","Smoking is a risk factor for varicella pneumonia.","Neonatal varicella is unrelated to whether the mother had varicella.","Primary varicella is commonly fatal in healthy school-age children.","Glomerulonephritis is the most common varicella complication."],"a":[0,1,2],"r":"Primary varicella is rarely fatal. The highest mortality is in newborns and immunocompromised children, and pneumonia is a complication for which smoking is a risk factor. Neonatal involvement is directly tied to maternal varicella infection. Glomerulonephritis is a rare complication. The most common one is pyoderma."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 6-year-old is on day 4 of the varicella rash and has had no fever for 48 hours. Most lesions are crusted, but a few fresh vesicles remain on the back. The parent asks when the child can go back to school. Which answer matches the blueprint?","o":["Now, because the child has been afebrile for more than 24 hours","After 24 hours of oral acyclovir","One week after the rash first erupted, whatever the lesions look like","Once all lesions have crusted over"],"a":[3],"r":"Children with a varicella rash are kept home until all lesions are crusted, because they are contagious until then. A fever-free period does not end contagiousness. The 24-hour rule applies to antibiotics for impetigo and scarlet fever, not to acyclovir. Option C is the rubella rule (home for 1 week after the rash erupts). It is a tempting look-alike, but it can send a child back to school while new vesicles are still forming."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"An 8-year-old with hereditary spherocytosis, a hemolytic anemia, was exposed to fifth disease at school. He now has fever, pallor, and tachycardia, and on exam he has early signs of heart failure. Which statements are accurate? Select all that apply.","o":["Fever, pallor, tachycardia, and heart failure symptoms are a recognized presentation of parvovirus B19 in children with hemolytic anemia.","A transfusion should be considered to treat his anemia.","IGIV is the listed treatment for parvovirus B19 in immunocompromised patients.","Oral acyclovir started within 24 hours will shorten the course.","A specific antiviral for parvovirus B19 should be started right away."],"a":[0,1,2],"r":"Patients with hemolytic anemia or immunodeficiency can develop fever, pallor, tachycardia, and heart failure symptoms with parvovirus B19. The blueprint lists transfusion for anemia and IGIV for immunocompromised patients. There is no specific antiviral treatment for fifth disease. The 24-hour acyclovir window applies to varicella, not parvovirus."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 7-year-old had bright red cheeks with circumoral pallor last week. Now he has a lacy, maculopapular rash on the trunk, arms, and thighs, and he feels well. His parent asks whether he must stay home until the rash is gone. Which response is correct?","o":["Keep him home until the rash fades completely, which can take about a month.","Keep him home for 1 week after the rash erupted.","He may attend school, because children in the rash stage of this illness are not contagious.","He may return after 24 hours of antibiotic therapy."],"a":[2],"r":"A slapped-cheek rash followed by a lacy rash moving out to the extremities is erythema infectiosum (fifth disease). Children in the rash stage are not contagious and may attend school. The rash can last about a month, but that does not affect whether he can attend. Staying home 1 week after the rash erupts is the rubella rule, and 24 hours of antibiotics applies to bacterial illnesses such as scarlet fever, not to this viral one."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"Which descriptions of rash timing and spread are accurate? Select all that apply.","o":["Measles: the rash starts behind the ears and on the forehead and moves downward over about 3 days, with the fever rising as the rash appears.","Rubella: discrete pinkish-red maculopapules start on the face, spread to the chest, and resolve in about 3 days.","Varicella: the rash starts on the extremities and spreads centrifugally toward the trunk.","Roseola: the rash erupts at the peak of the fever and coalesces into large plaques.","Fifth disease: the slapped-cheek rash lasts 1\u20134 days and is followed by a lacy rash on the trunk that moves outward and can last about a month."],"a":[0,1,4],"r":"The measles rash starts behind the ears and on the forehead and moves downward over 3 days while the temperature climbs, up to 105\u00b0F. Rubella starts on the face, spreads to the chest, and resolves in 3 days. Fifth disease goes from slapped cheeks to a lacy rash that moves out to the extremities. Varicella is centripetal and starts on the scalp, face, or trunk. The roseola rash appears after the fever resolves and does not coalesce."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 10-year-old who bites his nails has several rough, flesh-colored papules around the cuticles of three fingers. They bother him, and he wants them treated. Which identification and plan match the professor's recommendation?","o":["Periungual warts; topical salicylic acid every morning for 6\u20138 weeks","Periungual warts; topical salicylic acid at bedtime for 6\u20138 weeks","Filiform warts; refer for removal","Periungual warts; topical salicylic acid at bedtime for 2\u20133 weeks"],"a":[1],"r":"Warts around the cuticles in a nail biter are periungual warts. The professor recommends topical salicylic acid at bedtime (HS) for 6\u20138 weeks. Options A and D differ by only one detail: the time of day or the length of treatment. Filiform warts project on a narrow stalk on the face, and the professor's referral recommendation is for flat warts. Note: standard references say salicylic acid is often applied daily for up to 12 weeks."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"Which descriptions are correctly matched to the type of wart? Select all that apply.","o":["A single, raised, flesh-colored papule with a scaly, irregular surface on a knuckle: common wart (verruca vulgaris)","Many small, flat lesions spread across the face and legs in a child who picks at them: flat warts (verruca plana, or juvenile warts)","A mosaic cluster of lesions on the weight-bearing sole: plantar warts (verrucae plantaris)","A wart around the cuticle of a nail biter: filiform wart","A thin projection on a narrow stalk on the eyelid: periungual wart"],"a":[0,1,2],"r":"Common warts are raised, flesh-colored single papules with scaly, irregular surfaces. Flat (juvenile) warts are spread by picking and scratching across the face and extremities. Plantar (mosaic) warts form on weight-bearing surfaces of the feet. Options D and E swap two labels: warts around the cuticles in nail biters are periungual, and stalked lesions on the face or eyelids are filiform."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A healthy 6-year-old has a single common wart on his knee. It does not hurt or bleed, and it does not bother him. His parent asks to have it \"burned off today.\" What is the most appropriate counseling?","o":["Asymptomatic warts generally need no treatment, and removing a wart can cause scarring.","Every wart should be referred for removal to keep it from spreading.","Apply salicylic acid twice daily for 2 weeks, then remove the wart in the office.","Common warts often hide malignancy, so this one needs a biopsy."],"a":[0],"r":"The blueprint says warts generally need no management if they cause no symptoms, and it lists scarring as a complication of removal. The professor's referral recommendation is specific to flat warts, not all warts. Option C does not match the professor's bedtime, 6\u20138 week salicylic acid regimen, and common warts are benign."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"A nurse practitioner sees several children with rashes in one clinic day. Which presentations have a bacterial cause and call for antibiotic therapy? Select all that apply.","o":["A 6-year-old with sandpaper-textured skin, pharyngitis, a strawberry tongue, and Pastia lines","A 4-year-old with moist, honey-colored crusts on red, eroded skin around the nose","A 15-year-old with discrete pinkish-red maculopapules that started on the face, with postauricular and posterior occipital lymphadenopathy","A 7-year-old with a lacy, maculopapular rash on the arms a few days after slapped-cheek redness","A 3-year-old with cough, coryza, conjunctivitis, and small bluish-white spots on the buccal mucosa"],"a":[0,1],"r":"The scarlet fever triad (sandpaper skin, pharyngitis, strawberry tongue) with Pastia lines is caused by group A Streptococcus and is treated with penicillin, amoxicillin, or cephalexin. Honey-colored crusts on eroded skin are nonbullous impetigo, caused by S. aureus or S. pyogenes. Rubella, fifth disease, and measles (the 3 C's with Koplik spots) are viral illnesses. Antibiotics do not treat them."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 30-month-old had 3 days of fever up to 103\u00b0F and a brief febrile seizure. The fever broke yesterday, and today a rose-colored, blanching maculopapular rash appeared on the trunk and is spreading to the face. The spots do not coalesce. Which statement best fits?","o":["Measles; the child is most contagious now that the rash has appeared, and droplet precautions are needed.","Rubella; keep the child home for 1 week after the rash erupted.","Roseola infantum (HHV-6/HHV-7); the child was most contagious during the fever phase, before the rash, and care is supportive.","This cannot be roseola, because the child is older than 24 months."],"a":[2],"r":"High fever, then defervescence, then a non-coalescing rose-colored rash that starts on the trunk and spreads centrifugally is the hallmark of roseola. Roseola is most contagious during the fever phase before the rash appears. The professor's notes put roseola at under 3 years, so a 30-month-old fits, and option D applies only the 7\u201324 month peak. In measles, the rash appears while the fever is rising, not after it breaks. Note: standard references say roseola usually affects children 6 months to 2 years old."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"Which statements about itching and pain in pediatric rashes match the blueprint? Select all that apply.","o":["Varicella lesions are highly pruritic.","Atopic dermatitis causes severe itching that increases in the evening.","Seborrheic dermatitis is characteristically very pruritic.","Oral antihistamines are useful for the itching and scratching of allergic contact dermatitis.","Nonbullous impetigo lesions are typically painful."],"a":[0,1,3],"r":"Varicella lesions are highly pruritic. Atopic dermatitis is \"the itch that rashes,\" with itching that worsens in the evening. Oral antihistamines help with the itching and scratching (excoriation) of contact dermatitis. The blueprint describes seborrheic dermatitis as not pruritic and nonbullous impetigo as painless but spreading rapidly."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"A 10-month-old has several lesions on the buttocks and lower abdomen inside the diaper area. They started as vesicles, enlarged into large blisters, and ruptured, leaving a thin, varnish-like scale. The infant is afebrile and feeding well. What is the most appropriate diagnosis and treatment?","o":["Diaper dermatitis; Desitin plus hydrocortisone 0.5\u20131% three times daily for 5 days","Seborrheic dermatitis; hydrocortisone 1% lotion once daily for no longer than 2 weeks","Varicella; supportive care with acetaminophen and oatmeal baths","Bullous impetigo; an oral antibiotic active against beta-lactamase-producing S. aureus, such as dicloxacillin, for 7\u201310 days"],"a":[3],"r":"Vesicles that become bullae and rupture into a thin, varnish-like scale are bullous impetigo, which is almost always caused by S. aureus. With multiple lesions, the blueprint calls for an oral antibiotic active against beta-lactamase-producing S. aureus for 7\u201310 days, and dicloxacillin is the professor's preferred choice. Diaper dermatitis can include vesicles, but it is a shiny, peeling, red rash, not bullae. Steroids alone would leave a bacterial infection untreated."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":true,"q":"Which rash descriptions are correctly matched with the most likely diagnosis? Select all that apply.","o":["Greasy scale on the scalp, eyebrows, and nasolabial folds of a well infant: seborrheic dermatitis","A rash only where a wristwatch band sits, which appeared after the child started wearing the new watch: allergic contact dermatitis","Itchy vesicles in different stages, concentrated on the trunk and scalp, in an unvaccinated child: varicella","Itchy, lichenified flexural plaques in a 4-year-old with asthma and a strong family history of atopy: seborrheic dermatitis","A red macule surrounded by a clear ring and then a larger red outer ring at the site of a tick bite: erythema migrans","Sandpaper-textured skin with circumoral pallor and a strawberry tongue: measles"],"a":[0,1,2,4],"r":"Greasy scale in hair-bearing areas is seborrheic dermatitis. A rash confined to where a new item touches the skin is allergic contact dermatitis. Itchy, centripetal vesicles in different stages are varicella, and a bull's-eye lesion at a tick bite is erythema migrans. Lichenified, itchy plaques with a strong atopic history are atopic dermatitis, not seborrheic dermatitis. Sandpaper skin with a strawberry tongue and circumoral pallor is scarlet fever, not measles."},{"t":"Dermatitis, Varicella & Warts","l":2,"s":false,"q":"An unvaccinated 17-year-old who smokes is on day 3 of varicella. He now has cough, shortness of breath, tachypnea, and an oxygen saturation of 90%. Which management is most appropriate?","o":["Oral acyclovir, because he is still within the 72-hour treatment window","Supportive care with scheduled ibuprofen and antihistamines, because varicella is benign in healthy adolescents","An antistaphylococcal penicillin for pyoderma","IV acyclovir for severe disease (varicella pneumonia), recognizing smoking as a risk factor"],"a":[3],"r":"New respiratory distress and hypoxia in a smoker with varicella suggest varicella pneumonia, which is severe disease. The blueprint says IV acyclovir is effective for severe disease and for immunocompromised patients. The oral acyclovir window in the blueprint is 24 hours, and oral treatment is not appropriate for pneumonia. Ibuprofen is questionable in varicella, and an antistaphylococcal penicillin treats skin superinfection, not viral pneumonia."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"A 2-week-old is admitted with tachypnea, temperature instability, and a right lower lobe infiltrate. The mother had prolonged rupture of membranes. Which organism is the MOST likely cause?","o":["Streptococcus pneumoniae","Mycoplasma pneumoniae","Group B Streptococcus","Respiratory syncytial virus"],"a":[2],"r":"In neonates (0\u20131 month), the leading pneumonia pathogens are acquired around delivery: Group B Streptococcus, E. coli (linked to maternal infection and premature rupture of membranes), and Listeria. S. pneumoniae is the leading bacterial cause from 1 month to 5 years and beyond. Mycoplasma is a school-age/teen pathogen. RSV is the most common cause in infants past the newborn period, especially in winter."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"A 14-year-old has had 10 days of gradually worsening low-grade fever, malaise, and a dry, persistent cough. He has kept going to school. Which organisms are MOST consistent with this presentation in his age group? Select all that apply.","o":["Mycoplasma pneumoniae","Chlamydophila pneumoniae","Listeria monocytogenes","Streptococcus pneumoniae","Group B Streptococcus"],"a":[0,1,3],"r":"In school-age children (5\u201318 years), atypical bacteria predominate. Mycoplasma causes \"walking pneumonia,\" and Chlamydophila causes mild, gradual-onset symptoms. S. pneumoniae remains a significant cause at every pediatric age. Listeria and GBS are neonatal pathogens acquired from the mother."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"A 6-year-old recovering from influenza suddenly develops high fever, rapid breathing, and a necrotizing pneumonia on chest x-ray. Which pathogen should the NP be MOST concerned about?","o":["Staphylococcus aureus, including MRSA","Haemophilus influenzae type B","Pneumocystis jirovecii","Chlamydophila pneumoniae"],"a":[0],"r":"S. aureus, including MRSA, is a classic cause of severe secondary bacterial pneumonia after influenza. Hib is rare in vaccinated children. Pneumocystis occurs in immunocompromised children, such as those with HIV. Chlamydophila causes mild, gradual-onset illness, not a sudden necrotizing pneumonia."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"Which congenital heart defects are classified as ACYANOTIC? Select all that apply.","o":["Coarctation of the aorta","Patent ductus arteriosus","Tricuspid atresia","Pulmonary stenosis","Transposition of the great arteries","Atrial septal defect"],"a":[0,1,3,5],"r":"Acyanotic defects either increase pulmonary blood flow through a left-to-right shunt (VSD, ASD, PDA) or obstruct flow without cyanosis (aortic stenosis, pulmonary stenosis, coarctation). Tricuspid atresia and transposition are cyanotic defects. They send deoxygenated blood to the body or limit blood flow to the lungs."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"Which group of findings makes up tetralogy of Fallot?","o":["ASD, pulmonary stenosis, left ventricular hypertrophy, overriding aorta","VSD, aortic stenosis, right ventricular hypertrophy, overriding aorta","VSD, pulmonary stenosis, right ventricular hypertrophy, overriding aorta","VSD, pulmonary stenosis, left ventricular hypertrophy, coarctation of the aorta"],"a":[2],"r":"The four defects in TOF are VSD, pulmonary stenosis, right ventricular hypertrophy, and an overriding aorta. Each distractor swaps one element: ASD for VSD, aortic for pulmonary stenosis, left for right ventricular hypertrophy, or coarctation for overriding aorta. The RV hypertrophies because it pumps against the narrowed pulmonary outflow."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"A 3-month-old has a loud, harsh holosystolic murmur at the left lower sternal border with a palpable thrill. Which other findings would the NP expect if the defect is large? Select all that apply.","o":["Sweating and tiring during feeds","Poor weight gain","Recurrent respiratory infections","Fixed split S2","Persistent central cyanosis at rest"],"a":[0,1,2],"r":"A holosystolic murmur at the left lower sternal border with a thrill indicates a VSD. A large VSD causes heart failure from increased pulmonary blood flow, seen as diaphoresis and fatigue with feeds, failure to thrive, and recurrent respiratory infections or pneumonia. A fixed split S2 is the hallmark of ASD. VSD is acyanotic, so cyanosis at rest is not expected unless complications develop."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"A 5-year-old's well-child exam reveals a grade II/VI systolic ejection murmur at the upper left sternal border with a widely split S2 that does NOT change with respiration. Which defect is MOST likely?","o":["Ventricular septal defect","Atrial septal defect","Patent ductus arteriosus","Coarctation of the aorta"],"a":[1],"r":"ASD causes a systolic ejection murmur from increased flow across the pulmonary valve and a fixed split S2. ASDs are often asymptomatic in childhood. A VSD causes a holosystolic murmur at the lower left sternal border. A PDA causes a continuous \"machinery\" murmur. Coarctation causes differences in BP or pulses between the arms and legs."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"A 7-year-old has had sore throat for 1 day. Which findings support GABHS pharyngitis rather than a viral cause? Select all that apply.","o":["Petechiae on the soft palate","Sudden onset of sore throat with fever of 39\u00b0C","Cough and rhinorrhea","Tender, swollen anterior cervical lymph nodes","Headache and abdominal pain with vomiting","Hoarseness and conjunctivitis"],"a":[0,1,3,4],"r":"Strep throat presents with sudden onset, fever, palatal petechiae, tender cervical nodes, and often headache, nausea, or vomiting in children. Cough, rhinorrhea, hoarseness, and conjunctivitis point to a viral cause. The absence of cough and rhinorrhea is a key distinguishing feature of GABHS."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"Three weeks after an untreated sore throat, a 9-year-old has fever, migratory pain in the knees and ankles, a new murmur, and pink rings with raised edges on the trunk. Which complication is MOST likely?","o":["Post-streptococcal glomerulonephritis","PANDAS","Kawasaki disease","Acute rheumatic fever"],"a":[3],"r":"Migratory polyarthritis, carditis (new murmur), and erythema marginatum are major Jones criteria for acute rheumatic fever. ARF is a nonsuppurative complication that develops weeks after untreated GABHS pharyngitis. PSGN presents with cola-colored urine, facial edema, and hypertension. PANDAS presents with sudden OCD symptoms or tics. Kawasaki disease affects children under 5 and is not tied to strep."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"Which complications of GABHS infection are SUPPURATIVE? Select all that apply.","o":["Peritonsillar abscess","Post-streptococcal glomerulonephritis","Retropharyngeal abscess","Sydenham chorea","Otitis media","Necrotizing fasciitis"],"a":[0,2,4,5],"r":"Suppurative complications come from direct spread of the bacteria: peritonsillar abscess, retropharyngeal abscess, otitis media, sinusitis, and necrotizing fasciitis. PSGN and Sydenham chorea (part of rheumatic fever) are nonsuppurative, immune-mediated complications. They occur weeks later without direct infection of the tissue."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"An 11-year-old with asthma has symptoms 4 days a week, but not daily. She wakes at night 3 times a month, uses her SABA 4 days a week, and has minor limitation in gym class. Her FEV1 is 85% predicted. How should her asthma be classified?","o":["Intermittent","Mild persistent","Moderate persistent","Severe persistent"],"a":[1],"r":"Mild persistent asthma means symptoms more than 2 days a week but not daily, nighttime awakenings 3\u20134 times a month, SABA use more than 2 days a week but not daily, minor activity limitation, and FEV1 over 80%. Intermittent requires everything at 2 days a week or less and awakenings 2 or fewer times a month. Moderate persistent requires daily symptoms and an FEV1 of 60\u201380%."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"Which findings would classify a child's asthma as MODERATE persistent? Select all that apply.","o":["Daily symptoms","Nighttime awakenings more than once a week but not nightly","Daily SABA use","FEV1 between 60% and 80% of predicted","SABA use several times a day","FEV1 less than 60% of predicted"],"a":[0,1,2,3],"r":"Moderate persistent asthma is defined by daily symptoms, awakenings more than once a week but not nightly, daily SABA use, some activity limitation, and FEV1 of 60\u201380%. SABA use several times a day and FEV1 below 60% define severe persistent asthma. Remember the classification is based on the most severe category any single feature falls into."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"During which stage of pertussis is the patient MOST contagious?","o":["Catarrhal stage","Paroxysmal stage","Convalescent stage","Contagiousness is equal across all three stages"],"a":[0],"r":"The catarrhal stage (1\u20132 weeks) looks like a common cold, with runny nose, mild cough, sneezing, and low-grade fever. This is when pertussis is most contagious, and it is hard to recognize. The paroxysmal stage (1\u20136 weeks) brings the classic coughing fits with an inspiratory whoop and post-tussive vomiting. The convalescent stage is the gradual recovery over weeks to months."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"A 3-month-old with pertussis is in the paroxysmal stage. Which complications is this infant at highest risk for? Select all that apply.","o":["Apnea","Pneumonia","Seizures","Rib fractures","Weight loss from post-tussive vomiting","Urinary incontinence"],"a":[0,1,2,4],"r":"Infants face the most severe complications: apnea, pneumonia, seizures, weight loss from vomiting and feeding difficulty, and rarely hypoxic brain damage. Rib fractures and urinary incontinence from forceful coughing are complications typical of adolescents and adults. Infants also often do not \"whoop\"; apnea or cyanosis may be the presenting sign."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"A previously healthy 2-year-old had a sudden choking and coughing episode while eating peanuts an hour ago. He now has a persistent cough and wheezing heard only over the right lung, with decreased breath sounds on that side. There is no fever. Which diagnosis is MOST likely?","o":["Croup","Asthma exacerbation","Bronchiolitis","Foreign body aspiration"],"a":[3],"r":"A sudden choking episode with no fever or viral prodrome, followed by unilateral wheezing and decreased breath sounds, is classic for foreign body aspiration. The right mainstem bronchus is the most common site. Asthma and bronchiolitis cause diffuse, bilateral wheezing. Croup causes a barking cough and inspiratory stridor after a cold-like prodrome."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"An 18-month-old is brought in at 2 a.m. after 2 days of runny nose. Which findings are consistent with croup? Select all that apply.","o":["Barking, seal-like cough","Inspiratory stridor that worsens with crying","Hoarse voice","Low-grade fever around 38\u00b0C","Drooling, sitting forward, and refusing to swallow","High fever with a toxic appearance"],"a":[0,1,2,3],"r":"Croup, most often from parainfluenza, affects children 6 months to 3 years. It causes a barking cough, inspiratory stridor (worse with agitation and at night), hoarseness, and low-grade fever after a cold-like prodrome. Drooling, tripod positioning, high fever, and a toxic appearance suggest epiglottitis or bacterial tracheitis, which are airway emergencies."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"A 2-year-old with croup has stridor AT REST, frequent barking cough, and mild retractions. Her oxygen saturation is normal. How is this severity classified, and what is the key medication?","o":["Mild; humidified air only","Moderate; oral dexamethasone","Moderate; nebulized epinephrine as the first-line home treatment","Severe; humidified air only"],"a":[1],"r":"Moderate croup is frequent barking cough, stridor at rest, and mild respiratory distress. Corticosteroids such as dexamethasone reduce airway inflammation in moderate to severe croup. Mild croup has no stridor at rest. Severe croup has persistent stridor, significant distress, and signs of hypoxia. Nebulized epinephrine is given in the hospital or ED for severe cases, not as home treatment."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"A 15-month-old has fever and has been pulling at the left ear after a cold. Which otoscopic findings support a diagnosis of acute otitis media? Select all that apply.","o":["Bulging tympanic membrane","Opaque, cloudy tympanic membrane","Decreased mobility on pneumatic otoscopy","Translucent, pearly gray membrane with normal mobility","Red tympanic membrane"],"a":[0,1,2,4],"r":"AOM causes a red, opaque, bulging TM with reduced or absent mobility on pneumatic otoscopy. Bulging is the hallmark finding. A translucent, pearly gray TM that moves normally is a normal exam. Redness alone can come from crying or fever, which is why bulging and decreased mobility carry the most weight."},{"t":"Respiratory & Cardiac","l":2,"s":false,"q":"Which murmur is MOST consistent with an innocent (functional) murmur in an asymptomatic, thriving 4-year-old?","o":["Grade II/VI low-pitched, vibratory, musical systolic murmur at the left lower sternal border","Grade IV/VI harsh holosystolic murmur at the left lower sternal border with a thrill","Grade II/VI diastolic murmur at the left upper sternal border","Grade III/VI systolic murmur with a click and fatigue on exertion"],"a":[0],"r":"Still's murmur is the most common innocent murmur in children. It is a soft (grade I\u2013II), low-pitched, vibratory or musical systolic murmur at the left lower sternal border in a child with normal growth and no symptoms. A thrill (grade IV or higher) or harsh holosystolic quality suggests a VSD. Diastolic murmurs are usually pathologic. Clicks and exertional symptoms also point to heart disease."},{"t":"Respiratory & Cardiac","l":2,"s":true,"q":"A 3-year-old has had 6 days of fever, bilateral non-purulent conjunctivitis, a rash, and an enlarged cervical lymph node. Which statements correctly distinguish this condition from rheumatic fever? Select all that apply.","o":["The major complication is coronary artery aneurysm rather than valvular heart disease.","It is treated with IVIG and aspirin.","It is diagnosed with the Jones criteria and evidence of a prior strep infection.","It primarily affects children under 5 years old.","It requires long-term antibiotic prophylaxis to prevent recurrence."],"a":[0,1,3],"r":"This is Kawasaki disease: prolonged fever, conjunctivitis, rash, and cervical lymphadenopathy in a child under 5. It is a medium-vessel vasculitis treated with IVIG and aspirin, and the feared complication is coronary artery aneurysm. Rheumatic fever (ages 5\u201315) follows GABHS infection, is diagnosed with the Jones criteria, causes valvular heart disease, and needs long-term antibiotic prophylaxis."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A family nurse practitioner (FNP) is deciding between topical and systemic therapy for children with KOH-confirmed tinea corporis seen in clinic this week. Which findings support systemic therapy rather than topical therapy alone? Select all that apply.","o":["A 9-year-old with annular scaling plaques on the cheek and chin extending to the jawline","A 10-year-old with trunk lesions and a thickened, dystrophic great toenail with subungual debris","A 6-year-old with three 2-cm forearm lesions partially improved after 7 days of twice-daily clotrimazole","A 7-year-old with trunk lesions who is receiving maintenance chemotherapy for leukemia","An 8-year-old with a single thigh lesion with superficial pustules along its border","A 5-year-old with two trunk lesions that have spread peripherally and cleared centrally over 2 weeks"],"a":[0,1,3],"r":"Tinea faciei (A), a tinea infection of the nails at the same time (B), and immunosuppression (D) are all listed indications for systemic therapy, as are extensive infection and failure of topical treatment. Option C is not a topical failure: lesions are expected to take 1 to 4 weeks to resolve, and partial improvement at 1 week is on track. Superficial pustules (E) can be part of an inflammatory tinea corporis lesion and do not by themselves call for systemic therapy. Peripheral spread with central clearing (F) is the classic localized picture and is treated topically."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 7-year-old with extensive tinea corporis and tinea of the nails at the same time is starting oral griseofulvin, and an extended course is expected. Which laboratory monitoring plan matches the recommended schedule?","o":["CBC, liver, and renal function 4 weeks after starting therapy and every 4 weeks until it is stopped","CBC, liver, and renal function 8 weeks after starting therapy and every 8 weeks until it is stopped","CBC, liver, and renal function 8 weeks after starting therapy and once more when therapy is completed","CBC, liver, and renal function 2 weeks after starting therapy and every 8 weeks until it is stopped"],"a":[1],"r":"Griseofulvin carries a risk of hepatotoxicity, nephrotoxicity, and neutropenia. Patients on extended therapy should have a CBC, liver function, and renal function checked 8 weeks after starting and every 8 weeks until treatment stops. The 4-week interval (A) and the 2-week first check (D) do not match this schedule. Option C drops the repeated every-8-week checks needed for the rest of the course."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 6-year-old with atopic dermatitis has an annular, scaly plaque on the trunk that was mistaken for an eczema flare and treated with several different creams. Which topical agents, applied to a dermatophyte infection, can produce tinea incognito? Select all that apply.","o":["Tacrolimus 0.03% ointment used alone","Pimecrolimus 1% cream used alone","Triamcinolone 0.1% cream used alone","Clotrimazole-betamethasone combination cream","Terbinafine 1% cream used alone","Ciclopirox 0.77% cream used alone"],"a":[0,1,2,3],"r":"Tinea incognito is a dermatophyte infection altered by topical calcineurin inhibitors (tacrolimus, pimecrolimus) or steroid creams, used alone or together with a topical antifungal. That is why the steroid-antifungal combination (D) also qualifies. An antifungal used alone, whether an allylamine (E) or ciclopirox (F), treats the infection and does not hide it, so neither causes tinea incognito."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 5-year-old who attends day care has a KOH-confirmed tinea corporis lesion on the forearm. The parent will apply the first dose of topical clotrimazole tonight at 7 PM. When may the child return to day care?","o":["After 48 hours of antifungal treatment have elapsed","After 72 hours of antifungal treatment have elapsed","After 24 hours of antifungal treatment have elapsed","After the forearm lesion has completely cleared"],"a":[2],"r":"Children with tinea corporis are excluded from day care or school until 24 hours after treatment has begun. The 48-hour and 72-hour options (A, B) exclude the child longer than recommended. Waiting for complete clearing (D) is unnecessary, since topical clearing can take 1 to 4 weeks."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 16-year-old obese male has had an itchy groin rash for 3 weeks. Which examination findings are consistent with tinea cruris? Select all that apply.","o":["Erythematous to slightly brown plaques with sharp margins on the inner thighs","A raised advancing border containing scale, pustules, or vesicles","Partial central clearing within the plaques","Satellite papulopustules scattered beyond the main plaque border","Beefy-red, moist plaques with no defined advancing border","Involvement of the left thigh only, which rules out a dermatophyte"],"a":[0,1,2],"r":"Tinea cruris appears as erythematous to slightly brown, sharply marginated plaques with a raised border of scale, pustules, or vesicles, and central clearing may be present. Satellite papulopustules (D) and beefy-red plaques with no defined border (E) point to candidiasis or intertrigo instead. Tinea cruris is usually bilateral and symmetric but not always, so one-sided involvement (F) does not rule it out."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 15-year-old has KOH-confirmed tinea pedis between the fourth and fifth toes. Which instruction for the topical antifungal is correct?","o":["Apply it 1 cm beyond the rash border twice daily until 7 days after clearing","Apply it 2 cm beyond the rash border twice daily until 14 days after clearing","Apply it only to the visible rash twice daily until 7 days after clearing","Apply it 1 cm beyond the rash border once daily until 14 days after clearing"],"a":[0],"r":"For tinea pedis, the antifungal is applied 1 cm beyond the borders of the rash twice daily and continued until 7 days after clearing; the usual course is 3 to 6 weeks. Option B has the wrong margin and the wrong end point. Option D has the wrong frequency and the wrong end point. Option C leaves out the margin of normal-appearing skin beyond the border, where fungus is still present."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"An 8-year-old is on day 10 of topical clotrimazole for tinea corporis on the arm. The child now has a new, itchy papulovesicular eruption on the trunk, hands, and face. Which statements about this eruption are accurate? Select all that apply.","o":["It is a hypersensitivity response to the fungus","Its spread to the trunk, hands, and face is typical of this reaction","KOH of the new papulovesicles is expected to show many hyphae","It shows an allergy to clotrimazole, so all azoles must be avoided permanently","It is called an id response","It confirms tinea incognito caused by the topical antifungal"],"a":[0,1,4],"r":"An id response is an itchy papulovesicular rash on the trunk, hands, or face caused by a hypersensitivity response to the fungus. The id lesions themselves do not contain fungus, so KOH of them is expected to be negative (C). The reaction is to the fungus, not to the drug (D). Tinea incognito (F) is caused by steroids or calcineurin inhibitors, not by an antifungal used alone."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 17-year-old male has tinea cruris on both inner thighs and is starting topical clotrimazole. He asks how long he will need to use it. Which duration is typical?","o":["Usually 1 to 4 weeks of topical therapy","Usually 3 to 6 weeks of topical therapy","Usually 2 to 4 weeks of topical therapy","Usually 4 to 6 weeks of topical therapy"],"a":[3],"r":"Topical treatment of tinea cruris usually lasts 4 to 6 weeks. The distractors are durations for other tinea situations: 1 to 4 weeks (A) is topical therapy for tinea corporis, 2 to 4 weeks (C) is griseofulvin for tinea corporis outside the scalp, and 3 to 6 weeks (B) is topical therapy for tinea pedis."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 14-year-old with interdigital tinea pedis asks what to do at home besides applying the cream. Which instructions are appropriate? Select all that apply.","o":["Go barefoot at home so the feet can breathe","Machine-wash tennis shoes with soap and bleach","Rinse the feet with water and vinegar, then dry carefully between the toes","Wear nylon socks to pull moisture away from the toes","Keep shoes on indoors to avoid contaminating household floors","Avoid moisturizers on the feet because they encourage fungal growth"],"a":[0,1,2],"r":"Recommended home measures include going barefoot at home, machine-washing tennis shoes with soap and bleach, and rinsing the feet with plain water or water and vinegar, then drying carefully between the toes. Nylon socks (D) and shoes that do not breathe are risk factors for tinea pedis. Keeping shoes on all day (E) traps moisture. Families are told to moisturize and protect the feet to prevent splitting and cracking, so F is wrong."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 6-year-old is starting oral griseofulvin for extensive tinea corporis. Which instruction about giving the medication is most appropriate?","o":["Give each dose with a low-fat meal to limit stomach upset","Give each dose on an empty stomach 1 hour before a meal","Give each dose with a fatty food such as whole milk or ice cream","Give each dose with an antacid to limit stomach upset"],"a":[2],"r":"Griseofulvin is absorbed better when taken with fatty foods. An empty stomach (B) or a low-fat meal (A) lowers absorption. An antacid (D) is not recommended and gives no absorption benefit."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 16-year-old wrestler asks about the different ways athlete's foot can look. Which are the three described clinical forms of tinea pedis? Select all that apply.","o":["Vesicles and erosions on the instep of one or both feet","An occasional fissure between the toes with surrounding scale and erythema","Diffuse scaling of the weight-bearing sole extending to the outer edges of the foot","Diffuse scaling of the top of the foot extending up to the ankle","Vesicles and erosions on the tops of the toes of both feet","Thickened scaling of the weight-bearing sole that spares the outer edges of the foot"],"a":[0,1,2],"r":"The three forms are (1) vesicles and erosions on the instep, (2) an occasional fissure between the toes with surrounding scale and erythema, and (3) the rare moccasin form, with diffuse scaling of the weight-bearing surface often extending to the outer edges of the foot. The top of the foot stays clear in tinea pedis, which rules out D and E. Option F reverses the moccasin pattern, which typically extends to the outer edges rather than sparing them."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 9-year-old returns 2 weeks after starting twice-daily clotrimazole for a presumed tinea corporis lesion on the shoulder. The lesion is unchanged. What is the most appropriate next step?","o":["Add hydrocortisone 1% to the clotrimazole and reassess in 2 weeks","Obtain a fungal culture and switch to a different class of antifungal","Continue clotrimazole for 2 more weeks before obtaining a fungal culture","Obtain a fungal culture and switch to a different azole such as miconazole"],"a":[1],"r":"Follow-up is at 2 weeks. If the lesion has not responded, either the diagnosis is wrong or the fungus may be resistant, so obtain a culture to confirm the diagnosis and change to a different class of antifungal. Miconazole (D) is an azole like clotrimazole, so it is not a change of class. Continuing the same drug (C) delays the workup. Adding a steroid (A) risks tinea incognito and goes against the advice to avoid steroid-antifungal combinations."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"An FNP is teaching nursing students about who gets tinea cruris. Which statements about its epidemiology are accurate? Select all that apply.","o":["It rarely occurs before adolescence","It is more common in males than in females","Obesity and excessive sweating (hyperhidrosis) are predisposing factors","It is most common in toddlers who are still in diapers","It is more common in females because the labia majora are typically involved"],"a":[0,1,2],"r":"Tinea cruris rarely occurs before adolescence and is more common in males, in obese individuals, in people with hyperhidrosis, and with chafing from tight clothing or moisture. It is extremely common overall. A groin rash in a toddler wearing diapers (D) is more likely irritant or candidal diaper dermatitis. The labia majora, along with the penis and scrotum, are generally spared in tinea cruris (E)."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 13-year-old has had itchy, scaling skin on both feet since getting new sneakers 2 weeks ago. Which finding most strongly favors contact dermatitis over tinea pedis?","o":["Erythema and scaling on the tops of both feet, with the toe web spaces clear","Maceration and scaling between the fourth and fifth toes of both feet","White, peeling skin between the third and fourth toes, with the top of the foot clear","Vesicles and erosions on the instep of one foot, with the top of the foot clear"],"a":[0],"r":"In tinea pedis the top of the foot stays clear, and the rash is concentrated on the soles, the instep, and the spaces between the toes, especially between the third, fourth, and fifth toes. A rash on the top of both feet that spares the web spaces fits contact dermatitis from footwear. Options B, D, and C are each classic presentations of tinea pedis."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 10-year-old has a 3-cm annular lesion on the forearm. Which findings favor tinea corporis over its look-alikes? Select all that apply.","o":["Scale concentrated at a red, advancing border","Hyphae on KOH of scrapings taken from the border","Peripheral spread with central clearing","A smooth, non-scaly ring of skin-colored papules in the deeper skin on the back of the hand","A coin-shaped plaque that is scaly or crusted throughout, with no central clearing","An expanding, non-scaly red ring 10 days after a tick bite"],"a":[0,1,2],"r":"Tinea corporis has a red, scaly border, spreads outward while clearing centrally, and shows hyphae and spores on KOH of scrapings from the border. A smooth, non-scaly ring of deeper papules (D) suggests granuloma annulare. A coin-shaped plaque with no central clearing (E) suggests nummular eczema. A non-scaly expanding ring after a tick bite (F) suggests Lyme disease (erythema migrans). All three are in the differential diagnosis."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 4-year-old has several annular scaling plaques on the face, and the FNP decides systemic griseofulvin is warranted. Which treatment duration is typical for this non-scalp infection?","o":["6 to 8 weeks of oral griseofulvin","8 to 12 weeks of oral griseofulvin","4 to 6 weeks of oral griseofulvin","2 to 4 weeks of oral griseofulvin"],"a":[3],"r":"Griseofulvin is the systemic drug of choice for children older than 2 years. For tinea outside the scalp, such as tinea faciei, treatment typically lasts 2 to 4 weeks. Six to 8 weeks (A) is the usual griseofulvin course for tinea pedis. Four to 6 weeks (C) is topical therapy for tinea cruris. Eight to 12 weeks (B) is longer than needed for skin outside the scalp."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 12-year-old is expected to need several months of griseofulvin. Which laboratory tests should be included in periodic monitoring? Select all that apply.","o":["Complete blood count with differential","Liver function panel","Serum creatinine and blood urea nitrogen (BUN)","Thyroid-stimulating hormone (TSH)","Fasting lipid panel","Serum creatine kinase"],"a":[0,1,2],"r":"Extended griseofulvin therapy requires a CBC, liver function, and renal function because of the risk of neutropenia, hepatotoxicity, and nephrotoxicity. Griseofulvin does not cause the effects that TSH (D), lipids (E), or creatine kinase (F) would detect, so routine monitoring of these is not indicated."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 17-year-old with tinea cruris asks whether he can use the clotrimazole-betamethasone cream his brother was prescribed, because it \"works faster.\" Which response is most accurate?","o":["\"Steroid creams in the groin are safe as long as they are combined with an antifungal.\"","\"Steroid creams in the groin can cause skin thinning (atrophy) and stretch marks (striae), so they should be avoided.\"","\"Steroid creams in the groin only lighten the skin, so you can use them sparingly.\"","\"Steroid creams in the groin are safe if you limit them to the first 2 weeks of treatment.\""],"a":[1],"r":"For tinea cruris, steroids, including steroid-antifungal combinations, should not be used because they can cause atrophy and striae. A time limit (D) and combining with an antifungal (A) are not exceptions, since combination products are specifically to be avoided. Option C leaves out the key risk of atrophy and striae."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 14-year-old with interdigital tinea pedis has been using topical antifungals for 3 weeks. He now has itchy vesicles on the palms and the sides of the fingers, and the affected foot has started to smell bad. Which statements are accurate? Select all that apply.","o":["Vesicles on the palms and sides of the fingers are consistent with an id response","An id response from tinea pedis can occasionally involve the trunk and extremities","A foul odor from the foot suggests a secondary bacterial infection","The hand vesicles come from fungus spread to the hands, and KOH will show hyphae","The hand vesicles are tinea manuum and require griseofulvin for 6 to 8 weeks","The foul odor is the first sign of an id response"],"a":[0,1,2],"r":"An allergic reaction to the fungus, the id response, appears as vesicles on the palms and sides of the fingers and occasionally on the trunk and extremities. Secondary bacterial infection is suggested by a foul odor. Id lesions do not contain fungus, so they do not reflect spread of the fungus to the hands (D) and do not need tinea manuum treatment (E). Odor signals bacterial infection, not an id response (F)."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 15-year-old has acute vesicular tinea pedis on the instep. Besides the topical antifungal, which wet-compress regimen is recommended?","o":["Wet compresses 2 to 4 times daily for 10 to 15 minutes","Wet compresses 4 to 6 times daily for 10 to 15 minutes","Wet compresses 2 to 4 times daily for 30 to 45 minutes","Wet compresses 1 to 2 times daily for 20 to 30 minutes"],"a":[0],"r":"Acute vesicular tinea pedis lesions can be treated with wet compresses 2 to 4 times daily for 10 to 15 minutes, along with topical antifungals. Each distractor changes either the frequency (B, D) or the length of each session (C, D). Compresses that are too long or too frequent can cause maceration."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 16-year-old high school wrestler has tinea cruris. Which self-care instructions are appropriate? Select all that apply.","o":["Wear cotton underwear and loose-fitting clothing","Apply an absorbent antifungal powder to the groin","Bathe as soon as possible after a match, use only your own towel, and dry thoroughly","Wear snug compression shorts during practice to reduce chafing","Wait to bathe until you get home so you avoid locker room floors","Cover the groin with a thick occlusive ointment before practice"],"a":[0,1,2],"r":"Patients with tinea cruris are advised to wear cotton underwear and loose clothing, use absorbent antifungal powder, and after a wrestling event, bathe as soon as possible, use only their own towel, and dry thoroughly. Tight clothing (D) and occlusive products (F) trap moisture and add to chafing. Delaying bathing (E) goes against the advice to bathe as soon as possible."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 17-year-old has chronic tinea pedis that has not responded to several properly used topical courses, and griseofulvin is started. Which course length is usually recommended?","o":["3 to 6 weeks of griseofulvin","8 to 12 weeks of griseofulvin","6 to 8 weeks of griseofulvin","2 to 4 weeks of griseofulvin"],"a":[2],"r":"When griseofulvin is needed for tinea pedis, which is rare, treatment usually lasts 6 to 8 weeks. Two to 4 weeks (D) is the griseofulvin course for tinea corporis outside the scalp. Three to 6 weeks (A) is the usual topical course for tinea pedis. Eight to 12 weeks (B) is longer than recommended."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 4-year-old has two small, localized tinea corporis lesions on the trunk, and topical miconazole is prescribed. Which instructions are correct? Select all that apply.","o":["Apply the cream to each lesion and to a zone of surrounding normal skin","Apply the cream twice a day","Continue until the skin looks healed, which can take 1 to 4 weeks","Apply the cream only to the visible lesion, stopping at its border","Apply the cream once a day for a fixed 7-day course, however the skin looks","Continue until the skin looks healed, which typically takes 4 to 6 weeks"],"a":[0,1,2],"r":"For localized tinea corporis, apply the cream to the lesion and a zone of normal skin around it, twice a day, until the skin has healed, which can take 1 to 4 weeks. Stopping at the border (D) leaves fungus at the active edge untreated. A fixed 7-day course (E) is too short and does not follow the clinical response. Four to 6 weeks (F) is the usual duration for tinea cruris, not tinea corporis."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 16-year-old with suspected tinea cruris has a fungal culture sent after failing treatment. Which result would be LEAST consistent with the usual causes of tinea cruris?","o":["Trichophyton mentagrophytes","Trichophyton rubrum","Epidermophyton floccosum","Malassezia furfur"],"a":[3],"r":"Tinea cruris is caused by the dermatophytes Epidermophyton floccosum, Trichophyton rubrum, and Trichophyton mentagrophytes. Malassezia is a yeast that is not a dermatophyte and causes tinea (pityriasis) versicolor, not tinea cruris. Options C, B, and A are all expected causes."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 15-year-old high school wrestler has several annular, scaly plaques on the neck and arms, and two teammates have similar lesions. Which statements about managing this tinea corporis gladiatorum are accurate? Select all that apply.","o":["Systemic antifungal therapy may be required","Teammates with similar lesions should be identified and treated","The infection is endemic among wrestling team members, so team contacts are a likely ongoing source","A negative Wood's lamp exam rules out a dermatophyte infection","A topical antifungal-corticosteroid combination is preferred to calm inflammation before meets"],"a":[0,1,2],"r":"Tinea corporis gladiatorum may require systemic therapy because it is endemic among wrestling team members. Contacts should be identified and treated, and the source eliminated, to prevent recurrence. Most dermatophytes that cause tinea corporis (Trichophyton species) do not fluoresce, so a negative Wood's lamp exam (D) does not rule out infection. Steroid-antifungal combinations (E) should be avoided."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 7-year-old was diagnosed with eczema at urgent care and used triamcinolone cream for 3 weeks on a scaly trunk plaque. The plaque faded during treatment, but within days of stopping the cream it returned larger, less scaly, and with a poorly defined border. What is the most likely diagnosis?","o":["Tinea incognito","Flare of nummular eczema","Allergic contact dermatitis to triamcinolone","Id response"],"a":[0],"r":"In tinea incognito, a dermatophyte infection is altered by steroid creams or calcineurin inhibitors: the lesions improve, relapse rapidly when the cream is stopped, and the infection persists chronically. Its atypical, less scaly appearance makes it easy to misdiagnose. An id response (D) is a distant papulovesicular hypersensitivity eruption, not a single plaque that relapses. Nummular eczema (B) would not typically worsen so quickly after a steroid is stopped. Contact allergy to the steroid (C) would worsen during use, not improve."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 13-year-old athlete has itchy, scaling feet. Which findings favor tinea pedis over juvenile plantar dermatosis or pitted keratolysis? Select all that apply.","o":["Maceration and scaling between the fourth and fifth toes","Septate hyphae on KOH of the scale","Vesicles and erosions on the instep","Red, glazed, dry cracks limited to the weight-bearing forefoot","Involvement of both feet with the spaces between the toes spared","Small, crater-like pits on the pressure-bearing sole"],"a":[0,1,2],"r":"Tinea pedis favors the spaces between the third, fourth, and fifth toes and the instep, can be vesicular, and shows hyphae on KOH. Juvenile plantar dermatosis causes red, dry cracks on the weight-bearing surface (D) and typically affects both feet while sparing the spaces between the toes (E). Crater-like pits on pressure areas (F) are typical of pitted keratolysis. Both conditions are in the differential diagnosis."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 14-year-old starts topical terbinafine for interdigital tinea pedis. When should the FNP schedule follow-up, if the lesions are responding?","o":["In 4 to 6 weeks","In 1 week","In 6 to 8 weeks","In 2 to 3 weeks"],"a":[3],"r":"Follow-up for tinea pedis is recommended in 2 to 3 weeks, or sooner if the lesions are not responding. One week (B) is too early to judge response. Four to 6 weeks (A) and 6 to 8 weeks (C) wait too long to identify treatment failure."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 17-year-old male has KOH-confirmed tinea cruris. Where can tinea cruris be expected or occasionally found? Select all that apply.","o":["Inner thighs","Inguinal creases","Perianal region and buttocks","Scrotum","Shaft of the penis","Labia majora (in female patients)"],"a":[0,1,2],"r":"Tinea cruris occurs on the inner thighs and inguinal creases and occasionally extends to the perianal region, buttocks, or abdomen. The penis, scrotum, and labia majora are generally spared. Involvement of the scrotum in particular should raise concern for candidiasis instead."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 9-year-old has an annular plaque on the leg that has not improved after an appropriate course of topical antifungal. Which diagnostic step is the most appropriate first-line test to confirm a dermatophyte?","o":["Punch biopsy taken from the center of the lesion","Wood's lamp exam looking for fluorescence","KOH prep of scrapings from the scaly, advancing border","KOH prep of scrapings from the cleared center of the lesion"],"a":[2],"r":"When treatment fails or the diagnosis is uncertain, scrapings from the border of the lesion are treated with KOH to look for hyphae and spores, and a fungal culture can be sent. The cleared center (D) yields few organisms. Most Trichophyton species that cause tinea corporis do not fluoresce, so a Wood's lamp exam (B) is unreliable. Biopsy (A) is invasive and not first-line."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 3-year-old has tinea corporis. The family adopted a kitten with patchy hair loss 1 month ago, and the child's sibling has a similar lesion. Which education points are appropriate? Select all that apply.","o":["Have the kitten examined and treated by a veterinarian","Have the sibling's lesion examined and treated","Keep the skin dry after each application of the antifungal","Stop the cream as soon as the itching goes away to limit resistance","Cover the cream with a plastic occlusive wrap overnight","Lesions stop being contagious once the scaling decreases, so no other precautions are needed"],"a":[0,1,2],"r":"Families should find the source of infection and treat or eliminate it (the kitten), identify and treat contacts (the sibling), and keep the skin dry after applying the antifungal. Treatment continues until the skin has healed, not just until itching stops (D). Occlusive wraps (E) work against keeping the skin dry. Families should be taught about how the lesions spread and how long treatment lasts, rather than told that spread ends once scaling decreases (F)."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A parent asks why the FNP might prescribe econazole or ciclopirox instead of over-the-counter clotrimazole for the child's tinea corporis. Which statement is accurate?","o":["They penetrate the skin more effectively and are also less expensive","They penetrate the skin more effectively but are more expensive","They penetrate the skin less effectively but are less expensive","They penetrate the skin equally well but are more expensive"],"a":[1],"r":"Prescription antifungals such as econazole and ciclopirox penetrate the skin more effectively than over-the-counter agents such as miconazole or clotrimazole but are more expensive. Each distractor gets either penetration or cost wrong."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 15-year-old soccer player has burning, itchy, scaling skin between the toes. Which parts of his history increase his risk of tinea pedis? Select all that apply.","o":["He wears nylon socks every day","He wears non-breathable synthetic athletic shoes most of the day","He has small cracks and nicks on his feet from training","He showers barefoot in the school locker room after practice","He wears cotton socks and changes them twice a day","He goes barefoot on dry floors at home"],"a":[0,1,2,3],"r":"Risk factors for tinea pedis include sweaty feet, nylon socks or non-breathable shoes, small injuries to the skin of the feet (cracks, nicks, cuts), and contact with damp areas such as locker rooms, showers, and pools. Cotton socks (E) and going barefoot at home (F) are actually recommended preventive measures."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 17-year-old has tinea cruris and also has scaling between the fourth and fifth toes that suggests tinea pedis. Which dressing instruction is most appropriate?","o":["Put underwear on before socks to avoid spreading the fungus from the feet to the groin","Put socks on before underwear to avoid spreading the fungus from the groin to the feet","Put underwear on before socks to avoid spreading the fungus from the groin to the feet","Put socks on before underwear to avoid spreading the fungus from the feet to the groin"],"a":[3],"r":"When tinea pedis is suspected along with tinea cruris, the patient should put socks on before underwear so that underwear pulled up over the feet does not carry fungus to the groin. Option A gives the wrong order. Options A and C state the wrong direction of spread: the feet are the source that reinfects the groin."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"An 11-year-old has multiple scaly plaques on the trunk and arms. Which statements about the physical findings of tinea corporis are accurate? Select all that apply.","o":["Lesions may be inflamed throughout, with superficial pustules","Lesions are often prominent over hair follicles","Multiple secondary lesions may merge into an area several centimeters across","Lesions spread toward the center and clear at the edges","Pustules rule out a dermatophyte and indicate impetigo","Lesions typically spare hair-bearing skin"],"a":[0,1,2],"r":"Tinea corporis lesions spread outward and clear centrally, or may be inflamed throughout with superficial pustules. They are often prominent over hair follicles, and multiple secondary lesions may merge into a large area. Option D reverses the pattern of spread. Pustules can be part of inflammatory tinea, so they do not rule it out (E). Prominence over hair follicles contradicts F."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 16-year-old has chronic moccasin-type tinea pedis with thick scaling on the soles that has responded poorly to a topical antifungal alone. Which addition is most appropriate?","o":["Add triamcinolone cream as a keratolytic along with the topical antifungal","Add a urea or lactic acid keratolytic along with the topical antifungal","Replace the topical antifungal with a urea or lactic acid keratolytic alone","Add aluminum chloride as a keratolytic along with the topical antifungal"],"a":[1],"r":"Tinea pedis may need a keratolytic agent such as lactic acid or urea added to the antifungal to thin the scale so the drug can penetrate. Aluminum chloride (D) is an antiperspirant used for excessive sweating, not a keratolytic. A keratolytic alone (C) does not treat the fungus. Triamcinolone (A) is a steroid, not a keratolytic, and steroid-antifungal combinations are avoided."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 15-year-old obese male is evaluated for a groin rash. Which findings suggest a diagnosis OTHER than tinea cruris? Select all that apply.","o":["Scrotal involvement with satellite papulopustules","Coral-red fluorescence under a Wood's lamp with a negative KOH","Sharply defined, shiny red plaques without scale in the gluteal cleft, plus nail pitting","A raised, scaly border with central clearing on the inner thighs","Vesicles along the advancing border of the plaques","Involvement of the right thigh that is much worse than the left"],"a":[0,1,2],"r":"Scrotal involvement with satellite lesions suggests candidiasis (A). Coral-red fluorescence with a negative KOH suggests erythrasma (B). Shiny plaques without scale in a skin fold, together with nail pitting, suggest inverse psoriasis (C). All three are in the differential diagnosis of tinea cruris. A raised border with central clearing (D) and vesicles along the border (E) are typical of tinea cruris. Tinea cruris is usually, but not always, symmetric (F)."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 16-year-old female taking a combined oral contraceptive is starting griseofulvin for extensive tinea corporis. Which counseling statement is most accurate?","o":["Use a backup contraceptive method only during the first 7 days of griseofulvin therapy","Stop the oral contraceptive during therapy, because griseofulvin raises estrogen to toxic levels","Use a backup contraceptive method throughout therapy, because griseofulvin can make the pill less effective","No backup method is needed, because griseofulvin does not affect hormonal contraception"],"a":[2],"r":"Griseofulvin induces hepatic enzymes and can make hormonal contraceptives less effective. It is also teratogenic, so a backup method is advised throughout therapy and for about 1 month afterward. Seven days (A) is too short, and option C ignores the interaction. Griseofulvin lowers rather than raises effective hormone levels, and stopping contraception (B) would raise the risk of pregnancy while on a teratogenic drug."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A school nurse asks the FNP about the epidemiology of tinea pedis. Which statements are accurate? Select all that apply.","o":["It is acquired through direct contact with contaminated surfaces such as locker room floors","It often occurs together with tinea cruris","It is more common in males","It is uncommon in children who have not yet reached adolescence","It is most common in infants and toddlers","It is more common in females because of tight, closed footwear"],"a":[0,1,2,3],"r":"Tinea pedis is acquired through direct contact with contaminated surfaces, such as warm, moist shower and locker room floors. It often occurs with tinea cruris, is more common in males, and is uncommon before adolescence. Infants and toddlers (E) are not the peak group. It is more common in males, not females (F)."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 16-year-old has used topical clotrimazole twice daily as directed for 6 weeks for presumed tinea cruris, with no improvement. What is the most appropriate next step?","o":["Obtain a KOH prep and fungal culture of the border to confirm the diagnosis","Add hydrocortisone 1% cream to the clotrimazole and reassess in 2 weeks","Switch to a clotrimazole-betamethasone combination cream for 2 weeks","Continue the clotrimazole for another 4
