<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peds Nursing Quiz</title><meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1c2321;--mute:#5d6964;--acc:#0f766e;--acc2:#e6f2f0;--ok:#15803d;--okbg:#e8f6ec;--bad:#b42318;--badbg:#fdecea;--line:#dfe4e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:auto;padding:18px 16px 40px}
h1{font-size:26px;margin:6px 0 2px}.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:15px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4}.btn.ghost{background:var(--acc2);color:var(--acc)}
.count{color:var(--mute);font-size:14px;margin-top:8px;text-align:center}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--acc2);color:var(--acc);margin-right:6px}
.tag.sata{background:#fff4e0;color:#9a5b00}
.q{font-size:18px;margin:10px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}
.opt .k{flex:none;width:26px;height:26px;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:13px;font-weight:700;border-radius:50%}
.sata-q .opt .k{border-radius:6px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}.rat{font-size:15.5px;color:#2b3431}
.score{font-size:56px;font-weight:800;color:var(--acc);text-align:center;margin:6px 0 0}
.review{font-size:15px;border-top:1px solid var(--line);padding:10px 0}
.small{font-size:13px;color:var(--mute);text-align:center;margin-top:18px}
</style></head><body><main id="app"></main>
<script>
const BANK=[{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A mother brings her 7-year-old son for a well visit. She reports that his dry, itchy, scaly patches in the antecubital and popliteal folds first appeared shortly after his third birthday, and that he never had skin problems as a baby. Based on age of onset, which phase of atopic dermatitis does this child's presentation represent?","o":["Infantile phase, onset 1\u20136 months and continuing up to 2 years","Childhood phase, onset 2 years to puberty","Adult phase, onset after 12 years and continuing through puberty","Infantile phase, because atopic dermatitis that begins before age 5 is classified as infantile"],"a":[1],"r":"The childhood phase starts between 2 years and puberty, and this child's onset was at age 3. The infantile phase starts at 1\u20136 months and can continue up to 2 years. The adult phase starts after 12 years. Option D gets the infantile age range wrong."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"The nurse practitioner is teaching nursing students about the description of atopic dermatitis (eczema). Which findings fit the classic description? Select all that apply.","o":["Abnormally dry skin","Severe itching that gets worse in the evening","Lichenification in chronically scratched areas","Greasy, yellow, non-pruritic scale in hair-bearing areas","A steady course with no periods of remission once the rash appears"],"a":[0,1,2],"r":"Eczema, \"the itch that rashes,\" is described as abnormally dry skin with severe itching that gets worse in the evening. The itching and redness lead to dry, scaly skin, red papules, or lichenification. Greasy, non-pruritic scale describes seborrheic dermatitis. Eczema has periods of flare-ups and remission, not a steady course."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 2-year-old has had recurrent, very itchy, dry, red patches on the cheeks and extensor surfaces since 4 months of age. Which finding best supports a diagnosis of atopic dermatitis?","o":["Elevated IgM and no family history of allergic disease","Low serum IgE and a family history of psoriasis","Elevated IgG after a recent strep throat infection","Elevated serum IgE and a strong family history of atopy"],"a":[3],"r":"The professor's notes link atopic dermatitis to elevated IgE and a strong family history. Elevated IgM points to a current infection (for example, parvovirus), not atopy. Low IgE goes against the diagnosis. An elevated IgG after strep has nothing to do with eczema."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"The parent of a 4-year-old with atopic dermatitis asks how to help break the itch\u2013scratch cycle at home. Which instructions should the nurse practitioner include? Select all that apply.","o":["\"Keep the home environment cool and humid.\"","\"Give daily soaks in hot water with a deodorant soap to calm the itch.\"","\"Dress your child in 100% cotton and avoid wool or synthetic fabrics.\"","\"Lightly scented laundry detergents and fabric softeners are fine as long as they are labeled 'gentle.'\"","\"Emotional stress can make your child's eczema worse.\""],"a":[0,2,4],"r":"The professor's education points are: keep the environment cool and humid, wear 100% cotton, and recognize that emotional stress can worsen eczema. Soaks should use tepid water and mild soap. Hot water and harsh soaps dry the skin. Laundry detergents should be fragrance-free, and a \"gentle\" label does not make a scented product fragrance-free."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 6-year-old with moderate atopic dermatitis has used emollients, a low-potency topical steroid, and the recommended skin-care measures for 2 weeks. The parent says the rash is no better. What is the most appropriate next step?","o":["Refer the child to a specialist (dermatology)","Continue the same regimen for 4 more weeks, then reassess","Switch to a high-potency topical steroid, including on the face","Start a scheduled course of oral antibiotics to prevent infection"],"a":[0],"r":"Per the professor's notes, refer when a child has severe skin eruptions or does not respond to treatment after two weeks. Waiting another 4 weeks delays the recommended referral. High-potency steroids should not go on the face. Antibiotics are not given for prevention; secondary infection is something to watch for and treat if it occurs."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"Which of the following are treatment goals for atopic dermatitis according to the professor's notes? Select all that apply.","o":["Hydrate and lubricate the skin","Use an antipruritic agent to break the itch\u2013scratch cycle","Give systemic antibiotics continuously to prevent skin infection","Monitor for and prevent secondary infections","Hold topical steroids until an elevated IgE level is confirmed"],"a":[0,1,3],"r":"The listed goals are skin hydration and lubrication, an antipruritic to break the itch\u2013scratch cycle, topical steroids, and monitoring for and preventing secondary infection. Prevention means watching closely and caring for the skin, not giving antibiotics continuously. Topical steroids are a core part of treatment and do not depend on an IgE result."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 5-year-old with poorly controlled eczema has honey-colored crusts over excoriated, scratched areas on both forearms. The rest of the skin is unaffected. How should this impetigo be classified?","o":["Primary impetigo, because the bacteria infected normal skin directly","Bullous impetigo, because a pre-existing skin condition is present","Secondary impetigo, because the infection developed at a break in the skin","Primary impetigo, because honey-colored crusting is present"],"a":[2],"r":"Secondary impetigo is an infection at a break in the skin, such as eczema. Primary impetigo is a direct infection of normal skin, which does not fit lesions on excoriated eczema. Honey-colored crusts are a feature of nonbullous impetigo; they do not tell you whether it is primary or secondary. Having eczema does not make impetigo bullous."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 4-year-old has several lesions around the nose and mouth that began as tiny vesicles and now have moist, honey-colored crusts. Which findings are consistent with nonbullous impetigo? Select all that apply.","o":["Moist honey-colored crusts on red, eroded skin","Significant pain at the lesion sites","Rapid spread of lesions","A thin, varnish-like coating left after large blisters rupture","Pruritus and regional lymphadenopathy"],"a":[0,2,4],"r":"Nonbullous impetigo starts as 1\u20132 mm thin vesicles that rupture and leave moist honey-colored crusts on red, eroded skin. It is painless but spreads quickly, and itching and regional lymphadenopathy may be present. Pain is not typical. A varnish-like coating after large blisters rupture describes bullous impetigo."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"An 18-month-old has several large, flaccid blisters on the trunk. Some have ruptured and left a thin, shiny, varnish-like scale. Which type of impetigo is this, and which organism is most likely?","o":["Bullous impetigo; Staphylococcus aureus","Nonbullous impetigo; Streptococcus pyogenes","Bullous impetigo; Streptococcus pyogenes","Nonbullous impetigo; Staphylococcus aureus"],"a":[0],"r":"In bullous impetigo, vesicles become bullae (large blisters) that rupture and leave a thin varnish-like coating or scale. Bullous impetigo is almost always caused by S. aureus. S. pyogenes can cause impetigo in general, but not typically the bullous form. Nonbullous lesions leave honey-colored crusts, not varnish-like scale."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A nurse practitioner at a community clinic is reviewing impetigo risk factors and transmission. Which statements are accurate? Select all that apply.","o":["Cases increase during the summer months.","Hot, humid climates increase risk.","Children from lower socioeconomic groups are at higher risk.","Spread is mainly airborne and requires a negative-pressure room.","It is highly contagious and spreads through contact."],"a":[0,1,2,4],"r":"Impetigo is a highly contagious bacterial infection spread by contact. Risk factors are summer months, hot humid climates, and lower socioeconomic status. It is not an airborne disease, and negative-pressure isolation is not needed (compare varicella, which needs airborne precautions)."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 6-year-old with impetigo was started on appropriate therapy. After 7 days the lesions show no improvement. What is the most appropriate next diagnostic step?","o":["Swab the top surface of the crust for a rapid strep test","Do a KOH preparation of scrapings from the lesion edge","Continue the same therapy for another 7 days before any testing","Swab beneath the crust for Gram stain, culture, and sensitivities"],"a":[3],"r":"If there is no response after 7 days, swab beneath the crust and send a Gram stain, culture, and sensitivities to identify the organism and check for resistance. The surface of the crust is contaminated and gives poor results. KOH is used for fungal infections such as tinea. Waiting another week without testing delays the right therapy. Note: standard references say impetigo is usually diagnosed clinically, and culture is reserved for treatment failure or outbreaks."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 3-year-old has two small, superficial nonbullous impetigo lesions on one cheek. The nurse practitioner prescribes topical therapy. Which instructions are correct? Select all that apply.","o":["Mupirocin applied three times daily","Leave crusts intact under the ointment so they act as a protective barrier","Retapamulin applied twice daily","Gently remove crusts before applying the antibiotic","Mupirocin applied once daily at bedtime"],"a":[0,2,3],"r":"Topical antibiotics are used for superficial, nonbullous impetigo limited to a small area. The professor highlighted mupirocin three times daily and retapamulin twice daily. Crusts should be removed before applying the antibiotic so it reaches the infected tissue. Once-daily mupirocin is not the recommended frequency, and leaving crusts in place blocks the medication."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"In which child is oral antibiotic therapy, rather than topical therapy alone, recommended for impetigo?","o":["A 4-year-old with one 1-cm superficial crusted lesion on the chin","A 6-year-old with two small superficial lesions at the nares","A 5-year-old with multiple lesions on the face, both arms, and one leg","A 7-year-old with a single localized superficial lesion on the back of the hand"],"a":[2],"r":"The professor highlighted oral antibiotics for multiple lesions. Widespread involvement across several body areas is the clearest indication. The other children have superficial lesions limited to a small area, which fits topical therapy such as mupirocin or retapamulin."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 7-year-old with no drug allergies has widespread impetigo that needs oral therapy. Which regimen is preferred by the professor?","o":["Amoxicillin for 7\u201310 days","Dicloxacillin for 7\u201310 days","Dicloxacillin for 3 days","Penicillin V for 7\u201310 days"],"a":[1],"r":"Oral therapy must cover beta-lactamase-producing S. aureus and is given for 7\u201310 days. The professor's preferred agent is dicloxacillin. Plain amoxicillin and penicillin V are broken down by beta-lactamase, so they do not reliably cover S. aureus. A 3-day course is too short. Note: standard references often list cephalexin as first-line, with dicloxacillin as an acceptable alternative."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 4-year-old who attends daycare is diagnosed with impetigo and started on an appropriate antibiotic. Which instructions should the nurse practitioner give the parent? Select all that apply.","o":["\"Your child may return to daycare after 24 hours of antibiotic treatment.\"","\"Keep your child home until every lesion has completely crusted over.\"","\"Schedule a follow-up visit in 48 to 72 hours if the lesions are not improving.\"","\"Your child must finish 72 hours of antibiotics before returning to daycare.\"","\"No follow-up is needed unless the rash is still present in 2 weeks.\""],"a":[0,2],"r":"Per the professor's highlighted points, keep children out of daycare or school until they have been treated for 24 hours, and schedule a follow-up in 48\u201372 hours if there is no improvement. Waiting until all lesions crust over is the varicella rule, not the impetigo rule. A 72-hour exclusion is too long. Waiting 2 weeks to follow up misses the 48\u201372 hour check."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"An 8-year-old with multiple impetigo lesions on the arms and legs needs oral therapy. The parent reports that the child had hives, lip swelling, and wheezing after a dose of amoxicillin. Which antibiotic is most appropriate?","o":["Clindamycin","Amoxicillin/clavulanate","Dicloxacillin","Cephalexin"],"a":[0],"r":"Clindamycin is the blueprint's choice for children with a penicillin allergy. Amoxicillin/clavulanate and dicloxacillin are penicillins and are contraindicated. Cephalexin is a reasonable choice in many patients, but it should be avoided after an immediate, anaphylactic-type penicillin reaction like this one."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 6-week-old infant has extensive bullous impetigo over the trunk and diaper area, is feeding poorly, and looks ill. What is the most appropriate treatment?","o":["Oral dicloxacillin for 7\u201310 days","Topical retapamulin twice daily with crust removal","Oral cephalexin for 7\u201310 days","Parenteral nafcillin or oxacillin"],"a":[3],"r":"For severe bullous impetigo in infants, the blueprint calls for a parenteral beta-lactamase-resistant antistaphylococcal penicillin such as methicillin, oxacillin, or nafcillin. Oral dicloxacillin and cephalexin are fine for outpatient disease but are not enough for a sick infant with extensive bullous disease. Topical therapy is only for limited, localized lesions."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 9-year-old returns from a summer camping trip in New England with an expanding red lesion on the thigh where a tick was found. Which findings are consistent with Stage 1 (early localized) Lyme disease? Select all that apply.","o":["Mild nuchal rigidity","A rash that, without treatment, resolves permanently within 48 hours and never recurs","A red annular macule or papule at the bite site with a clear ring and a larger erythematous outer ring","Fever, malaise, and headache","Arthralgia and myalgia"],"a":[0,2,3,4],"r":"Stage 1 is defined by erythema migrans (EM) at the inoculation site. It starts as a red annular macule or papule surrounded by a clear ring and then a larger erythematous outer ring, the \"bull's eye.\" Fever, malaise, headache, arthralgia, myalgia, and mild nuchal rigidity can accompany it. Without treatment, the symptoms and rash do not go away for good; they come and go for weeks to months."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"The nurse practitioner is triaging calls about tick bites. According to the blueprint, which tick bite is classified as high risk for Lyme disease transmission?","o":["A flat (unengorged) tick removed about 24 hours after a hike","A flat tick removed within 12 hours of attachment","An engorged tick estimated to have fed for more than 72 hours","A flat tick believed to have been attached for about 30 hours"],"a":[2],"r":"The blueprint defines a high-risk bite as an engorged tick that has fed for more than 72 hours, and a low-risk bite as a brief attachment of less than 36 hours. Options A, B, and D all fall under 36 hours, and many people remove the tick before transmission occurs. Note: standard references (AAP/IDSA) use attachment of 36 hours or more as the threshold for single-dose doxycycline prophylaxis."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 10-year-old had an untreated bull's-eye rash 6 weeks ago and now has signs of early disseminated (Stage 2) Lyme disease. Which findings belong to Stage 2? Select all that apply.","o":["Multiple secondary annular lesions that look like the original EM but are smaller","Symmetric polyarthritis of the small joints of both hands","Carditis with first-, second-, or third-degree heart block","Lymphocytic meningitis","Radiculitis"],"a":[0,2,3,4],"r":"Stage 2 can cause multiple smaller secondary annular lesions, lymphocytic meningitis, radiculitis, and carditis with life-threatening heart blocks. It can also cause generalized illness such as stomachache, urinary symptoms, and migratory musculoskeletal pain, and it can last weeks to 2 years without treatment. Symmetric small-joint polyarthritis of the hands is not a Lyme pattern. Lyme arthritis is a late finding that affects large joints."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"Five weeks after a tick bite that was never treated, a 9-year-old suddenly develops drooping on one side of the face and cannot fully close the right eye. Which stage of Lyme disease and which cranial nerve are involved?","o":["Stage 1 (early localized); cranial nerve V","Stage 2 (early disseminated); cranial nerve VII","Stage 3 (late); cranial nerve VII","Stage 2 (early disseminated); cranial nerve VIII"],"a":[1],"r":"Cranial nerve palsy, specifically the facial nerve (CN VII), is a hallmark of Stage 2 early disseminated disease and appears weeks after the bite. Stage 1 is limited to EM and flu-like symptoms. Stage 3 involves arthritis and neurocognitive changes months to years later. CN V (sensation and chewing) and CN VIII (hearing and balance) do not cause facial droop with inability to close the eye."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 13-year-old was never treated for a probable tick bite 1 year ago and now has late (Stage 3) Lyme disease. Which findings fit this stage? Select all that apply.","o":["Paresthesias of the hands and feet","Arthritis of a large joint, most commonly the knee","White blood cells in the synovial fluid as concrete evidence of Lyme arthritis","Untreated arthritis that stays continuous and never goes into remission","Cognitive and memory loss"],"a":[0,1,2,4],"r":"Stage 3 causes large-joint arthritis (most often the knees), cognitive and memory loss, and paresthesias of the hands and feet. WBCs in the synovial fluid are the concrete evidence of Lyme arthritis. Untreated Lyme arthritis does go away in a few weeks but then comes back and becomes chronic, so the claim that it never remits is wrong."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":false,"q":"A 7-year-old has fatigue, headache, and an annular rash after a summer of hiking in Pennsylvania. According to the blueprint, which diagnostic test is used for Lyme disease?","o":["Western blot as the first screening test","KOH preparation of scrapings from the lesion edge","Synovial fluid culture","ELISA"],"a":[3],"r":"The blueprint lists ELISA as the diagnostic test for Lyme disease. Western blot is a confirmatory test, not the first screen. KOH is for fungal infections. Synovial fluid findings (WBCs) support late Lyme arthritis but are not used to diagnose an early rash. Note: standard references say a classic EM rash can be diagnosed clinically without serology, and serology uses a two-tier approach (ELISA, then Western blot if positive or equivocal)."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 6-year-old has a 7-cm annular red lesion on the lower leg, and the parent is unsure whether there was a tick exposure. Which conditions belong in the differential diagnosis for this possible Lyme lesion? Select all that apply.","o":["Tinea corporis","Granuloma annulare","Scarlet fever","Insect bite reaction","Eczema"],"a":[0,1,3,4],"r":"The blueprint's differential for Lyme skin findings is eczema, tinea, granuloma annulare, cellulitis, and insect bite. These can all look like a single red, annular, or expanding lesion. Scarlet fever causes a diffuse sandpaper rash with pharyngitis and strawberry tongue, not a single annular lesion, so it is not in the differential."},{"t":"Eczema, Impetigo & Lyme","l":1,"s":true,"q":"A 9-year-old is diagnosed with Stage 1 Lyme disease and a classic EM rash. Which parts of the treatment plan match the blueprint? Select all that apply.","o":["Cefuroxime for 14\u201321 days","Doxycycline for 14\u201321 days","Doxycycline for 5\u20137 days","Amoxicillin for 14\u201321 days","Tell the parent that antibiotics given at this early stage prevent progression to Stage 3 disease"],"a":[0,1,3,4],"r":"The blueprint lists doxycycline, amoxicillin, or cefuroxime, and the professor highlighted a 14\u201321 day course. A 5\u20137 day course is too short. Antibiotics given in the early stages keep the disease from progressing to Stage 3. Note: standard references (IDSA 2020/AAP) recommend about 10 days of doxycycline or 14 days of amoxicillin or cefuroxime for EM, and a single dose of doxycycline for post-bite prophylaxis."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A nurse practitioner is teaching students the difference between exanthem and enanthem findings. Which findings are classified as enanthems? Select all that apply.","o":["Koplik spots","Pastia lines","Strawberry tongue","Slapped-cheek erythema","Forchheimer spots"],"a":[0,2,4],"r":"An enanthem is an eruption on a mucous membrane, while an exanthem is an eruption on the skin. Koplik spots (oral mucosa in measles), strawberry tongue (scarlet fever), and Forchheimer spots (soft palate in rubella) are all mucosal findings. Pastia lines (skin folds) and slapped-cheek erythema (face) are skin findings, so they are exanthems."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"An unvaccinated 2-year-old has had 2 days of cough, coryza, conjunctivitis, and a low-grade fever. No rash is present yet. Which oral finding would most strongly support the suspected diagnosis?","o":["Small rose-colored to reddish spots on the soft palate","Small, irregular, bluish-white granules on an erythematous base on the oral mucosa","A white-coated tongue with prominent red papillae","Diffuse pharyngeal erythema with tender anterior cervical nodes"],"a":[1],"r":"Cough, coryza, and conjunctivitis (the 3 C's) point to measles, and Koplik spots are small, irregular, bluish-white granules on an erythematous base on the oral mucosa. Rose-colored spots on the soft palate are Forchheimer spots (rubella). A coated tongue with red papillae is strawberry tongue (scarlet fever). Pharyngitis with tender nodes also suggests strep, not measles."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"An unvaccinated 3-year-old has had 3 days of cough, coryza, conjunctivitis, and a fever under 101 F. The NP suspects rubeola. Which findings should the NP expect as the illness progresses? Select all that apply.","o":["A maculopapular rash that first appears behind the ears and on the forehead, then moves progressively downward over about 3 days","A rise in temperature as the rash appears, possibly reaching 105 F","Photophobia","Discrete papules that stay separate and do not coalesce","A rash that erupts only after the fever abruptly resolves"],"a":[0,1,2],"r":"The measles rash starts behind the ears and on the forehead, then the papules enlarge, coalesce, and move downward over 3 days. The fever climbs (up to 105 F) as the rash appears, and photophobia can occur. Measles lesions do coalesce; a rash that does not coalesce fits roseola. A rash that comes after the fever breaks is the classic roseola pattern, not measles."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A 4-year-old is on day 5 of a measles rash. The rash is fading, and the parent reports light-colored pigmentation and fine peeling where the rash was. What is the most appropriate response by the NP?","o":["\"This suggests a secondary strep infection, so I will start amoxicillin.\"","\"This peeling is typical of scarlet fever, so I will obtain a rapid strep test.\"","\"This signals a new rash cycle, so your child is contagious again and should be isolated.\"","\"This is expected after measles; the peeling and pigmentation usually last about a week.\""],"a":[3],"r":"In measles, the rash heals around day 4 and leaves residual desquamation with light-colored pigmentation that lasts about a week. This is part of normal recovery, not a new infection or a relapse. Peeling does occur in scarlet fever, but it affects the fingers, toes, and palms and fits a different clinical picture."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A 16-year-old female has a confirmed rubella infection. The NP is counseling her about possible complications. Which complications are associated with rubella? Select all that apply.","o":["Arthralgia or arthritis","Thrombocytopenia","Encephalitis","Desquamation of the palms and soles","Heart failure from severe anemia"],"a":[0,1,2],"r":"Rubella complications include arthralgia and arthritis (both more common in adolescent females), thrombocytopenia, and encephalitis. Desquamation of the fingers, toes, and palms is a feature of scarlet fever. Severe anemia with heart failure symptoms occurs with fifth disease in children with hemolytic anemia."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A 10-year-old has a maculopapular rash that started on the face and is spreading to the chest. Which additional finding most strongly supports rubella rather than measles?","o":["Rash lesions that enlarge and coalesce as they move downward","High fever that rises as the rash appears, with cough, coryza, and conjunctivitis","Postauricular, posterior cervical, and posterior occipital lymphadenopathy, with discrete pinkish-red lesions expected to resolve in 3 days","Bluish-white granules on an erythematous base on the oral mucosa"],"a":[2],"r":"Rubella characteristically causes postauricular, posterior cervical, and posterior occipital lymphadenopathy. Its rash is discrete pinkish-red maculopapules (only occasionally coalescing) that resolve in about 3 days. Coalescing lesions, a fever that rises with the rash, the 3 C's, and Koplik spots all point to measles."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"In late winter, a daycare director asks about a child who has rubella. Which statement about rubella transmission is accurate?","o":["The incubation period is 12\u201323 days (mean 17 days), and the child was contagious 5\u20136 days before the rash appeared.","The incubation period is 8\u201312 days, and the child was contagious 1\u20132 days before symptoms began.","The incubation period is 4\u201321 days, and the child is no longer contagious once the rash appears.","The incubation period is 9\u201310 days, and the child was most contagious during the fever phase before the rash."],"a":[0],"r":"Per the blueprint, rubella spreads through nasopharyngeal secretions, has an incubation period of 12\u201323 days (mean 17), and is contagious 5\u20136 days before the rash, mostly in late winter and early spring. Option B describes measles, option C describes fifth disease, and option D describes roseola. Note: standard references say rubella is contagious from about 7 days before to 7 days after rash onset."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A woman who is 9 weeks pregnant has laboratory-confirmed primary rubella infection. Which counseling statement is accurate?","o":["\"The risk of birth defects is highest in the second trimester, at about 61%.\"","\"Infection in the first 12 weeks carries about a 61% risk of congenital defects, which can be ophthalmic, auditory, cardiac, or neurologic.\"","\"The risk is about 26% at this point, and the main concern is severe fetal anemia.\"","\"The main risk is stillbirth from fetal anemia; structural birth defects are not expected.\""],"a":[1],"r":"Primary maternal rubella in the first 12 weeks carries about a 61% risk of congenital defects (ophthalmic, auditory, cardiac, neurologic), and the risk falls to about 26% in the second trimester. Option A reverses the trimester. Severe fetal anemia, miscarriage, and stillbirth are the pregnancy risks of parvovirus B19 (fifth disease), not rubella."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A school nurse asks when a 7-year-old with rubella may return to class. The rash erupted yesterday. What is the NP's best response?","o":["\"Once she has been fever-free for 24 hours.\"","\"As soon as the rash fades, usually in about 3 days.\"","\"Right away, because children are not contagious once the rash appears.\"","\"She should stay home for 1 week after the rash erupted.\""],"a":[3],"r":"Per the blueprint, children with rubella should stay home for 1 week after the rash erupts. Waiting only until the fever or rash resolves is too short. The idea that a child is no longer contagious once the rash appears applies to fifth disease, not rubella."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A 6-year-old has intensely red cheeks that look slapped. The parent reports that a week ago the child had a mild fever, headache, and a runny nose. Which findings are consistent with erythema infectiosum? Select all that apply.","o":["A lacy maculopapular rash that appears on the trunk and moves peripherally to the arms, thighs, and buttocks","A preceding prodrome of mild fever, myalgia, headache, malaise, and URI symptoms","Mild pruritus as the only complaint in some older children","Arthralgia that is less common in children, while affected adults more often develop symmetric polyarthropathy","A rash that appears with a peak fever of up to 105 F"],"a":[0,1,2,3],"r":"Fifth disease starts with a mild prodrome. About 7\u201310 days later, slapped-cheek facial erythema appears, followed by a lacy rash that spreads from the trunk to the arms, thighs, and buttocks. Older children may have only mild pruritus, and arthralgia is less common in children than the symmetric polyarthropathy seen in adults. A rash that appears with a fever of up to 105 F describes measles."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"An 8-year-old has a slapped-cheek appearance and a lacy rash on the trunk and was diagnosed with fifth disease today. The parent asks whether he can go to school tomorrow. What is the NP's best response?","o":["\"Yes. Children in the rash stage of fifth disease are not contagious and may attend school.\"","\"No. He should stay home until the lacy rash has completely faded.\"","\"No. He should stay home for 1 week after the rash erupted.\"","\"He may return after 24 hours of antibiotic therapy.\""],"a":[0],"r":"Per the blueprint, children in the rash stage of fifth disease are not contagious and may attend school, because transmission happens during the earlier prodromal phase. Excluding him until the rash fades is unnecessary, since that rash can persist for weeks. The 1-week exclusion applies to rubella, and returning after 24 hours of antibiotics applies to scarlet fever. Fifth disease is viral, so antibiotics play no role."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A teacher who is 18 weeks pregnant learns that a student in her class has fifth disease. She asks the NP what this means for her pregnancy. Which statements are accurate? Select all that apply.","o":["Exposure to parvovirus B19 is not recommended during pregnancy because it can cause severe fetal anemia.","Infection during pregnancy can lead to miscarriage or stillbirth.","A positive parvovirus B19 IgM indicates a current infection.","A positive IgG with a negative IgM indicates a past infection.","The main fetal risks are cataracts, hearing loss, and cardiac defects."],"a":[0,1,2,3],"r":"Per the blueprint, pregnant women should not be exposed to parvovirus B19 because it can cause severe fetal anemia, miscarriage, and stillbirth. IgM shows a current infection, and IgG shows a past infection. Ophthalmic, auditory, and cardiac defects are the congenital rubella pattern, not the parvovirus pattern."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A 7-year-old with sickle cell disease (a hemolytic anemia) has classmates with fifth disease. Which presentation should the NP anticipate if this child becomes infected with parvovirus B19?","o":["Slapped-cheek erythema and a lacy rash with no systemic symptoms","Symmetric polyarthropathy of the small joints as the main complaint","Fever, pallor, tachycardia, and symptoms of heart failure","Petechiae from thrombocytopenia accompanied by encephalitis"],"a":[2],"r":"Children with hemolytic anemia or immunocompromise who get fifth disease may develop fever, pallor, tachycardia, and symptoms of heart failure. A benign rash-only course is typical of healthy children. Symmetric polyarthropathy is the typical adult presentation, and thrombocytopenia and encephalitis are listed complications of rubella."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"An NP is planning care for children with parvovirus B19 infection, including those with special conditions. Which management statements are accurate? Select all that apply.","o":["Consider a transfusion for a child with hemolytic anemia who develops anemia.","IGIV is helpful for children who are immunocompromised.","Start oral acyclovir within 24 hours of the rash to shorten the illness.","No specific antiviral treatment exists for fifth disease.","Avoiding known exposures eliminates the risk of infection for high-risk children."],"a":[0,1,3],"r":"Fifth disease has no specific antiviral treatment. Transfusion is considered for anemia in children with hemolytic anemia, and IGIV helps immunocompromised children. Oral acyclovir within 24 hours of the rash is a varicella strategy. Because many children and adults carry undetected infection, avoiding known exposures reduces the risk but does not eliminate it."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"Which history best describes the normal presentation of roseola infantum?","o":["Low-grade fever and URI symptoms, followed 7\u201310 days later by red cheeks and a lacy rash on the trunk","Sudden high fever for 3\u20135 days, then abrupt defervescence followed by a pink maculopapular rash that begins on the trunk","Cough, coryza, and conjunctivitis, with fever rising as a rash appears behind the ears and spreads downward","Fever and sore throat with a sandpaper-textured rash and a strawberry tongue"],"a":[1],"r":"The hallmark of roseola is high fever, then abrupt defervescence, then a pink maculopapular rash that starts on the trunk. Unlike in measles, the rash appears after the fever subsides rather than during it. Option A describes fifth disease, option C describes measles, and option D describes scarlet fever."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A 15-month-old had 4 days of fever up to 103 F and has been afebrile since this morning. A rash appeared a few hours ago. Which rash characteristics are consistent with roseola? Select all that apply.","o":["Rose-colored macules and papules 2\u20133 mm in diameter that fade with pressure","A rash that began on the trunk and is spreading to the face and extremities","Lesions that coalesce into sheets of confluent erythema","A rash expected to last about 2\u20133 days","A rash that began behind the ears and on the forehead"],"a":[0,1,3],"r":"The roseola rash is rose-colored, 2\u20133 mm, blanches with pressure, begins on the trunk, spreads centrifugally to the face and extremities, and lasts 2\u20133 days. It does not coalesce. Coalescing lesions that begin behind the ears and on the forehead describe measles. Note: standard references say the roseola rash usually lasts 1\u20132 days."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A parent asks when her 18-month-old with roseola was most likely to spread the infection to a younger sibling. What is the NP's best response?","o":["\"After the rash appeared\"","\"Once the fever broke\"","\"Throughout the rash phase, until it fades\"","\"During the fever phase, before the rash appeared\""],"a":[3],"r":"Per the blueprint, roseola is most contagious during the fever phase, before the rash erupts. By the time the classic rash appears after defervescence, the period of peak contagiousness has passed. The other options all place peak transmission at or after the rash, which is incorrect."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A 10-month-old is in the febrile phase of suspected roseola. Which findings would require urgent medical assessment rather than routine supportive care? Select all that apply.","o":["Bulging anterior fontanelle","Rash that does not blanch with pressure","Altered consciousness or difficulty arousing","Mild eyelid edema and inflamed palpebral conjunctiva","Cervical and posterior occipital lymphadenopathy"],"a":[0,1,2],"r":"CNS involvement in roseola is rare but may show as a bulging anterior fontanelle. A febrile child with a nonblanching rash, altered consciousness, or a bulging fontanelle needs urgent assessment. Eyelid edema, inflamed palpebral conjunctiva, and cervical or posterior occipital lymphadenopathy are expected findings in roseola."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"Which statement about the cause and typical age group of roseola infantum is accurate?","o":["It is caused by HHV-6 and HHV-7 and typically occurs in children younger than 3 years.","It is caused by parvovirus B19 and typically occurs in school-aged children.","It is caused by HHV-6 and primarily affects adolescents and young adults.","It is caused by HHV-6 and HHV-7 and typically occurs in children aged 5\u201310 years."],"a":[0],"r":"Roseola infantum is caused by HHV-6 and HHV-7. It is most common at 7\u201324 months, and the professor's notes specify children under 3 years. Parvovirus B19 causes fifth disease. Adolescents and school-aged children are not the typical roseola population, although reactivation can occur in people who are immunocompromised."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"A 7-year-old has fever, sore throat, and a red rash. The NP suspects scarlet fever. Which findings make up the classic triad? Select all that apply.","o":["Sandpaper-textured skin","Pharyngitis","Strawberry tongue","Pastia lines","Circumoral pallor"],"a":[0,1,2],"r":"The scarlet fever triad is sandpaper-textured skin, pharyngitis, and strawberry tongue. Pastia lines and circumoral pallor are common associated features, but they are not part of the triad."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"Nine days after a 6-year-old was diagnosed with scarlet fever and started on amoxicillin, the parent calls to report peeling skin on the fingertips, toes, and palms. The child is afebrile and eating well. What is the NP's best response?","o":["\"This suggests an allergy to amoxicillin. Stop the medication.\"","\"This means treatment failed. Bring her in for a repeat throat culture.\"","\"Peeling of the fingers, toes, and palms is an expected part of scarlet fever.\"","\"This suggests a secondary fungal infection. Apply a topical antifungal.\""],"a":[2],"r":"Desquamation of the fingers, toes, and palms is a recognized feature of scarlet fever and is expected during recovery. In a well, afebrile child it does not indicate drug allergy, treatment failure, or fungal infection. The correct response is reassurance."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"An NP is documenting the physical exam of a 9-year-old with scarlet fever. Beyond the triad, which findings would be appropriate to document as consistent with this diagnosis? Select all that apply.","o":["Dark red lines in the antecubital skin folds (Pastia lines)","Pallor around the mouth (circumoral pallor)","Tender, swollen lymph nodes","Bluish-white granules on an erythematous base on the oral mucosa","Dry mucous membranes and reduced oral intake"],"a":[0,1,2,4],"r":"Per the blueprint, scarlet fever documentation includes the skin, the mouth and throat, and swollen lymph nodes. Associated findings include Pastia lines, circumoral pallor, and tender adenopathy, and hydration status (dry mucous membranes, reduced intake) should also be noted. Bluish-white granules on the oral mucosa are Koplik spots, which occur in measles."},{"t":"Rashes & Exanthems","l":1,"s":false,"q":"A 7-year-old with scarlet fever started penicillin this morning. The parent asks when he can return to school. What is the NP's best response?","o":["\"After he finishes the full 10-day course of antibiotics.\"","\"Once he has been fever-free for 24 hours, even without antibiotics.\"","\"After he has been on antibiotics for 24 hours.\"","\"Once the sandpaper rash fades, usually in 3\u20134 days.\""],"a":[2],"r":"A patient who has received antibiotics for 24 hours is no longer contagious and may return to school. He does not need to finish the full course before returning. Being fever-free without antibiotics does not end contagiousness. The rash fading in 3\u20134 days is not the criterion for return."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"Which tests can the NP use to diagnose scarlet fever? Select all that apply.","o":["Rapid antigen detection test (RADT)","Nucleic acid amplification test (NAAT)","Throat culture","Antistreptolysin O (ASO) titer to confirm acute infection","CBC showing leukocytosis to confirm the diagnosis"],"a":[0,1,2],"r":"Per the blueprint, scarlet fever is diagnosed by RADT, NAAT, or throat culture, all of which detect group A strep in the throat. An ASO titer reflects past or recent strep exposure and is not used to diagnose the acute illness. Leukocytosis is nonspecific and cannot confirm scarlet fever."},{"t":"Rashes & Exanthems","l":1,"s":true,"q":"An NP is reviewing scarlet fever with a school nurse. Which statements are accurate? Select all that apply.","o":["The causative agent is group A Streptococcus.","It is most common in school-aged children.","The incubation period is 3\u20135 days.","The child is contagious during the incubation and prodromal stages, before antibiotic treatment (e.g., penicillin, amoxicillin, cephalexin) begins.","The child becomes contagious only after the rash appears."],"a":[0,1,2,3],"r":"Scarlet fever is caused by group A Streptococcus, is most common in school-aged children, and has an incubation period of 3\u20135 days. Per the blueprint, the child is contagious during the incubation and prodromal stages (about 10 days) and remains contagious until antibiotic treatment begins. Contagiousness therefore starts well before the rash appears, which makes option E false."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 6-year-old (22 kg) has several scaly patches of alopecia with broken hairs on the scalp. KOH prep confirms tinea capitis. Which order best matches the recommended griseofulvin regimen?","o":["Griseofulvin 10\u201315 mg/kg once daily for 2 weeks, taken on an empty stomach","Griseofulvin 10\u201315 mg/kg twice daily for 4\u20138 weeks, taken with fatty food (e.g., whole milk or peanut butter)","Griseofulvin 10\u201315 mg/kg twice daily for 4\u20138 weeks, taken on an empty stomach to maximize absorption","Clotrimazole 1% cream to the patches twice daily for 4 weeks plus selenium sulfide shampoo"],"a":[1],"r":"Per the professor, griseofulvin is dosed 10\u201315 mg/kg twice a day for 4\u20138 weeks and taken with fatty food to enhance absorption. Option C has the right dose and duration but the wrong administration; fat increases absorption. Topical agents (D) do not reach the hair follicle and are not recommended for tinea capitis, and 2 weeks (A) is far too short. Note: standard references say microsize griseofulvin 20\u201325 mg/kg/day (once daily or divided) for 6\u201312 weeks."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"An 8-year-old is brought in for patchy hair loss and an itchy scalp. Which exam findings are consistent with tinea capitis? Select all that apply.","o":["Small black dots within patches of alopecia, hairs broken off at the scalp surface, typical of Trichophyton tonsurans","Occipital and posterior cervical lymphadenopathy","Scaling, erythema, or crusting with bald patches or areas of broken hair","A smooth, completely non-scaly, sharply round patch of alopecia with \"exclamation point\" hairs","Preauricular and submandibular lymphadenopathy as the characteristic nodal finding"],"a":[0,1,2],"r":"T. tonsurans causes \"black dot\" tinea, and the exam shows scaling, erythema, or crusting with bald patches or broken hairs. Occipital and posterior cervical adenopathy may be present. A smooth, non-scaly patch with exclamation point hairs (D) suggests alopecia areata. The nodes involved are occipital and posterior cervical, not preauricular or submandibular (E)."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 9-year-old on griseofulvin for tinea capitis comes back with a tender, boggy, pustular mass on the scalp and severe inflammation. Which plan is most appropriate?","o":["Incision and drainage of the mass with culture of the purulent material","Stop griseofulvin and apply ketoconazole 2% cream to the mass twice daily","Continue griseofulvin and add oral prednisone tapered over 2\u20133 weeks","Continue griseofulvin and add oral prednisone for 5\u201314 days; consider a systemic antibiotic if secondary bacterial infection is suspected"],"a":[3],"r":"This is a kerion. Per the professor, a kerion with severe inflammation is treated with prednisone for 5\u201314 days while oral antifungal therapy continues, with systemic antibiotics considered for secondary bacterial infection. A 2\u20133 week steroid taper (C) is the plan for extensive allergic contact dermatitis, not kerion. A kerion is an inflammatory reaction, not an abscess, so I&D (A) is not indicated, and topicals (B) do not treat tinea capitis. Note: standard references say the benefit of systemic corticosteroids for kerion is unproven and they are not routinely required."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"Which statements correctly describe a kerion? Select all that apply.","o":["A boggy, inflamed mass filled with pustules","It results from a delayed inflammatory reaction to the fungal infection","It may be accompanied by fever, lymphadenopathy, and leukocytosis","It is a primary bacterial abscess, so antifungal therapy can be stopped once antibiotics start","It presents as fine gray scales with lusterless broken hair and minimal inflammation"],"a":[0,1,2],"r":"A kerion is a boggy, pustule-filled inflammatory mass caused by a delayed inflammatory reaction, often with lymphadenopathy, fever, and leukocytosis. It is still a fungal process, so oral antifungal therapy must continue; antibiotics are only an add-on for secondary infection (D). Fine gray scale with lusterless hair (E) describes the non-inflammatory M. canis pattern."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 3-year-old has culture-confirmed T. tonsurans tinea capitis. The parent asks for terbinafine because the child's 9-year-old brother was treated with it last year. What is the best response?","o":["\"Terbinafine is used for children over 4 years old, so griseofulvin is the appropriate choice for your child.\"","\"Terbinafine is fine at any age as long as it is taken with fatty food.\"","\"Terbinafine can be used at this age if it is combined with terbinafine cream on the scalp.\"","\"Fluconazole is the better choice because it is the most effective oral agent for tinea capitis.\""],"a":[0],"r":"The blueprint limits terbinafine to children over 4 years old, so griseofulvin is the agent for a 3-year-old. Fatty food (B) improves griseofulvin absorption and has nothing to do with terbinafine's age limit. Topicals are not recommended for tinea capitis (C). Fluconazole (D) is an alternative but is less effective."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"A 7-year-old is starting oral griseofulvin for tinea capitis. Which statements about adjunctive shampoo are correct? Select all that apply.","o":["Selenium sulfide 2.5% shampoo may be used two times a week for 4 weeks","Ketoconazole 2% shampoo 2\u20133 times per week for 4 weeks is an acceptable alternative","The purpose of the shampoo is to decrease spore viability","The shampoo may replace oral therapy once scaling improves","Selenium sulfide 1% shampoo applied for 10 minutes daily for 1\u20132 weeks, then monthly for 3 months"],"a":[0,1,2],"r":"Per the professor, selenium sulfide 2.5% is used two times a week for 4 weeks, or ketoconazole 2% 2\u20133 times a week for 4 weeks, together with oral therapy to decrease spore viability. Shampoo is only an adjunct; topical therapy alone is not recommended for tinea capitis (D). Option E is the tinea versicolor regimen."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 10-year-old with tinea capitis has just started griseofulvin. Which follow-up plan is recommended?","o":["Return only if lesions have not resolved at the end of 8 weeks","Return in 48\u201372 hours if not improved","Follow up in 2 weeks, then every 2\u20134 weeks","Follow up at 1-month intervals with LFTs, then every 6 months long-term"],"a":[2],"r":"For tinea capitis, the first follow-up is at 2 weeks, then every 2\u20134 weeks. The 48\u201372-hour recheck (B) is the impetigo follow-up. Monthly LFT visits with 6-month long-term follow-up (D) is the onychomycosis plan. Waiting until the end of therapy (A) would miss treatment failure or adverse effects."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"Which statements about tinea capitis are accurate? Select all that apply.","o":["The incubation period is up to 4 days","Without treatment, new lesions can keep appearing for months","Fluconazole is an oral option but is less effective","Griseofulvin therapy lasting 8 weeks or longer should include lab evaluation","Oral itraconazole is contraindicated for tinea capitis"],"a":[0,1,2,3],"r":"The blueprint gives an incubation period of up to 4 days, says new lesions can appear for months if untreated, and lists fluconazole as less effective. Griseofulvin courses of 8 weeks or longer should include lab evaluation. Oral itraconazole is listed as an alternative agent, so it is not contraindicated (E)."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A healthy 10-year-old has one 2-cm annular, scaly plaque with central clearing on the forearm. KOH is positive. What is the most appropriate treatment?","o":["Clotrimazole 1% cream twice daily for 1\u20134 weeks","Oral griseofulvin for 2\u20134 weeks","Miconazole 2% cream once weekly for 6 weeks","Nystatin cream twice daily for 1\u20134 weeks"],"a":[0],"r":"Superficial or localized tinea corporis is treated with a topical antifungal such as miconazole or clotrimazole twice a day, with improvement over 1\u20134 weeks. Oral griseofulvin (B) is for lesions that do not respond to topical therapy or for special forms. Once-weekly dosing (C) is wrong frequency. Nystatin (D) treats Candida but not dermatophytes."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"Which findings or history support a diagnosis of tinea corporis? Select all that apply.","o":["Annular or oval plaques with a red, scaly border and central clearing","Lesions that clear peripherally while spreading centrally","A high school wrestler with new lesions on the neck and arms","A child on long-term systemic immunosuppression","Honey-colored crusts on red, eroded skin"],"a":[0,2,3],"r":"The classic lesion is annular, oval, or circinate with a red, scaly border. Lesions spread peripherally and clear centrally, so B has it reversed. Contact sports such as wrestling, day care, school, crowded or hot and humid settings, and immunosuppression all raise the risk. Honey-colored crusts (E) are nonbullous impetigo."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 7-year-old has several tinea corporis lesions on the trunk that have not improved after 4 weeks of correctly applied topical clotrimazole. What is the best next step?","o":["Add triamcinolone 0.1% cream to the clotrimazole to reduce inflammation","Start oral griseofulvin for 4\u20138 weeks, the same as for tinea capitis","Continue clotrimazole for 8 more weeks, because systemic therapy is reserved for scalp infection","Start oral griseofulvin, the systemic drug of choice for children older than 2 years, typically for 2\u20134 weeks"],"a":[3],"r":"Tinea corporis that does not respond to topical therapy may need systemic treatment. Griseofulvin is the systemic drug of choice for children older than 2, and treatment usually lasts 2\u20134 weeks for sites other than the scalp. The 4\u20138 week course (B) is for the scalp. Antifungals should not be combined with steroids (A)."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"A 15-year-old obese male football player has a pruritic rash in the groin. Which findings support tinea cruris? Select all that apply.","o":["Hyperhidrosis and tight-fitting athletic clothing","Coexisting tinea pedis","Erythematous to slightly brown, sharply marginated plaques with raised, scaling borders","Prepubertal age as the peak risk period","Symmetric, non-pruritic, red scaling in skin folds in a neurologically impaired child"],"a":[0,1,2],"r":"Risk factors for tinea cruris include male sex, post-adolescent age, obesity, hyperhidrosis, tight clothing, chafing, and warm, moist climates. It is often associated with tinea pedis. The exam shows sharply marginated plaques with raised, scaling borders, sometimes with central clearing. Risk rises after adolescence, not before (D), and a symmetric, non-pruritic eruption in a neurologically impaired child (E) suggests seborrheic dermatitis."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"The adolescent in the previous vignette has KOH-confirmed tinea cruris. Which plan is most appropriate?","o":["Clotrimazole-betamethasone cream twice daily for 2 weeks, plus cotton underwear","Topical antifungal for 4\u20136 weeks, plus cotton underwear, loose clothing, and talcum or antifungal powder","Topical antifungal for 4\u20136 weeks, plus hydrocortisone 1% daily for up to 2 weeks for itching","Topical antifungal for 1 week, plus tight compression shorts to reduce thigh chafing"],"a":[1],"r":"Tinea cruris is treated with a topical antifungal for 4\u20136 weeks, along with cotton underwear, loose clothing, and talcum or antifungal powder. Antifungals should not be combined with steroids, which rules out both the combination product (A) and adding hydrocortisone (C). Tight clothing is a risk factor, and 1 week is too short (D). Note: standard references say 2\u20134 weeks of topical therapy is often enough."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"A 13-year-old male swimmer has scaling and maceration between the toes, consistent with tinea pedis. Which statements are accurate? Select all that apply.","o":["Male sex is a risk factor","It is commonly acquired from shower and locker room floors","Antifungal cream should be applied twice daily and continued until 7 days after clearing","The total course usually lasts 3\u20136 weeks","The cream should be stopped as soon as the skin looks clear to avoid resistance"],"a":[0,1,2,3],"r":"Tinea pedis is more common in males and spreads by direct contact with contaminated surfaces such as shower and locker room floors. Antifungal cream is applied twice daily until 7 days after clearing, for a total of about 3\u20136 weeks. Stopping when the skin first looks clear (E) leads to relapse."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 16-year-old with KOH-confirmed onychomycosis of two fingernails will start oral terbinafine. What is the expected treatment duration?","o":["2\u20134 weeks","12 weeks","6 weeks","48 weeks"],"a":[2],"r":"Terbinafine is given for 6 weeks for fingernails and 12 weeks for toenails. Twelve weeks (B) would be correct for toenails. Forty-eight weeks (D) is the topical ciclopirox course, and 2\u20134 weeks (A) is the oral course for tinea corporis."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"Which findings are consistent with onychomycosis (tinea unguium)? Select all that apply.","o":["An opaque white or silvery nail","A nail that becomes thick and yellow with subungual debris","Separation of the nail plate from the underlying tissue (onycholysis)","\"Onychauxis,\" a term for separation of the nail plate from the nail bed","Involvement of all ten nails at once, with pitting as the main finding"],"a":[0,1,2],"r":"Onychomycosis starts as an opaque white or silvery nail that becomes thick and yellow with subungual debris. It may cause separation of the nail plate (onycholysis) or nail thickening. Onychauxis means a hypertrophic (thickened) nail, not separation (D). Usually only one or two nails are involved, and pitting (E) points to psoriasis."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 14-year-old with toenail onychomycosis wants to avoid oral medication. Which statement is most accurate?","o":["Ciclopirox is not used under age 18, so oral terbinafine is required","Ciclopirox may be used and must be applied for 12 weeks","Ciclopirox may be used and must be applied for 6 weeks for toenails","Ciclopirox may be used in children over 12 years old and must be used for 48 weeks"],"a":[3],"r":"Topical ciclopirox is an option for patients over 12 years old and must be used for 48 weeks. The 12-week (B) and 6-week (C) durations belong to the terbinafine and itraconazole oral regimens. A 14-year-old meets the age requirement, so A is wrong."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"An adolescent is starting an oral antifungal for onychomycosis. Which elements belong in the follow-up plan? Select all that apply.","o":["Follow-up visits at 1-month intervals to check LFTs","For long-term management, follow-up about every 6 months","No lab monitoring, because nail courses are short","Follow-up in 2 weeks, then every 2\u20134 weeks","Teach the family to report jaundice, dark urine, or persistent anorexia or abdominal pain"],"a":[0,1,4],"r":"The blueprint calls for follow-up at 1-month intervals for LFTs, with follow-up about every 6 months long-term. Teaching the family the signs of hepatotoxicity supports that monitoring. Oral nail courses last weeks to months and are hepatically metabolized, so skipping labs (C) is wrong. The 2-week, then every 2\u20134 week schedule (D) is for tinea capitis. Note: standard references say a baseline LFT is advised and routine interval LFTs may not be needed in healthy children on short courses."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 15-year-old with toenail onychomycosis is prescribed fluconazole. The parent asks how long it will take to clear. What is the most accurate answer?","o":["About 8\u201318 months","About 6\u20139 months","About 12 weeks","About 3 months with monthly pulse dosing"],"a":[0],"r":"Fluconazole works more slowly, with about 6\u20139 months to resolve fingernails and 8\u201318 months for toenails. Six to 9 months (B) is the fingernail timeline. Twelve weeks (C) matches the terbinafine toenail course and continuous itraconazole, and 3 months of pulses (D) is itraconazole pulse therapy."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"A 16-year-old has a rash on the upper back and shoulders after summer. Which findings are consistent with tinea versicolor? Select all that apply.","o":["Multiple discrete, scaling, annular macules or patches on the trunk and upper arms","Hypopigmented lesions in a dark-skinned adolescent","Salmon-colored to brown hyperpigmented lesions in a light-skinned adolescent","A guttate (\"raindrop\") pattern","A single large herald patch followed days later by a \"Christmas tree\" eruption"],"a":[0,1,2,3],"r":"Tinea versicolor shows multiple annular, scaling, discrete macules or patches on the trunk and upper extremities. They range from hypopigmented in dark skin to hyperpigmented (salmon to brown) in light skin, often in a guttate or raindrop pattern. A herald patch followed by a Christmas-tree distribution (E) is pityriasis rosea."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"Which regimen is recommended for the adolescent with tinea versicolor in the previous vignette?","o":["Selenium sulfide 2.5% shampoo two times a week for 4 weeks","Selenium sulfide 2.5% lotion or 1% shampoo applied in a thin layer for 10 minutes daily for 1\u20132 weeks, then monthly for 3 months","Selenium sulfide 2.5% lotion left on overnight daily for 1\u20132 weeks, then weekly for 3 months","Oral griseofulvin for 2\u20134 weeks"],"a":[1],"r":"The blueprint regimen is selenium sulfide 2.5% lotion or 1% shampoo applied in a thin layer for 10 minutes daily for 1\u20132 weeks, then monthly for 3 months to prevent recurrence. Twice weekly for 4 weeks (A) is the tinea capitis adjunct. Option C changes both the contact time and the maintenance frequency. Griseofulvin (D) treats dermatophytes, not Malassezia."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"Which statements about the cause and epidemiology of tinea versicolor are correct? Select all that apply.","o":["It is caused by the yeast Malassezia","It is also known as tinea unguium","It occurs mostly in adolescents","Infants can acquire it from their mothers","It is caused by the dermatophyte Trichophyton rubrum"],"a":[0,2,3],"r":"Tinea versicolor (pityriasis versicolor) is caused by Malassezia. It occurs mostly in adolescents, but infants can get it from their mothers. Tinea unguium (B) is onychomycosis. T. rubrum (E) causes tinea corporis, not versicolor."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"An adolescent with toenail onychomycosis will be treated with oral itraconazole. Which regimen is consistent with recommended dosing?","o":["Itraconazole daily for 6 weeks","Itraconazole pulse therapy, 1 week each month for 12 months","Itraconazole daily for 12 weeks, or pulse therapy 1 week each month for 3 months","A single 1-week course of itraconazole"],"a":[2],"r":"Itraconazole is given continuously for 12 weeks or as pulse therapy for 1 week each month for 3 months. Six weeks (A) is the terbinafine fingernail course. Twelve months of pulses (B) overextends the regimen, and a single week (D) is far too short."},{"t":"Tinea (Fungal)","l":1,"s":true,"q":"In which situations should the NP expect that oral antifungal therapy may be needed? Select all that apply.","o":["Tinea capitis in a 6-year-old","Tinea faciei","Tinea corporis gladiatorum on a high school wrestling team","A first presentation of localized tinea cruris","Tinea corporis that has not responded to appropriate topical therapy"],"a":[0,1,2,4],"r":"Tinea capitis always needs oral therapy, and tinea faciei and tinea corporis gladiatorum may need oral medication. Tinea corporis that fails topical therapy may need systemic treatment. A first presentation of localized tinea cruris (D) is treated topically for 4\u20136 weeks."},{"t":"Tinea (Fungal)","l":1,"s":false,"q":"A 5-year-old whose family got a kitten last month has scalp patches with broken, lusterless hairs and fine gray scale. Which organism is most likely?","o":["Trichophyton tonsurans, since broken hairs indicate black dot tinea","Trichophyton tonsurans, since it spreads by direct contact with pets","Trichophyton rubrum","Microsporum canis"],"a":[3],"r":"M. canis is linked to pet exposure and causes broken, lusterless hair with fine gray scales. T. tonsurans causes black dot tinea and spreads by fomites, not pets, so A and B mismatch the presentation and the transmission. T. rubrum (C) is a cause of tinea corporis, not the pet-associated scalp organism here."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 10-year-old boy has a red, chapped, scaly ring of skin around his mouth that gets worse every winter. His mother says he licks his lips constantly. He has not used any new lip products, and he has no history of eczema. Which description best fits this presentation?","o":["Allergic contact dermatitis, which requires prior sensitization to a specific allergen","Irritant contact dermatitis, caused by repeated exposure to an offending agent rather than an allergy","Perioral seborrheic dermatitis, caused by overproduction of sebum","Atopic dermatitis, because the skin is dry and scaly and worse in winter"],"a":[1],"r":"Irritant contact dermatitis is not an allergy. It comes from repeated exposure to an offending agent, and lip licking is one of the blueprint's own examples. Allergic contact dermatitis needs prior sensitization to an allergen, and nothing new has been applied here. Dry skin alone does not make this atopic dermatitis when there is no history and the cause is clearly the lip licking."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A 14-year-old girl has an itchy, red, vesicular, weeping rash in a circle on both earlobes. It started 2 days after she began wearing new inexpensive earrings. She had a milder reaction to similar earrings last year. Which statements about her condition are accurate? Select all that apply.","o":["The reaction is a type IV delayed hypersensitivity response.","This reaction occurs only after sensitization to the allergen has already happened.","Erythema, vesicles, and weeping fit the acute stage of this condition.","A circular pattern is typical of a belt allergen, and a linear pattern is typical of earrings.","It is an IgE-mediated immediate hypersensitivity reaction, the same mechanism as atopic dermatitis."],"a":[0,1,2],"r":"Allergic contact dermatitis is seen only after sensitization. It is a type IV delayed hypersensitivity reaction, and the acute stage can show erythema, vesicles, and weeping. Option D has the patterns reversed: earrings usually give a circular rash and belts a linear one. The reaction is not IgE-mediated or immediate. Elevated IgE is a feature of atopic dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"An 8-year-old has localized allergic contact dermatitis on the backs of both forearms after wearing a new jacket with rough cuffs. It covers well under 10% of the body surface area. The face and groin are clear. Which topical regimen matches the professor's recommendation?","o":["Triamcinolone 0.1% cream 2\u20133 times daily, including any lesions that spread to the face","Clobetasol 0.05% ointment twice daily under occlusion","Hydrocortisone 0.5% cream three times daily for 5 days","Triamcinolone 0.1% cream once daily to the forearm lesions, never on the face or groin"],"a":[3],"r":"The professor recommends triamcinolone 0.1% once daily and says not to use it on the face or groin. Option A uses the right drug but the wrong frequency, and it puts the steroid on the face. Hydrocortisone 0.5% TID for 5 days is the diaper dermatitis regimen. A super-high-potency steroid under occlusion is not indicated for limited disease. Note: standard references usually list mid-potency steroids such as triamcinolone 0.1% at 2\u20133 times daily."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A nurse practitioner is teaching the parent of a child with acute allergic contact dermatitis. The lesions on the legs are inflamed and weeping. Which instructions are appropriate? Select all that apply.","o":["Use oatmeal baths to soothe the skin.","Apply lanolin or petroleum jelly generously to the inflamed, weeping areas.","Give an oral antihistamine to reduce itching and scratching (excoriation).","The rash may respond to steroid cream within a few days, but complete healing can take 2\u20133 weeks.","If the rash is not completely gone after 3 days of steroid cream, treatment has failed and the cream should be stopped."],"a":[0,2,3],"r":"Management of contact dermatitis includes oatmeal baths, water and emollients, and oral antihistamines for itching and excoriation. Steroid creams are applied for about 2\u20133 days, but full healing can take 2\u20133 weeks. The blueprint says not to use lanolin or petroleum when the skin is inflamed. Incomplete clearing at 3 days is expected and does not mean treatment has failed."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 12-year-old returns from camp with intensely itchy, vesicular allergic contact dermatitis on both arms, both legs, the trunk, and parts of the face. It covers about 25% of the body surface area. Which management is most appropriate?","o":["A systemic oral corticosteroid tapered over 2\u20133 weeks","A 5-day oral prednisone burst, stopped without a taper","Triamcinolone 0.1% cream once daily to every affected area, including the face","Topical therapy alone, because oral steroids are reserved for involvement over 30% of the skin"],"a":[0],"r":"If allergic involvement exceeds 10% of the skin and affects extensive areas of the body, the blueprint calls for systemic oral corticosteroids tapered over 2\u20133 weeks. A short burst without a taper is the tempting look-alike, but it risks a rebound flare and does not match the blueprint. Triamcinolone should not go on the face. The cutoff for systemic therapy is 10%, not 30%."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A 9-month-old has a shiny, red, macular rash with mild edema over the convex surfaces of the diaper area. The infant is otherwise well. Which statements about diaper dermatitis are accurate? Select all that apply.","o":["A shiny, peeling, erythematous macular or papular rash is consistent with diaper dermatitis.","Any vesiculation rules out diaper dermatitis and points to bullous impetigo.","A barrier product such as Desitin (cod liver oil with zinc oxide) is part of management.","Hydrocortisone 0.5\u20131% three times daily for 5 days may be used.","Triamcinolone 0.1% once daily is the preferred steroid for the diaper area."],"a":[0,2,3],"r":"Diaper dermatitis is a shiny, peeling, red macular or papular rash. It can include erythema, edema, and vesiculation, so vesicles do not rule it out. Management is Desitin plus hydrocortisone 0.5\u20131% TID for 5 days. The professor says not to use triamcinolone on the groin, which includes the diaper area."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 3-month-old has thick, greasy, yellow scales on the scalp and symmetric red, scaly patches on the eyebrows and cheeks. The parents are already loosening the scalp scales with a soft brush and frequent shampooing. Following the professor's recommendation, what should be added for the facial lesions?","o":["Ketoconazole 2% shampoo to the face and scalp, left on for 5\u201310 minutes","Triamcinolone 0.1% cream once daily to the face","Low-potency hydrocortisone 1% lotion once daily for no longer than 2 weeks","Hydrocortisone 1% lotion three times daily until clear, for up to 4 weeks"],"a":[2],"r":"For seborrheic dermatitis on the face or diaper area, the professor recommends low-potency hydrocortisone 1% lotion once daily for no longer than 2 weeks. Option D has the right drug but the wrong frequency and duration. Medicated shampoos are used in older children, and no medication is approved for children under 2. Triamcinolone should not be used on the face."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A student is reviewing the cause of seborrheic dermatitis. Which statements are accurate? Select all that apply.","o":["The causative organism is Malassezia ovalis, a saprophytic yeast.","The condition is caused by overproduction of sebum.","It is more common in neurologically impaired children and in those with immunodeficiency.","It is caused by a dermatophyte such as Trichophyton tonsurans.","It is a type IV delayed hypersensitivity reaction to an allergen."],"a":[0,1,2],"r":"Seborrheic dermatitis comes from overproduction of sebum with the yeast Malassezia ovalis. It is more common in neurologically impaired people and in those with immunodeficiency. Trichophyton tonsurans is a cause of tinea capitis, not seborrheic dermatitis. A type IV delayed hypersensitivity reaction describes allergic contact dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 13-year-old has flaky scalp scale (dandruff) and red, scaly eyelid margins. Which teaching about treatment is most accurate?","o":["The eyelid findings are an unrelated bacterial process, and the scalp needs no treatment.","Use a shampoo containing ketoconazole, zinc pyrithione, selenium sulfide, or salicylic acid. Leave it on for 5\u201310 minutes before scrubbing, and expect improvement to take weeks to months.","Rinse the medicated shampoo off right away to avoid irritation. The scalp should clear in 3\u20135 days.","Oral griseofulvin 10\u201315 mg/kg twice daily for 4\u20138 weeks is needed, because topical treatment does not work."],"a":[1],"r":"In older children, seborrheic dermatitis presents as dandruff and can be associated with blepharitis. It is treated with ketoconazole, zinc pyrithione, selenium sulfide, or salicylic acid shampoo left on for 5\u201310 minutes before scrubbing. Treatment can take weeks to months to work. The quick-rinse, rapid-cure option is the look-alike distractor. Griseofulvin is the treatment for tinea capitis, not seborrheic dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A 15-year-old has new, severe, generalized seborrheic dermatitis. Which actions are appropriate? Select all that apply.","o":["Consider HIV testing, because severe generalized seborrhea is commonly found in people with HIV.","Monitor for secondary yeast (Candida) infection.","Use a keratolytic such as topical salicylic acid or urea to remove excess scale.","Avoid all topical steroids, because the causative organism is a yeast.","Start an oral prednisone taper as first-line therapy for generalized seborrhea."],"a":[0,1,2],"r":"Severe generalized seborrhea is commonly found in people with HIV. Yeast or Candida infection is a listed complication. Keratolytics such as salicylic acid and urea are part of management. Topical steroids and calcineurin inhibitors are the anti-inflammatory options, so steroids are not contraindicated. An oral steroid taper is the treatment for extensive allergic contact dermatitis, not seborrheic dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 4-year-old with active varicella is admitted for dehydration. According to the course blueprint, which transmission-based precautions should the nurse put in place?","o":["Contact precautions only","Contact and droplet precautions","Airborne precautions only","Contact, droplet, and airborne precautions"],"a":[3],"r":"The blueprint lists contact, droplet, and airborne precautions for varicella. The other options each leave out at least one route the blueprint includes. Note: standard references (CDC) specify airborne plus contact precautions for varicella."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A parent asks about the timeline of chickenpox. Which statements are accurate? Select all that apply.","o":["The incubation period is 10\u201321 days, with a mean of 14\u201316 days.","The child is contagious 1\u20132 days before the rash erupts.","The child stays contagious until all lesions have crusted over, usually about 3\u20137 days.","The child is not contagious until the first vesicles appear.","The incubation period is usually 3\u20135 days."],"a":[0,1,2],"r":"Varicella has a 10\u201321 day incubation period (mean 14\u201316 days). The child is contagious from 1\u20132 days before the rash until every lesion is crusted. Contagiousness starts before the rash appears, so option D is wrong. A 3\u20135 day incubation is the figure for scarlet fever."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"An unvaccinated 7-year-old girl has no symptoms. Her brother broke out with chickenpox yesterday. Her mother asks whether she can go to school. Which response matches the blueprint?","o":["She may keep attending school for about 1 week. If she then shows signs of illness, she must stay home for 1 week. If no rash develops, she may return.","She must stay home starting today and for 21 days after the exposure.","She may attend school with no restrictions for the whole incubation
