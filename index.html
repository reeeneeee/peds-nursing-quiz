period, because she has no symptoms.","She may attend only after taking oral acyclovir for 24 hours."],"a":[0],"r":"The professor's note says an exposed child without symptoms may attend school for about 1 week before quarantine. If she shows signs of illness, she stays home for 1 week, and if no rash develops she may return. Keeping her home from day 0 or letting her attend with no restriction at all both conflict with that rule. Acyclovir has nothing to do with school clearance. Note: standard references (AAP) exclude exposed, susceptible children from day 8 through day 21 after exposure."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"Which findings are typical of the varicella rash? Select all that apply.","o":["A centripetal distribution, with more lesions on the chest, back, and abdomen than on the arms and legs","Teardrop vesicles that cloud over and umbilicate within 24\u201348 hours","Lesions in different stages at the same time","A rash that starts on the hands and feet and spreads toward the trunk","Mucous membranes are always spared."],"a":[0,1,2],"r":"The varicella rash is centripetal and starts on the scalp, face, or trunk. It is very itchy. Lesions go from spots to teardrop vesicles that cloud over and umbilicate in 24\u201348 hours, and lesions in different stages appear together. The rash does not start distally. Lesions can form on all mucosal tissues, including the mouth, pharynx, vagina, and anus."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 5-year-old on day 6 of varicella is afebrile and alert. The child now has new petechiae, easy bruising on the shins, and a nosebleed. Which complication is most likely?","o":["Pyoderma (bacterial superinfection of the lesions)","Reye syndrome","Idiopathic thrombocytopenic purpura (ITP)","Glomerulonephritis"],"a":[2],"r":"ITP is a recognized varicella complication (1\u20132%). It presents with petechiae, bruising, and mucosal bleeding in a child who otherwise looks well. Pyoderma would cause red, crusted, infected lesions, not bleeding. Reye syndrome causes vomiting and changes in mental status. Glomerulonephritis is rare and affects the kidneys, not bleeding."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A healthy 6-year-old is on day 2 of uncomplicated varicella. Which home-care recommendations are appropriate? Select all that apply.","o":["Acetaminophen for fever","Aspirin for fever, since the child is old enough","An oral antihistamine or oatmeal baths for itching","Ibuprofen as the first-choice antipyretic, because it also reduces skin inflammation","Avoid ibuprofen if possible, because it may be linked to bacterial superinfection"],"a":[0,2,4],"r":"Care for varicella is supportive: acetaminophen for fever and antihistamines or oatmeal baths for itching. Aspirin is contraindicated at any age in varicella because of the risk of Reye syndrome. Ibuprofen use is questionable because of a possible link to bacterial superinfection, so it should not be the first choice."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A healthy 4-year-old has a mild varicella rash that appeared 3 days ago. The parent asks for an antiviral \"to make it go away faster.\" What is the most appropriate response?","o":["Prescribe oral acyclovir, which greatly shortens illness if started at any point during the vesicular stage.","Explain that oral acyclovir is not routinely recommended for healthy children and gives only modest benefit when started within 24 hours of the rash. Recommend supportive care.","Admit for IV acyclovir to prevent complications.","Prescribe oral acyclovir, because healthy children still benefit if it is started within 72 hours of the rash."],"a":[1],"r":"Oral acyclovir is not routinely recommended for most children. In healthy children it modestly reduces symptoms and illness length only when given within 24 hours of the rash. Option D gives the wrong window (72 hours instead of 24). IV acyclovir is for immunocompromised children or severe disease."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"In which situations is acyclovir indicated, or should it be strongly considered, for varicella? Select all that apply.","o":["IV acyclovir for an 8-year-old receiving chemotherapy for leukemia","IV acyclovir for a child with severe varicella disease","Oral acyclovir for a pregnant woman who develops varicella at 26 weeks' gestation","Routine oral acyclovir for a healthy 3-year-old on day 4 of the rash","Routine oral acyclovir for a woman at 8 weeks' gestation, because its safety in the first trimester is well established"],"a":[0,1,2],"r":"IV acyclovir works for immunocompromised patients and for severe disease. Oral acyclovir should be strongly considered for pregnant women with varicella in the second or third trimester. It is not routine for a healthy child, especially after the 24-hour window. Option E is wrong because the safety of acyclovir in the first trimester is uncertain. Note: standard references (CDC/ACOG) generally recommend oral acyclovir for pregnant women with varicella in any trimester."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 9-year-old has a flesh-colored lesion on the edge of the nostril that sticks out from the skin on a narrow stalk. Which type of wart is this?","o":["Common wart (verruca vulgaris)","Flat wart (verruca plana)","Periungual wart","Filiform wart"],"a":[3],"r":"Filiform warts stick out from the skin on a narrow stalk and are usually found on the face, lips, nose, eyelids, or neck. Common warts are raised, scaly, irregular papules that sometimes show black pinpoints. Flat warts are flat lesions spread by picking or scratching. Periungual warts form around the cuticles, often in nail biters."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"An 11-year-old has many flat warts spread across the face from scratching. He also has a common wart on one finger. Which statements match the blueprint and the professor's recommendations? Select all that apply.","o":["Refer him for removal of the flat warts.","Treat the common wart with topical salicylic acid at bedtime for 6\u20138 weeks.","Plantar warts grow outward and keep the normal skin markings intact.","Black pinpoints in a common wart suggest a melanocytic lesion that needs biopsy.","Tell the family that removing a wart can cause scarring."],"a":[0,1,4],"r":"The professor recommends referral to remove flat warts and topical salicylic acid at bedtime (HS) for 6\u20138 weeks. Scarring is the listed complication of wart removal. Plantar warts grow inward and disrupt skin markings. The black pinpoints in a common wart are thrombosed blood vessels, not a melanocytic lesion. Note: standard references say salicylic acid is often used daily for up to 12 weeks, and flat warts are often watched or treated with topical tretinoin rather than referred."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"During a well-child visit, a nurse practitioner finds several genital warts in the perianal area of a 4-year-old. What is the priority action?","o":["Recognize that this finding raises suspicion of sexual abuse. Take a careful history, examine thoroughly, and follow mandated reporting requirements.","Reassure the parent that genital warts in preschoolers usually spread from hand warts, so no further evaluation is needed.","Start topical salicylic acid at bedtime for 6\u20138 weeks and follow up in 2 months.","Tell the family that asymptomatic warts need no management and will resolve on their own."],"a":[0],"r":"Genital warts in a young child, or in an adolescent who is not sexually active, should raise suspicion of sexual abuse. That makes evaluation and reporting the priority. Reassuring the parent, starting treatment, or watching and waiting would skip the safety concern. The rule that asymptomatic warts need no management does not cover genital warts in a young child."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"A 2-month-old has a red, scaly rash. Which findings favor seborrheic dermatitis over atopic dermatitis? Select all that apply.","o":["A symmetric, red, scaling eruption on the scalp with greasy scale","The rash does not itch, and the infant is content and not scratching","Lichenified plaques with itching that gets worse in the evening","A strong family history of atopy and an elevated IgE level","Involvement of hair-bearing and intertriginous areas such as the neck folds"],"a":[0,1,4],"r":"Seborrheic dermatitis is a symmetric, red, scaling eruption of hair-bearing and intertriginous areas. The blueprint describes it as not itchy and without pustules. Severe itching that worsens in the evening, lichenification, an elevated IgE level, and a strong family history all point to atopic dermatitis (\"the itch that rashes\"). Note: standard references say seborrheic dermatitis can cause mild itching."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 15-year-old high school wrestler has several oval plaques on his neck and shoulder. Each has a raised, red, scaly border and a clearing center, and they are spreading outward. He has no fever, no tick exposure, and no new products. Which diagnosis and plan is most appropriate?","o":["Erythema migrans; doxycycline for 14\u201321 days","Allergic contact dermatitis from mat cleaner; triamcinolone 0.1% cream once daily","Tinea corporis gladiatorum; antifungal therapy, which may need to be oral, with no steroid added","Tinea corporis; a clotrimazole\u2013betamethasone combination cream twice daily"],"a":[2],"r":"Tinea corporis gladiatorum fits here: annular, scaly plaques with red borders that clear in the center and spread outward, in a wrestler. It may need oral medication, and antifungals should not be combined with steroids. Option D gets the diagnosis right but uses a steroid combination product. Erythema migrans is a bull's-eye rash at a tick bite site and does not have scaling borders. With no new exposure, there is no reason to suspect contact dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":true,"q":"Which rash descriptions are correctly matched with their most likely diagnosis? Select all that apply.","o":["A linear rash along the waistline after wearing a new belt: allergic contact dermatitis","A circular rash on the earlobes after wearing new earrings: allergic contact dermatitis","Moist, honey-colored crusts on red, eroded skin: nonbullous impetigo","Scaly macules on the trunk of an adolescent, in a guttate (raindrop) pattern, ranging from hypopigmented to salmon-colored: seborrheic dermatitis","Very itchy vesicles in different stages, mostly on the trunk: bullous impetigo"],"a":[0,1,2],"r":"Belts usually cause a linear rash and earrings a circular one, and both are allergic contact dermatitis. Honey-colored crusts on red, eroded skin are the classic sign of nonbullous impetigo. Guttate macules on the trunk that range from hypopigmented to salmon-colored describe tinea versicolor, not seborrheic dermatitis. Itchy, centripetal vesicles in different stages describe varicella, while bullous impetigo forms bullae that leave a thin, varnish-like crust."},{"t":"Dermatitis, Varicella & Warts","l":1,"s":false,"q":"A 6-year-old is on day 4 of varicella. Several lesions on the trunk are now red, swollen, tender, and covered with honey-colored crusts. The child is otherwise stable. What is the most appropriate next step?","o":["Continue supportive care only, because crusting is the expected evolution of the lesions","Treat a bacterial superinfection (pyoderma) with an antistaphylococcal penicillin or a cephalosporin","Start scheduled ibuprofen to reduce the inflammation in the lesions","Start IV acyclovir, because these findings mean disseminated varicella"],"a":[1],"r":"Pyoderma is the most common varicella complication (5%). Red, tender lesions with honey-colored crusts suggest secondary bacterial infection, which is treated with an antistaphylococcal penicillin or a cephalosporin. Normal scabs are not red, swollen, and tender with honey-colored crusts. Ibuprofen is questionable in varicella because of its possible link to bacterial superinfection. IV acyclovir is for immunocompromised patients or severe viral disease, not a localized bacterial infection."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"An 8-month-old has had dry, rough, red patches on the cheeks and the outer surfaces of the arms since 3 months of age. The parent says the infant rubs her face against the crib sheets constantly, especially in the evening, and that the patches clear for a while and then come back. The father has asthma and allergic rhinitis. Which diagnosis and phase best fit this presentation?","o":["Seborrheic dermatitis (cradle cap), which usually resolves in the first year","Atopic dermatitis, childhood phase","Atopic dermatitis, infantile phase","Irritant contact dermatitis from repeated exposure to saliva"],"a":[2],"r":"Severe itching that gets worse in the evening, dry skin, flares followed by remission, and a strong family history of atopy point to atopic dermatitis. Onset at 3 months puts it in the infantile phase (onset 1\u20136 months, can continue to 2 years). Seborrheic dermatitis does not itch and favors hair-bearing intertriginous areas. The childhood phase begins between 2 years and puberty."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A 2-month-old has a red, scaly rash. The nurse practitioner is trying to tell atopic dermatitis apart from seborrheic dermatitis. Which findings favor atopic dermatitis? Select all that apply.","o":["The infant is fussy and rubs the affected areas constantly, and it is worse in the evening","A symmetrical, red, scaling eruption limited to the scalp, behind the ears, and the skin folds, with no itching","The mother has eczema and a known elevated IgE level","The patches flare, clear completely, and then flare again","The eruption is attributed to overproduction of sebum with Malassezia yeast","Dry, rough skin with red papules on the cheeks"],"a":[0,2,3,5],"r":"Atopic dermatitis is \"the itch that rashes.\" It causes severe itching that worsens in the evening, abnormally dry skin with red papules, periods of flare and remission, and is linked to elevated IgE with a strong family history. A non-itchy, symmetrical, scaling eruption in hair-bearing intertriginous areas, caused by sebum overproduction and Malassezia, describes seborrheic dermatitis."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A 13-year-old girl has had an itchy, dry, scaly rash in the antecubital folds for the past 3 months. She and her mother confirm she never had eczema or any other skin problem before age 13. Which phase of atopic dermatitis is this?","o":["Adult phase, because onset occurred after 12 years of age","Childhood phase, because onset occurred before puberty was complete","Childhood phase, because the childhood phase covers age 2 through adolescence","Reactivation of the infantile phase, because adult-onset disease requires a history of infantile eczema"],"a":[0],"r":"The adult phase is defined by onset after 12 years and can continue through puberty. The childhood phase begins between 2 years and puberty, and this patient's first symptoms appeared at 13. The blueprint does not require earlier infantile disease for adult-phase onset."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"According to the professor's notes, which of these children with atopic dermatitis should be referred to a specialist? Select all that apply.","o":["A 5-year-old who has used emollients and a topical steroid as directed for 2 weeks with no change in the rash","A 3-year-old who has severe, widespread skin eruptions over the trunk and extremities at the first visit","A 7-year-old who is partly improved after 1 week of treatment","A 9-year-old whose flare began after his parents' divorce and who is improving on the treatment plan","A 6-year-old who has improved steadily over 10 days of treatment and has mild dryness left"],"a":[0,1],"r":"Refer when a child has severe skin eruptions, regardless of how long treatment has lasted, or has not responded after two weeks of treatment. Children C and E have not reached 2 weeks and are improving. Emotional stress can worsen eczema (D), but this child is responding, so referral is not needed."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"The nurse practitioner reviews itch\u2013scratch cycle teaching with the mother of a 4-year-old with eczema. Which statement by the mother shows that more teaching is needed?","o":["\"I'll give her a daily soak in lukewarm water with a mild soap.\"","\"I'll keep her bedroom cool and run a humidifier.\"","\"I'll switch our laundry detergent to a fragrance-free one.\"","\"I'll put her in soft cotton-polyester blend pajamas instead of wool ones.\""],"a":[3],"r":"The professor's teaching calls for 100% cotton and avoiding both wool and synthetics. A cotton-polyester blend contains a synthetic fiber, even though it avoids wool. Tepid soaks with mild soap, a cool and humid environment, and fragrance-free detergent are all correct."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A 6-year-old with known atopic dermatitis comes in because \"the rash looks different.\" Which findings suggest a secondary infection that needs evaluation and treatment beyond routine eczema care? Select all that apply.","o":["Moist, honey-colored crusts over scratched areas","Lesions that have spread quickly over the past 2 days","New regional lymphadenopathy near the affected skin","Thickened, leathery skin in the popliteal fossae","Itching that is worse in the evening"],"a":[0,1,2],"r":"One treatment goal in eczema is to monitor for and prevent secondary infection. Honey-colored crusts, rapid spread, and regional lymphadenopathy suggest secondary impetigo at the broken skin. Lichenification (D) and evening itching (E) are expected features of atopic dermatitis itself."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A 10-year-old who has had atopic dermatitis since age 3 has thick, leathery plaques with exaggerated skin markings in both antecubital fossae. What best explains this finding?","o":["A kerion caused by a delayed inflammatory reaction to a fungal infection","Lichenification from a long-standing itch\u2013scratch cycle","Bullous impetigo that left a thin, varnish-like scale","Allergic contact dermatitis from a type IV delayed hypersensitivity reaction"],"a":[1],"r":"In eczema, a pattern of severe itching and redness leads to dry, scaly skin. Chronic scratching thickens the skin into lichenified plaques. A kerion is a boggy, pustular scalp mass seen in tinea capitis. Varnish-like scale follows ruptured bullae. Allergic contact dermatitis causes acute erythema, vesicles, and weeping at the site of contact."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A school nurse asks the nurse practitioner about the cause and spread of impetigo. Which statements match the blueprint? Select all that apply.","o":["It results from bacterial colonization of the skin.","It is caused by Staphylococcus aureus and Streptococcus pyogenes.","It spreads through contact and droplet contact.","It is caused by overgrowth of Malassezia yeast in hot, humid climates.","It spreads only through contaminated objects, not from person to person."],"a":[0,1,2],"r":"Impetigo is a highly contagious infection caused by bacterial colonization with S. aureus and S. pyogenes. The blueprint says it spreads through contact and droplet contact. Malassezia causes tinea versicolor and seborrheic dermatitis, not impetigo. Impetigo clearly spreads from person to person. Note: standard references describe spread mainly by direct contact with lesions; droplet spread is not usually emphasized."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A 4-year-old with poorly controlled eczema develops crusted lesions over the excoriated patches on both wrists. According to the blueprint, which organism almost always causes this type of impetigo?","o":["Streptococcus pyogenes, because the crusts are honey-colored","S. aureus and S. pyogenes equally, so the organism cannot be predicted","Malassezia ovalis, because the infection developed on eczematous skin","Staphylococcus aureus"],"a":[3],"r":"Lesions that form at a break in the skin, such as eczema, are secondary impetigo. The blueprint states that bullous and secondary impetigo are almost always caused by S. aureus. Honey-colored crusts describe the nonbullous form and do not identify the organism. Malassezia causes seborrheic dermatitis, not impetigo."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"Which of these presentations are secondary impetigo? Select all that apply.","o":["Crusted lesions over excoriated eczema on the wrists","Honey-colored crusts at the sites of scratched mosquito bites","Crusted lesions forming on a healing abrasion on the knee","Honey-colored crusts that appeared on previously normal, intact skin around the nares in a child with no skin condition","Crusted, oozing lesions over scratched varicella vesicles"],"a":[0,1,2,4],"r":"Secondary impetigo is an infection at a break in the skin, such as eczema, a bite, an abrasion, or scratched varicella lesions (pyoderma is a known varicella complication). Option D is primary impetigo, which is a direct bacterial infection of normal skin."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A healthy 5-year-old with no drug allergies has two small, superficial, painless lesions with honey-colored crusts on the chin. No other lesions are present. Which plan is most appropriate?","o":["Mupirocin twice daily, applied over the intact crusts","Retapamulin three times daily after removing the crusts","Retapamulin twice daily after removing the crusts","Oral dicloxacillin for 7\u201310 days"],"a":[2],"r":"Superficial, nonbullous impetigo limited to a small area is treated with a topical antibiotic, applied after the crusts are removed. Retapamulin is dosed twice daily and mupirocin three times daily, so options A and B each have the wrong frequency, and A also leaves the crusts on. Oral therapy is for multiple lesions, not two lesions on the chin."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"For which children is topical antibiotic therapy alone appropriate for impetigo? Select all that apply.","o":["A 4-year-old with one superficial, nonbullous lesion at the edge of the nares","A 6-year-old with two small nonbullous lesions on one cheek","A 3-year-old with many lesions on the face, trunk, and both legs","A 5-week-old with extensive bullae who is feeding poorly","A 7-year-old with a small, superficial crusted patch on the back of one hand"],"a":[0,1,4],"r":"Topical antibiotics are for impetigo that is superficial, nonbullous, or limited to a small area, which fits children A, B, and E. Multiple widespread lesions (C) call for oral antibiotics. Severe bullous disease in an infant (D) calls for a parenteral antistaphylococcal penicillin."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A 6-year-old with no drug allergies has many impetigo lesions on the arms and legs. Which oral antibiotics are acceptable choices according to the blueprint? Select all that apply.","o":["Cephalexin","Amoxicillin/clavulanate","Dicloxacillin","Amoxicillin alone","Penicillin V","Mupirocin three times daily as the only therapy"],"a":[0,1,2],"r":"Oral therapy must work against beta-lactamase-producing S. aureus. The blueprint lists cephalexin, amoxicillin/clavulanate, and dicloxacillin (the professor's preference), with clindamycin reserved for penicillin allergy. Plain amoxicillin and penicillin V are broken down by beta-lactamase. Mupirocin is topical and is not enough on its own for multiple lesions."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A 4-year-old who attends daycare starts oral cephalexin for impetigo at 9:00 a.m. on Monday. Which plan matches the blueprint?","o":["Return to daycare Tuesday at 9:00 a.m.; follow up in 48\u201372 hours if not improved; if there is no response by 7 days, swab beneath the crust for Gram stain, culture, and sensitivities","Return to daycare Wednesday at 9:00 a.m.; follow up in 48\u201372 hours if not improved; if there is no response by 7 days, swab beneath the crust for Gram stain, culture, and sensitivities","Return to daycare Tuesday at 9:00 a.m.; follow up in 7 days if not improved; if there is no response by 14 days, swab the surface of the crust for culture","Return to daycare Tuesday at 9:00 a.m.; follow up in 48\u201372 hours if not improved; if there is no response by 7 days, swab the top of the crust for a rapid strep test"],"a":[0],"r":"Children stay out of daycare until they have been treated for 24 hours, and follow-up is scheduled in 48\u201372 hours if there is no improvement. If there is no response after 7 days, swab beneath the crust for Gram stain, culture, and sensitivities. Option B uses 48 hours of exclusion. Option C uses the wrong follow-up timing and swabs the crust surface. Option D uses the wrong swab site and the wrong test."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A well-appearing 20-month-old has several large, flaccid blisters on the trunk and thighs. Some have ruptured and left a thin, varnish-like scale. The nurse practitioner decides on oral therapy. Which parts of the plan are appropriate? Select all that apply.","o":["Choose an agent that is active against beta-lactamase-producing S. aureus","Treat for 7\u201310 days","Recognize that this type of impetigo is almost always caused by S. aureus","Admit for parenteral nafcillin, because all bullous impetigo in children under 2 requires IV therapy","Use topical mupirocin alone, because oral antibiotics are avoided in children under 2"],"a":[0,1,2],"r":"Varnish-like scale after ruptured bullae identifies bullous impetigo, which is almost always caused by S. aureus. Multiple lesions call for a beta-lactamase-active oral antibiotic for 7\u201310 days. Parenteral therapy is reserved for severe bullous disease in infants, not a well toddler. The blueprint has no rule against oral antibiotics under age 2."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"Which infant with impetigo most clearly needs a parenteral beta-lactamase-resistant antistaphylococcal penicillin such as oxacillin or nafcillin?","o":["A 10-month-old with two small, intact bullae on the thigh who is afebrile and feeding well","A 5-week-old with extensive bullous lesions over the trunk and diaper area who is feeding poorly and lethargic","A 9-month-old with honey-colored crusted lesions around the nose","An 11-month-old with secondary impetigo over eczema on the cheeks who is otherwise well"],"a":[1],"r":"The blueprint reserves parenteral methicillin, oxacillin, or nafcillin for severe bullous impetigo in infants. Extensive lesions in a young, lethargic infant who is feeding poorly is severe disease. The other infants have limited or nonbullous disease and can be treated with topical or oral therapy."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"Ten days after a camping trip in Connecticut, a 9-year-old has an 8-cm round lesion on the thigh. It has a red center, a clear ring, and a larger red outer ring. The border is not scaly, and the lesion is not warm or tender. He also has fever, headache, and myalgias. What is the most likely diagnosis?","o":["Tinea corporis","Cellulitis","Stage 1 (early localized) Lyme disease with erythema migrans","Stage 2 (early disseminated) Lyme disease"],"a":[2],"r":"A single bull's-eye lesion at the bite site with fever, headache, and myalgia is erythema migrans, the hallmark of Stage 1. Tinea corporis and cellulitis are on the blueprint's differential, but tinea has red, scaly borders and cellulitis is warm and tender without target rings. Stage 2 would cause multiple smaller secondary annular lesions or systemic findings such as cranial nerve palsy."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A parent calls after finding a tick on her child's scalp and asks about the risk of Lyme disease. Which statements match the blueprint? Select all that apply.","o":["Many people remove the tick before transmission happens.","A brief attachment of less than 36 hours is considered a low-risk bite.","An engorged tick that has fed for more than 72 hours is a high-risk bite.","A flat tick attached for 24 hours is high risk, because any attachment longer than 12 hours transmits infection.","Engorgement does not matter; only the location of the bite determines risk."],"a":[0,1,2],"r":"The blueprint notes that many people remove the tick before transmission. It defines a low-risk bite as attachment for less than 36 hours and a high-risk bite as an engorged tick that has fed for more than 72 hours. Option D contradicts the low-risk definition, and option E ignores engorgement, which is a key part of the high-risk definition. Note: standard references (AAP/IDSA) use attachment of 36 hours or more as the threshold for single-dose doxycycline prophylaxis."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A child with Lyme disease is being evaluated. Which findings show that the disease has progressed beyond Stage 1? Select all that apply.","o":["Multiple annular lesions that look like the original EM but are smaller","Facial droop from a cranial nerve VII palsy","Lymphocytic meningitis","Mild nuchal rigidity with a single EM lesion","Fever and malaise with a single EM lesion"],"a":[0,1,2],"r":"Multiple smaller secondary annular lesions, CN VII palsy, and lymphocytic meningitis are all Stage 2 (early disseminated) findings. Mild nuchal rigidity, fever, and malaise are listed among the symptoms that come with the EM rash in Stage 1. Do not confuse mild nuchal rigidity with lymphocytic meningitis."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"Two months after an untreated bull's-eye rash, a 10-year-old has several smaller annular lesions on the trunk, and a lumbar puncture confirms lymphocytic meningitis. Which additional finding belongs to the same stage of Lyme disease?","o":["Arthritis of the knee with WBCs in the synovial fluid","Paresthesias of the hands and feet","Cognitive and memory loss","Radiculitis"],"a":[3],"r":"Secondary annular lesions and lymphocytic meningitis place this child in Stage 2 (early disseminated), which also includes radiculitis. Large-joint arthritis with synovial WBCs, paresthesias of the hands and feet, and cognitive and memory loss are all Stage 3 (late) findings. Note that Stage 2 radiculitis and Stage 3 paresthesias both involve nerves, which makes them easy to mix up."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"A 9-year-old with early disseminated (Stage 2) Lyme disease has the generalized illness described in the blueprint. Which complaints fit this presentation? Select all that apply.","o":["Stomachache","Urinary symptoms","Migratory musculoskeletal pain","Memory loss","Paresthesias of the hands and feet","Arthritis of the knee"],"a":[0,1,2],"r":"Stage 2 generalized illness includes stomachache, urinary symptoms, and migratory musculoskeletal pain. Memory loss, paresthesias of the hands and feet, and large-joint arthritis of the knee are Stage 3 (late) findings. Migratory musculoskeletal pain (Stage 2) is easy to confuse with large-joint arthritis (Stage 3)."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A parent asks how long early disseminated (Stage 2) Lyme disease can last if it is never treated. Which answer matches the blueprint?","o":["Weeks to 2 years","Weeks to months, with symptoms that come and go","It appears months to years after the original infection","A few weeks, then it resolves permanently"],"a":[0],"r":"Untreated, Stage 2 lasts from weeks to 2 years. Intermittent symptoms lasting weeks to months describe untreated Stage 1 (EM and its accompanying symptoms). Appearance months to years after infection describes late (Stage 3) disease. Untreated Lyme disease does not resolve permanently in a few weeks."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":true,"q":"Six weeks after an untreated bull's-eye rash, an 8-year-old comes in with a fainting episode, bradycardia, and second-degree heart block on ECG. Which statements are accurate? Select all that apply.","o":["This presentation fits early disseminated (Stage 2) Lyme disease.","Lyme carditis can cause first-, second-, or third-degree heart block.","Heart block means the child has reached Stage 3 (late) disease.","Antibiotics given during the EM stage would have prevented progression to Stage 3.","Arrhythmias are not a feature of Lyme disease, so another cause should be the only focus."],"a":[0,1,3],"r":"Carditis with life-threatening first-, second-, or third-degree heart block is a Stage 2 (early disseminated) finding. Treating with antibiotics in the early stages prevents progression to Stage 3. Stage 3 involves large-joint arthritis, cognitive changes, and paresthesias, not carditis. Arrhythmias are a well-documented Lyme complication."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A 12-year-old who was never treated for a tick bite 14 months ago had a swollen right knee. Fluid aspirated during the episode contained WBCs. The swelling went away on its own after 3 weeks, and the parents are relieved. What is the nurse practitioner's best response?","o":["\"The swelling went away on its own, which shows it was not Lyme arthritis.\"","\"Untreated Lyme arthritis often goes away within a few weeks, but it tends to come back and become chronic.\"","\"Since the swelling has resolved, the disease can no longer progress.\"","\"Knee arthritis is a Stage 2 finding that resolves within 2 years.\""],"a":[1],"r":"WBCs in the synovial fluid are concrete evidence of Lyme arthritis, a Stage 3 finding that affects large joints, most often the knee. Untreated, the arthritis resolves in a few weeks but becomes recurrent and chronic, so spontaneous resolution neither rules out Lyme disease nor means it is cured. Large-joint arthritis is late (Stage 3) disease, not Stage 2."},{"t":"Eczema, Impetigo & Lyme","l":2,"s":false,"q":"A 10-year-old has a single classic EM lesion and flu-like symptoms after a tick exposure. Which regimen matches the blueprint and the professor's notes?","o":["Amoxicillin for 7\u201310 days","Cefuroxime for 5\u20137 days","Doxycycline for 14\u201321 days","A single dose of doxycycline with no further therapy"],"a":[2],"r":"The blueprint lists doxycycline, amoxicillin, or cefuroxime, and the professor specified a 14\u201321 day course. Options A and B use acceptable drugs with courses that are too short. A single dose of doxycycline is not the treatment for an established EM rash. Note: standard references (IDSA 2020/AAP) recommend about 10 days of doxycycline or 14 days of amoxicillin or cefuroxime for EM, and reserve single-dose doxycycline for post-bite prophylaxis."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"A student reviews her charting from a pediatric clinic day. Which findings has she labeled correctly, both by type of eruption and by condition? Select all that apply.","o":["Small rose-colored spots on the soft palate: enanthem of rubeola","Small, irregular, bluish-white granules on an erythematous base on the oral mucosa: enanthem of rubeola","Intense red eruption on the cheeks: enanthem of erythema infectiosum","White-coated tongue with prominent red papillae: enanthem of scarlet fever","Dark red lines in the skin folds: exanthem of scarlet fever","Bluish-white granules on the oral mucosa: enanthem of rubella"],"a":[1,3,4],"r":"Koplik spots are the oral enanthem of measles (rubeola). Strawberry tongue is a mucosal finding (enanthem) of scarlet fever, and Pastia lines in the skin folds are a skin finding (exanthem) of scarlet fever. Rose-colored soft-palate spots are Forchheimer spots, which belong to rubella, not rubeola. Slapped cheeks involve the skin, so they are an exanthem, and the bluish-white granules are paired with the wrong disease in option F."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"An unvaccinated 4-year-old's measles rash appeared this morning. The daycare director asks how far back the child was likely contagious so that exposed families can be notified. Based on the blueprint, which response is accurate?","o":["From about 5\u20136 days before the rash appeared","Only from the day the rash appeared","From 1\u20132 days before symptom onset, which is about 3\u20135 days before the rash appeared","From 1\u20132 days before the rash appeared, until all lesions crust over"],"a":[2],"r":"Per the blueprint, a person with measles is contagious 1\u20132 days before symptom onset, which is about 3\u20135 days before the rash appears. A contagious period of 5\u20136 days before the rash is the rubella window. Contagiousness from 1\u20132 days before the rash until all lesions crust describes varicella. Note: standard references say measles is contagious from about 4 days before to 4 days after rash onset."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"A daycare had several different infections this season. The NP reviews incubation periods with the staff. Which pairings are correct? Select all that apply.","o":["Rubella: 3\u20135 days","Erythema infectiosum: 4\u201321 days","Measles: 12\u201323 days (mean 17 days)","Roseola infantum: 9\u201310 days","Scarlet fever: 9\u201310 days"],"a":[1,3],"r":"Per the blueprint, fifth disease has an incubation period of 4\u201321 days, and roseola has an incubation period of 9\u201310 days. An incubation period of 3\u20135 days belongs to scarlet fever, and 12\u201323 days (mean 17) belongs to rubella. Assigning roseola's 9\u201310 days to scarlet fever is the near-miss distractor."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"On May 1, an unvaccinated 2-year-old sat in a clinic waiting room next to a child who was later confirmed to have measles. The parent asks when to watch for symptoms. Based on the incubation period, symptoms would most likely begin:","o":["May 4\u20136","May 9\u201313","May 10\u201311","May 13\u201324"],"a":[1],"r":"Measles has an incubation period of 8\u201312 days, so symptoms would be expected 8\u201312 days after the May 1 exposure, or May 9\u201313. May 4\u20136 reflects the 3\u20135 day scarlet fever incubation period. May 10\u201311 reflects roseola's 9\u201310 days, and May 13\u201324 reflects rubella's 12\u201323 days."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"An unvaccinated 15-year-old has had 2 days of low-grade fever, headache, and malaise. The NP is considering rubella. Which additional prodromal findings would support that diagnosis? Select all that apply.","o":["Small, irregular, bluish-white granules on the oral mucosa","Lower GI upset","Cough, coryza, and conjunctivitis with photophobia","Eye pain","Postauricular and posterior occipital lymphadenopathy developing within about 24 hours","Temperature climbing toward 105 F"],"a":[1,3,4],"r":"The rubella prodrome includes fever, lower GI upset, pharyngitis, eye pain, arthralgia, malaise, and headache. Lymphadenopathy develops within about 24 hours and mainly involves the postauricular, posterior cervical, and posterior occipital nodes. Koplik spots, the 3 C's with photophobia, and a fever approaching 105 F all point to measles. The pairing of eye pain (rubella) with photophobia (measles) is the near-miss to watch for."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 17-year-old was exposed to rubella about 2\u00bd weeks ago. She now reports generalized itching but has no visible maculopapular rash, and the exam shows only fine, bran-like scaling. What is the NP's best interpretation?","o":["Rubella is ruled out because it always produces a visible maculopapular rash.","This is most consistent with an atopic dermatitis flare, so rubella is unlikely.","This is the residual desquamation with light-colored pigmentation seen after measles.","Exanthems occur less often in adolescents, and rubella can present as pruritus without a rash or as a fine, bran-like desquamation."],"a":[3],"r":"Per the blueprint, adolescents develop exanthems less often, and rubella may present as pruritus without a rash or as a fine, bran-like desquamation. The exposure timing also fits rubella's 12\u201323 day incubation period (mean 17 days). The absence of a classic rash does not exclude rubella. Residual desquamation with light-colored pigmentation follows a measles rash, which this patient never had."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A woman who is 14 weeks pregnant has laboratory-confirmed primary rubella. Which counseling statement matches the blueprint?","o":["\"Because you are in the second trimester, the risk of congenital defects is about 26%.\"","\"Any infection before 20 weeks carries the highest risk, about 61%.\"","\"The risk is about 61% until the third trimester, when it drops to 26%.\"","\"The risk is about 26%, and the main concern is severe fetal anemia and stillbirth.\""],"a":[0],"r":"Per the blueprint, primary maternal rubella in the first 12 weeks carries about a 61% risk of congenital defects, and the risk falls to about 26% in the second trimester. At 14 weeks she is past the 12-week cutoff. Options B and C misplace that cutoff. Severe fetal anemia and stillbirth are parvovirus B19 risks, not rubella risks. Note: standard references say the risk declines steadily after 12 weeks and defects are rare after about 20 weeks."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"An NP is comparing the joint symptoms of rubella and erythema infectiosum. Which statements are accurate? Select all that apply.","o":["In children with fifth disease, arthralgia is common and is usually the presenting complaint.","In rubella, arthralgia and arthritis are more common in adolescent females.","In rubella, arthralgia appears only after the rash has resolved.","In children with fifth disease, joint complaints most often involve the hands, wrists, knees, or ankles and appear 2\u20133 weeks after symptom onset.","Adults with parvovirus B19 typically develop a symmetric polyarthropathy."],"a":[1,3,4],"r":"Rubella arthralgia and arthritis are more common in adolescent females. In fifth disease, children less often have arthralgia; when they do, it usually involves the hands, wrists, knees, or ankles 2\u20133 weeks after symptom onset, while adults typically have a symmetric polyarthropathy. Arthralgia is uncommon, not the main complaint, in children with fifth disease. In rubella, arthralgia is part of the prodrome, so it does not appear only after the rash resolves."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 7-year-old with fifth disease had red cheeks that faded within a few days. Three weeks later, a lacy rash is still visible on his arms and thighs, and his parent worries that something is wrong. What is the NP's best response?","o":["\"The rash usually lasts only 1\u20134 days, so we need to look for another cause.\"","\"The lacy rash of fifth disease can last about a month, so this is expected.\"","\"The rash should have resolved in about 3 days, so he may have a second infection.\"","\"The rash normally lasts 2\u20133 days; one that persists suggests an allergic reaction.\""],"a":[1],"r":"Per the blueprint, the lacy maculopapular eruption of fifth disease spreads from the trunk to the arms, thighs, and buttocks and lasts about a month. The 1\u20134 day duration applies to the slapped-cheek facial eruption, not the lacy body rash. A rash lasting about 3 days fits rubella, and 2\u20133 days fits roseola."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"An 8-year-old has a sandpaper-textured rash, pharyngitis, and a strawberry tongue. The NP is documenting the rest of the exam and history. Which findings would be consistent with scarlet fever? Select all that apply.","o":["Cough and coryza as the predominant symptoms","Increased heart rate","Possibly increased respiratory rate","Flushed face and an ill appearance","Patient report of chills and difficulty swallowing","Photophobia"],"a":[1,2,3,4],"r":"The blueprint's documentation list for scarlet fever includes elevated temperature, increased heart rate, and possibly increased respiratory rate; an ill-appearing, flushed face; and patient-reported sore throat, headache, chills, and difficulty swallowing. Cough and coryza as the main symptoms and photophobia suggest measles, not a group A strep infection."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A woman who is 14 weeks pregnant learns that her 5-year-old has fifth disease. Her parvovirus B19 serology shows a positive IgG and a negative IgM. Which interpretation is correct?","o":["She has a current infection, and her fetus is at risk of severe anemia.","She has never been infected and remains susceptible.","The results indicate a past infection rather than a current infection.","The results are not useful, because only a fetal blood sample can show infection."],"a":[2],"r":"Per the blueprint, IgM indicates a current infection and IgG indicates a past infection. A positive IgG with a negative IgM therefore points to a past infection, not an acute one. A current infection would require a positive IgM. Someone who had never been infected would be negative for IgG."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"A school nurse asks the NP how erythema infectiosum spreads and how its course unfolds. Which statements are accurate? Select all that apply.","o":["Parvovirus B19 can be transmitted through blood products.","It spreads mainly through direct contact with draining skin lesions.","Droplet precautions are indicated.","Children are most contagious once the slapped-cheek rash appears.","The facial rash appears about 7\u201310 days after the prodromal stage."],"a":[0,2,4],"r":"Per the blueprint, parvovirus B19 spreads through blood products and requires droplet precautions. The slapped-cheek rash appears 7\u201310 days after a mild prodrome of fever, myalgia, headache, malaise, and URI symptoms. Fifth disease does not produce draining lesions. Children in the rash stage are not contagious, so option D reverses the actual contagious period."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"A previously healthy 10-month-old is brought to the emergency department after a brief generalized febrile seizure. The parent reports 2 days of fever up to 103 F, and no rash is present. The NP suspects roseola infantum. Which additional findings are consistent with the febrile phase of roseola? Select all that apply.","o":["A maculopapular rash erupting at the peak of the fever","Reddened tympanic membranes","GI complaints","Cough, coryza, and conjunctivitis with bluish-white oral granules","Lethargy"],"a":[1,2,4],"r":"In the febrile phase, roseola can cause URI symptoms, cervical and posterior occipital lymphadenopathy, lethargy, eyelid edema, GI complaints, reddened tympanic membranes, and febrile convulsions. Fever, seizures, or toxicity may bring the child to the ED. The rash comes after the fever resolves, not at its peak. The 3 C's with Koplik spots indicate measles."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 16-month-old has roseola. The parent asks how the child caught it, because the only recent sick contact was a cousin at a family gathering. What is the NP's best explanation of how roseola spreads?","o":["Through nasopharyngeal secretions, mostly in late winter and early spring","Through blood products and respiratory droplets","Through direct contact with fluid from vesicles until they crust over","Through oral, nasal, and conjunctival routes from close contacts"],"a":[3],"r":"Per the blueprint, HHV-6 and HHV-7 spread through oral, nasal, and conjunctival routes from close contacts. Nasopharyngeal secretions with a late-winter and early-spring peak describe rubella. Blood products and droplets describe parvovirus B19. Contact with vesicle fluid until the lesions crust describes varicella."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"Four children are seen in an urgent care clinic for fever and rash. Which child's presentation is most consistent with roseola infantum?","o":["A 14-month-old with 4 days of fever up to 103 F who has been afebrile since this morning and now has a rose-colored, blanching rash on the trunk","A 14-month-old with a rose-colored rash on the trunk that erupted on the second day of fever while the temperature was still 103 F","A 6-year-old with 4 days of fever up to 103 F who has been afebrile since this morning and now has a rose-colored, blanching rash on the trunk","A 14-month-old whose fever climbed toward 105 F as a rash began behind the ears and spread downward"],"a":[0],"r":"Roseola follows a pattern of high fever, then abrupt defervescence, then a rash that begins on the trunk. Per the professor's notes, it occurs in children under 3 years. Option B has the right age but the wrong sequence, because the rash appears during the fever. Option C has the right sequence but falls outside the professor's age range. Option D describes measles."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"A 6-year-old has red cheeks and a rash. The NP is trying to decide between scarlet fever and fifth disease. Which findings would favor scarlet fever? Select all that apply.","o":["A lacy rash that moves from the trunk to the arms, thighs, and buttocks","Dark red lines in the antecubital skin folds","A white-coated tongue with prominent red papillae","A body rash that appeared after a slapped-cheek phase lasting several days","Skin with a rough, sandpaper texture"],"a":[1,2,4],"r":"Pastia lines, strawberry tongue, and sandpaper-textured skin are features of scarlet fever. Both conditions can produce red cheeks with circumoral pallor, so the facial appearance alone does not distinguish them. A lacy rash that spreads from the trunk to the extremities and buttocks after a slapped-cheek phase is the sequence of fifth disease."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"An 8-year-old has fever, pharyngitis, a sandpaper-textured rash, and a strawberry tongue, and the rapid antigen detection test is positive. Which antibiotics does the blueprint list for this condition?","o":["Dicloxacillin, cephalexin, or clindamycin","Penicillin, amoxicillin, or cephalexin","Doxycycline, amoxicillin, or cefuroxime","No antibiotic; oral acyclovir if started within 24 hours of the rash"],"a":[1],"r":"The findings indicate scarlet fever, and the blueprint lists penicillin, amoxicillin, and cephalexin for it. Dicloxacillin (the professor's preference), cephalexin, and clindamycin are listed for impetigo. Doxycycline, amoxicillin, and cefuroxime are listed for Lyme disease. Acyclovir is an antiviral used for varicella and does not treat group A strep."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 9-year-old with scarlet fever started amoxicillin 4 days ago. The parent reports that the rough rash on his trunk is already gone and asks whether that is normal. What is the NP's best response?","o":["\"No. The sandpaper rash normally lasts about a month, so this may not have been scarlet fever.\"","\"No. The rash should last until the peeling begins, so we should recheck him today.\"","\"No. Early fading means the antibiotic is causing a reaction and should be stopped.\"","\"Yes. The sandpaper-textured rash typically fades in 3\u20134 days.\""],"a":[3],"r":"Per the blueprint, the sandpaper-textured skin of scarlet fever fades in 3\u20134 days, so this is the expected course. The lacy rash of fifth disease is the one that lasts about a month. Peeling of the fingers, toes, and palms can come later as a separate feature, but the rash does not persist until then. Expected fading of the rash is not a sign of a drug reaction."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 6-year-old was diagnosed with scarlet fever today. His 4-year-old sister shared a cup with him yesterday. The parent asks when the sister would develop symptoms if she was infected. What is the NP's best response?","o":["\"Within about 3\u20135 days of the exposure\"","\"About 8\u201312 days after the exposure\"","\"About 9\u201310 days after the exposure\"","\"Anywhere from 12 to 23 days after the exposure\""],"a":[0],"r":"Scarlet fever has an incubation period of 3\u20135 days. The other ranges describe measles (8\u201312 days), roseola (9\u201310 days), and rubella (12\u201323 days). Because scarlet fever has the shortest incubation period of these exanthems, symptoms in the sister would appear soonest."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"A school nurse asks the NP for return-to-school guidance for three students. Which statements are accurate? Select all that apply.","o":["The student with rubella should stay home for 1 week after the rash erupted.","The student with scarlet fever may return only after finishing the full antibiotic course.","The student with fifth disease should stay home until the lacy rash has faded.","The student with fifth disease who is in the rash stage may attend school.","The student with scarlet fever may return after 24 hours of antibiotics.","The student with rubella may return once fever-free for 24 hours."],"a":[0,3,4],"r":"Per the blueprint, children with rubella stay home for 1 week after the rash erupts. Children with fifth disease are not contagious in the rash stage and may attend school. Children with scarlet fever are no longer contagious and may return after 24 hours of antibiotics. Waiting for the full antibiotic course or for the fifth-disease rash (which can last about a month) to fade is unnecessary. Being fever-free for 24 hours is not the rubella criterion."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 16-year-old has eye pain, postauricular and posterior occipital lymphadenopathy, and a discrete pinkish-red rash that started on her face and spread to her chest. Two days later, she reports tingling in her hands and tenderness along the tendons of her wrists. What is the NP's best response?","o":["\"Tingling and joint symptoms suggest late Lyme disease, so I will order an ELISA.\"","\"Tingling means encephalitis has developed, so you need to go to the emergency department now.\"","\"Paresthesia and tendonitis can occur with this infection, and we will monitor you with supportive care.\"","\"This is the symmetric polyarthropathy of parvovirus B19, so IGIV is indicated.\""],"a":[2],"r":"Eye pain, postauricular and posterior occipital nodes, and a discrete rash spreading from the face to the chest point to rubella, and the blueprint notes that paresthesia and tendonitis occur with rubella. Isolated tingling without altered mental status does not indicate encephalitis. Symmetric polyarthropathy of parvovirus B19 is mainly an adult finding, and IGIV is reserved for immunocompromised patients. The clinical picture does not fit Lyme disease."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"An NP is teaching students to use fever patterns to tell the childhood exanthems apart. Which statements are accurate? Select all that apply.","o":["Measles: low to moderate fever (101 F or less) during the prodrome","Roseola: the fever rises when the rash erupts","Fifth disease: a mild fever during the prodrome, before the rash appears","Measles: a fever of 104 F or higher throughout the prodrome, which breaks when the rash appears","Scarlet fever: fever along with sore throat, headache, and malaise"],"a":[0,2,4],"r":"In measles, the fever is low to moderate (101 F or less) during the prodrome and climbs as the rash appears. The fifth-disease prodrome includes only a mild fever, and scarlet fever features include fever, sore throat, headache, and malaise. In roseola, the rash appears after the fever resolves, so option B reverses the pattern. Option D reverses the measles pattern."},{"t":"Rashes & Exanthems","l":2,"s":false,"q":"A 20-month-old has posterior occipital lymphadenopathy. The parent reports 3 days of fever up to 102.8 F, and today the child is afebrile with a pink maculopapular rash. Which finding most strongly favors roseola over rubella?","o":["Posterior occipital lymphadenopathy","A rash that appeared after the fever resolved and began on the trunk","A pink maculopapular rash","A prodrome of low-grade fever with eye pain and GI upset"],"a":[1],"r":"The roseola rash appears after defervescence and begins on the trunk before spreading to the face and extremities. The rubella rash begins on the face and spreads to the chest. Posterior occipital lymphadenopathy and a pinkish maculopapular rash occur in both conditions, so they do not distinguish them. A prodrome with eye pain and GI upset favors rubella."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"An NP is examining the faces of several children with rashes. Which facial findings are correctly matched to the condition? Select all that apply.","o":["Fifth disease: an intense red eruption on the cheeks with circumoral pallor that lasts 1\u20134 days","Scarlet fever: a flushed face with circumoral pallor","Roseola: a rash that begins on the face and then spreads to the trunk","Rubella: a rash that begins on the face and spreads to the chest","Measles: a rash that begins around the mouth and spreads upward to the forehead"],"a":[0,1,3],"r":"The slapped-cheek eruption of fifth disease comes with circumoral pallor and lasts 1\u20134 days. Scarlet fever also produces a flushed face with circumoral pallor, and the rubella rash begins on the face and spreads to the chest. The roseola rash begins on the trunk and spreads outward to the face and extremities. The measles rash begins behind the ears and on the forehead and moves downward, not upward."},{"t":"Rashes & Exanthems","l":2,"s":true,"q":"An unvaccinated 3-year-old is on day 2 of a measles rash. The lesions have coalesced over the face and upper trunk, and the fever is 104.5 F. Which statements by the NP to the parent are accurate? Select all that apply.","o":["\"The rash usually lasts 2\u20133 days and fades without leaving any skin changes.\"","\"In general, the more severe the rash, the more severe the illness.\"","\"The spots should stay separate and are not expected to run together.\"","\"The rash usually begins to heal around day 4.\"","\"This rash typically lingers for about a month.\""],"a":[1,3],"r":"Per the blueprint, the measles rash heals around day 4, and the more severe the rash, the more severe the illness. Afterward, light-colored pigmentation and desquamation can remain for about a week, so the claim of no residual changes is wrong. Measles lesions do coalesce, and a rash lasting about a month describes fifth disease."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 20-kg 6-year-old has three itchy patches of hair loss on the crown. In each patch, hairs are broken off at the scalp surface and look like small black dots, and there are tender posterior cervical nodes. Which order is consistent with the professor's regimen for this condition?","o":["Griseofulvin 200\u2013300 mg once daily for 4\u20138 weeks, with fatty food","Griseofulvin 400\u2013600 mg twice daily for 4\u20138 weeks, with fatty food","Griseofulvin 200\u2013300 mg twice daily for 4\u20138 weeks, with fatty food","Griseofulvin 200\u2013300 mg twice daily for 2\u20134 weeks, with fatty food"],"a":[2],"r":"Black dot alopecia with posterior cervical adenopathy points to T. tonsurans tinea capitis. Per the professor, the dose is 10\u201315 mg/kg per dose twice daily for 4\u20138 weeks, which is 200\u2013300 mg BID for a 20-kg child. Option B doubles the per-dose amount, A gives the dose only once a day, and D uses the 2\u20134 week course for non-scalp tinea. Note: standard references say microsize griseofulvin 20\u201325 mg/kg/day (once daily or divided) for 6\u201312 weeks."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 7-year-old in week 2 of griseofulvin for tinea capitis now has a tender, boggy, pustule-studded scalp mass with marked inflammation. Which orders are appropriate? Select all that apply.","o":["Continue oral griseofulvin","Add oral prednisone for 5\u201314 days","Hold griseofulvin until the inflammation subsides, then restart","Add oral prednisone for 4 weeks to match the antifungal course","Consider a systemic antibiotic if secondary bacterial infection is suspected","Apply triamcinolone 0.1% cream to the mass daily"],"a":[0,1,4],"r":"For a kerion with severe inflammation, the professor's plan is prednisone for 5\u201314 days, with oral antifungal therapy continued and a systemic antibiotic considered for secondary bacterial infection. Holding the antifungal (C) leaves the fungal cause untreated. A 4-week steroid course (D) goes beyond the 5\u201314 day window. Topicals are not recommended for tinea capitis, and triamcinolone 0.1% (F) is the professor's choice for contact dermatitis. Note: standard references say the benefit of systemic corticosteroids for kerion is unproven."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 9-year-old has taken griseofulvin for tinea capitis for 4 weeks. The scalp now looks normal, but the repeat fungal culture is still positive. The parent asks if the medicine can be stopped. What is the best response?","o":["\"Keep taking it. We treat until 2 weeks after the scalp looks clear and the fungus tests come back negative.\"","\"Yes, you can stop now, because the scalp has healed.\"","\"Take it for 2 more weeks, since the scalp has looked clear for a while.\"","\"Keep taking it for 6 months total, no matter what the tests show.\""],"a":[0],"r":"The blueprint says to treat for 6\u20138 weeks, or until 2 weeks after both clinical and mycologic cure. A positive culture means mycologic cure has not happened yet. Option C counts only clinical cure, and B stops at clinical improvement alone. Six months (D) has no basis in the tinea capitis plan."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 5-year-old has KOH-confirmed tinea capitis. Which agents are acceptable options for treating the infection? Select all that apply.","o":["Oral griseofulvin","Oral terbinafine, because the child is older than 4 years","Oral fluconazole, recognizing that it is less effective","Oral itraconazole","Econazole cream applied to the patches as the only therapy","Oral nystatin suspension"],"a":[0,1,2,3],"r":"The blueprint lists griseofulvin, terbinafine (children over 4), fluconazole (less effective), and oral itraconazole for tinea capitis. Econazole appears in the blueprint only as an adjunctive shampoo option. No topical is recommended as treatment for tinea capitis (E). Nystatin (F) is not one of the listed tinea capitis agents."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"An 8-year-old has culture-confirmed black dot tinea capitis. The family has no pets, and the child shares a bedroom with two siblings. Which counseling is most appropriate?","o":["\"This is most likely Microsporum canis, so ask classmates whether their pets have skin problems.\"","\"This is most likely Trichophyton tonsurans, which spreads on objects, so don't share combs, brushes, hats, or pillowcases, and have the siblings' scalps checked.\"","\"This is most likely Trichophyton tonsurans, which comes mainly from animals, so no household precautions are needed.\"","\"Your child must stay home from school until the whole 4\u20138 week course is finished.\""],"a":[1],"r":"Black dot tinea is the T. tonsurans pattern, and the blueprint says T. tonsurans is spread by fomites, so preventing shared hair items and checking household contacts is the priority. Pet exposure is linked to M. canis (A, C). Keeping the child home for the whole treatment course (D) is not part of the plan."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 6-year-old is brought in for scalp scaling. Which history findings support tinea capitis? Select all that apply.","o":["Three days of high fever, followed by a rash on the trunk as the fever broke","Patchy hair loss with itching","A cousin who was recently treated for ringworm","Weeping vesicles along the hairline that started the day after a new hair dye","A new puppy with patches of fur loss","Symmetric, greasy, non-itchy scale that has been present since infancy"],"a":[1,2,4],"r":"The blueprint lists hair loss, itching, and contact with a person or pet with ringworm as history findings in tinea capitis. Fever followed by a rash as the fever resolves (A) is roseola. Vesicles after a new product (D) suggest allergic contact dermatitis. Symmetric, non-pruritic scale (F) fits seborrheic dermatitis."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 9-year-old has an itchy, scaly scalp, and the referring note says \"dandruff.\" On exam there are two patches of broken hairs with black dots, plus posterior cervical lymphadenopathy. What is the most appropriate plan?","o":["Ketoconazole shampoo, left on for 5\u201310 minutes before scrubbing, for several weeks","Hydrocortisone 1% lotion daily for no more than 2 weeks","Selenium sulfide 2.5% shampoo twice a week for 4 weeks as the only treatment","Oral antifungal therapy, with medicated shampoo used only as an adjunct"],"a":[3],"r":"Broken hairs with black dots and posterior cervical nodes mean tinea capitis, not seborrheic dermatitis. Tinea capitis needs oral therapy, and topicals are not recommended. Option A is the dandruff (seborrheic dermatitis) shampoo method and B is the professor's low-potency steroid for seborrheic dermatitis on the face or diaper area. Selenium shampoo (C) only decreases spore viability alongside oral therapy."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 6-year-old with a 3-week history of a scaly scalp patch now has a 4-cm boggy, tender mass with pustules, a temperature of 38.5 \u00b0C (101.3 \u00b0F), a WBC of 14,000/mm\u00b3, and occipital lymphadenopathy. The urgent care note says \"scalp abscess.\" Which interpretations are correct? Select all that apply.","o":["These findings are consistent with a kerion","This is a primary bacterial abscess, so antifungal therapy is unnecessary","A kerion results from a delayed inflammatory reaction","Fever, leukocytosis, and lymphadenopathy can accompany a kerion","This presentation matches the fine gray scale, minimal-inflammation pattern of M. canis"],"a":[0,2,3],"r":"A boggy, pustule-filled mass arising from a scaly patch is a kerion, which results from a delayed inflammatory reaction and can come with lymphadenopathy, fever, and leukocytosis. These systemic signs do not make it a primary abscess, and the fungal infection still needs treatment (B). Fine gray scale with minimal inflammation (E) is the non-inflammatory M. canis pattern, not a kerion."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 10-year-old was given triamcinolone 0.1% cream for an \"eczema patch\" on the thigh. Three weeks later, the lesion is larger and has a red, scaly, advancing border with central clearing. KOH is positive. What is the best next step?","o":["Stop the triamcinolone and apply a topical azole such as clotrimazole twice daily","Continue the triamcinolone for itching and add clotrimazole twice daily","Switch to hydrocortisone 1% plus clotrimazole, since a low-potency steroid is safe to combine","Start oral griseofulvin and continue the triamcinolone for inflammation"],"a":[0],"r":"This is tinea corporis, which got worse under a topical steroid. Superficial, localized tinea corporis is treated with a topical azole (miconazole or clotrimazole) twice a day. The blueprint says not to combine antifungals with steroids, which rules out B, C, and D. Oral therapy (D) is reserved for lesions that do not respond to topical treatment, and this lesion has not had a trial of topical antifungal yet."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 6-year-old whose family recently adopted a kitten has two annular, scaly plaques on the forearm. Which organisms can cause tinea corporis? Select all that apply.","o":["Trichophyton rubrum","Microsporum canis","Malassezia species","Trichophyton mentagrophytes","Candida albicans"],"a":[0,1,3],"r":"The blueprint lists M. canis, T. rubrum, and T. mentagrophytes as causes of tinea corporis, and M. canis fits the kitten exposure. Malassezia (C) causes tinea versicolor and seborrheic dermatitis. Candida (E) is a yeast, not a dermatophyte, and is not a listed cause of tinea corporis."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 9-year-old who wrestles in a youth league went camping 2 weeks ago and now has an annular lesion on the thigh. The blueprint lists tinea in the differential for erythema migrans. Which presentation and plan best fit tinea corporis?","o":["A red macule with a clear ring and a larger erythematous outer ring, plus fever and arthralgia; treat with a topical azole","Several smaller annular lesions with a new facial nerve palsy; treat with a topical azole","Moist, honey-colored crusts on red, eroded skin; treat with a topical azole","A raised, red, scaly border that spreads outward with central clearing and no systemic symptoms; treat with a topical azole"],"a":[3],"r":"A scaly, red border that spreads peripherally and clears centrally, in a wrestler without systemic symptoms, is tinea corporis and gets a topical azole. Option A describes stage 1 Lyme erythema migrans, and B describes stage 2 disseminated Lyme. Both need antibiotics, not antifungals. Honey-colored crusts (C) are nonbullous impetigo."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"Which descriptions match the classic lesions of tinea corporis? Select all that apply.","o":["Annular, oval, or circinate shape","Vesicles that enlarge into bullae and rupture, leaving a thin, varnish-like coating","One or more flat, scaling, mildly erythematous circular patches or plaques with red, scaly borders","A lacy, reticular eruption on the trunk that moves out to the arms and thighs","Lesions that may be inflammatory throughout, with superficial pustules"],"a":[0,2,4],"r":"The blueprint describes tinea corporis lesions as annular, oval, or circinate, with flat, scaling, mildly erythematous patches or plaques and red, scaly borders. Lesions can also be inflammatory throughout, with superficial pustules. Varnish-like scale after bullae rupture (B) is bullous impetigo, and a lacy reticular eruption (D) is fifth disease."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 13-year-old on the school wrestling team has several annular, scaly plaques on the cheek, jaw, and neck, and two teammates have similar lesions. What is the most appropriate plan?","o":["Topical clotrimazole only, because oral antifungals are reserved for scalp infection","Oral griseofulvin, because tinea faciei and tinea corporis gladiatorum may require oral therapy","Oral griseofulvin plus hydrocortisone 1% daily to the face for no more than 2 weeks","Oral terbinafine, because griseofulvin is only used in children older than 12"],"a":[1],"r":"Facial lesions in a wrestling-team cluster are tinea faciei and tinea corporis gladiatorum, which the blueprint says may require oral medication. Griseofulvin is the systemic drug of choice for children over 2. Adding hydrocortisone (C) breaks the rule against combining antifungals with steroids, even with a face-safe low-potency product. Oral therapy is not limited to the scalp (A), and the age cutoff in D is wrong."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"Which tinea treatments are paired with the correct frequency or duration? Select all that apply.","o":["Localized tinea corporis: topical azole twice daily, with improvement expected within 1\u20134 weeks","Localized tinea corporis: topical azole once daily, with improvement expected within 4\u20136 weeks","Tinea cruris: topical antifungal for 4\u20136 weeks","Tinea cruris: topical antifungal for 1\u20132 weeks","Tinea corporis that fails topical therapy in a child older than 2: oral griseofulvin, usually for 2\u20134 weeks","Tinea corporis that fails topical therapy: oral griseofulvin for 4\u20138 weeks, the same as for the scalp"],"a":[0,2,4],"r":"Localized tinea corporis is treated with a topical azole twice a day, with improvement over 1\u20134 weeks. Tinea cruris gets 4\u20136 weeks of topical therapy. For non-scalp tinea that does not respond to topicals, griseofulvin (the systemic drug of choice for children over 2) usually lasts 2\u20134 weeks. The 4\u20138 week course (F) is for the scalp, and B and D change the frequency or shorten the course. Note: standard references say 2\u20134 weeks of topical therapy is often enough for tinea cruris."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 16-year-old obese hockey player has a sharply marginated, red-brown plaque with a raised, scaling border on both inner thighs. He also has scaling and maceration between his toes. Both sites are KOH-positive. Which plan is best?","o":["Topical antifungal to the groin and feet, hydrocortisone 1% to the groin for itching for up to 2 weeks, and cotton underwear","Oral griseofulvin, because two body sites are involved","Topical antifungal to the groin and feet, no steroid, cotton underwear, loose clothing, and antifungal powder","Topical antifungal to the groin, tight compression shorts to prevent thigh chafing, and talcum powder"],"a":[2],"r":"He has tinea cruris with coexisting tinea pedis, a common pairing, so both sites are treated topically. The blueprint adds cotton underwear, loose clothing, and talcum or antifungal powder, and says not to combine antifungals with steroids. Option A differs from C only by the added steroid. Tight clothing (D) is a risk factor, and two sites alone do not call for oral therapy (B)."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"An adolescent has a red, scaling eruption in the groin. Which findings favor tinea cruris over seborrheic dermatitis? Select all that apply.","o":["Pustules or vesicles along the plaque border","A symmetric, non-pruritic, red scaling eruption in hair-bearing intertriginous areas","Sharply marginated plaques with raised, scaling borders and some central clearing","A history of cerebral palsy with frequent seborrhea elsewhere","A shiny, peeling, erythematous macular rash confined to the diaper area","Coexisting tinea pedis"],"a":[0,2,5],"r":"Tinea cruris shows sharply marginated plaques with raised borders of scaling, pustules, or vesicles, sometimes with central clearing, and it is often associated with tinea pedis. Seborrheic dermatitis is symmetric, non-pruritic, without pustules, and more common in neurologically impaired children (B, D). Option E describes diaper dermatitis."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 14-year-old swimmer started clotrimazole cream twice daily for tinea pedis on day 1. On day 17, the skin between his toes looks completely clear. On which day should he stop the cream?","o":["Day 17","Day 21","Day 42","Day 24"],"a":[3],"r":"Tinea pedis cream is applied twice daily until 7 days after clearing, so clearing on day 17 means stopping on day 24, within the expected 3\u20136 week total. Stopping when the skin first looks clear (A) invites relapse. Day 21 (B) is just the low end of the 3\u20136 week range, and day 42 (C) is the high end. Neither follows the 7-days-after-clearing rule."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 16-year-old has KOH-confirmed onychomycosis of one fingernail. Which oral regimens are appropriate? Select all that apply.","o":["Terbinafine for 12 weeks","Terbinafine for 6 weeks","Itraconazole pulse therapy, 1 week each month for 6 months","Itraconazole daily for 12 weeks","Itraconazole pulse therapy, 1 week each month for 3 months","Terbinafine for 2\u20134 weeks"],"a":[1,3,4],"r":"Terbinafine is given for 6 weeks for fingernails, and itraconazole is given for 12 weeks or as pulse therapy 1 week each month for 3 months. Twelve weeks of terbinafine (A) is the toenail course. Six months of pulses (C) doubles the pulse regimen, and 2\u20134 weeks (F) is far too short for a nail infection."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"An 11-year-old has a thick, yellow great toenail with subungual debris, and onychomycosis is confirmed. The parent asks for \"the nail paint\" because they want to avoid pills. What is the most accurate response?","o":["\"Ciclopirox nail treatment is used for patients over 12, so an oral medicine is the option for your child now.\"","\"Ciclopirox can be used now, but it has to be applied for 48 weeks.\"","\"Ciclopirox can be used now for 12 weeks, the same as oral terbinafine for toenails.\"","\"Ciclopirox works for fingernails at any age, but it is not used on toenails.\""],"a":[0],"r":"The blueprint limits topical ciclopirox to patients over 12 years old, so an 11-year-old does not qualify. Option B gives the correct 48-week duration but ignores the age limit. Option C confuses ciclopirox with the terbinafine toenail course. The blueprint does not restrict ciclopirox by nail site (D)."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"A 15-year-old with KOH-confirmed onychomycosis of one great toenail is starting terbinafine. Which elements belong in the plan? Select all that apply.","o":["Terbinafine for 12 weeks","Terbinafine for 6 weeks, because only one nail is involved","Follow-up visits at 1-month intervals for LFTs","Follow-up about every 6 months for long-term management","Follow-up in 2 weeks, then every 2\u20134 weeks","Switching to fluconazole if the family wants faster nail clearing"],"a":[0,2,3],"r":"The terbinafine course is 12 weeks for toenails. The 6-week course (B) is for fingernails, no matter how many nails are involved. The blueprint plans follow-up at 1-month intervals for LFTs, then about every 6 months long term. The 2-week, then every 2\u20134 week schedule (E) is for tinea capitis, and fluconazole (F) resolves nails more slowly. Note: standard references say a baseline LFT is advised, and routine interval LFTs may not be needed in healthy children."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A 16-year-old with onychomycosis of one fingernail cannot take terbinafine and is started on fluconazole. About how long should the family expect it to take for the nail to clear?","o":["6 weeks","6\u20139 months","8\u201318 months","48 weeks"],"a":[1],"r":"Fluconazole works more slowly than the other agents, with resolution in about 6\u20139 months for fingernails and 8\u201318 months for toenails. Option C is the toenail timeline. Six weeks (A) is the terbinafine fingernail course, and 48 weeks (D) is the ciclopirox course."},{"t":"Tinea (Fungal)","l":2,"s":true,"q":"Which selenium sulfide regimens are correctly matched to the condition? Select all that apply.","o":["Tinea versicolor: selenium sulfide 2.5% shampoo twice a week for 4 weeks, with no maintenance","Tinea capitis: selenium sulfide 2.5% shampoo twice a week for 4 weeks, together with oral therapy","Tinea capitis: selenium sulfide 2.5% shampoo alone for mild cases","Tinea versicolor: selenium sulfide 2.5% lotion or 1% shampoo applied in a thin layer for 10 minutes daily for 1\u20132 weeks, then monthly for 3 months","Tinea capitis: selenium sulfide 1% shampoo applied for 10 minutes daily for 1\u20132 weeks, then monthly"],"a":[1,3],"r":"Per the professor, selenium sulfide 2.5% shampoo twice a week for 4 weeks is an adjunct to oral therapy for tinea capitis, to decrease spore viability. Tinea versicolor gets a 10-minute thin-layer application daily for 1\u20132 weeks, then monthly for 3 months. Options A and E swap the two regimens. Shampoo alone (C) is never enough for tinea capitis."},{"t":"Tinea (Fungal)","l":2,"s":false,"q":"A fair-skinned 16-year-old has many small, oval, salmon-to-light-brown macules with fine scale on the upper back and chest in a raindrop pattern, noticed after summer. KOH shows yeast forms. Which diagnosis and treatment are correct?","o":["Tinea corporis; clotrimazole cream twice daily","Tinea versicolor; oral griseofulvin","Tinea versicolor; topical selenium sulfide","Seborrheic dermatitis; hydrocortisone 1% daily for no more than 2 weeks"],"a":[2],"r":"Multiple discrete, scaling, hyperpigmented (salmon to brown) macules in a guttate pat
