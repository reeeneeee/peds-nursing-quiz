 to 6 weeks before reassessing"],"a":[0],"r":"For tinea cruris, a KOH prep and fungal culture are indicated when treatment fails or the diagnosis is uncertain. Six weeks is the upper end of the usual 4- to 6-week topical course, so failure at this point calls for confirming the diagnosis and considering look-alikes such as erythrasma, candidiasis, or psoriasis. Steroids (B, C) are not used in the groin because of the risk of atrophy and striae. Extending the same therapy (D) delays the diagnosis."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 17-year-old has a sharply defined, itchy rash on the inner thighs. Which parts of his history support tinea cruris? Select all that apply.","o":["The rash started during hot, humid summer weather","He is on the high school wrestling team","He has scaling and cracks between his fourth and fifth toes","He wears tight athletic clothing that rubs and chafes","He recently switched to loose cotton boxer shorts","He recently finished a 10-day course of oral amoxicillin"],"a":[0,1,2,3],"r":"History supporting tinea cruris includes hot, humid weather, tight clothing, vigorous activity with chafing, contact sports such as wrestling, and tinea pedis at the same time. Loose cotton underwear (E) is recommended to prevent it, not a risk factor. A recent antibiotic course (F) points more toward candidal intertrigo."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 15-year-old was prescribed nystatin cream at urgent care for a \"yeast\" groin rash. After 3 weeks there is no improvement. KOH shows septate hyphae, and the scrotum is spared. Which explanation and plan are most appropriate?","o":["Nystatin has no activity against dermatophytes, so add hydrocortisone to the nystatin","Nystatin resistance is likely, so switch to oral griseofulvin for 6 to 8 weeks","Nystatin needs a longer course, so continue it for a total of 4 to 6 weeks","Nystatin has no activity against dermatophytes, so switch to an azole or allylamine"],"a":[3],"r":"Septate hyphae and a spared scrotum point to tinea cruris, a dermatophyte infection. Nystatin treats Candida only and does not work against dermatophytes, so the patient needs a dermatophyte-active topical such as an azole (clotrimazole, miconazole) or an allylamine (terbinafine). Adding a steroid (A) is contraindicated in the groin. A longer nystatin course (C) will still not work. Systemic therapy (B) is not first-line, and 6 to 8 weeks is the griseofulvin course for tinea pedis."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 16-year-old with tinea pedis has very sweaty feet. Which additional measures are appropriate? Select all that apply.","o":["Aluminum chloride antiperspirant (e.g., Drysol) on the feet for the sweating","An absorbent antifungal powder or spray","Drying the feet and between the toes thoroughly after using a commercial shower","Wearing cotton socks","Clotrimazole-betamethasone cream in the spaces between the toes","A thick occlusive ointment between the toes before practice"],"a":[0,1,2,3],"r":"Aluminum chloride products can be used for excessive sweating. Absorbent antifungal powders or sprays, cotton socks, and thorough drying between the toes after commercial showers are all recommended. Steroid-antifungal combinations (E) are avoided. A thick occlusive ointment between the toes (F) traps moisture and causes maceration."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 14-year-old has had foot symptoms for more than a year that were never treated. Which examination finding is most typical of chronic tinea pedis?","o":["Diffuse scaling and thickening of the soles with intense erythema and vesicles","Diffuse scaling and thickening on the tops of the feet with mild erythema","Diffuse scaling and thickening of the soles (plantar hyperkeratosis) with mild erythema","White, peeling lesions limited to the spaces between the toes"],"a":[2],"r":"Chronic tinea pedis shows diffuse scaling of the soles (plantar hyperkeratosis) with mild erythema. Intense erythema with vesicles (A) fits the acute vesicular form. The tops of the feet stay clear (B). White, peeling lesions (D) are how the infection first appears, before it becomes red, vesicular, macerated, cracked, and scaly."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 13-year-old is starting a griseofulvin course for extensive tinea corporis. Which counseling points about griseofulvin are accurate? Select all that apply.","o":["It can cause sun sensitivity, so use sun protection","It is contraindicated in liver failure and porphyria","Headache and stomach upset are common side effects","It can permanently stain developing teeth","It requires a baseline ECG and a monthly ECG to watch for QT prolongation","It commonly turns urine and tears orange"],"a":[0,1,2],"r":"Well-established griseofulvin counseling includes photosensitivity, contraindication in hepatic failure and porphyria, and common headache and GI upset. Its labeled systemic use is in children older than 2 years. Tooth staining (D) is associated with tetracyclines. QT monitoring (E) is not required for griseofulvin. Orange body fluids (F) are a rifampin effect."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 17-year-old has his third episode of tinea cruris this year and also has scaling between the fourth and fifth toes. Which approach best prevents another recurrence?","o":["Treat the tinea pedis at the same time as the tinea cruris","Treat the tinea pedis only, because the groin rash will clear on its own","Treat the tinea cruris first, then treat the tinea pedis after the groin clears","Treat the tinea cruris only, because tinea pedis rarely spreads to the groin"],"a":[0],"r":"Tinea cruris often occurs with tinea pedis, and preventing recurrence depends on finding and treating the source of infection. Both sites need treatment at the same time, along with putting socks on before underwear. Treating them one after the other (C) leaves the feet free to reseed the groin. Option B is wrong because the feet are a common source of spread to the groin. Option B leaves an active infection in the groin untreated."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 7-year-old returns from a camping trip in Connecticut with an 8-cm red, annular patch on the thigh that has been expanding for several days. There is no scale, and the KOH prep is negative. What is the most likely diagnosis?","o":["Tinea corporis","Erythema migrans of Lyme disease","Granuloma annulare","Herald patch of pityriasis rosea"],"a":[1],"r":"Lyme disease is in the differential diagnosis of tinea corporis. A large, expanding red ring without scale after exposure in an endemic area, with a negative KOH, fits erythema migrans. Tinea corporis (A) has a scaly border with hyphae on KOH. Granuloma annulare (C) is made of slowly enlarging, skin-colored papules in the deeper skin. A herald patch (D) is scaly and is followed by a more widespread eruption."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 13-year-old soccer player has interdigital tinea pedis and has just started topical treatment. The parent asks about physical education and soccer. Which response is correct?","o":["Physical education and sports must stop until 24 hours after treatment begins","Physical education and sports may continue during treatment","Physical education and sports must stop until 7 days after the rash clears","Physical education and sports must stop until the 2- to 3-week follow-up visit"],"a":[1],"r":"For tinea pedis, physical education and sports may continue. The 24-hour exclusion (A) applies to day care or school for tinea corporis. \"7 days after clearing\" (C) is when topical therapy for tinea pedis can stop, not a return-to-activity rule. The 2- to 3-week visit (D) is the follow-up interval, not an exclusion period."},{"t":"Tinea (Fungal)","l":3,"s":true,"q":"A 9-year-old has a single annular scaly plaque on the outer surface of the forearm. Which conditions belong in the differential diagnosis? Select all that apply.","o":["Herald patch of pityriasis rosea","Nummular eczema","Granuloma annulare","Tinea versicolor","Erythrasma","Intertrigo"],"a":[0,1,2,3],"r":"The differential diagnosis of tinea corporis includes the pityriasis rosea herald patch, nummular eczema, psoriasis, seborrhea, contact dermatitis, tinea versicolor, granuloma annulare, and Lyme disease. Erythrasma (E) and intertrigo (F) are in the differential for tinea cruris. They occur in skin folds, not as a single plaque on the forearm."},{"t":"Tinea (Fungal)","l":3,"s":false,"q":"A 15-year-old has acute vesicular lesions on the instep, and the FNP wants to confirm tinea pedis with a KOH prep. Which specimen is most likely to show hyphae?","o":["The roof of a vesicle on the palm that appeared during treatment","Fluid drawn out of a vesicle on the instep","Scrapings of normal-appearing skin on the top of the foot","The roof of an intact vesicle on the instep"],"a":[3],"r":"In vesicular tinea pedis, the roof of the vesicle has the most hyphae and gives the best KOH result. Vesicle fluid (B) usually contains few organisms. The top of the foot (C) is spared in tinea pedis. Palm vesicles that appear during treatment (A) are likely an id response, which does not contain fungus, so KOH would be negative."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 16-year-old competitive swimmer with darkly pigmented skin presents in August with a several-month history of lighter \"spots\" that she first noticed after spring break in Florida. She reports occasional mild itching. Which additional findings would be consistent with tinea versicolor? Select all that apply.","o":["Fine scale that becomes more apparent when the macules are gently scraped","Discrete macules concentrated on the neck, shoulders, and upper back","Lesions confined to the face and scalp, sparing the trunk entirely","A guttate, raindrop-like pattern of discrete scaling macules","Scaling macules concentrated on the palms and plantar surfaces","Thick, silvery scale on sharply demarcated plaques of the elbows"],"a":[0,1,3],"r":"Tinea versicolor produces multiple discrete, scaling macules or patches in a guttate (raindrop) pattern on the neck, shoulders, upper back and arms, and chest midline; fine scale is accentuated by scraping. Although the face is commonly involved in children, the infection occurs predominantly on the trunk, so a pattern confined to the face and scalp with truncal sparing does not fit. Palmar/plantar involvement suggests other diagnoses (e.g., secondary syphilis), and thick silvery plaques on the elbows describe psoriasis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 17-year-old with extensive tinea versicolor across the chest and back is started on selenium sulfide 2.5% lotion. Which application instruction is consistent with the recommended regimen?","o":["Apply a thin layer several hand-widths beyond the lesions for 30 minutes twice a week for 2 to 4 weeks, then monthly for 3 months","Apply a thin layer several hand-widths beyond the lesions overnight twice a week for 2 to 4 weeks, then monthly for 3 months","Apply a thin layer several hand-widths beyond the lesions for 30 minutes twice a week for 2 to 4 weeks, then monthly for 6 months","Apply a thin layer to the visible lesions only for 30 minutes twice a week for 2 to 4 weeks, then monthly for 3 months"],"a":[0],"r":"Selenium sulfide 2.5% lotion (or 1% shampoo) is applied in a thin layer extending several hand-widths beyond the lesions, left on for 30 minutes twice weekly for 2 to 4 weeks, followed by monthly applications for 3 months to help prevent recurrence. Treating visible lesions only misses subclinical colonization at the margins. Overnight application causes skin irritation, and the maintenance phase is 3 months, not 6."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 5-week-old infant has thick, yellow, greasy, adherent scales on the scalp with mild erythema behind the ears. The infant is feeding well and does not appear itchy. Which management recommendations are appropriate? Select all that apply.","o":["Apply mineral oil to the scalp for 5 to 10 minutes before shampooing with a mild shampoo","Loosen and remove the scales gently with a soft brush or a soft toothbrush","Shampoo the scalp twice weekly with selenium sulfide 2.5% prescription shampoo","Reassure the parents that infant seborrhea typically resolves within the first year of life","Advise that frequent shampooing with a mild baby shampoo is generally effective","Advise infrequent shampooing, because frequent washing worsens infant scaling"],"a":[0,1,3,4],"r":"Infant seborrhea is often self-limited, typically resolving spontaneously in the first year of life. Mineral oil applied for 5 to 10 minutes before a mild shampoo, followed by gentle scale removal with a soft brush or toothbrush, and frequent shampooing are generally effective. No medicated or prescription shampoos are approved for children under 2 years, so selenium sulfide 2.5% is inappropriate; infrequent shampooing is the opposite of the recommendation."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 10-month-old has a 4-day history of diaper rash. Examination reveals shiny, chapped, erythematous, parchment-like skin over the buttocks, labia majora, and upper thighs with a few superficial erosions. The inguinal creases are completely spared, and there are no satellite papules. Which type of diaper dermatitis is most likely?","o":["Candidal diaper dermatitis","Seborrheic diaper dermatitis","Irritant contact diaper dermatitis","Psoriatic diaper dermatitis"],"a":[2],"r":"Irritant contact diaper dermatitis produces chapped, shiny, erythematous, parchment-like skin with possible erosions on the convex surfaces with the creases spared, and it peaks at 9 to 12 months of age. Seborrheic diaper dermatitis is the reverse pattern (well-circumscribed in the creases, convex surfaces spared). Candidiasis involves the inguinal folds and has satellite lesions, and psoriasis produces sharply defined scaly plaques that also involve the inguinal folds."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"An FNP is evaluating a 7-month-old with a 3-week history of diaper rash that has not responded to barrier cream and frequent changes. Which findings are red flags that could indicate systemic disease or warrant dermatology consultation? Select all that apply.","o":["Purpura or petechiae within the diaper area","Bullae or pustules within the diaper area","Large papules or nodules within the diaper area","Shiny erythema on convex surfaces with the creases spared","Satellite papules just beyond the border of a beefy-red plaque","Severe erosions or ulcers within the diaper area"],"a":[0,1,2,5],"r":"Red flags listed for diaper dermatitis include severe erosions or ulcers; bullae or pustules; large papules or nodules; purpura or petechiae; and redness or scaliness over the entire body. Shiny convex-surface erythema with spared creases is the classic pattern of irritant contact dermatitis. Satellite papules at the margin of a fiery-red plaque indicate candidal diaper dermatitis, which is treated with an antifungal cream rather than prompting a workup for systemic disease."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 15-year-old has greasy yellow scale with mild erythema on the nasal bridge, eyebrows, and nasolabial folds. Which regimen for his facial seborrheic dermatitis is most consistent with recommended treatment?","o":["Daily ketoconazole 2% cream with intermittent clobetasol 0.05% cream","Daily ketoconazole 2% cream with intermittent desonide 0.05% cream","Daily ketoconazole 2% cream with continuous daily desonide 0.05% cream","Weekly ketoconazole 2% cream with intermittent desonide 0.05% cream"],"a":[1],"r":"Facial seborrheic dermatitis in adolescents is treated with daily ketoconazole 2% topical preparations plus intermittent use of a low-potency topical corticosteroid such as desonide 0.05% cream or lotion. Continuous daily steroid use on the face risks atrophy and steroid-induced dermatitis. Clobetasol is a super-high-potency steroid inappropriate for the face, and ketoconazole is applied daily, not weekly, for facial disease."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A sexually active 17-year-old presents with hypopigmented macules on the upper chest and back. The FNP is weighing tinea versicolor against other conditions in its differential diagnosis. Which statements about distinguishing these conditions are accurate? Select all that apply.","o":["Vitiligo produces depigmented, milk-white macules that typically lack the fine scale of tinea versicolor","Pityriasis alba most often presents as ill-defined, faintly scaly hypopigmented patches on the face of atopic children","Secondary syphilis can mimic tinea versicolor and should be considered, especially with palm or sole involvement","Under a Wood's lamp, vitiligo shows the same yellowish fluorescence that tinea versicolor may show","A KOH preparation from pityriasis alba characteristically shows short hyphae and round yeast forms"],"a":[0,1,2],"r":"Pityriasis alba, pityriasis rosea, vitiligo, postinflammatory pigment change, seborrhea, and secondary syphilis are in the differential for tinea versicolor. Vitiligo is depigmented and nonscaly, pityriasis alba favors the face of atopic children with ill-defined borders, and secondary syphilis must be considered in sexually active adolescents, particularly with palmar/plantar lesions. Under Wood's lamp vitiligo shows bright blue-white accentuation, not yellowish fluorescence, and the \"short hyphae and round spores\" KOH pattern is specific to Malassezia, not pityriasis alba."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"The parent of a 6-month-old with irritant contact diaper dermatitis asks how often diapers should be changed. Which recommendation is consistent with recommended management?","o":["Every 1 to 2 hours, with no changes during the night and a minimum of 6 changes in 24 hours","Every 2 to 3 hours, with one change during the night and a minimum of 8 changes in 24 hours","Every 1 to 2 hours, with one change during the night and a minimum of 8 changes in 24 hours","Every 1 to 2 hours, with one change during the night and a minimum of 6 changes in 24 hours"],"a":[2],"r":"Frequent diaper changes are essential: every 1 to 2 hours, with one change at night, for a minimum of eight changes in a 24-hour period for infants. Option B lengthens the interval to 2 to 3 hours. Options C and D lower the minimum to 6 changes, and C also omits the overnight change."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 6-week-old has scaling on the scalp and erythema in the neck folds and inguinal creases. The parents ask whether this is eczema. Which findings favor infantile seborrheic dermatitis over atopic dermatitis? Select all that apply.","o":["The infant shows no rubbing, scratching, or other signs of pruritus","Lesions in the creases are well circumscribed rather than diffusely bordered","Yellow, greasy, waxy-appearing scale on the scalp and behind the ears","Excoriations on the cheeks and scratching during each diaper change","Hyperlinear skin creases in the diaper area with diffuse borders","Scattered small pustules distributed within the erythematous plaques"],"a":[0,1,2],"r":"Seborrheic dermatitis is not pruritic, has no pustules, and in infants presents with yellow, greasy (waxy) scale on the scalp, behind the ears, and in creases; in the diaper area it is well circumscribed in the creases. Excoriations and scratching at diaper changes, along with hyperlinear skinfolds with diffuse borders, are the diaper-area features of atopic dermatitis. Pustules are not a feature of seborrhea and suggest Candida or bacterial superinfection."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 17-year-old with widespread tinea versicolor has failed two properly completed courses of topical selenium sulfide. The FNP elects oral therapy. Which plan is consistent with recommended management?","o":["Fluconazole 400 mg orally once, with follow-up in 1 week","Fluconazole 150 mg orally once, with follow-up in 1 month","Fluconazole 400 mg orally daily for 14 days, with follow-up in 1 month","Fluconazole 400 mg orally once, with follow-up in 1 month"],"a":[3],"r":"Resistant or severe tinea versicolor in older adolescents may be treated with a single oral dose of fluconazole 400 mg, with follow-up in 1 month. Follow-up at 1 week is too early to judge response. A 150 mg single dose is the vaginal candidiasis dose and is underdosed for tinea versicolor, and 14 days of daily 400 mg is unnecessary systemic exposure."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 7-month-old completed a 10-day course of amoxicillin for otitis media 4 days ago. The diaper area now shows fiery-red, scaly plaques extending into the inguinal folds and onto the scrotum, with shallow pustules and scattered satellite lesions at the periphery. Which statements regarding this child's diaper dermatitis are accurate? Select all that apply.","o":["The oral cavity should be examined for coexisting thrush","Treatment is an antifungal cream plus the same measures used for irritant dermatitis","The inguinal folds are characteristically spared in this type of diaper dermatitis","This type of diaper dermatitis can occur at any age in children who wear diapers","A fluorinated topical steroid combined with the antifungal will speed clearance","This type of diaper dermatitis is typically limited to the first 4 weeks of life"],"a":[0,1,3],"r":"Candidal diaper dermatitis presents with shallow pustules and fiery-red scaly plaques on convex surfaces, inguinal folds, labia, and scrotum, with satellite lesions; it is associated with oral thrush, recent antibiotics or diarrhea, and occurs at any age. Treatment is an antifungal cream plus the irritant-dermatitis care measures. Fold involvement distinguishes it from irritant dermatitis (which spares creases), and fluorinated steroids should not be used in the diaper area."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 16-year-old African American female with tightly coiled hair has scalp seborrheic dermatitis. She washes her hair about every 2 weeks and is concerned about dryness and breakage. Which medicated shampoo instruction is most appropriate?","o":["Use the medicated shampoo 1 to 4 times per month, leaving it on the scalp for 5 to 10 minutes before rinsing","Use the medicated shampoo 2 to 3 times per week, leaving it on the scalp for 5 to 10 minutes before rinsing","Use the medicated shampoo once daily, leaving it on the scalp for 5 to 10 minutes before rinsing","Use the medicated shampoo 1 to 4 times per month, rinsing it off immediately after lathering the scalp"],"a":[0],"r":"Medicated shampoos are generally used 2 or 3 times a week, but the recommended frequency for African American patients is 1 to 4 times per month. Shampoo should be left on the scalp for 5 to 10 minutes before scrubbing crusts and rinsing, so immediate rinsing (D) reduces effectiveness. Daily or 2 to 3 times weekly washing (B, C) is not the adjusted recommendation and worsens dryness and breakage in tightly coiled hair."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 9-month-old has moderate to severe irritant contact diaper dermatitis with dry, inflamed skin. The FNP adds a topical corticosteroid to barrier care. Which instructions are appropriate? Select all that apply.","o":["Apply hydrocortisone 1% as a thin layer 3 times a day","Limit the hydrocortisone to no more than 5 days of use","Substitute triamcinolone 0.1% if there is no improvement after 2 days","Continue hydrocortisone for up to 14 days until fully healed","Follow up by phone in 1 to 2 days and reassess within 1 week if not improved","Cover the hydrocortisone with a plastic-covered diaper to enhance penetration"],"a":[0,1,4],"r":"Hydrocortisone 0.5% or 1% is applied as a thin layer 3 times a day for no more than 5 days for moderate to severe diaper dermatitis, with phone follow-up in 1 to 2 days and reassessment within 1 week if not improved. Fluorinated steroids such as triamcinolone must not be used in the diaper area. Fourteen days exceeds the 5-day limit, and occlusion with plastic or rubber covering increases steroid absorption and worsens diaper dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 17-year-old is given a single oral dose of fluconazole for recalcitrant tinea versicolor. Which instruction should the FNP include?","o":["Expect continued flaking when lesions are scraped, which shows the drug is working","Expect normal skin color to return within 1 to 2 weeks after the oral dose","Avoid exercise and sweating after the dose, because sweat dilutes the drug in the skin","Exercise to induce sweating after the dose, because this may enhance skin drug concentration"],"a":[3],"r":"Patients taking oral antifungal medication for tinea versicolor are encouraged to exercise to induce sweating, because this may enhance the concentration of the drug in the skin. Avoiding sweating is the opposite of the recommendation. Repigmentation takes several months, not 1 to 2 weeks, and the absence (not persistence) of flaking on scraping signals effective treatment."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"The parent of a 14-year-old with seborrheic dermatitis of the scalp, eyebrows, and eyelid margins asks about the condition. Which statements are accurate? Select all that apply.","o":["Seborrheic dermatitis is associated with blepharitis, which may explain the eyelid findings","Treatment should continue for a few days after the dermatitis resolves","Follow-up should be arranged in 1 to 2 weeks to evaluate the response","The lesions are typically intensely pruritic and studded with small pustules","The condition is permanently cured after a single 2-week course of treatment","Secondary infection with bacteria or Candida can complicate the dermatitis"],"a":[0,1,2,5],"r":"Seborrhea is associated with blepharitis; education includes continuing treatment for a few days after resolution with follow-up in 1 to 2 weeks, and secondary bacterial or Candida infection is a recognized complication. Seborrheic dermatitis is not pruritic and has no pustules. It is a chronic inflammatory dermatitis requiring ongoing control rather than a one-time cure."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 8-month-old has had 4 days of watery diarrhea from a viral gastroenteritis. A new diaper rash is confined mainly to the buttocks and the skin around the anus, while the inguinal creases are spared. Which is the most likely primary contributing factor?","o":["Chemical irritation from contact with feces and its breakdown products","Allergic sensitization to dyes in the disposable diaper","Ammonia from urine irritating the convex surfaces","Mechanical friction from the diaper edges and leg bands"],"a":[0],"r":"In the diaper area around the anus, the rash is often due to diarrhea, and feces and their breakdown products are the major factors in diaper dermatitis; erythema primarily on the buttocks and around the anus indicates fecal irritation. Urine is the usual culprit when the skin is affected broadly but folds are spared, without perianal predominance. Mechanical irritation produces changes along the diaper edges, and allergic contact dermatitis to diaper components is far less common than irritant dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"Which patients are at increased risk for tinea versicolor? Select all that apply.","o":["A 15-year-old receiving long-term systemic immunosuppressive therapy after a kidney transplant","A 16-year-old who recently moved to a hot, humid coastal climate","A breastfed 3-month-old whose mother has active tinea versicolor","A healthy 4-year-old living in a cold, dry climate during the winter","A healthy 7-year-old, because prevalence peaks before the onset of puberty"],"a":[0,1,2],"r":"Tinea versicolor occurs more commonly in adolescents than in younger children, in chronically ill and immunocompromised children, and in warm seasons and humid climates. Breastfeeding infants can acquire Malassezia from their mother. A healthy preschooler in cold, dry weather has none of these risks, and the claim that prevalence peaks before puberty is incorrect, as the infection is more common in adolescents."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 4-week-old has well-circumscribed erythematous plaques with greasy yellow scale in the inguinal creases and groin. The convex surfaces of the buttocks are spared, and similar scale is present on the scalp. According to the treatment table for diaper dermatitis, which is the treatment of choice?","o":["Nystatin and/or triamcinolone","Ketoconazole and/or hydrocortisone","Ketoconazole and/or triamcinolone","Mupirocin and/or hydrocortisone"],"a":[1],"r":"Seborrheic diaper dermatitis, which begins at 3 to 4 weeks of age with greasy, well-circumscribed scale in the creases and spares the convex surfaces, is treated with ketoconazole and/or hydrocortisone. Triamcinolone is a fluorinated steroid that should not be used in the diaper area (C, A). Mupirocin targets bacterial dermatitis and does not address the Malassezia-related process."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"The parents of a 4-month-old ask how to prevent recurrent diaper rash. Which recommendations are appropriate? Select all that apply.","o":["Soak, prerinse, wash cloth diapers in mild soap, then double rinse with a cup of vinegar","Use disposable diapers that are large enough not to bind the infant's skin","Cover disposable diapers with rubber pants overnight to prevent leakage","Apply a protective barrier ointment at the first sign of skin irritation","Cleanse vigorously at each change to remove all residue from the skin","Choose thin, less absorbent diapers to allow better airflow to the skin"],"a":[0,1,3],"r":"Cloth diapers should be soaked, prerinsed, washed in a mild soap, double rinsed with a cup of vinegar, and sun-dried if possible; disposable diapers must be large enough not to bind; barrier ointment is applied at the first sign of irritation. Disposable diapers should never be worn with rubber pants, because occlusion promotes dermatitis. Vigorous cleansing worsens the skin, and thick or absorbent diapers, not thin ones, are recommended."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"The parent of a 14-month-old with persistent cradle cap asks whether a dandruff shampoo can be used. Which statement best reflects the guidance on medicated shampoos?","o":["No medicated or prescription shampoos are approved for children under 6 months of age","No medicated or prescription shampoos are approved for children under 12 months of age","No medicated or prescription shampoos are approved for children under 2 years of age","Medicated shampoos are approved for infants once they are older than 1 month of age"],"a":[2],"r":"No medicated or prescriptive shampoos are approved for children under 2 years old, so this 14-month-old should continue with mineral oil, a mild shampoo, and gentle scale removal. The 6-month and 12-month cutoffs are incorrect thresholds that would wrongly permit medicated shampoo use in this child. No medicated shampoo is approved simply because an infant is older than 1 month."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 12-month-old whose father has plaque psoriasis has sharply defined, erythematous, scaly plaques on the convex surfaces of the buttocks and in the inguinal folds that have persisted despite 3 weeks of good diaper care. Which statements about this child's likely diagnosis are accurate? Select all that apply.","o":["When it occurs, diaper-area psoriasis usually presents between 6 and 18 months of age","Treatment is often required for weeks or until the child is toilet trained","Ketoconazole is added to the regimen if Candida is also present","The inguinal folds are characteristically spared in diaper-area psoriasis","The plaques characteristically have diffuse, poorly defined borders","Psoriasis is the most common cause of diaper dermatitis at this age"],"a":[0,1,2],"r":"Psoriasis in the diaper area is rare, but when found it usually appears at 6 to 18 months; it produces erythematous, well-defined, sharp, scaly plaques on convex surfaces and inguinal folds. Treatment with steroids is often required for weeks or until toilet trained, with ketoconazole if Candida is present. Fold sparing describes irritant dermatitis, diffuse borders describe atopic dermatitis, and psoriasis is a rare, not the most common, cause."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 16-year-old completed treatment for tinea versicolor 3 weeks ago. Scraping no longer produces scale, but light patches persist on his back, and he worries the treatment failed. Which response is most accurate?","o":["Pigment returns within 1 to 2 weeks, so persisting light patches indicate a second oral dose is needed","Pigment returns over several months, but persisting light patches indicate a second oral dose is needed","Pigment returns within 1 to 2 weeks, so light patches persisting after that indicate treatment failure","Pigment returns over several months, so persisting light patches alone do not indicate treatment failure"],"a":[3],"r":"Repigmentation after treatment of tinea versicolor takes several months, and sun exposure makes treated areas look hypopigmented as the surrounding skin tans. Persistent pigment change alone is therefore not a sign of treatment failure, especially when scraping no longer produces scale. The 1-to-2-week timeline is wrong, and pigment change alone does not justify re-dosing with an oral antifungal."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 16-year-old has recalcitrant scalp seborrheic dermatitis despite an over-the-counter dandruff shampoo. Which recommendations are appropriate? Select all that apply.","o":["Use a medicated shampoo such as tar, salicylic acid, ketoconazole, or selenium sulfide 2 or 3 times a week","Alternate the medicated shampoo with a prescription-strength selenium sulfide 2.5% shampoo","Leave the shampoo on the scalp for 5 to 10 minutes before scrubbing the crusts and rinsing","Add a weekly topical corticosteroid ointment, because greasy ointments work best on the scalp","Rinse the medicated shampoo off immediately after lathering to prevent scalp irritation","Prescribe oral ketoconazole for 4 weeks for recalcitrant adolescent scalp disease"],"a":[0,1,2],"r":"Scalp seborrhea in adolescents is treated with medicated shampoos (tar, salicylic acid, ketoconazole, or selenium sulfide) 2 or 3 times weekly, alternated with prescription-strength shampoos such as selenium sulfide 2.5%, left on for 5 to 10 minutes before scrubbing and rinsing. Topical corticosteroids may be added weekly for recalcitrant disease, but leave-in foams or solutions, not ointments, work best on the scalp. Immediate rinsing reduces efficacy, and oral ketoconazole is not part of the regimen and carries hepatotoxicity warnings."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 14-month-old with long-standing, poorly managed irritant diaper dermatitis now has sharply punched-out ulcers and erosions primarily on the labia and buttocks. Which identification and key concern are correct?","o":["Jacquet dermatitis; this form is especially prone to secondary infection","Jacquet dermatitis; this form is typically self-limited, similar to miliaria","Tidemark dermatitis; this form is especially prone to secondary infection","Tidemark dermatitis; this form is typically self-limited, similar to miliaria"],"a":[0],"r":"Jacquet dermatitis is a severe form of irritant diaper dermatitis with punched-out lesions or erosions primarily on the labia and buttocks, and it is especially prone to secondary infection. Tidemark (tidewater) dermatitis is a variant found at the diaper edges. Self-limited course is a feature of miliaria, not of Jacquet dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 3-week-old has red, denuded areas, fragile flaccid blisters, honey-colored crusting, and pustules in the suprapubic and periumbilical regions. Which statements about this presentation are consistent with the diaper dermatitis treatment table? Select all that apply.","o":["The usual causative organisms are staphylococci or streptococci","Mupirocin may be used if the involvement is minimal","Amoxicillin-clavulanate or cephalexin is used for more than minimal involvement","Nystatin monotherapy is the treatment of choice for this presentation","Lesions are characteristically confined to the creases with convex surfaces spared","A fluorinated topical steroid should be added to reduce the inflammation"],"a":[0,1,2],"r":"Bacterial diaper dermatitis, usually from staphylococcal or streptococcal infection, presents with red denuded areas or fragile blisters, crusting, and pustules in the suprapubic and periumbilical areas, most often in newborns. Mupirocin is used if minimal, with amoxicillin-clavulanate or cephalexin for more extensive disease (a febrile or ill-appearing neonate needs urgent evaluation). Nystatin is added only if yeast is also present, crease-limited lesions with convex sparing describe seborrhea, and fluorinated steroids are avoided in the diaper area."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An FNP sees two infants with diaper dermatitis on the same day: one whose rash began at 3 weeks of age and one whose rash developed at 10 months. Which pairing of diaper dermatitis type and typical age is correct?","o":["Irritant contact dermatitis peaks at 3 to 4 weeks; seborrheic dermatitis begins at 9 to 12 months","Irritant contact dermatitis peaks at 6 to 18 months; seborrheic dermatitis begins at 3 to 4 weeks","Irritant contact dermatitis peaks at 9 to 12 months; seborrheic dermatitis begins at 3 to 4 weeks","Irritant contact dermatitis peaks at 9 to 12 months; seborrheic dermatitis begins at 6 to 18 months"],"a":[2],"r":"Irritant contact diaper dermatitis peaks at 9 to 12 months, whereas seborrheic diaper dermatitis has its onset at 3 to 4 weeks of age. Option A reverses the two age ranges. The 6-to-18-month range is the typical age for diaper-area psoriasis, so D and D attach it to the wrong condition."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 16-year-old has a small, localized patch of tinea versicolor on the upper chest. Which topical regimens are appropriate? Select all that apply.","o":["Clotrimazole 1% cream applied twice daily for 2 to 4 weeks","Ketoconazole 2% cream applied twice daily for 2 to 4 weeks","Clotrimazole 1% cream applied twice daily for 3 to 5 days","Nystatin cream applied twice daily for 2 to 4 weeks","Oral terbinafine 250 mg taken once daily for 2 weeks","Ciclopirox cream applied twice daily for 2 to 4 weeks"],"a":[0,1,5],"r":"For smaller areas in older adolescents, topical antifungals such as clotrimazole, miconazole, ciclopirox, ketoconazole, or oxiconazole are applied twice daily for 2 to 4 weeks. A 3-to-5-day course is the right drug for too short a time. Nystatin is not effective against Malassezia, and oral terbinafine is ineffective for tinea versicolor because it does not reach adequate levels in the stratum corneum."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 7-month-old has a red, weeping diaper rash. Which soak regimen is consistent with recommended treatment?","o":["Warm-water sitz baths for 30 minutes 4 times a day, plus Burow solution compresses 4 times a day for weeping skin","Warm-water sitz baths for 10 to 15 minutes 4 times a day, plus Burow solution compresses 4 times a day for weeping skin","Hot-water sitz baths for 10 to 15 minutes 2 times a day, plus Burow solution compresses 4 times a day for weeping skin","Warm-water sitz baths for 10 to 15 minutes 4 times a day, plus Burow solution compresses once daily at bedtime for weeping skin"],"a":[1],"r":"Treatment of diaper rash includes warm-water sitz baths for 10 to 15 minutes 4 times a day and Burow solution soaks or compresses 4 times a day if the skin is weepy. Option A lengthens the bath to 30 minutes. Option C uses hot water only twice daily, and option D reduces the Burow compresses to once daily."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 15-year-old presents with mild flaking, erythema, and yellow greasy scale. Which locations are characteristic of seborrheic dermatitis in an adolescent? Select all that apply.","o":["Nasal bridge and eyebrows","Postauricular (behind the ears) skin","Intertriginous areas","Palms and soles","Extensor elbows and knees","Dorsal hands and fingers"],"a":[0,1,2],"r":"In adolescents, seborrheic dermatitis produces mild flaking with erythema and yellow greasy scale on the scalp, forehead, nasal bridge, eyebrows, behind the ears, on the face and flexural surfaces, and in intertriginous areas, consistent with sebaceous gland density. Palms and soles lack sebaceous glands and are not typical sites. Extensor elbows and knees suggest psoriasis, and dorsal hand involvement suggests irritant or allergic contact dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 15-year-old is starting selenium sulfide lotion for tinea versicolor. Which pair of instructions is accurate?","o":["Do not apply the lotion overnight; the absence of flaking when the skin is scraped indicates effective treatment","Apply the lotion overnight for best effect; the return of normal pigment within 2 weeks indicates effective treatment","Do not apply the lotion overnight; the return of normal pigment within 2 weeks indicates effective treatment","Apply the lotion overnight for best effect; the absence of flaking when the skin is scraped indicates effective treatment"],"a":[0],"r":"Overnight application causes skin irritation, and the absence of flaking when skin is scraped is a sign of effective treatment. Options C and D recommend overnight application, which is incorrect. Options C and C use repigmentation within 2 weeks as the marker, but repigmentation takes several months and is not a reliable early test of cure."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"During examination of infants with diaper dermatitis, the FNP correlates findings with likely contributing causes. Which pairings are accurate? Select all that apply.","o":["Shiny, peeling erythema confluent in the diaper area but sparing the folds: chemical irritation (often urine)","Erythema primarily on the buttocks and around the anus: fecal irritation","Macerated or hyperpigmented erythema along the edges of the diaper or plastic pants: mechanical irritation","Erythematous, macerated folds caused by overlapping skin: chemical irritation from urine","An erythematous, dry glans penis: mechanical friction from the diaper leg bands","Fiery-red plaques with satellite lesions: chemical irritation from fragranced wipes"],"a":[0,1,2],"r":"Chemical causes produce a shiny, peeling, erythematous rash confluent in the diaper area that spares the folds (urine is often responsible when folds are spared), fecal irritation causes erythema on the buttocks and around the anus, and mechanical causes produce changes along diaper or plastic-pant edges. Macerated folds from overlapping skin are a mechanical cause, not urine. An erythematous, dry penile head is listed under chemical causes, and satellite lesions indicate Candida."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 16-year-old has severe, generalized seborrheic dermatitis involving the scalp, face, chest, and groin, along with recurrent oral thrush and 5 kg of unintentional weight loss. Which next step is most appropriate?","o":["Order thyroid studies, because severe generalized seborrhea is commonly found in persons with hypothyroidism","Order a serum zinc level, because severe generalized seborrhea is commonly found in persons with zinc deficiency","Order patch testing, because severe generalized seborrhea is commonly found with allergic contact sensitization","Offer HIV testing, because severe generalized seborrhea is commonly found in persons infected with HIV"],"a":[3],"r":"Severe, generalized seborrhea is commonly found in persons infected with HIV, and recurrent thrush with weight loss further raises concern for immunodeficiency. Patch testing evaluates allergic contact dermatitis, which does not explain this systemic picture. Hypothyroidism and zinc deficiency are not the recognized association, and acrodermatitis enteropathica presents with periorificial and acral erosive dermatitis rather than generalized greasy scale."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 16-year-old has scaling, hypopigmented truncal macules, and the FNP performs office diagnostics to confirm suspected tinea versicolor. Which findings support the diagnosis? Select all that apply.","o":["KOH preparation showing short hyphae and round spores in a \"spaghetti and meatballs\" pattern","Wood's lamp examination showing yellowish-gold to coppery-orange fluorescence of the lesions","KOH preparation showing long, branching septate hyphae only, with no yeast forms","Wood's lamp examination showing coral-red fluorescence of the involved skin","Wood's lamp examination showing chalk-white accentuation of nonscaly macules"],"a":[0,1],"r":"Malassezia produces a characteristic KOH pattern of short hyphae and round yeast cells (\"spaghetti and meatballs\"), and lesions may fluoresce yellowish-gold to coppery-orange under Wood's lamp. Long branching septate hyphae without yeast suggest a dermatophyte (tinea corporis). Coral-red fluorescence indicates erythrasma (Corynebacterium), and chalk-white accentuation of nonscaly macules indicates vitiligo."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A breastfeeding mother is being treated for tinea versicolor on her chest. Her 2-month-old has developed fine, scaling hypopigmented macules. Which distribution is most characteristic of tinea versicolor in a breastfeeding infant who acquires the organism from the mother?","o":["The palms and soles","The face","The scalp, sparing the face","The diaper area"],"a":[1],"r":"Breastfeeding infants can acquire Malassezia from their mother and characteristically exhibit facial lesions; facial involvement is also common in children generally. The diaper area is the typical site for irritant, candidal, and seborrheic diaper dermatitis. Palmar/plantar lesions suggest other diagnoses, and scalp-predominant greasy scale in an infant suggests seborrheic dermatitis (cradle cap)."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"Seborrheic dermatitis may be treated with antifungal, anti-inflammatory, and keratolytic agents. Which pairings of agent and category are correct? Select all that apply.","o":["Selenium sulfide: antifungal agent","Topical calcineurin inhibitor: anti-inflammatory agent","Topical urea: keratolytic agent","Topical salicylic acid: antifungal agent","Desonide 0.05%: keratolytic agent","Topical azoles: keratolytic agent"],"a":[0,1,2],"r":"The antifungal category includes the azoles and selenium sulfide, the anti-inflammatory category includes topical steroids and calcineurin inhibitors, and the keratolytic category (which removes excess scale) includes topical salicylic acid and urea. Salicylic acid is keratolytic, not antifungal. Desonide is a low-potency corticosteroid (anti-inflammatory), and azoles are antifungals."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 4-month-old has been kept heavily bundled under a plastic diaper cover during a summer heat wave. The diaper area shows discrete, pinpoint vesicles and papules with mild erythema and some maceration in the skinfolds. Which management is most appropriate?","o":["Apply mupirocin ointment 3 times a day plus the skin care measures used for contact dermatitis","Apply an antifungal cream plus the skin care measures used for contact dermatitis","Recognize the condition as self-limited, avoid the precipitating factors, and provide contact dermatitis care","Apply hydrocortisone 1% 3 times a day for 14 days plus the skin care measures used for contact dermatitis"],"a":[2],"r":"Miliaria (discrete vesicles or papules) and intertrigo (erythematous, scaly maceration in skinfolds) in the diaper area result from heat and occlusion and are related to sweat retention or friction. Miliaria is self-limited, and management is to avoid precipitating factors and provide care as for contact dermatitis. Antifungal and antibacterial therapy are not indicated without evidence of infection, and hydrocortisone in the diaper area is limited to no more than 5 days."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 17-year-old asks about the cause and course of his tinea versicolor. Which statements are accurate? Select all that apply.","o":["It is caused by Malassezia furfur, a yeastlike organism","The organism has also been referred to as Pityrosporum orbiculare and ovale","It is caused by Trichophyton tonsurans, a scalp dermatophyte","The infection tends to be persistent and to recur","It spreads mainly through shared combs and hats, like tinea capitis","One course cures it permanently, so recurrence suggests misdiagnosis"],"a":[0,1,3],"r":"Tinea versicolor is a superficial fungal infection caused by the yeastlike organism Malassezia furfur (also referred to as Pityrosporum orbiculare and Pityrosporum ovale), and it tends to be persistent, which is why monthly maintenance applications are used. Trichophyton tonsurans causes tinea capitis, which spreads by fomites such as combs and hats. Malassezia is part of normal skin flora, so recurrence is expected and does not imply misdiagnosis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 16-year-old with facial and postauricular seborrheic dermatitis has used intermittent low-potency topical steroids, and the FNP wants a steroid-sparing anti-inflammatory option for the face and ears. Which choice is most appropriate?","o":["A topical calcineurin inhibitor applied to the face and ears to reduce inflammation without steroids","Coal tar shampoo applied to the face and ears to reduce inflammation without steroids","Topical salicylic acid applied to the face and ears to reduce inflammation without steroids","Desonide 0.05% applied continuously to the face and ears to reduce inflammation without breaks"],"a":[0],"r":"Calcineurin inhibitors are anti-inflammatory agents that are good for the face and ears in adolescent seborrheic dermatitis and avoid steroid-related adverse effects. Salicylic acid is a keratolytic, not an anti-inflammatory, and is irritating on facial skin. Coal tar is a scalp shampoo agent, and continuous desonide is neither steroid-sparing nor the recommended intermittent use."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A parent asks which products may be used as a protective barrier for an infant with early diaper irritation. Which are appropriate choices? Select all that apply.","o":["Zinc oxide ointment","Plain petrolatum","Desitin (cod liver oil with zinc oxide)","A diaper cream containing undecylenic acid","A lanolin-and-petrolatum emollient on inflamed skin","A talc-based powder dusted onto the skin"],"a":[0,1,2,3],"r":"Protective barriers include Desitin (cod liver oil with zinc oxide), A&D Ointment, Aquaphor, petrolatum, and zinc oxide, and diaper creams containing undecylenic acid or zinc oxide reduce friction and exposure to moisture. Lanolin-and-petrolatum emollients should not be used when there is inflammation. Talc powder carries an aspiration risk for infants and is not a recommended barrier."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 11-month-old with eczematous patches on the cheeks and antecubital fossae has a diaper-area rash with excoriations on the buttocks, involvement of both folds and convex surfaces, and hyperlinear skinfolds with diffuse borders. The infant scratches the area at every diaper change. Which identification and treatment are correct?","o":["Psoriasis; topical steroids often required for weeks or until toilet trained","Atopic dermatitis; contact dermatitis skin care plus AD care, with antibiotics for bacterial infection","Irritant contact dermatitis; frequent changes, greasy lubricant, and air drying alone","Seborrheic dermatitis; ketoconazole and/or hydrocortisone as the treatment of choice"],"a":[1],"r":"Atopic dermatitis in the diaper area shows an increased number of skin lines, excoriations in folds, convex surfaces, and buttocks, and hyperlinear skinfolds with diffuse borders, along with AD elsewhere and scratching at diaper changes. It is managed with contact-dermatitis skin care plus standard AD therapy, with antibiotics for bacterial infection. Psoriasis has sharply defined plaques, seborrhea is well circumscribed and nonpruritic, and irritant dermatitis spares the creases."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"Which statements about systemic (oral) therapy for tinea versicolor in children and adolescents are accurate? Select all that apply.","o":["Oral therapy is reserved for resistant or severe cases","Oral therapy is used for older adolescents, not young children","Oral terbinafine is an effective alternative to oral azoles","Oral ketoconazole is preferred over fluconazole because of cost","Oral itraconazole is an alternative to oral fluconazole","Oral griseofulvin is an effective alternative to oral azoles"],"a":[0,1,4],"r":"Resistant or severe cases in older adolescents sometimes require oral antifungal treatment with fluconazole or itraconazole. Oral terbinafine and griseofulvin are ineffective against tinea versicolor because they do not achieve adequate activity against Malassezia in the stratum corneum. Oral ketoconazole carries FDA warnings for hepatotoxicity and is no longer recommended for superficial fungal infections."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 15-year-old has scaling of the scalp. Which additional finding most strongly favors seborrheic dermatitis over psoriasis?","o":["Thick, silvery scale on plaques extending onto the extensor elbows","Sharply demarcated plaques extending well beyond the frontal hairline","Yellow, greasy scale with mild erythema on the eyebrows and nasal bridge","Thick, silvery scale on sharply demarcated plaques with nail pitting"],"a":[2],"r":"Adolescent seborrheic dermatitis produces mild flaking with erythema and yellow, greasy scale on the scalp, forehead, nasal bridge, eyebrows, and behind the ears. Thick silvery scale, sharply demarcated plaques, nail pitting, extensor involvement, and plaques extending well past the hairline are hallmarks of psoriasis, which is in the differential diagnosis of seborrhea."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 6-month-old has moderate irritant diaper dermatitis. Which home care measures should the FNP recommend? Select all that apply.","o":["Increase the infant's fluid intake to help dilute the urine","Leave the diaper off or blow-dry with low heat 3 or 4 times a day","Blow-dry on a high heat setting held close to the skin to dry faster","Refer to a dermatologist if the rash proves recalcitrant to treatment","Scrub firmly with soap at each change to remove all residual cream","Air-dry only once daily at bedtime to avoid chilling the infant"],"a":[0,1,3],"r":"Diaper rash treatment includes exposing the area to air by leaving the diaper off or blow-drying with low heat 3 or 4 times a day, increasing fluids to dilute urine, and referring any recalcitrant rash to a dermatologist. High heat held close to infant skin risks burns. Vigorous cleansing worsens diaper dermatitis, and once-daily air drying is below the recommended 3 to 4 times a day."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 9-month-old has a 2-month history of a diaper rash concentrated in the inguinal creases that has not responded to barrier care, topical antifungal, or a short course of hydrocortisone 1%. Examination shows scattered petechiae and purpuric papules in the creases and persistent greasy scaling of the scalp. Which is the most appropriate next step?","o":["Increase to hydrocortisone 2.5% three times daily and reassess within 1 week","Switch to ketoconazole cream and reevaluate in 2 weeks for presumed seborrheic dermatitis","Add nystatin cream to the regimen for presumed Candida superinfection of seborrhea","Refer for dermatology consultation and evaluation for systemic disease, such as biopsy"],"a":[3],"r":"Purpura or petechiae are red flags in diaper dermatitis that could indicate systemic disease and require dermatology consultation. This pattern (seborrhea-like scalp scale plus purpuric crease lesions refractory to therapy) is classic for Langerhans cell histiocytosis, which requires biopsy. Continuing empiric antifungal or steroid therapy delays the diagnosis, and stronger steroids in the diaper area are inappropriate."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"Which statements about the etiology and epidemiology of seborrheic dermatitis are accurate? Select all that apply.","o":["It is thought to be related to overproduction of sebum in areas rich in sebaceous glands","It may reflect overgrowth of Malassezia, a saprophytic yeast universally present on skin","It occurs most often in early infancy and in adolescence","It is contagious, and affected children should be excluded from school until treated","It is a dermatophyte infection, and diagnosis requires a positive fungal culture","It occurs most often in middle childhood, between about 5 and 10 years of age"],"a":[0,1,2],"r":"Seborrhea is thought to be related to sebum overproduction because it occurs in sebaceous gland-rich areas, and it may represent overgrowth of Malassezia ovalis, a saprophytic yeast universally present on human skin. It occurs most often in early infancy and adolescence, which matches periods of sebaceous activity. It is not contagious, is not a dermatophyte infection, and is uncommon in middle childhood, when sebaceous activity is low."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A fair-skinned 14-year-old has had salmon-colored to light-brown, finely scaling, discrete oval macules in a raindrop pattern on the upper chest and shoulders for over a year, with seasonal changes in how noticeable they are. There was no preceding single larger lesion, and she is not sexually active. Which diagnosis is most likely?","o":["Pityriasis rosea","Postinflammatory hyperpigmentation","Secondary syphilis","Tinea versicolor"],"a":[3],"r":"In light-skinned individuals, tinea versicolor produces hyperpigmented (salmon-colored to brown), scaling, discrete macules in a guttate pattern on the neck, shoulders, and upper trunk; it is persistent, and its visibility changes with the seasons. Pityriasis rosea typically starts with a herald patch and resolves over weeks, not more than a year. Secondary syphilis is unlikely without sexual activity, and postinflammatory hyperpigmentation lacks active scale and follows a prior dermatosis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"Which types of diaper dermatitis characteristically involve the skin creases or inguinal folds? Select all that apply.","o":["Candidiasis","Seborrheic dermatitis","Psoriasis","Early irritant contact dermatitis","Intertrigo","Tidemark dermatitis"],"a":[0,1,2,4],"r":"Candidal diaper dermatitis involves convex surfaces and the inguinal folds, seborrhea is well circumscribed in the creases while sparing convex surfaces, psoriasis involves convex surfaces and the inguinal folds, and intertrigo causes maceration within skinfolds. Irritant contact dermatitis characteristically spares the creases, although it may progress to involve them later. Tidemark dermatitis is found at the diaper edges rather than in the folds."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 6-week-old being treated for seborrheic diaper dermatitis returns with new shallow pustules and satellite papules spreading beyond the well-circumscribed plaques in the inguinal creases. Which explanation is most likely?","o":["Evolution into diaper-area psoriasis, which requires treatment until toilet training","Candida superinfection, which commonly complicates seborrheic diaper dermatitis","Evolution into Jacquet dermatitis, which presents as pustules beyond the creases","Bacterial superinfection, which requires oral cephalexin as first-line therapy"],"a":[1],"r":"Seborrheic diaper dermatitis is often superinfected with Candida, and the new satellite lesions and shallow pustules are hallmarks of candidal infection. Seborrhea itself has no pustules, so the change signals superinfection. Bacterial dermatitis presents with denuded areas, fragile blisters, and crusting, typically suprapubic/periumbilical; psoriasis is rare and presents as sharp scaly plaques; and Jacquet dermatitis consists of punched-out erosions on the labia and buttocks."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"An FNP is teaching a student about pigment changes in tinea versicolor. Which statements are accurate? Select all that apply.","o":["Lesions range from hypopigmented in dark-skinned individuals","Lesions are hyperpigmented, salmon to brown, in light-skinned individuals","Lesions become relatively darker during the winter months","Hypopigmented lesions reflect M. furfur, while hyperpigmented ones reflect Trichophyton","The hypopigmentation represents permanent scarring that will not repigment","Lesions tan normally in summer and are visible only during the winter"],"a":[0,1,2],"r":"Tinea versicolor ranges from hypopigmented in dark-skinned individuals to hyperpigmented (salmon-colored to brown) in light-skinned individuals; the lesions do not tan in summer and become relatively darker in winter. Both color variants are caused by the same Malassezia organism, not separate species. Hypopigmentation is not scarring, since repigmentation occurs over several months, and lesions do not tan in summer, which is why they appear lighter as surrounding skin tans."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 17-year-old with known facial and scalp seborrheic dermatitis now has erythematous, greasy, scaling patches in the axillae and groin. KOH preparation is negative for hyphae. Which management is most appropriate?","o":["Apply the same regimen used for the face, such as daily ketoconazole 2% plus intermittent low-potency steroid","Apply the same regimen used for the face, such as daily ketoconazole 2% plus daily high-potency steroid","Prescribe oral terbinafine for 2 weeks, because skinfold seborrhea requires systemic therapy","Prescribe oral fluconazole 400 mg once, because skinfold seborrhea requires systemic therapy"],"a":[0],"r":"For body and skinfold seborrheic dermatitis, the same regimens used elsewhere, such as daily ketoconazole 2% with intermittent low-potency corticosteroids, can be used on the body. High-potency steroids in intertriginous skin risk atrophy and striae because occlusion increases absorption. Systemic antifungals are not required for skinfold seborrhea, and terbinafine has poor activity against Malassezia."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 3-year-old is brought in on day 2 of fever to 39.2\u00b0C, drooling, and refusing to drink. Exam shows grouped vesicles on an erythematous base and shallow ulcers with white plaques. Which additional findings are most consistent with primary HSV-1 gingivostomatitis? Select all that apply.","o":["Ulcers on the anterior gingiva, tongue, and lips that extend onto the chin","Noticeable halitosis accompanied by tender cervical lymphadenopathy","Swollen, friable gingiva together with perioral vesicles in the nasolabial folds","Ulcers confined to the soft palate and tonsillar pillars with the gingiva spared","A single cluster of tense vesicles on one side of the lower vermilion border","Ulcers of the posterior pharynx alone, with no lesions anterior to the uvula"],"a":[0,1,2],"r":"Primary HSV-1 gingivostomatitis causes vesicles that ulcerate and form white plaques on the mucosa, gingiva, tongue, palate, lips, chin, and nasolabial folds, with lymphadenopathy and halitosis. Lesions limited to the soft palate, tonsillar pillars, or posterior pharynx with the gingiva spared (D, F) point to herpangina (coxsackievirus), which is on the differential. A single unilateral cluster on the vermilion border (E) is classic recurrent herpes labialis, not primary gingivostomatitis."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 13-year-old reports a \"cold sore\" that returns a few times a year after sun exposure. Which exam finding is most typical of recurrent herpes labialis?","o":["A cluster of small, clear, tense vesicles on an erythematous base on the hard palate and the tongue","A cluster of small, clear, tense vesicles on an erythematous base spread symmetrically across both lips","A cluster of small, clear, tense vesicles on an erythematous base on one side of the vermilion border","A cluster of small, clear, tense vesicles on an erythematous base on the buccal mucosa and gingiva"],"a":[2],"r":"Classic herpes labialis is a cluster of small, clear, tense vesicles on an erythematous base that becomes weepy, ulcerates, then crusts, usually on only one side of the mouth on the vermilion border. Bilateral, symmetric lip involvement (B) is not typical of a recurrence. Lesions on the gingiva, buccal mucosa, palate, or tongue (D, A) fit primary gingivostomatitis or aphthous ulcers, not a recurrent cold sore."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"The FNP is reviewing several children with HSV infection seen in clinic today. Per the source, which children call for consultation with or referral to another provider instead of routine primary care management? Select all that apply.","o":["A 10-day-old with a cluster of vesicles on the scalp at the site of a fetal monitor electrode","A 6-year-old with grouped vesicles directly on the upper eyelid margin of the right eye","A 9-year-old with recurrent labialis on the lower lip after a 24-hour tingling prodrome","A 4-year-old with atopic dermatitis whose flexural eczema now has clustered, punched-out erosions","A 3-year-old with gingivostomatitis on day 3 who is drinking well and has good urine output","A 7-year-old receiving maintenance chemotherapy who has new vesicles on the lower lip"],"a":[0,1,3,5],"r":"The source lists the newborn, the immunosuppressed child, the child with infected atopic dermatitis (here, probable eczema herpeticum), and the child with a lesion in the eye or on the eyelid margin as needing consultation or referral. A healthy school-age child with recurrent labialis (C) and a well-hydrated preschooler with uncomplicated gingivostomatitis (E) can be managed in primary care with supportive care."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A Tzanck smear is ordered for fluid unroofed from a 15-year-old's genital vesicle, and the adolescent wants to know whether the infection is \"type 1 or type 2.\" Which statement about this test is accurate?","o":["It identifies epidermal giant cells and can distinguish HSV-1 from HSV-2 by their size","It identifies epidermal giant cells but cannot distinguish HSV-1 from HSV-2 infection","It identifies epidermal giant cells and, if it is negative, rules out HSV infection reliably","It identifies epidermal giant cells and can distinguish HSV-1 from HSV-2 by their location"],"a":[1],"r":"The Tzanck smear shows multinucleated epidermal giant cells, but it does not distinguish HSV-1 from HSV-2. In reality it also cannot tell HSV apart from VZV, and it has low sensitivity, so a negative smear does not rule out HSV (C). Typing requires viral culture or PCR; giant-cell size or location (A, D) carries no information about type."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Parents ask about child care attendance during HSV infection. Which statements are consistent with the exclusion guidance in the source? Select all that apply.","o":["A toddler with primary gingivostomatitis who drools constantly should stay home for now","Exclusion for HSV applies only during the initial course, gingivostomatitis, if secretions are uncontrolled","A child with gingivostomatitis must stay home until every lesion is crusted, whatever the secretion control","A child with recurrent herpes labialis must stay home until the lesion is completely re-epithelialized","A child with gingivostomatitis may return 24 hours after the first dose of oral acyclovir is given","A child with a recurrent cold sore who controls secretions does not need exclusion from child care"],"a":[0,1,5],"r":"The source says to exclude from day care only during the initial course (gingivostomatitis) and only if the child cannot control secretions, so the drooling toddler stays home, and the child with a recurrent cold sore who controls secretions does not. \"Until crusted\" (C) is the varicella/zoster rule, not the HSV rule. There is no exclusion for recurrent labialis (D), and no \"24 hours after starting therapy\" return rule for HSV (E); that pattern comes from bacterial infections such as strep."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"An 18-month-old with primary gingivostomatitis is refusing fluids because of mouth pain. The parent asks for a \"magic mouthwash\" of liquid diphenhydramine and magnesium/aluminum hydroxide. Which plan best follows the source?","o":["Have the child swish and swallow a 1:1 mix, limiting diphenhydramine to 10 mg/kg/day","Have the child swish and spit a 1:1 mix, limiting diphenhydramine to 5 mg/kg/day","Dab a 1:1 mix onto lesions with a cotton swab, limiting diphenhydramine to 5 mg/kg/day","Dab a 1:1 mix onto lesions with a cotton swab, limiting diphenhydramine to 10 mg/kg/day"],"a":[2],"r":"Oral anesthetics must be used with caution because the child needs to be able to rinse and spit, which an 18-month-old cannot reliably do. The source therefore allows the 1:1 diphenhydramine and antacid mixture to be applied to lesions with cotton-tipped swabs, with diphenhydramine capped at 5 mg/kg/day in case it is swallowed. Swish-and-spit (B) is not realistic at this age, and 10 mg/kg/day (D, A) exceeds the stated maximum."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"For which patients does the source say oral acyclovir may be indicated for HSV infection? Select all that apply.","o":["A 6-year-old with moderate eczema who develops primary HSV lesions on the cheek","A 16-year-old with primary genital HSV who has fever, myalgias, and headache","A 5-year-old with leukemia in remission on maintenance therapy who has new oral HSV","A healthy 10-year-old with a mild recurrent cold sore that began 12 hours ago","A healthy 4-year-old with mild gingivostomatitis on day 6 who is drinking well","A healthy 14-year-old with a mild recurrent cold sore who has no systemic symptoms"],"a":[0,1,2],"r":"The source lists acyclovir for children with an underlying skin disorder such as eczema, an immunocompromising disease, or systemic symptoms with primary genital infection, and occasionally for initial severe gingivostomatitis. Mild recurrent labialis in a healthy child (D, F) is not on the list. The day-6 mild gingivostomatitis case (E) is neither severe nor within the 3-day window in which acyclovir works best."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A previously healthy 4-year-old has severe primary gingivostomatitis and poor oral intake. The FNP is considering oral acyclovir. According to the source, acyclovir is most effective when started within what time after disease onset?","o":["Within 48 hours of disease onset","Within 24 hours of disease onset","Within 5 days of disease onset","Within 3 days of disease onset"],"a":[3],"r":"The source states that acyclovir is most effective if started within 3 days of disease onset, which matches trial data for gingivostomatitis started within 72 hours. The 24- and 48-hour windows (B, A) are too strict and might lead the clinician to wrongly withhold therapy on day 3. Five days (C) is beyond the period of best benefit."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 2-year-old who sucks her thumb and was recently treated for gingivostomatitis now has a painful, swollen thumb tip. Which statements about herpetic whitlow are accurate? Select all that apply.","o":["It may resemble a paronychia, with a swollen, painful, erythematous base and ulceration","Vesicles on the involved finger often appear deep-seated rather than superficial","In young children it typically follows autoinoculation from oral gingivostomatitis","Incision and drainage of the vesicles is first-line care to speed resolution","It typically presents as a pus-filled nail-fold abscess that follows manicure trauma","In adolescents it is associated with autoinoculation from genital HSV infection"],"a":[0,1,2,5],"r":"Herpetic whitlow is a swollen, painful lesion with an erythematous base and ulceration resembling a paronychia, with deep-appearing vesicles. It occurs in thumb-sucking children with gingivostomatitis and in adolescents with genital HSV. Incision and drainage (D) is contraindicated because it can spread the virus and add bacterial infection. A pus-filled nail-fold abscess after trauma (E) describes bacterial paronychia."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 15-year-old with known genital HSV has a painful fingertip with grouped, deep-appearing vesicles on an erythematous base that started 2 days ago. Which plan is most appropriate?","o":["Avoid incising the vesicles, and consider oral acyclovir to speed healing of the finger","Unroof and drain the vesicles, then start oral acyclovir to speed healing of the finger","Unroof and drain the vesicles, then start oral dicloxacillin as primary therapy for the finger","Avoid incising the vesicles, and start oral dicloxacillin as primary therapy for the finger"],"a":[0],"r":"This is herpetic whitlow. The source states that oral acyclovir may speed healing, and standard guidance warns against incision and drainage because it can spread the infection and invite bacterial superinfection. Antistaphylococcal antibiotics such as dicloxacillin (D, C) are for proven secondary bacterial infection, not primary treatment of a viral lesion."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"When teaching the parents of a 3-year-old with primary gingivostomatitis about the expected course and recurrences, which statements match the source? Select all that apply.","o":["Fever with the primary infection may last up to 4 days","The lesions of the primary infection take at least 2 weeks to heal","Lesions stay contagious only until the fever has fully resolved","Triggers for recurrence can include UV light, fever, stress, and menses","Fever with the primary infection commonly lasts up to 10 days","The lesions of the primary infection typically heal within 5 days"],"a":[0,1,3],"r":"The source says to explain that fever in primary disease lasts up to 4 days and that lesions take at least 2 weeks to heal. Triggers include physical and psychological stress, trauma, fever, UV light, illness, menses, and extreme weather. Lesions stay contagious as long as they are present, not just until the fever breaks (C). A 10-day fever (E) and 5-day healing (F) misstate the course."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 4-year-old develops primary gingivostomatitis. The parent asks when the child was most likely exposed to the cousin who had an active cold sore. Which incubation period does the source give for HSV?","o":["2 to 7 weeks","10 to 21 days","1 to 3 days","2 to 12 days"],"a":[3],"r":"The source gives an HSV incubation period of 2 to 12 days. The 10- to 21-day range (B) is the varicella incubation period, and 2 to 7 weeks (A) is the molluscum contagiosum incubation period from the same chapter. One to 3 days (C) is too short and too narrow."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Which conditions does the source name as complications of, or conditions linked to, HSV infection in children? Select all that apply.","o":["Eczema herpeticum (Kaposi varicelliform eruption)","Erythema multiforme","Stevens-Johnson syndrome","Secondary staphylococcal skin infection","Postherpetic neuralgia in most affected children","Reye syndrome caused directly by the HSV infection"],"a":[0,1,2,3],"r":"The source lists eczema herpeticum (Kaposi varicelliform eruption) as a complication. It also implicates HSV as a possible cause of erythema multiforme and SJS, and it gives antibiotic regimens for secondary bacterial infection, usually staphylococcal. Postherpetic neuralgia (E) belongs to zoster, and the source calls it rare in children. Reye syndrome (F) is linked to giving salicylates during viral illnesses such as varicella and influenza; HSV does not cause it directly."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 17-year-old male with previously confirmed genital HSV-2 comes in with a recurrence. According to the source, recurrent HSV-2 lesions in males most typically appear on which sites?","o":["The prepuce, glans, or sulcus","The penile shaft and perineum","The perianal skin and buttocks","The scrotum and the inner thighs"],"a":[0],"r":"The source places recurrent HSV-2 lesions in males on the prepuce, glans, or sulcus, and describes them as generally less severe than primary lesions. The penile shaft and perineum (B) are the sites listed for primary lesions in males, which makes A the main distractor. Scrotal, thigh, perianal, and buttock sites (D, C) are not the typical recurrence sites given."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 16-year-old female has her first episode of genital HSV-2. Which findings are consistent with the primary infection as described in the source? Select all that apply.","o":["Grouped vesicopustules and ulcerations with surrounding edema","Lesions on the vaginal mucosa, labia, or perineum","Possible cervical involvement in addition to external lesions","Regional (inguinal) lymphadenopathy","A single painless, indurated ulcer with a clean base","Lesions milder than those expected with later recurrences"],"a":[0,1,2,3],"r":"Primary HSV-2 shows grouped vesicopustules and ulceration with edema on the vaginal mucosa, labia, or perineum in females, possible cervical involvement, and regional lymphadenopathy. A single painless, indurated, clean-based ulcer (E) suggests a primary syphilis chancre. The source says recurrent lesions are generally less severe than primary ones, so F reverses the relationship."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 5-year-old's healing herpes labialis lesion has developed honey-colored crusting consistent with secondary staphylococcal infection. The infection is localized. According to the HSV section of the source, which topical regimen is appropriate?","o":["Mupirocin applied once a day for 5 days","Mupirocin applied three times a day for 5 days","Mupirocin applied three times a day for 10 days","Mupirocin applied twice a day for 10 days"],"a":[1],"r":"For secondary bacterial infection of HSV lesions, the source lists topical mupirocin three times a day for 5 days. The other options change only the frequency or the duration, and none matches the stated regimen. Ten days (D, C) is the length of the systemic erythromycin and dicloxacillin courses listed for HSV, not the mupirocin course."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 15-year-old has had six painful, extensive episodes of herpes labialis in the past year that cause missed school. Which statements about prevention are consistent with the source? Sele
