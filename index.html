ct all that apply.","o":["Frequent, severe recurrences like these may be treated with acyclovir prophylaxis","The prophylaxis course described in the source lasts 6 months","Counseling should cover triggers such as UV exposure, stress, and extreme weather","The prophylaxis course described in the source lasts 6 weeks","Prophylaxis is advised after any first episode of labialis, even a mild one","Prophylaxis eliminates the latent virus from the sensory ganglia permanently"],"a":[0,1,2],"r":"The source states that recurrent, frequent, and severe HSV infection may be treated with acyclovir prophylaxis for 6 months, and that education should cover triggers and how to avoid them. Six weeks (D) gets the duration wrong. Prophylaxis is reserved for frequent and severe recurrences, not a single mild episode (E). Antivirals suppress replication but do not clear latent virus from nerve cells (F)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 10-year-old with occasional mild cold sores asks for an over-the-counter topical antiviral cream \"like my mom uses.\" Which statement reflects the source?","o":["Most topical antivirals are not approved for children under 6 years old","Most topical antivirals are not approved for children under 2 years old","Most topical antivirals are not approved for children under 12 years old","Most topical antivirals are not approved for children under 18 years old"],"a":[2],"r":"The source says topical antivirals may help for initial genital herpes and recurrent herpes labialis but that most are not approved for children under 12. A 10-year-old is therefore below the approved age for most products. The 2-, 6-, and 18-year cutoffs (B, A, D) are wrong; agents such as docosanol and penciclovir are labeled for ages 12 and older."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 14-year-old comes in on the first morning of a suspected recurrent HSV lesion on the lip. Which historical features are most consistent with a recurrent episode rather than a primary one? Select all that apply.","o":["Burning, tingling, and itching at the same lip site in the hours before vesicles appeared","Paresthesia at the involved site that came before the visible eruption","A recent acute febrile illness or a beach weekend with significant sun exposure","High fever, malaise, sore throat, and markedly reduced fluid intake for 3 days","About 1 week of burning pain and touch sensitivity in a band before the vesicles"],"a":[0,1,2],"r":"Recurrent HSV often starts with a painful prodrome of burning, tingling, paresthesia, and itching at the site, and a recent febrile illness or sun exposure may be reported. Fever, malaise, sore throat, and reduced intake (D) describe primary infection. A week-long prodrome of hyperesthesia in a band (E) is the herpes zoster prodrome."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 16-year-old is upset to learn that a viral PCR of a genital lesion shows HSV-1. She says she thought \"type 1 only causes cold sores.\" Which response is accurate?","o":["HSV-1 is found only on the lips and mouth, so the PCR result most likely reflects contamination","HSV-1 can also be found in the genital area, and HSV-2 can be found on the lips and mouth","HSV-1 can also be found in the genital area, but HSV-2 is never found on the lips and mouth","HSV-2 can be found on the lips and mouth, but HSV-1 is never found in the genital area"],"a":[1],"r":"HSV-1 usually affects the oral mucosa, pharynx, lips, and eyes, and HSV-2 usually causes neonatal and genital infection. The source states clearly, however, that type 1 can be found in the genital area and type 2 on the lips and mouth. Each distractor wrongly makes one or both viruses site-exclusive."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Which statements correctly contrast primary and recurrent HSV infection, according to the source? Select all that apply.","o":["Primary infection occurs in people who have no circulating HSV antibodies","Primary lesions usually occur before 5 years of age","Primary lesions are typically more painful and extensive and last longer","Recurrence occurs only in people whose first infection was clinically evident","Primary lesions are typically milder and shorter than recurrent lesions","Primary lesions usually occur after 10 years of age, during early adolescence"],"a":[0,1,2],"r":"Primary infection occurs in people without circulating antibodies after contact with infected secretions or lesions. Primary lesions usually occur before age 5 and are more painful, more extensive, and longer lasting. Recurrence can follow either a clinical or a subclinical first infection (D is wrong). E reverses the severity relationship, and F gets the age wrong."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 7-year-old has crusting, weepy herpes facialis lesions on the cheek. The FNP recommends Burow solution (aluminum acetate) compresses for comfort. Which frequency does the source specify?","o":["Three times daily","Twice daily","Every 2 hours while awake","Once daily, at bedtime"],"a":[0],"r":"The source recommends Burow solution compresses three times a day to relieve discomfort, for both HSV and herpes zoster. The other frequencies are not the source recommendation. Very frequent wet compresses (C) can also over-macerate the skin."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 2-year-old with primary gingivostomatitis is mildly dehydrated but tolerating small sips. Which supportive measures are appropriate? Select all that apply.","o":["Acetaminophen for fever and mouth pain, dosed by weight","Frequent small amounts of cool, nonacidic fluids to maintain hydration","Gentle oral hygiene with a soft cloth or soft toothbrush as tolerated","Aspirin for fever, since salicylates also reduce oral inflammation","Viscous lidocaine 2% given as a swish-and-swallow before each feeding"],"a":[0,1,2],"r":"The source recommends supportive care with antipyretics, analgesics, hydration, and good oral hygiene. Aspirin (D) is avoided in children with viral illness because of the risk of Reye syndrome. Viscous lidocaine (E) should be used with caution only in children who can rinse and spit, and swallowing it risks toxicity and an impaired gag reflex in a toddler."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 6-year-old has a cluster of vesicles on the margin of the left upper eyelid, with mild tearing. Visual acuity is normal. Which action is most appropriate?","o":["Prescribe a topical corticosteroid\u2013antibiotic eye drop and recheck the child in 48 hours","Begin Burow compresses three times a day and refer only if visual acuity worsens","Consult with or refer to ophthalmology the same day for evaluation of possible ocular HSV","Prescribe topical acyclovir cream for the eyelid and recheck the child in 1 week"],"a":[2],"r":"The source says that a child with an HSV lesion in the eye or on the eyelid margin should be referred to, or managed in consultation with, an appropriate provider. Herpetic keratoconjunctivitis threatens vision even when acuity is still normal, so waiting for a decline (B) is unsafe. Topical corticosteroids (A) can worsen HSV keratitis. A topical cream with a 1-week recheck (D) delays the eye exam that is needed."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 3-year-old with poorly controlled atopic dermatitis develops many uniform, punched-out erosions and vesicles over the eczematous antecubital and facial skin, with fever. Which actions are appropriate? Select all that apply.","o":["Consult with or refer to an appropriate provider promptly","Anticipate systemic acyclovir, since an underlying skin disorder is an indication","Obtain viral testing of a vesicle to confirm HSV while treatment is arranged","Move up to a high-potency topical corticosteroid to settle the inflamed skin","Treat with topical mupirocin alone and reassess the child in 1 week"],"a":[0,1,2],"r":"This picture suggests eczema herpeticum. The source calls for referral or consultation for a child with infected atopic dermatitis and lists an underlying skin disorder such as eczema as an indication for acyclovir. Confirmatory viral testing is reasonable but should not delay treatment. Stepping up to a potent steroid (D) can worsen viral spread. Mupirocin alone (E) treats only bacterial superinfection and leaves the HSV infection untreated."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A healthy, unvaccinated 4-year-old has a dermatomal vesicular eruption on the left chest. Which history most increases this child's risk of herpes zoster, according to the source?","o":["A sibling with active zoster 2 weeks ago","Mild wild-type varicella at 3 years of age","Varicella vaccination at 12 months of age","Mild wild-type varicella at 8 months of age"],"a":[3],"r":"The source says herpes zoster is more common after mild varicella before 1 year of age, with a threefold to twentyfold higher risk, and in immunocompromised children. Wild-type varicella at age 3 (B) does not carry this added risk. Vaccination (C) carries a lower zoster risk than wild-type infection. Contact with someone who has zoster (A) can transmit varicella to a nonimmune child, but it does not cause zoster, which is reactivation of latent virus."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 12-year-old has a painful eruption on the right side of the trunk. Which findings support herpes zoster? Select all that apply.","o":["Two or three clustered groups of vesicles on an erythematous base","Sharp demarcation of the lesions at the anterior and posterior midline","A few scattered vesicles outside the main dermatome on that side","Enlarged, tender regional lymph nodes in the axilla on the same side","A symmetric band of vesicles that crosses the midline onto the left chest","Generalized crops of lesions at all stages, mostly on the trunk and scalp"],"a":[0,1,2,3],"r":"Zoster presents as two or three clustered groups of lesions that progress to vesicles on an erythematous base. The lesions do not cross the midline, which is the key to diagnosis, and they show sharp midline demarcation, with occasional scattered lesions outside the dermatome and possible lymphadenopathy. A symmetric band crossing the midline (E) argues against zoster. Generalized crops at all stages on the trunk and scalp (F) describe primary varicella."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"According to the source, herpes zoster lesions in children most commonly follow which dermatomes?","o":["Second cervical to second lumbar, plus cranial nerves IX to XII","First thoracic to second sacral, plus cranial nerves III to V","Second cervical to second lumbar, plus cranial nerves V to VII","Fifth cervical to fifth lumbar, plus cranial nerves VII to IX"],"a":[2],"r":"The source says lesions commonly follow the dermatomes of the second cervical to the second lumbar nerves and the fifth to seventh cranial nerves. Option A has the correct spinal range but the wrong cranial nerves. Options B and D shift both ranges. CN V (trigeminal, including the ophthalmic branch) and CN VII (facial, as in Ramsay Hunt syndrome) explain why the face and eye are clinically important."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A healthy 8-year-old has uncomplicated thoracic herpes zoster on day 2. Which measures are part of the recommended management? Select all that apply.","o":["Burow solution compresses three times a day","An oral antihistamine for itching","A petrolatum ointment to moisturize the lesions","Acetaminophen for discomfort","Aspirin for discomfort and fever","Routine oral acyclovir, as for every child"],"a":[0,1,2,3],"r":"Zoster management includes Burow compresses three times a day, warm baths, antihistamines for itch, analgesics, and an ointment such as Aquaphor or Vaseline to moisturize and reduce itching. The source says not to use salicylates (E). It also states that antivirals are not recommended for all children with zoster (F); they are reserved for specific indications."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"The parent of a 9-year-old with herpes zoster asks why aspirin should not be used for pain. What is the primary reason salicylates are avoided?","o":["Salicylates in varicella-zoster infection are associated with erythema multiforme","Salicylates in varicella-zoster infection are associated with Reye syndrome","Salicylates in varicella-zoster infection are associated with postherpetic neuralgia","Salicylates in varicella-zoster infection are associated with eczema herpeticum"],"a":[1],"r":"The source tells clinicians not to use salicylates in herpes zoster. The reason is the established link between salicylate use during varicella-zoster (and influenza) infection and Reye syndrome, an acute encephalopathy with liver failure. Erythema multiforme (A) is linked to HSV, eczema herpeticum (D) is a complication of HSV or VZV in eczematous skin, and postherpetic neuralgia (C) is unrelated to salicylates."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"For which children with herpes zoster does the source say acyclovir may be useful? Select all that apply.","o":["A 7-year-old receiving chemotherapy for acute lymphoblastic leukemia","A 13-year-old with zoster in the V1 distribution and a red, painful eye","A 15-year-old with ear vesicles and ipsilateral facial nerve weakness","A healthy 6-year-old with mild lumbar zoster seen on day 2 of the rash","A healthy 11-year-old with single-dermatome thoracic zoster and itching","A healthy 14-year-old who wants to return to school sooner than expected"],"a":[0,1,2],"r":"The source says antivirals are not recommended for all children with zoster. Acyclovir may be useful for children who are immunosuppressed, have ocular herpes, or have Ramsay Hunt syndrome (ear vesicles with facial palsy). Healthy children with uncomplicated single-dermatome disease (D, E) need supportive care. Wanting to return to school sooner (F) is not an indication, and school attendance depends on whether lesions can be covered."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 10-year-old has vesicles on the right forehead and on the tip of the nose. The conjunctiva looks quiet and the child reports no visual change. What is the most appropriate next step?","o":["Start Burow compresses and refer for ophthalmology at the routine 2-week follow-up visit","Refer for ophthalmologic examination only if eye redness or visual change develops","Recheck the child in 48 hours and refer for ophthalmology if new lesions reach the eyelid","Refer for immediate ophthalmologic examination because the forehead and nose are involved"],"a":[3],"r":"The source says to refer for immediate ophthalmologic examination if the eyes, forehead, or nose is involved. Involvement of the nasal tip (Hutchinson sign, nasociliary branch of V1) predicts ocular involvement even when the eye looks normal. Waiting for symptoms (B), rechecking in 48 hours (C), or deferring to a routine visit (A) all delay a referral that should happen now."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A healthy 9-year-old has thoracic zoster with vesicles that are not yet crusted. Which statements about school attendance and contagion are accurate? Select all that apply.","o":["If the lesions can be fully covered, the child does not need to be excluded from school","If the lesions cannot be covered, the child should avoid contact until they are crusted","Nonimmune classmates exposed to the lesions may develop varicella, not zoster","The child must be excluded for 24 hours after the first dose of oral acyclovir","The child must be excluded for 2 full weeks, whatever the lesion coverage","Nonimmune classmates exposed to the lesions most often develop zoster themselves"],"a":[0,1,2],"r":"The child is contagious for varicella until the lesions are crusted. If the lesions can be covered, exclusion from school or child care is unnecessary; if not, the child should avoid contact until crusting. Exposed nonimmune contacts develop primary varicella, not zoster (F is wrong). There is no 24-hour post-antiviral rule (D) and no fixed 2-week exclusion (E)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"The parent of an 11-year-old with newly diagnosed zoster asks how long the rash will last. Which response matches the education points in the source?","o":["New vesicles may appear for up to 1 week, and the rash takes 2 to 3 weeks to resolve","New vesicles may appear for up to 2 weeks, and the rash takes 4 to 6 weeks to resolve","New vesicles may appear for up to 1 week, and the rash takes 4 to 6 weeks to resolve","New vesicles may appear for up to 3 days, and the rash takes 7 to 10 days to resolve"],"a":[0],"r":"The source states that new vesicles appear for up to 1 week and take 2 to 3 weeks to resolve, and that the illness is usually mild. Option C has the correct 1-week eruption period but an exaggerated resolution time. Option D understates both numbers, and C overstates both."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Which statements about complications of herpes zoster in children are consistent with the source? Select all that apply.","o":["Complications are rare except in immunocompromised children","Postherpetic neuralgia, a delayed chronic pain, is rare in children","Eczema herpeticum may occur as a complication","Postherpetic neuralgia develops in about one-third of affected children","Lesions crossing the midline are expected in healthy children"],"a":[0,1,2],"r":"The source says complications are rare except in immunocompromised children, that postherpetic neuralgia is rare in children, and that eczema herpeticum may occur. Postherpetic neuralgia is mainly a problem in older adults, so a one-third rate in children (D) is wrong. Lesions do not cross the midline in zoster (E); widespread or bilateral disease suggests dissemination or another diagnosis."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A healthy 13-year-old has a 3-day history of grouped vesicles on an erythematous base in a single right T8 dermatome, sharply stopping at the midline, after a few days of burning pain. What is the most appropriate diagnostic approach?","o":["Make a clinical diagnosis without laboratory testing","Confirm with a Tzanck smear before starting care","Confirm with VZV serology before starting care","Confirm with a bacterial culture before starting care"],"a":[0],"r":"The source states that the diagnosis of herpes zoster is clinical, and this presentation is classic: a prodrome, then clustered vesicles in one dermatome that respect the midline. Laboratory testing is for unclear cases. Bacterial culture (D) is used to distinguish zoster from impetigo, which this presentation does not resemble. Serology (C) does not help confirm an acute episode, and a Tzanck smear (B) is not required."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Herpes zoster in children must be told apart from local cutaneous HSV infection and impetigo. Which statements about this differential are accurate? Select all that apply.","o":["A bacterial culture or Gram stain can help separate impetigo from zoster","Honey-colored crusts without a dermatomal pattern suggest impetigo","Viral PCR or culture of vesicle fluid can separate VZV from HSV","A Tzanck smear's giant cells reliably separate VZV from HSV infection","Strict sparing of the face and scalp is required to diagnose zoster"],"a":[0,1,2],"r":"The source names local cutaneous HSV infection and impetigo as the differentials and says bacterial culture or Gram stain can distinguish impetigo. Impetigo shows honey-colored crusts that do not follow a dermatome. Viral culture or PCR identifies the virus. Although the source suggests a Tzanck smear can help, both HSV and VZV produce multinucleated giant cells, so the Tzanck smear cannot reliably tell them apart (D). Zoster commonly involves cranial nerve V to VII dermatomes on the face (E is wrong)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 15-year-old has 5 days of burning, stinging pain and sensitivity to light touch in a band around the left side of the chest. There is no rash, and the cardiopulmonary exam is normal. Which explanation is most likely?","o":["A herpes simplex prodrome, which can come about 1 week before the eruption","A herpes zoster prodrome, which can come about 1 week before the eruption","A herpes zoster prodrome, which can come only within 24 hours of the eruption","A herpes simplex prodrome, which can come only within 24 hours of the eruption"],"a":[1],"r":"In herpes zoster, burning or stinging pain, tenderness to light touch, hyperesthesia, or tingling comes about 1 week before the eruption, although this prodrome is less common in children. The unilateral band-like distribution fits a dermatome. The HSV prodrome (A, D) is localized burning or tingling at a recurrence site that usually lasts hours. A zoster prodrome limited to 24 hours (C) gets the timing wrong."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 10-year-old with herpes zoster on the flank develops spreading erythema and purulent crusting around several lesions. Which statements about treating the secondary infection are accurate? Select all that apply.","o":["The usual organism in secondary infection of zoster lesions is staphylococcal","Oral dicloxacillin 12.5 to 25 mg/kg/day for 7 to 10 days is one listed option","Topical mupirocin is an option for localized secondary bacterial infection","Oral dicloxacillin 12.5 to 25 mg/kg/day for 3 days is one listed option","Systemic antibiotics should be given to all children with zoster as prophylaxis","The usual organism in secondary infection of zoster lesions is a gram-negative rod"],"a":[0,1,2],"r":"The source lists antibiotics for secondary bacterial infection, usually staphylococcal: topical mupirocin, or dicloxacillin 12.5 to 25 mg/kg/day for 7 to 10 days. Option D has the right dose but too short a course. Antibiotics are for established secondary infection, not routine prophylaxis (E). Gram-negative organisms (F) are not the usual cause."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 14-year-old has painful vesicles in the right external auditory canal and on the pinna, with new weakness of the right side of the face. Which management decision follows the source?","o":["Give topical mupirocin, because ear-canal vesicles in this pattern are usually staphylococcal","Give supportive care only, because antivirals are not recommended for most children with zoster","Give acyclovir, because Ramsay Hunt syndrome is one of the listed indications for antivirals","Hold any treatment until viral culture confirms VZV, because the diagnosis is not yet clinical"],"a":[2],"r":"Ear-canal vesicles with ipsilateral facial nerve palsy are Ramsay Hunt syndrome, reactivation of VZV in the geniculate ganglion of CN VII. The source lists it with immunosuppression and ocular herpes as indications for acyclovir. Supportive care alone (B) applies to uncomplicated disease in healthy children, mupirocin (A) is for bacterial infection, and holding treatment for a culture (D) wastes the time in which treatment works best."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Which epidemiologic statements about herpes zoster are consistent with the source? Select all that apply.","o":["Herpes zoster occurs in about 10% to 20% of all individuals","Herpes zoster is rare in childhood and rises in frequency with age","It is about three times more common in adolescents than in preschoolers","It is about three times more common in preschoolers than in adolescents","Zoster after vaccine-strain virus is more common than after wild-type virus"],"a":[0,1,2],"r":"The source says herpes zoster occurs in 10% to 20% of all individuals, is rare in childhood, becomes more frequent with age, and is three times more common in adolescents than in preschoolers. Option D reverses that ratio. Vaccinated children have a lower zoster risk than children who had wild-type infection (E is wrong)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 12-year-old's zoster lesions were first noticed as clustered red papules. Which description best matches the expected evolution and timing in the source?","o":["Papules become vesicles, then pustules that rupture and crust; lesions develop over 3 to 5 days and last 3 to 4 weeks","Papules become vesicles, then pustules that rupture and crust; lesions develop over 1 to 2 days and last 3 to 5 days","Papules become bullae, then flaccid erosions that crust; lesions develop over 3 to 5 days and last 7 to 10 days","Papules become vesicles, then pustules that rupture and crust; lesions develop over 3 to 5 days and last 7 to 10 days"],"a":[3],"r":"The source describes clustered macules and papules that progress to vesicles on an erythematous base, then become pustular, rupture, ulcerate, and crust. The lesions develop over 3 to 5 days and last 7 to 10 days. Options B and A change the timing. Option C describes a bullous morphology that is more typical of bullous impetigo."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"The FNP is educating the family of a healthy 10-year-old with herpes zoster. Which teaching points are accurate? Select all that apply.","o":["The illness is usually mild in otherwise healthy children","The child stays contagious until lesions stop erupting and are crusted","Varicella vaccination is the measure the source names for preventing zoster","The child is contagious only during the prodrome, before the rash appears","Once new vesicles stop appearing, the child is no longer contagious","The child can give shingles directly to a nonimmune sibling"],"a":[0,1,2],"r":"The source says zoster is usually mild, that the child is contagious until lesions stop erupting and are crusted over, and it names the varicella vaccine for prevention. Contagion is linked to the lesions, not the prodrome (D). It continues after new vesicles stop until the existing ones crust (E). A nonimmune sibling exposed to zoster would develop varicella, not shingles (F)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 7-year-old with no known medical history has zoster lesions in three separate, noncontiguous dermatomes (right T4, left T10, and right L1). Besides symptom management, what is the most important next step?","o":["Reassure the family that multidermatomal disease is typical in children with zoster","Reassure the family and evaluate for immunodeficiency only if the zoster recurs within a year","Evaluate for underlying immunodeficiency only if postherpetic neuralgia develops after healing","Evaluate for underlying immunodeficiency, including HIV, because of the multidermatomal disease"],"a":[3],"r":"The source notes that zoster is occasionally the first sign of AIDS, especially when more than one dermatome is involved. Complications cluster in immunocompromised children, so this child needs an immunodeficiency evaluation now. Multidermatomal disease is not typical (A). Waiting for postherpetic neuralgia (C) or a recurrence (B) delays a diagnosis that could change management."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"Which statements correctly contrast herpes simplex and herpes zoster in children, according to the source? Select all that apply.","o":["Zoster lesions follow a dermatome and do not cross the midline; HSV lesions are not tied to a dermatome","HSV exclusion depends on secretion control during gingivostomatitis; zoster exclusion depends on whether lesions can be covered","Both conditions use Burow solution compresses three times a day for local comfort","Acyclovir is given routinely to every child with HSV, but only to selected children with zoster","Recurrent HSV and zoster both typically come with a prodrome lasting about 1 week"],"a":[0,1,2],"r":"Zoster follows a dermatome with a sharp midline boundary, whereas HSV clusters at sites such as the lips, fingers, and face. HSV exclusion applies only during gingivostomatitis if secretions are uncontrolled, while zoster exclusion depends on whether lesions can be covered until crusted. Burow compresses three times a day are listed for both. Acyclovir is selective for HSV as well (D is wrong). The HSV prodrome lasts hours, whereas the zoster prodrome lasts about a week (E is wrong)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"The parent of a 6-year-old with herpes zoster says the child also has nausea, and lists the over-the-counter products at home. Which product should the FNP specifically advise the parent to avoid?","o":["Plain petrolatum ointment","Bismuth subsalicylate liquid","Diphenhydramine oral liquid","Acetaminophen oral suspension"],"a":[1],"r":"The source says not to use salicylates in herpes zoster because of the risk of Reye syndrome. Bismuth subsalicylate (Pepto-Bismol) is a salicylate that parents often don't recognize as one. Acetaminophen (D) is an appropriate analgesic, antihistamines (C) are recommended for itch, and petrolatum ointment (A) is recommended to moisturize lesions."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 9-year-old receiving induction chemotherapy for leukemia develops a vesicular eruption in the left T6 dermatome. Which actions are appropriate? Select all that apply.","o":["Coordinate care promptly with the child's oncology team","Anticipate antiviral therapy, since immunosuppression is an indication","Watch closely for spread beyond the dermatome and for visceral illness","Give supportive care only, as for most healthy children with zoster","Use aspirin for pain to avoid acetaminophen masking a fever"],"a":[0,1,2],"r":"The source reserves acyclovir for children who are immunosuppressed, have ocular herpes, or have Ramsay Hunt syndrome, and it notes that complications are rare except in immunocompromised children. This child therefore needs antiviral therapy, close monitoring for dissemination, and prompt coordination with oncology. Supportive care alone (D) is for healthy children. Salicylates (E) are contraindicated in zoster."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A parent whose 10-year-old has shingles asks whether the younger, unvaccinated sibling can be protected from getting shingles later in life. Which response is most accurate?","o":["Varicella vaccination lowers later zoster risk compared with wild-type chickenpox infection","Varicella vaccination raises later zoster risk compared with wild-type chickenpox infection","Varicella vaccination should be withheld from siblings of any child with active zoster","Varicella vaccination does not change later zoster risk compared with wild-type chickenpox"],"a":[0],"r":"The source lists the varicella vaccine as the preventive measure for zoster. Vaccine-strain virus can reactivate, but vaccinated children have a much lower zoster incidence than children who had wild-type varicella. Options B and D misstate this, and a sibling's active zoster is not a reason to withhold the vaccine from a healthy child (C)."},{"t":"Herpes & Shingles","l":3,"s":true,"q":"A 5-year-old has an atypical vesicular eruption on the buttock, and the FNP is unsure whether it is zoster, HSV, or impetigo. Which diagnostic choices are appropriate? Select all that apply.","o":["A DFA stain of scrapings from the base of a vesicle, which gives timely results","A PCR of fluid or scrapings from an unroofed vesicle to identify VZV or HSV","A bacterial culture or Gram stain of the lesion to evaluate for impetigo","A single serum VZV IgG level to confirm that this episode is acute zoster","A sample of intact dry crust only, since vesicle-base samples are less reliable"],"a":[0,1,2],"r":"For the hard-to-diagnose case, the source recommends a DFA stain of vesicle-base scrapings, with timely results. Bacterial culture or Gram stain distinguishes impetigo. PCR of vesicle fluid or base scrapings is the most sensitive current test for VZV and HSV. A positive IgG (D) shows past infection and cannot confirm an acute episode. Unroofed vesicles and vesicle-base scrapings give better yield than dry crust (E is wrong)."},{"t":"Herpes & Shingles","l":3,"s":false,"q":"A 12-year-old has a third episode in 8 months of grouped vesicles on an erythematous base at the same spot on the right buttock, each healing within about 10 days. Which diagnosis is most likely?","o":["Recurrent herpes zoster, since zoster commonly recurs at the same site","Recurrent impetigo, since grouped vesicles at one site suggest bacteria","Recurrent HSV infection, since repeated eruptions at one site suggest HSV","Recurrent herpes zoster, since buttock lesions follow a sacral dermatome"],"a":[2],"r":"HSV becomes dormant in nerve cells and reactivates repeatedly at or near the same site, so repeated eruptions in one location over months are typical of recurrent HSV. Zoster rarely recurs in immunocompetent children, so repeated \"zoster\" at one site should raise suspicion for zosteriform HSV (A, D). Grouped vesicles on an erythematous base that recur at one spot are not the pattern of impetigo (B), which shows honey-colored crusts."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 5-year-old with mild atopic dermatitis has had \"little bumps\" for 2 months that itch occasionally. The mother notes new ones appear where he scratches. Which examination findings are consistent with molluscum contagiosum? Select all that apply.","o":["Firm, flesh-colored to pink discrete papules measuring 1 to 6 mm with central umbilication","Clustered papules concentrated in the antecubital and popliteal fossae","Discrete firm papules scattered across the palms and soles","Papules arranged in a linear configuration along a scratch line","Scaly, irregular papules with black pinpoint dots on the surface","A cheesy keratinous core that can be expressed from the center of a papule"],"a":[0,1,3,5],"r":"Molluscum presents as firm, pink to flesh-colored papules 1 to 6 mm in size (occasionally to 15 mm) that become umbilicated with a cheesy core. They favor the face, axillae, antecubital area, trunk, popliteal fossae, crural area, and extremities, and often appear clustered or linear from autoinoculation. The palms, soles, and scalp are spared, which rules out C. Scaly irregular surfaces with black pinpoints (thrombosed vessels) describe verruca vulgaris, not molluscum."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A mother brings her 4-year-old with new umbilicated papules on the trunk. She says the only known contact was a cousin with molluscum who stayed with them about 4 months ago, and she asks whether that visit could explain the rash. Which response by the nurse practitioner is most accurate?","o":["\"The incubation period is usually 2 to 7 weeks and does not go beyond 8 weeks, so that visit is unlikely to be the source.\"","\"The incubation period is usually 2 to 7 weeks but can be as long as 6 months, so that visit could be the source.\"","\"The incubation period is usually 1 to 6 months and possibly years, so the source can never be identified.\"","\"The incubation period is usually 2 to 7 days, so the infection must have come from a more recent contact.\""],"a":[1],"r":"The incubation period for molluscum contagiosum is about 2 to 7 weeks but can be as long as 6 months, so an exposure 4 months earlier is still possible. Option A is wrong because the incubation period can go well past 8 weeks. Option D uses days instead of weeks. Option C gives the incubation period for warts (1 to 6 months, possibly years)."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"The parents of a 4-year-old diagnosed with molluscum contagiosum ask about child care and what to expect. They have chosen not to treat. Which statements by the nurse practitioner are accurate? Select all that apply.","o":["\"Your child is contagious for as long as lesions are present.\"","\"Your child may keep attending child care; exclusion is not needed.\"","\"Your child should stay home from child care until all the lesions have crusted over.\"","\"Untreated lesions usually go away within 6 months to 2 years but can take up to 4 years.\"","\"Untreated lesions usually go away within 2 to 3 weeks of first appearing.\"","\"Infectivity is high, so most household contacts will develop lesions.\""],"a":[0,1,3],"r":"The child stays contagious as long as lesions are present, but there is no need to exclude the child from day care or school. Untreated lesions usually clear within 6 months to 2 years and may take up to 4 years. Exclusion until lesions crust is the rule for varicella, not molluscum. A 2 to 3 week course is far too short. The source states that infectivity is low, not high."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An otherwise healthy-appearing 7-year-old with no history of eczema has well over 100 umbilicated papules across the face, trunk, and extremities. No lesions are in the genital area. Which action is most appropriate?","o":["Evaluate for HIV infection because of the number of lesions","Evaluate for celiac disease because of the number of lesions","Evaluate for type 1 diabetes because of the number of lesions","Evaluate for sexual abuse because of the number of lesions"],"a":[0],"r":"Children with HIV infection or AIDS can have hundreds of molluscum lesions, and the source recommends evaluating for HIV when hundreds of lesions are found. Sexual abuse evaluation is triggered by genitally grouped lesions, not by the total number of lesions in nongenital areas. Diabetes and celiac disease are not named as causes of extensive molluscum."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"The parents of a 9-year-old with persistent, itchy molluscum on the trunk ask for treatment to reduce autoinoculation. The dermatology consultant reviews options with larger supporting controlled studies. Which options are on that list? Select all that apply.","o":["Curettage","Topical potassium hydroxide (KOH)","Lemon myrtle oil","Oral cimetidine","Topical clotrimazole","Oral acyclovir"],"a":[0,1,2],"r":"The source lists curettage, salicylic acid, KOH, imiquimod, cantharidin, and lemon myrtle oil as molluscum treatments with larger supporting controlled studies. Oral cimetidine is listed as an adjunct immunomodulator for warts, not as a molluscum option. Clotrimazole is an antifungal and does not treat a poxvirus. Acyclovir targets herpesviruses and is not effective against molluscum."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 6-year-old with molluscum papules in the left antecubital fossa now has a scaly, pink, mildly itchy patch around the lesions. There is no honey-colored crusting, warmth, or drainage. Which management is most appropriate for this new finding?","o":["Apply mupirocin ointment to the scaly patch around the lesions","Keep the child out of school until the scaly patch resolves","Apply cantharidin to every papule within the scaly patch","Apply a bland moisturizer to the scaly patch around the lesions"],"a":[3],"r":"This is molluscum dermatitis, a scaly, erythematous hypersensitivity reaction that responds to moisturizer. Mupirocin is for impetiginized lesions, and there are no signs of bacterial infection here. Cantharidin is a blistering agent and is not the treatment for the surrounding eczematous reaction. Children with molluscum do not need to be excluded from school."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A sexually active 16-year-old has a group of small, firm, umbilicated papules on the penile shaft and pubic area. Which statements about this presentation are accurate? Select all that apply.","o":["Treating the genital lesions may be needed to prevent spread to sexual partners.","Condyloma acuminatum should be considered in the differential diagnosis.","The molluscum poxvirus can infect mucous membranes as well as skin.","Genital involvement is atypical because molluscum spares mucosal surfaces.","The patient should stay out of school until all lesions resolve."],"a":[0,1,2],"r":"Genital molluscum lesions may need treatment to prevent spread to sexual partners, and condyloma acuminatum is in the differential diagnosis. The poxvirus attacks both skin and mucous membranes, which makes D false. School exclusion is not needed for molluscum."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A dermatologist applies cantharidin in the office to several molluscum lesions on a 7-year-old's trunk. Which anticipatory guidance should the family receive?","o":["Blistering at a treated site means an allergic reaction, and treatment must stop.","Severe inflammation may develop several weeks after the application.","Severe inflammation may develop several hours after the application.","Scarring at the treated sites is the expected outcome after this application."],"a":[2],"r":"The source warns that severe inflammation is possible several hours after cantharidin is applied, and that scarring is unusual. Cantharidin is a blistering agent, so a blister is the intended effect, not an allergic reaction. The reaction appears within hours, not weeks."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"The nurse practitioner is counseling families of children with molluscum contagiosum. Which children are at greater risk for broader spread of lesions? Select all that apply.","o":["A child receiving chemotherapy for leukemia","A child with moderate atopic dermatitis","A child with skin traumatized by frequent scratching and picking","A child with Fitzpatrick type I skin who sunburns easily","A child who received varicella vaccine 2 weeks ago","A child with seasonal allergic rhinitis and no skin disease"],"a":[0,1,2],"r":"Children with impaired immunity, atopic dermatitis, or traumatized skin are at greater risk for broader spread of molluscum. Fair skin type, recent varicella vaccination, and allergic rhinitis without skin barrier disruption are not risk factors for spread."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 3-year-old has several 2 mm, smooth, slightly raised papules on the face and neck. The nurse practitioner is deciding between molluscum contagiosum and flat warts. Which finding most strongly favors molluscum contagiosum?","o":["Lesions numbering from a few to several hundred on the face","Black pinpoint dots representing thrombosed capillaries","A central umbilication with a cheesy core that can be expressed","Lesions that grow inward and disrupt the overlying skin markings"],"a":[2],"r":"Molluscum papules become umbilicated with a cheesy keratinous core that can be expressed. Black pinpoints are seen in common warts. Inward growth that disrupts skin markings describes plantar warts. Flat warts can number from a few to several hundred on the face, so lesion count does not separate the two."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 6-year-old with molluscum keeps scratching and picking at lesions on the face and eyelids. Which complications of molluscum contagiosum are documented? Select all that apply.","o":["Impetiginization of lesions","Inflammation of the eyes or conjunctiva","Scarring at lesion sites","Malignant transformation to squamous cell carcinoma","Persistent hypopigmentation from viral destruction of melanocytes","Disseminated viremia with encephalitis in healthy children"],"a":[0,1,2],"r":"Documented complications include molluscum dermatitis, impetiginized lesions, inflammation of the eyes or conjunctiva, and scarring. Molluscum is a benign infection with little health risk. It does not become squamous cell carcinoma, does not destroy melanocytes, and does not cause disseminated viremia or encephalitis in healthy children."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 8-year-old on a swim team has molluscum on the trunk. Her father asks how it spreads. Which statement is most accurate?","o":["It spreads by direct contact, by fomites such as shared towels, and by autoinoculation.","It spreads by direct contact, but only after the lesions have crusted.","It spreads by direct contact and respiratory droplets, not by shared objects.","It spreads only by fomites such as shared towels; autoinoculation does not occur."],"a":[0],"r":"Molluscum spreads by direct contact, by fomites, and by autoinoculation, usually through scratching. It is not spread by respiratory droplets. Autoinoculation is a major route and explains the linear lesions. Molluscum lesions do not crust before becoming contagious; the child is contagious whenever lesions are present."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 10-year-old has a painful, thick lesion on the ball of the foot. The nurse practitioner is trying to tell a plantar wart from a callus. Which findings support a plantar wart? Select all that apply.","o":["The lesion interrupts the normal skin markings across its surface.","Paring reveals black pinpoints, which are thrombosed blood vessels.","The lesion appears to grow inward on a weight-bearing surface.","The skin markings continue uninterrupted across the lesion.","The lesion has a central umbilication with a keratinous core.","The lesion is limited to the non-weight-bearing arch of the foot."],"a":[0,1,2],"r":"Plantar warts are found on weight-bearing surfaces, grow inward, and disrupt skin markings, and black pinpoints (thrombosed vessels) are characteristic of warts. Skin markings that continue across the lesion suggest a callus. Umbilication with a keratinous core describes molluscum. Plantar warts favor weight-bearing areas, not the arch."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 9-year-old has a single wart on the side of the neck that sticks out from the skin on a narrow stalk. The family wants it removed. Which treatment is most specifically recommended for this type of wart?","o":["Salicylic acid 40% plaster for 3 to 5 days","Cantharidin 0.7% under tape for 24 hours","Excision with a scalpel","Snip removal with scissors"],"a":[3],"r":"This is a filiform wart, which projects on a narrow stalk and is usually seen on the face, lips, nose, eyelids, or neck. Snipping with scissors, not a scalpel, is useful for filiform warts. Cantharidin should be used only on periungual and some plantar warts, not other body surfaces. The 40% salicylic plaster is the method for plantar warts."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A nurse practitioner is about to perform in-office liquid nitrogen cryotherapy on a common wart on the dorsum of a 13-year-old's hand. Which technique details are correct? Select all that apply.","o":["Apply for 2 to 10 seconds, or stop sooner if the patient reports pain.","Freeze until an area 1 to 3 mm beyond the wart turns white.","Freeze until an area 5 to 10 mm beyond the wart turns white.","Aim to form a blister above the dermal-epidermal junction.","Freeze aggressively on the lateral aspects of the digits to ensure clearance.","Apply for 30 to 60 seconds to reduce the need for retreatment."],"a":[0,1,3],"r":"Liquid nitrogen is applied for 2 to 10 seconds until an area 1 to 3 mm beyond the wart turns white or the patient complains of pain, with the goal of blistering above the dermal-epidermal junction. A 5 to 10 mm margin and 30 to 60 second freezes are excessive, and the source warns against freezing too vigorously. Extra caution, not aggressive freezing, is needed over joints and the lateral aspects of digits."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"After liquid nitrogen treatment of a wart on the finger of an 11-year-old, which statement belongs in patient and family education?","o":["A blister after treatment means the wart was not frozen long enough.","A blister, sometimes hemorrhagic, may form 1 to 2 days after treatment.","A hemorrhagic blister after treatment means a bacterial infection needing antibiotics.","A blister, sometimes hemorrhagic, may form 7 to 14 days after treatment."],"a":[1],"r":"Families should be told that a blister, sometimes hemorrhagic, may form 1 to 2 days after liquid nitrogen treatment. The 7 to 14 day window is when a cantharidin blister sloughs. A hemorrhagic blister is an expected effect and does not mean infection. Blister formation is the goal of cryotherapy, not a sign of undertreatment."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A dermatologist plans to use cantharidin for a 10-year-old's periungual wart. Which statements about cantharidin for warts are accurate? Select all that apply.","o":["It is applied as a 0.7% solution and covered with tape for 24 hours.","It is applied as a 0.7% solution and washed off after 4 hours.","It produces a blister in 2 to 3 days that sloughs after 7 to 14 days.","It is appropriate for filiform warts on the face and lips.","A ring of satellite warts may develop at the edge of the blister.","It is useful for periungual warts and some plantar warts."],"a":[0,2,4,5],"r":"Cantharidin 0.7% is applied with a toothpick and covered with tape for 24 hours. It forms a blister in 2 to 3 days that sloughs after 7 to 14 days, and a ring of satellite warts can form at the blister edge. It is useful for periungual and some plantar warts and should not be used on other body surfaces such as the face. Washing off after 4 hours is the instruction for podophyllum."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 11-year-old has dozens of small, slightly raised, flesh-colored papules on the forehead and cheeks, consistent with verruca plana. Which topical regimen is most appropriate for this type of wart?","o":["Cantharidin 0.7%, covered with tape for 24 hours","Salicylic acid 40% plaster, changed every 3 to 5 days","Podophyllum 25%, washed off after 4 hours","Retinoic acid 0.025% to 0.05% gel, applied once or twice daily"],"a":[3],"r":"Retinoic acid gel 0.025% to 0.05% applied once or twice daily brings resolution in 4 to 6 weeks and is useful for flat warts. The 40% salicylic plaster is for plantar warts. Cantharidin should not be used on body surfaces other than periungual and plantar sites, which excludes the face. Podophyllum is described for common or genital warts."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 12-year-old with a plantar wart will use 40% salicylic acid plasters at home. Which instructions are correct? Select all that apply.","o":["Cut the plaster to the size of the wart and tape it in place for 3 to 5 days.","Tape the plaster in place for 24 hours, then throw it away and stop treatment.","After removing the plaster, soak the area for 45 minutes and remove the dead skin.","After removing the plaster, soak the area for 5 minutes and leave the dead skin alone.","Expect treatment to continue for about 3 to 6 weeks.","Expect treatment to continue for about 3 to 6 months."],"a":[0,2,4],"r":"Salicylic acid 40% plasters are cut to size and taped in place for 3 to 5 days. After removal, the area is soaked for 45 minutes, the dead epidermis is removed, and a new plaster is applied, for a course of 3 to 6 weeks. A single 24 hour application, a 5 minute soak without debridement, and a 3 to 6 month course do not match the source."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 8-year-old has a single common wart on the index finger that measures 8 mm across. The parent wants an inexpensive, painless home treatment and asks about salicylic acid paint. Which statement is most accurate?","o":["Salicylic acid paint is most likely to work because the wart is larger than 5 mm across.","Salicylic acid paint is less likely to work because the wart is larger than 5 mm across.","Retinoic acid gel would work better because it is effective for common warts.","Salicylic acid paint is applied once a week for 4 to 6 weeks for common warts."],"a":[1],"r":"Salicylic acid paints are useful for common or periungual warts, but the source states they are not effective for warts larger than 5 mm in diameter. Retinoic acid does not work for common, plantar, or periungual warts. Salicylic acid paint is applied once or twice a day for 4 to 6 weeks, not once a week."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A nurse practitioner is reviewing podophyllum and podofilox regimens for a 17-year-old with external genital warts. Which statements are accurate? Select all that apply.","o":["Podophyllum 25% in compound benzoin tincture is washed off after 4 hours.","Podophyllum 25% is applied, covered with tape, and left on for 24 hours.","Podophyllum application may be repeated in 1 week.","Podofilox is applied twice a day for 3 days, followed by a 4-day rest period.","Podofilox is applied twice a day for 7 days in a row with no rest period.","Podofilox is the preferred treatment for flat warts on the face."],"a":[0,2,3],"r":"Podophyllum 25% in compound benzoin tincture is applied with a toothpick, washed off after 4 hours, and may be repeated in 1 week. Podofilox is applied twice daily for 3 days, then stopped for 4 days, and the cycle may be repeated as needed. Covering with tape for 24 hours is the cantharidin method. These agents are described for common or genital warts, not facial flat warts."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"The parent of a 9-year-old with multiple common warts on the hands read online about imiquimod cream and asks whether it is an option. Which statement is accurate?","o":["Imiquimod is approved for children older than 12 years of age.","Imiquimod is approved for children older than 6 years of age.","Imiquimod is approved only for adults 18 years of age and older.","Imiquimod is approved for children older than 2 years of age."],"a":[0],"r":"Imiquimod cream builds cell-mediated immunity in surrounding areas and is often effective as a home treatment, but it is approved for children over 12 years of age. A 9-year-old is below that age. The 2 year, 6 year, and adult-only cutoffs are incorrect."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 4-year-old is brought in for lesions around the anus. Exam shows multiple, confluent, light-colored lesions with an irregular, cauliflower-like surface. Which statements are accurate? Select all that apply.","o":["The appearance is consistent with condylomata acuminata.","The appearance is consistent with discrete, umbilicated molluscum papules with a cheesy core.","This finding in a young child should raise suspicion of sexual abuse and prompt evaluation.","This finding is fully explained by autoinoculation and needs no further evaluation.","Molluscum contagiosum belongs in the differential diagnosis of these lesions.","Squamous cell carcinoma is the most likely diagnosis."],"a":[0,2,4],"r":"Condylomata acuminata appear on genital mucosa and adjacent skin as multiple, confluent, light-colored, cauliflower-like warts. Genital warts in young children or in adolescents who are not sexually active should raise suspicion of sexual abuse, so further evaluation is required. Condyloma acuminatum is in the differential diagnosis for molluscum, so the two must be told apart. Squamous cell carcinoma is in the wart differential but is not the likely diagnosis in a 4-year-old."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"The nurse practitioner starts treatment for a 10-year-old's common warts on the fingers. When should the child return to evaluate response?","o":["In 2 to 3 months","In 2 to 3 days","In 2 to 3 weeks","In 6 months"],"a":[2],"r":"After wart treatment is started, follow-up in 2 to 3 weeks is recommended to evaluate response. Two to 3 days is too soon to judge most treatments. Two to 3 months and 6 months would delay adjustment of a therapy that often needs repeat or combined treatment."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 14-year-old has several warts and asks whether they must be treated. Which considerations should guide the decision to treat? Select all that apply.","o":["The location, number, and size of the lesions","Whether the lesions cause discomfort","Whether the patient finds the lesions cosmetically objectionable","The need to treat all warts, even asymptomatic ones, to prevent spread","HPV genotyping results obtained before any treatment","Whether a high-efficacy option is available, even if scarring is likely"],"a":[0,1,2],"r":"The decision to treat should be based on location, number and size of lesions, discomfort, and whether they are cosmetically objectionable. No treatment is necessary if warts are asymptomatic, and watchful waiting is an option. HPV genotyping is not required. Treatment should not be harmful, and scarring should be avoided."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 10-year-old has many recalcitrant common warts. The dermatologist recommends adding oral cimetidine. Which statement about how cimetidine is used for warts is accurate?","o":["It is used together with other treatments for 3 to 4 months.","It is used alone for 3 to 4 months.","It is used together with other treatments for 3 to 4 weeks.","It is used alone for 3 to 4 weeks."],"a":[0],"r":"Oral cimetidine, a histamine-2 receptor blocker thought to improve immunity to HPV, is used together with other treatments for 3 to 4 months. It is not described as monotherapy. A 3 to 4 week course is too short for this immunomodulating effect."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 12-year-old who plays goalkeeper has new warts on the fingers and knuckles, the areas most often scraped during games. Which statements about wart pathophysiology and natural history are accurate? Select all that apply.","o":["Trauma promotes HPV inoculation, which explains why warts appear at sites of injury.","The incubation period ranges from 1 to 6 months and possibly years.","Warts have a high recurrence rate, even after they resolve.","The incubation period ranges from 2 to 7 weeks, up to 6 months.","Warts do not occur on the scalp, face, or genitalia.","Warts spread mainly by respiratory droplets during contact sports."],"a":[0,1,2],"r":"Trauma promotes HPV inoculation (Koebner phenomenon), so most warts are on the hands, fingers, elbows, and plantar feet. Incubation is 1 to 6 months, possibly years, and recurrence is high. The 2 to 7 week incubation is for molluscum. Warts can occur anywhere, including the face, scalp, and genitalia. Spread is by fomites, skin-to-skin contact, and autoinoculation, not droplets."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 12-year-old who bites his nails has several warts around the cuticles of the fingers. Which treatment is least appropriate for this type of wart?","o":["Salicylic acid 16.7% with 16.7% collodion applied to thick skin","Retinoic acid 0.025% to 0.05% gel applied once or twice daily","Cantharidin 0.7% applied and covered with tape for 24 hours","Salicylic acid paint (greater than 20%) applied once or twice daily"],"a":[1],"r":"Retinoic acid gel is useful for flat warts but does not work for common, plantar, or periungual warts. Salicylic acid paints, including the 16.7% salicylic acid with 16.7% collodion combination for thick skin, are useful for common or periungual warts. Cantharidin is specifically noted as useful for periungual warts."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A parent asks the nurse practitioner to compare categories of wart treatment for a 6-year-old who is afraid of pain. Which statements are accurate? Select all that apply.","o":["Keratolytics are low in cost and risk but slow to work.","Keratolytics are low in cost and risk and usually clear warts within 24 hours.","Destructive agents cause necrosis and blistering, and they require patient cooperation.","Destructive agents are painless, which makes them ideal for uncooperative young children.","Duct tape occlusion is easy, painless, and inexpensive.","Laser therapy usually clears warts after a single painless session."],"a":[0,2,4],"r":"Keratolytics work by causing inflammation and peeling. They are often available over the counter, cause little pain, and are low in cost and risk, but they are slow to work. Destructive agents cause necrosis and blistering, are mostly painful, and require patient cooperation. Duct tape occlusion is easy, painless, and inexpensive. Laser treatment can be painful and needs several sessions."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 14-year-old has a common wart on the thickened skin over a knuckle and wants an over-the-counter keratolytic. Which formulation is described as more effective on thick skin?","o":["Salicylic acid 5% compounded in white petrolatum","Retinoic acid 0.05% gel combined with duct tape","Cantharidin 0.7% applied without any occlusion","Salicylic acid 16.7% combined with 16.7% collodion"],"a":[3],"r":"On thick skin, a combination of 16.7% salicylic acid and 16.7% collodion is more effective, and adding duct tape occlusion may improve results further. Retinoic acid does not work for common warts. A 5% salicylic acid preparation is not the formulation in the source. Cantharidin is a destructive agent, not a keratolytic, and it is covered with tape."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A nurse practitioner is reviewing immunotherapy options for warts. Which statements are accurate? Select all that apply.","o":["Imiquimod cream builds local cell-mediated immunity and is often used at home.","Cimetidine is a histamine-2 receptor blocker that may improve immunity to HPV.","Interferon injection is a first-line home therapy for school-age children.","Contact sensitization is a method used by dermatologists, usually in adults.","Cimetidine is a histamine-1 receptor blocker that may improve immunity to HPV.","Immunotherapy agents clear warts by directly causing epidermal necrosis."],"a":[0,1,3],"r":"Immunotherapy works by stimulating an immune response to HPV. Imiquimod builds cell-mediated immunity and is often effective as a home treatment. Cimetidine is an H2 blocker, not an H1 blocker, that may improve immunity to HPV. Contact sensitization and interferon injection are used by dermatologists, usually in adults, so interferon is not a first-line home therapy for children. Direct necrosis is how destructive agents work."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"Two weeks after starting treatment for a common wart, an 8-year-old's parent reports that the wart has become red and itchy. There is no drainage, spreading redness, or fever. How should the nurse practitioner interpret this?","o":["Redness and itching suggest allergic contact dermatitis, and treatment should stop permanently.","Redness and itching suggest a ring of satellite warts forming around the lesion.","Redness and itching may mean the wart is starting to regress.","Redness and itching suggest a secondary bacterial infection needing antibiotics."],"a":[2],"r":"Families are taught that redness and itching may herald regression of a wart, reflecting an immune response. Satellite warts are a specific complication at the blister edge after cantharidin. Without drainage, spreading redness, or fever, there is no evidence of bacterial infection. Nothing in this picture suggests an allergic reaction that requires stopping treatment permanently."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 10-year-old has a pruritic eruption. The nurse practitioner is deciding whether it is allergic or irritant contact dermatitis. Which features favor allergic contact dermatitis? Select all that apply.","o":["The reaction appears in a delayed fashion after re-exposure to the substance.","The reaction occurs only after an earlier sensitization phase.","The reaction is mediated by type I, IgE-dependent immediate hypersensitivity.","Shiny, chafed, fissured skin on the backs of the hands after frequent handwashing.","Acute erythema with pruritic vesicles and weeping.","The reaction appears immediately on first contact with the substance."],"a":[0,1,4],"r":"Allergic contact dermatitis is a type IV delayed hypersensitivity reaction. It has a sensitization phase and an elicitation phase and appears only after sensitization, so reactions are delayed. The acute stage shows erythema, vesicles, and weeping with pruritus. Immediate reactions and shiny, chafed, fissured skin from handwashing are typical of irritant dermatitis. Type I IgE reactions are not the mechanism."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 9-year-old with atopic dermatitis has had dry, cracked, shiny, red skin on the weight-bearing surfaces of both feet for 3 months, starting at the big toes. The toe web spaces are clear, and a KOH prep is negative. Which diagnosis is most likely?","o":["Juvenile plantar dermatosis","Dyshidrotic eczema","Tinea pedis","Allergic contact dermatitis to shoe components"],"a":[0],"r":"Juvenile plantar dermatosis causes dryness, cracking, and erythema of the weight-bearing surfaces of the feet, beginning at the big toes. It is common in children with atopic dermatitis and mimics tinea pedis. Clear web spaces and a negative KOH prep argue against tinea. Shoe allergic contact dermatitis typically involves the toes and the dorsum of the foot. Dyshidrotic eczema presents with deep-seated vesicles rather than this dry, fissured pattern on weight-bearing surfaces."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 6-year-old squeezed limes for limeade at an outdoor picnic. Two days later, she has blistered lesions on a red base in streaks on her hands and forearms. Which statements about this condition are accurate? Select all that apply.","o":["The reaction needs sun exposure after skin contact with the plant juice.","Celery, parsnips, figs, and carrots can cause the same reaction.","The lesions may be mistaken for a burn.","The reaction is caused by urushiol, the plant oleoresin.","The reaction needs an earlier sensitization phase to the plant."],"a":[0,1,2],"r":"Phytophotodermatitis results from sun exposure after contact with plants or juices such as limes, lemons, carrots, celery, figs, parsnips, or dill. It appears as a blistered lesion on an erythematous base and may be confused with a burn. Urushiol is the allergen in poison ivy, oak, and sumac, not limes. Phytophotodermatitis is a phototoxic reaction that does not require earlier sensitization."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 10-year-old treated for poison ivy after a camping trip 3 weeks ago keeps getting new patches of dermatitis every few days, even though the family has not gone back outdoors. Which explanation is most likely?","o":["A new immediate irritant reaction caused by scratching","Spread of urushiol through fluid from ruptured blisters","Spread of urushiol through the bloodstream after skin absorption","Re-exposure to urushiol left on clothing, pet fur, toys, or sports equipment"],"a":[3],"r":"Urushiol can remain on contaminated items such as clothing, animal hair, toys, and sports equipment, which causes repeated outbreaks through re-exposure. Blister fluid does not contain urushiol and does not spread the rash. Urushiol does not spread through the bloodstream. Scratching does not create a new irritant contact dermatitis that explains repeated new outbreaks."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 13-year-old has extensive poison oak dermatitis covering both legs, both arms, and the trunk. The nurse practitioner considers systemic corticosteroids. Which statements are accurate? Select all that apply.","o":["Oral corticosteroids may be considered when allergic involvement exceeds 10% of the body surface area.","Oral corticosteroids may be considered when allergic involvement exceeds 5% of the body surface area.","The total course lasts 10 to 14 days.","The total course lasts 3 to 5 days.","The dose is tapered over the last 7 days of the course.","The dose is stopped abruptly at the end of the course without a taper."],"a":[0,2,4],"r":"Oral corticosteroids are occasionally used for short periods if allergic involvement exceeds 10% of the skin surface, with a 10 to 14 day course tapered over the last 7 days. The 5% threshold is wrong. A 3 to 5 day burst or stopping without a taper is too short and risks rebound of the dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 8-year-old with localized allergic contact dermatitis on the forearm is started on a topical corticosteroid. Which statement correctly describes the expected regimen and time course?","o":["Apply 2 or 3 times daily; relief in 2 or 3 weeks; complete healing in 2 or 3 months","Apply 2 or 3 times daily; relief in 2 or 3 days; complete healing in 2 or 3 weeks","Apply 2 or 3 times daily; relief in 2 or 3 hours; complete healing in 2 or 3 days","Apply once weekly; relief in 2 or 3 days; complete healing in 2 or 3 weeks"],"a":[1],"r":"Topical corticosteroids applied 2 or 3 times daily give relief in 2 or 3 days, although complete healing may take 2 or 3 weeks. The other options change the frequency (once weekly) or move the time frames to hours, days, or months, which does not match the source."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 7-year-old has acute, weeping, vesicular allergic contact dermatitis on the forearms, with dry, chafed areas at the edges. Which management measures are appropriate? Select all that apply.","o":["Cool compresses or Burow solution soaks for 20 minutes every 4 to 6 hours on the vesicular areas","Cool compresses or Burow solution soaks for 60 minutes every 1 to 2 hours on the vesicular areas","A lanolin-and-petrolatum-based emollient on the inflamed areas","A petrolatum-based emollient, such as white petrolatum, on the dry, chafed areas","An oral antihistamine if itching and scratching are a problem","Topical neomycin on the weeping areas to prevent secondary infection"],"a":[0,3,4],"r":"Burow solution soaks, oatmeal baths, or cool compresses applied for 20 minutes every 4 to 6 hours soothe vesicular rashes. Petrolatum-based emollients restore moisture to dry, chafed skin, and oral antihistamines help with itching. Lanolin-and-petrolatum-based emollients should not be used if there is inflammation. Neomycin is a common contact allergen and could worsen the dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 11-year-old has had recurrent hand dermatitis despite 3 weeks of avoiding suspected irritants, using emollients, and applying a topical corticosteroid. The rash clears and then keeps coming back. Which next step is most appropriate?","o":["Start psoralen plus UVA phototherapy right away.","Refer to a dermatologist or allergist for skin prick testing.","Refer to a dermatologist or allergist for patch testing.","Order serum allergen-specific IgE testing."],"a":[2],"r":"Referral to a dermatologist or allergist for patch testing is indicated when contact dermatitis worsens, fails to respond, or recurs. Patch testing detects type IV delayed hypersensitivity. Skin prick testing and serum specific IgE detect type I reactions. Phototherapy is considered only when the condition does not respond to other measures, not before allergen identification."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 12-year-old has a pruritic, well-demarcated dermatitis that the nurse practitioner suspects is caused by nickel. Which distributions are consistent with nickel contact dermatitis? Select all that apply.","o":["Inflammation of both earlobes after wearing new earrings","A circular patch just below the umbilicus where a jeans snap sits","Patches on the nose bridge and behind the ears where metal eyeglass frames rest","Symmetric, poorly defined lichenified plaques in both antecubital fossae","Greasy yellow scale across the scalp and nasolabial folds","Erythema and scaling around the lips that is worse in cold, dry weather"],"a":[0,1,2],"r":"Nickel dermatitis comes from contact with jewelry, belts, snaps, or eyeglasses. The rash is localized with sharp borders, such as inflamed earlobes, circular areas under snaps, or sites where frames touch. Symmetric flexural lichenification suggests atopic dermatitis. Greasy scale on the scalp and nasolabial folds suggests seborrhea. Perioral scaling in cold, dry weather is lip-licker dermatitis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 7-year-old has had a red, scaly ring around the mouth since winter began, and the parent says the child licks the lips constantly. Which recommendation is most appropriate?","o":["Apply a flavored, lanolin-based lip cream to the inflamed skin.","Apply an unflavored, petroleum-based emollient whose taste discourages licking.","Apply a flavored, petroleum-based emollient to encourage frequent use.","Apply an unflavored, lanolin-and-petrolatum-based cream to the inflamed skin."],"a":[1],"r":"Flavored lip creams should not be used in lip-licker dermatitis because they encourage licking. Petroleum-based emollients moisturize the skin and discourage lip licking because of their bad taste. Lanolin-and-petrolatum-based emollients should not be used on inflamed skin, and lanolin is itself a recognized contact allergen."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 13-year-old has a pruritic, sharply bordered dermatitis on the top of both feet and the toes 2 weeks after getting new leather sneakers. She also put an over-the-counter triple antibiotic ointment on a blister on one heel. Which substances are recognized causes of allergic contact dermatitis that could explain her rash? Select all that apply.","o":["Rubber components in the shoe","Potassium dichromate used in tanning the leather","Neomycin in the triple antibiotic ointment","White petrolatum in the ointment base","Zinc oxide in a foot powder","Dimethicone in a barrier cream"],"a":[0,1,2],"r":"Common causes of allergic contact dermatitis include shoe components such as rubber and potassium dichromate, and topical medications such as neomycin and lanolin. A reaction on the toes and dorsum of the foot is a classic shoe pattern. White petrolatum and dimethicone are listed as petrolatum-based emollients used in treatment. Zinc oxide is not named as a common allergen."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"An 8-year-old had poison ivy dermatitis on the right forearm. One week later, a symmetric, itchy papulovesicular eruption appears on the trunk and the opposite arm, with no new plant exposure. Which term best describes the new eruption?","o":["Irritant contact dermatitis","Phytophotodermatitis","Idiosyncratic (id) reaction","Koebner phenomenon"],"a":[2],"r":"An id reaction is a generalized secondary or \"sympathy\" rash that develops distant from the primary site of allergen exposure. The Koebner phenomenon is inoculation along sites of trauma, as with warts. Phytophotodermatitis requires plant juice plus sun exposure. Irritant dermatitis is immediate and limited to contact sites."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 5-year-old has dry, scaly, mildly itchy patches on the trunk and legs every winter. Which history findings are recognized contributors to dry skin contact dermatitis? Select all that apply.","o":["Indoor humidity measured below 30%","Long baths with heavy use of soap or cleansing cream","Soap residue left on the skin because of poor rinsing","Indoor humidity kept between 40% and 50% with a humidifier","Use of fragrance-free white petrolatum after bathing","Wearing loose cotton clothing next to the skin"],"a":[0,1,2],"r":"Dry skin dermatitis is caused by extremely low humidity (less than 30%), excess soap or cleansing cream use, or inadequate rinsing of soap products. Keeping humidity at 40% to 50% and applying petrolatum protect against dryness. Loose cotton clothing is not a contributor, while woolen or rough textures can be."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"A 12-year-old has had dermatitis around the umbilicus from a metal belt buckle for 5 months and has never been treated. Which findings are most expected at this stage?","o":["Honey-colored crusts over erosions","Shiny, chafed, fissured skin with peeling","Erythema, vesicles, and weeping","Hyperpigmentation and lichenification"],"a":[3],"r":"Hyperpigmentation and lichenification are seen in chronic contact dermatitis, and allergic contact dermatitis can become chronic if left untreated. Erythema, vesicles, and weeping are acute-stage findings. Shiny, chafed, fissured skin suggests irritant dermatitis. Honey-colored crusts suggest impetigo, which is in the differential diagnosis."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 15-year-old helped burn a brush pile that contained poison ivy. Two days later, he has dermatitis on the face and neck, plus cough and chest tightness. Which statements are accurate? Select all that apply.","o":["Exposure to poison ivy can be indirect, through smoke from burning plant material.","Plant oils carried in smoke can be inhaled and damage lung tissue.","Only direct skin contact with the leaves can cause the dermatitis.","Urushiol is destroyed by burning, so the respiratory symptoms must have another cause.","Fluid from his facial blisters can spread the dermatitis to classmates."],"a":[0,1],"r":"Contact with plant oleoresins can be direct or indirect, including exposure to burning plant material, and the oils may be inhaled and damage lung tissue. This makes C and D false. Blister fluid does not contain urushiol and does not spread the dermatitis to others."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"Two siblings spilled the same household cleaning solution on their forearms. One wiped it off right away and has only mild redness. The other did not notice until several hours later and has marked redness, swelling, and blisters. Which factor best explains the difference in severity?","o":["How long the skin was exposed and how concentrated the irritant was","Each child's history of atopic dermatitis","Each child's total serum IgE level","The number of earlier sensitizations to the solution"],"a":[0],"r":"The severity of contact dermatitis depends on the length of exposure and the concentration of the irritant. Brief contact may cause only mild erythema, while prolonged or concentrated contact can cause marked erythema, edema, and blistering. Irritant reactions do not require sensitization. IgE levels are not involved, and the vignette shows a clear difference in exposure time."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":true,"q":"A 3-year-old has red, chapped skin around the mouth and on the hands. Which history items are recognized sources of contact dermatitis that the nurse practitioner should ask about? Select all that apply.","o":["Saliva on the skin from thumb sucking","Nightly bubble baths","Frequent use of adhesive bandages","Wearing soft cotton mittens outdoors","Applying fragrance-free white petrolatum","Running a humidifier that keeps indoor humidity at 45%"],"a":[0,1,2],"r":"Substances such as saliva, urine, and feces, baby wipes, bubble bath, agents that dry the skin, and adhesives often cause contact dermatitis in children. Soft cotton, white petrolatum, and humidity above 30% are protective or neutral. Rough or woolen textures and humidity below 30% are the contributors."},{"t":"Dermatitis, Varicella & Warts","l":3,"s":false,"q":"Three weeks ago, a 6-year-old used a neomycin-containing antibiotic ointment on a knee abrasion with no reaction. Two days ago, the parent applied the same ointment to a new scrape on the elbow. Today the child has an itchy, sharply bordered, vesicular eruption limited to where the ointment was applied. Which explanation is most accurate?","o":["Idiosyncratic (id) reaction appearing far from the original site of exposure","Immediate irritant reaction caused by a high concentration of the ointment","Type I IgE-mediated reaction occurring within minutes of re-exposure","Elicitation phase of a type IV delayed hypersensitivity reaction after earlier sensitization"],"a":[3],"r":"Allergic contact dermatitis has two
