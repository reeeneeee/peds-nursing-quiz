sure","Give MMR now to prevent infection from this exposure","Tell her that immune globulin given now reliably prevents congenital rubella syndrome","If she was already IgG-positive, explain that reinfection rarely causes congenital rubella syndrome","Wait for symptoms before testing, because silent infection does not affect the fetus"],"a":[0,1,4],"r":"Prompt IgG testing establishes immune status, and IgG-negative women need repeat serology (about 2 to 3 weeks and 6 weeks after exposure) to detect seroconversion. Reinfection in an immune woman rarely causes congenital rubella syndrome. MMR is contraindicated in pregnancy. Immune globulin does not reliably prevent congenital infection and is reserved for women who would not end the pregnancy. Transplacental spread happens with both apparent and silent infection, so waiting for symptoms is wrong."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 2-year-old unvaccinated child attended a family gathering with a cousin who developed confirmed rubella. If the child is infected, when is the rash most likely to appear?","o":["Within 3 to 6 days after the exposure","Within 7 to 10 days after the exposure","Within 28 to 35 days after the exposure","Within 14 to 21 days after the exposure"],"a":[3],"r":"The rubella incubation period is 14 to 21 days (mean 18 days). The other windows are too short or too long and would lead to closing the observation period at the wrong time."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An NP is teaching a family how rubella spreads. Which statements are accurate? Select all that apply.","o":["Virus shedding starts several days before the rash appears","People with subclinical infection, about 25% of cases, can still spread the virus","The virus has been found in breast milk, urine, and the conjunctiva of infected people","Infection spreads mainly through blood, not respiratory secretions","A child stops being contagious once the lymph nodes start to swell","A single brief, passing contact is usually enough to transmit infection"],"a":[0,1,2],"r":"Maximum shedding runs from about 5 days before to 6 days after the rash. Spread occurs through nasopharyngeal secretions during both apparent and silent infection, and about 25% of infections are subclinical. Virus has been isolated from blood, breast milk, the conjunctival sac, and urine. Respiratory secretions, not blood, are the main route. Lymphadenopathy often starts before the rash, during the shedding period. Prolonged, repeated contact is generally needed for infection."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 9-year-old with postnatal rubella develops widespread petechiae and gum bleeding 3 days after the rash started. Which statement about this complication is most accurate?","o":["Thrombocytopenia usually occurs within 4 days of rash onset, and severe purpura can be treated with corticosteroids and platelet transfusion","Thrombocytopenia usually occurs within 4 weeks of rash onset, and severe purpura can be treated with corticosteroids and platelet transfusion","Thrombocytopenia occurs only before the rash, so purpura appearing after the rash points to another diagnosis","Thrombocytopenia usually occurs within 4 days of rash onset, and severe purpura can be treated with ribavirin and immune globulin"],"a":[0],"r":"In postnatal rubella, thrombocytopenia and encephalitis can occur within 4 days of rash onset. Severe thrombocytopenic purpura is managed with corticosteroids and platelet transfusions. The 4-week window in B is wrong. Ribavirin (D) is not a rubella therapy. Thrombocytopenia follows the rash rather than coming only before it (C)."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"Compared with young children, which features of rubella are more typical in adolescents and young adults? Select all that apply.","o":["Arthralgia or arthritis, especially in females","No visible rash in a larger share of cases","More itching when the rash is present","Severe photophobia during the rash","Higher risk of subacute sclerosing panencephalitis","A facial rash that looks like acne"],"a":[0,1,2,5],"r":"Rash occurs less often in adolescents and young adults. When present, it may itch more, and a facial acneiform rash is more common in adolescents. Arthritis and arthralgia complicate rubella in postpubertal patients, more often females. Rubella causes no photophobia at any age, and subacute sclerosing panencephalitis is a complication of measles."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A well-appearing 5-year-old has had a temperature of 38.0\u00b0C (100.4\u00b0F) for 2 days, tender postauricular and suboccipital nodes, and pink discrete maculopapules. The rash started on the face yesterday, has already reached the trunk, and is fading on the face. There is no cough, coryza, or conjunctivitis. Which diagnosis is most likely?","o":["Roseola (erythema subitum)","Scarlet fever","Rubella","Rubeola (measles)"],"a":[2],"r":"A mild illness with postauricular and suboccipital nodes and discrete maculopapules that start on the face, spread downward within 24 hours, and fade quickly is classic rubella. Measles brings high fever with cough, coryza, conjunctivitis, and Koplik spots. Roseola's rash starts on the trunk after high fever resolves. Scarlet fever has a sandpaper-like rash with circumoral pallor and pharyngitis."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 20-year-old with arthralgias and no clear rash has a positive rubella IgM. The NP considers a false-positive result. Which can cause a false-positive rubella IgM? Select all that apply.","o":["Rheumatoid factor in the serum sample","Recent infection with parvovirus B19","Recent infection with Epstein-Barr virus","A single MMR dose received 10 years earlier","Leukopenia found on the same day's CBC"],"a":[0,1,2],"r":"False-positive rubella IgM can result from rheumatoid factor or other viral infections, such as parvovirus B19 and EBV. That matters here because parvovirus also causes arthropathy in adults. Vaccine-induced IgM does not persist for 10 years. Leukopenia is a common finding in rubella and does not interfere with antibody assays."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 27-year-old who is breastfeeding is found to be rubella IgG-negative on the day after delivery. Which plan is most appropriate?","o":["Give MMR before discharge, stop breastfeeding for 4 weeks, and avoid pregnancy for 4 weeks","Wait to give MMR until she stops breastfeeding, then avoid pregnancy for 4 weeks","Give MMR before discharge, continue breastfeeding, and avoid pregnancy for 3 months","Give MMR before discharge, continue breastfeeding, and avoid pregnancy for 4 weeks"],"a":[3],"r":"Rubella-susceptible women should receive MMR after delivery, before discharge. Breastfeeding is not a contraindication, so B and A are wrong. Current guidance is to avoid pregnancy for 4 weeks (28 days) after vaccination. The 3-month interval in C is outdated."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 7-year-old had a mild runny nose and headache last week. Today he has bright red cheeks. Which findings over the coming days fit erythema infectiosum (fifth disease)? Select all that apply.","o":["Bright red \"slapped cheek\" redness on the face, with paleness around the mouth","A lacy, net-like pink rash on the trunk and the extensor surfaces of the arms and legs","The rash fades and then returns for weeks with heat, sunlight, exercise, or friction","A rash that starts on the palms and soles and then spreads toward the trunk","Peeling of the fingertip skin about 2 weeks after the rash","Bright red cheeks with marked swelling of the hands and feet and a \"strawberry\" tongue"],"a":[0,1,2],"r":"Erythema infectiosum starts with intense slapped-cheek redness and relative paleness around the mouth, followed by a lacy, reticular rash on the trunk and extensor surfaces. The rash can fade and come back for weeks with heat, sunlight, exercise, or friction. A rash that starts on the palms and soles and moves inward suggests Rocky Mountain spotted fever. Fingertip peeling and strawberry tongue with swelling of the hands and feet suggest Kawasaki disease or scarlet fever."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy 8-year-old has slapped cheeks and a lacy rash on her arms, and the NP diagnoses fifth disease. Her parent asks when she can return to school. Which response is most accurate?","o":["She can return 24 hours after the rash appears, as long as she has no fever","She can attend school now, because she is no longer contagious once the rash appears","She should stay home until the lacy rash has faded completely from her arms","She should stay home for 7 days after the facial redness first appeared"],"a":[1],"r":"In immunocompetent children with erythema infectiosum, communicability is highest before the rash, and they are not contagious once it appears. Exclusion is unnecessary. Excluding until the rash fades (C) could keep a child home for weeks because the rash recurs. The 7-day and 24-hour rules (D, A) have no basis for this disease."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 9-year-old with sickle cell disease (HbSS) has fever, fatigue, and pallor. Her hemoglobin has dropped from her baseline of 8.2 g/dL to 4.1 g/dL, and her reticulocyte count is 0.2%. Her spleen is not enlarged, and she has no rash. Her younger brother had fifth disease last week. Which statements are accurate? Select all that apply.","o":["This picture fits a transient aplastic crisis caused by parvovirus B19","The very low reticulocyte count helps separate this from splenic sequestration, where reticulocytes rise","She is contagious and should be placed on droplet precautions in the hospital","She is not contagious, because she has not developed the characteristic rash","Red blood cell transfusion is the main treatment for her severe symptomatic anemia","IVIG is the first-line treatment for transient aplastic crisis in an immunocompetent host"],"a":[0,1,2,4],"r":"Parvovirus B19 replicates in red cell precursors and causes transient aplastic crisis in people with hemolytic anemias. Profound reticulocytopenia is the hallmark, unlike splenic sequestration, where the reticulocyte count is high. Patients in aplastic crisis are viremic and contagious, usually without a rash, so they need droplet precautions. Management centers on red cell transfusion. IVIG is reserved for chronic infection in immunocompromised patients."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 31-year-old elementary teacher at 14 weeks of gestation was exposed to fifth disease in her classroom 3 weeks ago. Her parvovirus B19 IgM is positive and IgG is negative. Which plan is most appropriate?","o":["Refer to obstetrics for serial fetal ultrasounds with MCA Doppler every 1 to 2 weeks for 8 to 12 weeks","Advise ending the pregnancy because of the high risk of a congenital parvovirus malformation syndrome","Reassure her that the fetus is not at risk, because the infection occurred after the first trimester","Give maternal IVIG now to prevent the virus from crossing the placenta"],"a":[0],"r":"Positive IgM with negative IgG means acute maternal infection. The main fetal risk is anemia leading to hydrops fetalis, so the fetus is monitored with serial ultrasounds and middle cerebral artery Doppler for about 8 to 12 weeks. If severe anemia is found, intrauterine transfusion can be done. B19 is not linked to a congenital malformation syndrome (B). Maternal IVIG has no proven role (D). The risk is highest in the first half of pregnancy, so 14 weeks is not a low-risk time (C)."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 28-year-old at 12 weeks of gestation has serologically confirmed acute parvovirus B19 infection. Which counseling statements are accurate? Select all that apply.","o":["Parvovirus B19 is not an established cause of a congenital malformation syndrome","The main fetal risk is anemia leading to hydrops, and the risk is greatest when infection occurs in the first half of pregnancy","Most pregnancies complicated by maternal B19 infection end with a healthy infant","Pregnant school staff should be routinely excluded from work during community outbreaks","Severe fetal anemia identified on monitoring may be treated with intrauterine transfusion","A woman who was IgG-positive and IgM-negative before the exposure is susceptible to infection"],"a":[0,1,2,4],"r":"B19 crosses the placenta and infects fetal red cell precursors. The result can be anemia, hydrops fetalis, or fetal death, with the greatest risk in the first half of pregnancy. It is not a known teratogen, and most infected pregnancies have good outcomes. Fetal anemia can be treated with intrauterine transfusion. Routine exclusion of pregnant workers is not recommended because spread is widespread before the rash. Positive IgG with negative IgM before exposure means prior immunity."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 34-year-old mother of a child recently diagnosed with fifth disease has had painful, swollen hands, wrists, and knees on both sides for 5 days. She has no rash and no tick exposure. Which plan is most appropriate?","o":["Order rubella IgM and give MMR once results return","Order parvovirus B19 IgM and manage the joint symptoms with an NSAID","Start methotrexate for presumed early rheumatoid arthritis","Start doxycycline for presumed early Lyme arthritis"],"a":[1],"r":"Adults, especially women, often develop B19 arthropathy without a rash: a symmetric arthritis of the hands, wrists, and knees that is self-limited and treated supportively with NSAIDs. B19 IgM confirms recent infection. Starting a disease-modifying drug (C) before ruling out viral arthropathy is premature. Rubella testing and MMR (A) do not fit the exposure history. Lyme arthritis (D) usually involves a single large joint after tick exposure."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An NP is teaching parents how parvovirus B19 spreads. Which statements are accurate? Select all that apply.","o":["It spreads through respiratory secretions from infected people","It can spread through blood or blood products","It can pass from a pregnant woman to her fetus","Pet dogs and cats can carry the virus that causes fifth disease","It spreads mainly by the fecal-oral route in child care settings","Up to 50% of susceptible household contacts become infected"],"a":[0,1,2,5],"r":"Parvovirus B19 spreads through respiratory secretions, percutaneous exposure to blood or blood products, and vertical transmission from mother to fetus. Secondary spread to household contacts reaches about 50%. Humans are the only reservoir. Canine and feline parvoviruses do not cause human disease. Fecal-oral spread is not the main route."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 6-year-old developed slapped cheeks and a lacy rash this week. His classmate's pregnant mother asks when he was most likely contagious. Which answer is correct?","o":["During flares of the rash brought on by sun exposure in the following weeks","During the slapped-cheek phase, when the facial redness was most intense","During the lacy rash phase on the trunk and the extensor surfaces of the arms and legs","During the mild, nonspecific illness in the days before the facial rash appeared"],"a":[3],"r":"In erythema infectiosum, communicability is highest before the rash appears, during the mild prodrome of low-grade fever, myalgia, headache, and URI symptoms. By the time the slapped-cheek and lacy rash phases appear, the immunocompetent child is no longer contagious. Recurrent flares with heat or sunlight are not a sign of renewed contagiousness."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A 6-year-old with acute lymphoblastic leukemia on maintenance chemotherapy has persistent anemia with reticulocytopenia, and chronic parvovirus B19 infection is suspected. Which statements are accurate? Select all that apply.","o":["PCR for B19 DNA is preferred, because the antibody response may be weak or absent","IVIG is a treatment option for chronic B19 infection in this immunocompromised child","He may be contagious for a long time and needs droplet precautions for the whole hospital stay","The classic slapped-cheek rash should be present before the diagnosis is considered","A negative B19 IgM reliably rules out chronic B19 infection in this child","Acyclovir is the first-line antiviral treatment for chronic B19 infection"],"a":[0,1,2],"r":"Immunocompromised patients may not mount an antibody response, so serology is unreliable and PCR is used for diagnosis. That is also why a negative IgM does not exclude infection. IVIG provides neutralizing antibody and is the treatment for chronic infection with pure red cell aplasia. These patients can shed virus for a long time and need droplet precautions throughout hospitalization. A rash is often absent, and acyclovir has no activity against parvovirus."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"The mother of a 7-year-old who recovered from fifth disease 2 weeks ago calls because the lacy rash came back on his arms and thighs after a hot bath. He feels well and has no fever. Which response is most accurate?","o":["The rash commonly returns for weeks with heat, sunlight, or exercise, and he should stay home until it fades","A returning rash suggests a second B19 infection, and he should have repeat IgM testing","The rash commonly returns for weeks with heat, sunlight, or exercise, and this is not reinfection or a sign he is contagious","A returning rash suggests a drug eruption, and any recent medicines should be stopped"],"a":[2],"r":"The reticular rash of erythema infectiosum can fade and come back for weeks after heat (baths), sunlight, exercise, friction, or stress. This is expected and does not mean he is contagious, so exclusion (A) is unnecessary. Reinfection (B) is not the explanation, and a drug eruption (D) does not fit a typical recurrence in a child who feels well."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A healthy 9-year-old has a classic slapped-cheek rash followed by a lacy rash on his trunk. His mother is 18 weeks pregnant. Which statements about diagnostic evaluation are accurate? Select all that apply.","o":["In the child, the diagnosis is usually made clinically from the characteristic rash","In the child, B19 IgM is usually detectable by the time the rash appears","In the child, a CBC with reticulocyte count is routinely needed to confirm the diagnosis","In the child, viral culture of a throat swab is the standard confirmatory test","In the mother, B19 IgG and IgM should be checked to determine whether she is immune or acutely infected","In the mother, testing is unnecessary, because exposure after the first trimester carries no fetal risk"],"a":[0,1,4],"r":"In immunocompetent children, erythema infectiosum is diagnosed clinically. The rash is immune-mediated, so IgM is usually present by the time it appears. A CBC is not routinely needed in a healthy child, and B19 is not routinely recovered by viral culture. An exposed pregnant woman needs IgG and IgM to tell immunity (IgG-positive, IgM-negative) from acute infection. The fetal risk of hydrops continues into the second trimester, which makes F wrong."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A healthy 5-year-old has slapped cheeks, a mildly itchy lacy rash on his extremities, and a temperature of 37.8\u00b0C (100.1\u00b0F). Which management is most appropriate?","o":["A single dose of IVIG to prevent chronic infection and later aplastic crisis","Supportive care, such as an antipyretic and an antihistamine for itching if needed, with no antiviral therapy","Oral acyclovir for 5 days to shorten how long the rash lasts and how long he can spread the virus","A mid-potency topical corticosteroid twice daily for 2 weeks to prevent the rash from returning"],"a":[1],"r":"Erythema infectiosum in healthy children is self-limited, and treatment is supportive. No antiviral is effective against parvovirus B19 (C). IVIG (A) is reserved for chronic infection in immunocompromised patients. Topical steroids (D) do not prevent the expected recurrences of the reticular rash."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"An NP is explaining the typical course of erythema infectiosum to a family whose child was exposed at school. Which statements are accurate? Select all that apply.","o":["The rash usually appears about 2 to 3 weeks after exposure","Only a minority of children (about 15% to 30%) have mild fever during the prodrome","The lacy rash on the body usually follows the facial redness within several days","The appearance of the rash marks the start of peak virus shedding","The lacy rash goes away for good within 48 hours, with no recurrence","The rash usually appears 2 to 3 days after the prodrome begins"],"a":[0,1,2],"r":"The incubation period is about 4 to 21 days, and the rash and symptoms occur about 2 to 3 weeks after exposure. Mild fever occurs in only 15% to 30% of patients during the prodrome. The rash appears 7 to 10 days after the prodrome, not 2 to 3 days (F). It starts as facial redness, followed within days by the lacy rash on the body. Peak communicability comes before the rash, not when it appears (D), and the reticular rash commonly recurs for weeks (E)."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"A 15-year-old has a low-grade fever, small mouth erosions, and painful, itchy swelling with petechiae and purpura on both hands and feet. The lesions stop sharply at the wrists and ankles. Which virus is the most likely cause?","o":["Coxsackievirus A16","Human herpesvirus 6","Rubella virus","Parvovirus B19"],"a":[3],"r":"Papular-purpuric \"gloves and socks\" syndrome is a well-recognized presentation of parvovirus B19, usually in adolescents and young adults. Its hallmark is petechial and purpuric swelling of the hands and feet that stops sharply at the wrists and ankles, sometimes with mouth lesions. Coxsackievirus hand-foot-and-mouth disease causes oval vesicles rather than sharply bordered purpuric swelling. Rubella causes a rash that spreads downward from the face. HHV-6 causes roseola, with a rash on the trunk after the fever breaks."},{"t":"Rashes & Exanthems","l":3,"s":true,"q":"A hospital infection preventionist asks the NP about isolation for patients with parvovirus B19. Which recommendations are correct? Select all that apply.","o":["A child with sickle cell disease in transient aplastic crisis: droplet precautions for 7 days","An immunocompromised child with chronic B19 infection: droplet precautions for the whole hospital stay","A healthy child admitted for a fracture who has the lacy rash of fifth disease: standard precautions only","Pregnant staff must be reassigned so they never care for any patient with B19","A child in transient aplastic crisis: airborne precautions in a negative-pressure room","A healthy child with fifth disease: droplet precautions until the lacy rash fades completely"],"a":[0,1,2],"r":"Patients in transient aplastic crisis are viremic and need droplet precautions for 7 days, not airborne precautions (E). Immunocompromised patients with chronic infection shed for a long time and need droplet precautions for the entire hospitalization. Immunocompetent children with the rash are no longer contagious, so standard precautions are enough and F is wrong. Pregnant staff should be told about the risk and should follow infection-control practices, but routine reassignment is not mandated."},{"t":"Rashes & Exanthems","l":3,"s":false,"q":"Four 6-year-olds in the same classroom were exposed to a classmate who developed fifth disease. For which child is the exposure most concerning for transient aplastic crisis?","o":["A child with sickle cell disease (HbSS) and a baseline reticulocyte count of 12%","A child whose iron deficiency anemia resolved with 3 months of oral iron","A child who is a silent carrier of alpha-thalassemia with normal red cell indices","A child with sickle cell trait (HbAS) and a normal baseline hemoglobin"],"a":[0],"r":"Transient aplastic crisis happens when B19 halts red cell production in a patient whose red cells already have a shortened lifespan, as in sickle cell disease or hereditary spherocytosis. That is why a high baseline reticulocyte count signals vulnerability. Sickle cell trait, silent alpha-thalassemia carrier status, and resolved iron deficiency do not involve chronic hemolysis, so a short pause in red cell production is not clinically significant in those children."}];
const TOPICS=[...new Set(BANK.map(q=>q.t))];
const LEVELS={1:"Exam level",2:"Harder",3:"Hardest"};
let st={topics:new Set(TOPICS),levels:new Set([1,2]),n:20,qs:[],i:0,sel:new Set(),done:false,res:[]};
const $=h=>{document.getElementById('app').innerHTML=h;scrollTo(0,0)};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function pool(){return BANK.filter(q=>st.topics.has(q.t)&&st.levels.has(q.l))}
function home(){
  const p=pool().length;
  $(`<h1 data-ref="title">Peds Nursing Quiz</h1><p class="sub">NCLEX-style SATA & single-answer questions with rationales.</p>
  <div class="card" data-ref="topic-picker"><p class="lbl">Topics</p><div class="chips">${TOPICS.map(t=>`<button class="chip" aria-pressed="${st.topics.has(t)}" onclick="tog('topics','${t}')">${t}</button>`).join('')}</div></div>
  <div class="card" data-ref="level-picker"><p class="lbl">Difficulty</p><div class="chips">${[1,2,3].map(l=>`<button class="chip" aria-pressed="${st.levels.has(l)}" onclick="tog('levels',${l})">${LEVELS[l]}</button>`).join('')}</div></div>
  <div class="card" data-ref="length-picker"><p class="lbl">How many questions</p><div class="chips">${[10,20,35,50].map(n=>`<button class="chip" aria-pressed="${st.n==n}" onclick="st.n=${n};home()">${n}</button>`).join('')}</div></div>
  <button class="btn" data-ref="start-button" ${p?'':'disabled'} onclick="start()">Start quiz</button>
  <p class="count">${p} questions available</p>
  <p class="small">For study only — always follow your course materials and current clinical guidelines.</p>`)}
function tog(k,v){st[k].has(v)?st[k].delete(v):st[k].add(v);home()}
function start(){const p=pool().sort(()=>Math.random()-.5);st.qs=p.slice(0,Math.min(st.n,p.length));st.i=0;st.res=[];show()}
function show(){
  const q=st.qs[st.i];st.sel=new Set();st.done=false;
  const pct=st.i/st.qs.length*100;
  $(`<div class="meta"><span>Question ${st.i+1} of ${st.qs.length}</span><span>${st.res.filter(r=>r).length} correct</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card ${q.s?'sata-q':''}" data-ref="question-card"><span class="tag ${q.s?'sata':''}">${q.s?'Select all that apply':'Single answer'}</span><span class="tag">${q.t}</span>
  <p class="q">${esc(q.q)}</p><div id="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}" onclick="pick(${j})"><span class="k">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>
  <button class="btn" id="go" data-ref="submit-button" disabled onclick="go()">Check answer</button>
  <p class="small"><a href="#" onclick="if(confirm('Quit this quiz?'))home();return false">Quit</a></p>`)}
function pick(j){if(st.done)return;const q=st.qs[st.i];
  if(q.s){st.sel.has(j)?st.sel.delete(j):st.sel.add(j)}else{st.sel=new Set([j])}
  document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',st.sel.has(+b.dataset.j)));
  document.getElementById('go').disabled=!st.sel.size}
function go(){
  const q=st.qs[st.i];
  if(st.done){st.i++;return st.i<st.qs.length?show():end()}
  st.done=true;const A=new Set(q.a);const ok=A.size==st.sel.size&&[...A].every(x=>st.sel.has(x));st.res.push(ok);
  document.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.j;b.classList.remove('sel');
    if(A.has(j)&&st.sel.has(j))b.classList.add('right');else if(st.sel.has(j))b.classList.add('wrong');else if(A.has(j))b.classList.add('missed','right')});
  const letters=q.a.map(x=>String.fromCharCode(65+x)).join(', ');
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}" data-ref="feedback"><b>${ok?'Correct!':'Not quite — answer: '+letters}</b><div class="rat">${esc(q.r)}</div></div>`;
  const g=document.getElementById('go');g.textContent=st.i+1<st.qs.length?'Next question →':'See my score';g.disabled=false}
function end(){
  const c=st.res.filter(r=>r).length,n=st.qs.length,p=Math.round(c/n*100);
  const by={};st.qs.forEach((q,i)=>{by[q.t]=by[q.t]||[0,0];by[q.t][1]++;if(st.res[i])by[q.t][0]++});
  $(`<h1>Your score</h1><div class="card" data-ref="score-card"><p class="score">${p}%</p><p class="sub" style="text-align:center">${c} of ${n} correct${p>=90?' — amazing 🎉':p>=75?' — solid work':' — keep going, you’re learning'}</p>
  ${Object.entries(by).map(([t,[a,b]])=>`<div class="review">${t}: <b>${a}/${b}</b></div>`).join('')}</div>
  <button class="btn" onclick="start()">New quiz, same settings</button><div style="height:10px"></div>
  <button class="btn ghost" onclick="home()">Change topics</button>`)}
home();
</script></body></html>
